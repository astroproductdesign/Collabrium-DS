<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bar graph — Graph Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<style>
  /* ---- Design tokens (see dataviz skill's references/palette.md) ---- */
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border-hairline: rgba(11, 11, 11, 0.10);
    --series-1:       #2a78d6; /* categorical slot 1 — blue */
    --series-1-hover: #1c5cab; /* one step darker, for hover lift */
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border-hairline: rgba(255, 255, 255, 0.10);
      --series-1:       #3987e5;
      --series-1-hover: #5598e7;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border-hairline: rgba(255, 255, 255, 0.10);
    --series-1:       #3987e5;
    --series-1-hover: #5598e7;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 40px 24px;
  }
  .viz-card {
    max-width: 640px;
    margin: 0 auto;
    background: var(--surface-1);
    border: 1px solid var(--border-hairline);
    border-radius: 12px;
    padding: 24px;
  }
  .viz-head { margin-bottom: 20px; }
  .viz-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin: 0 0 2px; }
  .viz-subtitle { font-size: 13px; color: var(--text-secondary); margin: 0; }
  .viz-chart-wrap { position: relative; height: 280px; }
  .viz-foot {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
  }
  .viz-toggle {
    font: inherit;
    font-size: 13px;
    color: var(--text-secondary);
    background: transparent;
    border: 1px solid var(--border-hairline);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .viz-toggle:hover { color: var(--text-primary); border-color: var(--baseline); }

  .viz-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .viz-table caption { text-align: left; color: var(--text-secondary); font-size: 13px; margin-bottom: 8px; }
  .viz-table th, .viz-table td {
    text-align: right;
    padding: 8px 4px;
    border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums;
  }
  .viz-table th:first-child, .viz-table td:first-child { text-align: left; font-variant-numeric: normal; }
  .viz-table thead th { color: var(--text-secondary); font-weight: 600; border-bottom: 1px solid var(--baseline); }
  .viz-table tbody td:last-child { color: var(--text-primary); font-weight: 600; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

  <div class="viz-card viz-root">
    <div class="viz-head">
      <p class="viz-title">Monthly visits</p>
      <p class="viz-subtitle">Sample data — Jan–Jun</p>
    </div>

    <div class="viz-chart-wrap">
      <canvas id="barChart" role="img" aria-label="Bar chart of monthly visits from January to June"></canvas>
    </div>

    <table class="viz-table" id="dataTable" hidden>
      <caption>Monthly visits — table view</caption>
      <thead>
        <tr><th scope="col">Month</th><th scope="col">Visits</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="viz-foot">
      <button type="button" class="viz-toggle" id="toggleView" aria-pressed="false">View as table</button>
    </div>
  </div>

<script>
(function () {
  var labels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
  var values = [1240, 1890, 1620, 2210, 2480, 2050];

  function token(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function buildColors() {
    return {
      series: token('--series-1'),
      seriesHover: token('--series-1-hover'),
      textPrimary: token('--text-primary'),
      textSecondary: token('--text-secondary'),
      textMuted: token('--text-muted'),
      gridline: token('--gridline'),
      baseline: token('--baseline'),
      surface: token('--surface-1')
    };
  }

  var ctx = document.getElementById('barChart').getContext('2d');
  var colors = buildColors();

  var chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Visits',
        data: values,
        backgroundColor: colors.series,
        hoverBackgroundColor: colors.seriesHover,
        borderRadius: 4,
        maxBarThickness: 24
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false }, // single series — title already names it
        tooltip: {
          backgroundColor: colors.surface,
          titleColor: colors.textPrimary,
          bodyColor: colors.textSecondary,
          borderColor: colors.baseline,
          borderWidth: 1,
          padding: 10,
          cornerRadius: 8,
          displayColors: false,
          titleFont: { size: 13, weight: '700' },
          bodyFont: { size: 12, weight: '400' },
          callbacks: {
            // Value leads (title, strong); category follows (body).
            title: function (items) {
              return items[0].formattedValue + ' visits';
            },
            label: function (item) {
              return item.label;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          border: { color: colors.baseline },
          ticks: { color: colors.textMuted, font: { size: 12 } }
        },
        y: {
          beginAtZero: true,
          grid: { color: colors.gridline },
          border: { display: false },
          ticks: {
            color: colors.textMuted,
            font: { size: 12 },
            callback: function (v) { return v.toLocaleString(); }
          }
        }
      }
    }
  });

  // Canvas colors don't follow CSS custom properties automatically —
  // re-read the tokens and update the chart whenever the theme changes,
  // so dark mode is a real re-step, not an automatic filter flip.
  function applyTheme() {
    var c = buildColors();
    var ds = chart.data.datasets[0];
    ds.backgroundColor = c.series;
    ds.hoverBackgroundColor = c.seriesHover;
    var t = chart.options.plugins.tooltip;
    t.backgroundColor = c.surface;
    t.titleColor = c.textPrimary;
    t.bodyColor = c.textSecondary;
    t.borderColor = c.baseline;
    chart.options.scales.x.border.color = c.baseline;
    chart.options.scales.x.ticks.color = c.textMuted;
    chart.options.scales.y.grid.color = c.gridline;
    chart.options.scales.y.ticks.color = c.textMuted;
    chart.update();
  }

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // Table view — same data, built with textContent (not innerHTML) since
  // labels/values are treated as untrusted per the dataviz skill's rule,
  // even though this sample data is hardcoded.
  var tbody = document.querySelector('#dataTable tbody');
  labels.forEach(function (label, i) {
    var tr = document.createElement('tr');
    var th = document.createElement('th');
    th.scope = 'row';
    th.textContent = label;
    var td = document.createElement('td');
    td.textContent = values[i].toLocaleString();
    tr.appendChild(th);
    tr.appendChild(td);
    tbody.appendChild(tr);
  });

  var toggleBtn = document.getElementById('toggleView');
  var chartWrap = document.querySelector('.viz-chart-wrap');
  var table = document.getElementById('dataTable');
  var showingTable = false;
  toggleBtn.addEventListener('click', function () {
    showingTable = !showingTable;
    chartWrap.hidden = showingTable;
    table.hidden = !showingTable;
    toggleBtn.textContent = showingTable ? 'View as chart' : 'View as table';
    toggleBtn.setAttribute('aria-pressed', String(showingTable));
  });
})();
</script>

</body>
</html>
