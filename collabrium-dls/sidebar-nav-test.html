<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Collabrium — SidebarNav Stress Test</title>

<!-- Only external dependency: Google Fonts, per Typography -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;700;800&display=swap" rel="stylesheet" />

<style>
  /* ============================================================
     Tokens — only values cited in the SidebarNav section itself
     (colors/spacing/type/motion it references are reused exactly
     as read there; nothing here is invented).
     ============================================================ */
  :root {
    --color-obsidian: #2B2B2C;
    --color-neutral-9: #080808;
    --color-neutral-5: #5a5a5a;
    --color-neutral-4: #bdbdbd;
    --color-neutral-3: #d8d8d8;
    --color-neutral-2: #f0f0f0;
    --color-neutral-1: #ffffff;
    --color-navy: #1473E6; /* Water — example "owning element" accent for the dot badge/icon override */

    --font-primary: 'Mulish', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

    --text-body1-size: 16px;   --text-body1-lh: 22px;  --text-body1-weight: 500;
    --text-body2-size: 14px;   --text-body2-lh: 20px;  --text-body2-weight: 400;
    --text-caption-size: 12px; --text-caption-lh: 16px; --text-caption-weight: 400;
    --tracking-eyebrow: 0.12em;

    --spacing-4: 4px;
    --spacing-8: 8px;
    --spacing-12: 12px;
    --spacing-16: 16px;
    --spacing-24: 24px;

    --radius-sm: 12px;
    --radius-lg: 20px;

    --icon-base: 20px;

    --duration-fast: 140ms;
    --duration-slow: 360ms;
    --ease-standard: cubic-bezier(.2,.6,.2,1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--color-neutral-2);
    color: var(--color-neutral-9);
    font-family: var(--font-primary);
    padding: var(--spacing-24);
  }

  .page-header h1 {
    font-size: 22px;
    font-weight: 800;
    margin: 0 0 var(--spacing-4);
  }

  .page-header p {
    font-size: var(--text-caption-size);
    color: var(--color-neutral-5);
    margin: 0 0 var(--spacing-24);
    max-width: 640px;
  }

  .stage {
    display: flex;
    align-items: flex-start;
    gap: var(--spacing-24);
    flex-wrap: wrap;
  }

  .stage-col {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-8);
  }

  .stage-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: var(--tracking-eyebrow);
    text-transform: uppercase;
    color: var(--color-neutral-5);
  }

  /* ============================================================
     SidebarNav — Container
     "240px width — hard max-width, never horizontally scrollable;
     radius-lg (20px), 1px Neutral-3 border, Neutral-1 fill,
     spacing-12 (12px) padding, spacing-4 (4px) gap between items"
     ============================================================ */
  .sidebar {
    width: 240px;
    max-width: 240px; /* hard max-width — never horizontally scrollable */
    /* `clip`, not `hidden` — `hidden` only hides the scrollbar and
       visual overflow, it still lets `scrollLeft`/keyboard scroll the
       box a little; `clip` removes the scroll port entirely so there
       is truly no way to shift it horizontally, matching "restrict to
       follow the width" literally. Paired explicitly with `visible`
       on the y-axis so this doesn't accidentally turn the sidebar
       itself into a vertical scroll container (that's `.nav-scroll`'s
       job, not `.sidebar`'s). */
    overflow-x: clip;
    overflow-y: visible;
    border-radius: var(--radius-lg);
    border: 1px solid var(--color-neutral-3);
    background: var(--color-neutral-1);
    padding: var(--spacing-12);
    display: flex;
    flex-direction: column;
    gap: var(--spacing-4); /* reverted 2026-08-04 — see .nav-scroll below for the real fix */
    height: 560px; /* fixed so the item list overflows and scrolls, per Overflow behavior */
    transition: width var(--duration-slow) var(--ease-standard);
  }

  /* Collapsible state — "Collapsed width: 72px" — a one-off literal,
     not a named spacing token (widened 2026-08-04 from 60px/spacing-60
     specifically to fit the logo/element icon and toggle icon side by
     side on one row; 60px had no room for both). */
  .sidebar.is-collapsed {
    width: 72px;
  }

  /* Wraps nav + toggle together so the toggle can live OUTSIDE
     .sidebar's own DOM subtree — necessary because .sidebar has
     `overflow-x: clip` (never horizontally scrollable, see above),
     and a clipped ancestor clips absolutely-positioned descendants
     too, no matter how their offsets are set. The collapsed toggle
     deliberately straddles the rail's own border (half in / half
     out), so it can't live inside .sidebar without being cut off —
     same category of fix as the hover label needing to escape
     .nav-scroll's forced overflow-x (see .nav-hover-label above).
     `display: inline-block` so the shell auto-sizes to whichever
     width .sidebar currently has (240 expanded / 72 collapsed) as it
     toggles, rather than needing its own hardcoded width. */
  .sidebar-shell {
    position: relative;
    display: inline-block;
    align-self: flex-start; /* .stage-col is a flex column — without this,
      the shell stretches to the column's own cross-axis width (driven by
      the longer stage-label text) instead of hugging the nav's actual
      width, throwing the toggle's right-edge anchor way off */
  }

  /* ============================================================
     Header. Expanded: flex row, logo left — the toggle used to be a
     second flex child here, right-aligned; it's now a sibling outside
     .sidebar entirely (see .sidebar-shell above and .sidebar-toggle
     below), so the header only ever lays out the logo. Collapsed
     (changed 2026-08-04, revised twice same day): logo is the header's
     only content, independently centered — no longer paired with the
     toggle at all.
     ============================================================ */
  .sidebar-header {
    padding: var(--spacing-8) var(--spacing-8) var(--spacing-16);
    display: flex;
    align-items: center;
    justify-content: flex-start; /* logo only now; toggle lives outside .sidebar */
  }

  .sidebar.is-collapsed .sidebar-header {
    justify-content: center; /* logo is the only content — independently centered */
  }

  .sidebar-header .logo-slot {
    display: flex;
    align-items: center;
    justify-content: flex-start; /* expanded: left-aligned */
    min-height: 28px;
  }

  .sidebar.is-collapsed .sidebar-header .logo-slot {
    justify-content: center; /* collapsed: center-aligned */
  }

  .sidebar-header .logo-slot img {
    height: 22px;
    width: auto;
  }

  .sidebar.is-collapsed .sidebar-header .logo-slot img {
    height: 24px;
    width: 24px;
  }

  /* Toggle — now a sibling of .sidebar inside .sidebar-shell (see
     above), always `position: absolute`, targeted per state via a
     sibling selector off .sidebar's own `is-collapsed` class rather
     than by DOM position. */
  .sidebar-toggle {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    border-radius: var(--radius-sm);
    color: var(--color-neutral-5);
    cursor: pointer;
  }

  /* Expanded — same row as the logo, right-aligned, vertically
     centered within the header (values verified via
     getBoundingClientRect against the rendered header). */
  .sidebar:not(.is-collapsed) ~ .sidebar-toggle {
    top: 35px; /* matches the logo's vertical center — verified via getBoundingClientRect */
    right: 8px;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
  }

  /* Collapsed — a floating overlay, straddling the rail's own right
     border (half in / half out), vertically centered to the same row
     as the now-independently-centered logo. Sized down from the
     expanded toggle's 28px button / 18px icon to 24px/16px so it
     doesn't crowd the logo in the narrower 72px rail. */
  .sidebar.is-collapsed ~ .sidebar-toggle {
    top: 35px; /* matches the logo's vertical center — verified via getBoundingClientRect */
    right: -10px;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    background: var(--color-neutral-1);
    border: 1px solid var(--color-neutral-3);
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }

  .sidebar-toggle:hover { background: var(--color-neutral-2); color: var(--color-neutral-9); }
  .sidebar.is-collapsed ~ .sidebar-toggle:hover { background: var(--color-neutral-2); }
  .sidebar-toggle:focus-visible { outline: 2px solid var(--color-obsidian); outline-offset: 2px; }

  /* ============================================================
     Section label + divider
     "spacing-16 top, spacing-8 sides, spacing-4 bottom padding;
     caption size, weight 700, tracking-eyebrow, uppercase,
     Neutral-5". A 1px Neutral-3 hairline sits above every section
     label except the first one in the list.
     ============================================================ */
  .nav-section-label {
    padding: var(--spacing-16) var(--spacing-8) var(--spacing-4);
    font-size: var(--text-caption-size);
    font-weight: 700;
    letter-spacing: var(--tracking-eyebrow);
    text-transform: uppercase;
    color: var(--color-neutral-5);
  }

  .nav-section-divider {
    border: none;
    border-top: 1px solid var(--color-neutral-3);
    margin: var(--spacing-8) 0 0;
  }

  .sidebar.is-collapsed .nav-section-label,
  .sidebar.is-collapsed .nav-section-divider,
  .sidebar.is-collapsed .nav-label,
  .sidebar.is-collapsed .nav-count-text,
  .sidebar.is-collapsed .footer-text {
    display: none;
  }

  /* Scrollable nav list — Overflow behavior.
     A genuinely custom overlay scrollbar: the native scrollbar is
     fully hidden (not just recolored) and a separate absolutely-
     positioned thumb draws the affordance on top of content, so it
     never reserves layout space. This replaces an earlier attempt
     that recolored a native `scrollbar-width:thin` gutter — that
     gutter was reserved at all times (visible or not), which is what
     was actually causing the right inset to read as bigger than the
     left. `overflow: overlay` was tried next as a lighter fix, but
     current Chromium has removed it (it now computes as plain `auto`
     and reserves the gutter again), so a hand-built thumb is the only
     reliable way to satisfy "must overlay, never reserve space." */
  .nav-scroll-wrap {
    position: relative;
    flex: 1;
    min-height: 0; /* let the scrolling child size within the column flex */
  }
  .nav-scroll {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-4);
    /* Individual nav items live in here — this is the flex container
       the Container's spacing-4 item gap actually applies to (not
       .sidebar's own gap above, which only ever spaces out
       header/scroll-area/footer, three items total). */
    scrollbar-width: none; /* Firefox: fully hidden, custom thumb below draws it */
  }
  .nav-scroll::-webkit-scrollbar { display: none; } /* Chrome/Safari: fully hidden */

  .nav-scrollbar-track {
    position: absolute;
    top: 0;
    right: 2px;
    bottom: 0;
    width: 6px;
    pointer-events: none;
  }
  .nav-scrollbar-thumb {
    position: absolute;
    right: 0;
    width: 6px;
    border-radius: var(--radius-sm);
    background: transparent;
    transition: background-color var(--duration-fast) var(--ease-standard);
  }
  /* Hidden by default, visible color on hover — item width never
     shifts under the cursor since the thumb was never part of layout. */
  .nav-scroll-wrap:hover .nav-scrollbar-thumb { background: var(--color-neutral-3); }

  /* ============================================================
     Nav item — "40px height minimum, full width, 0/spacing-12
     padding, radius-sm (12px), spacing-12 gap between icon and
     label, body1 type (16px)"
     ============================================================ */
  .nav-item {
    position: relative;
    min-height: 40px; /* grows for a wrapped 2-line label */
    width: 100%;
    padding: 0 var(--spacing-12);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    gap: var(--spacing-12);
    font-size: var(--text-body1-size);
    line-height: var(--text-body1-lh);
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    transition: background-color var(--duration-fast) var(--ease-standard),
                color var(--duration-fast) var(--ease-standard);
  }

  /* Nav item — inactive: "transparent fill, Neutral-5 text, weight 500" */
  .nav-item.is-inactive { color: var(--color-neutral-5); font-weight: var(--text-body1-weight); }

  /* Nav item — active: "Neutral-2 fill, Neutral-9 text, weight 700" */
  .nav-item.is-active { background: var(--color-neutral-2); color: var(--color-neutral-9); font-weight: 700; }

  /* Nav item — hover: "Neutral-2 fill, text color unchanged from
     whatever active/inactive state it already has" */
  .nav-item:hover,
  .nav-item.is-hover-demo { background: var(--color-neutral-2); }

  /* Nav item — focus-visible: "2px Obsidian outline, 2px offset" */
  .nav-item:focus-visible {
    outline: 2px solid var(--color-obsidian);
    outline-offset: 2px;
  }

  /* Nav item — active-pressed: "Neutral-3 fill" */
  .nav-item:active,
  .nav-item.is-pressed-demo { background: var(--color-neutral-3); }

  /* Nav item — disabled: "Neutral-4 text/icon, fill stays
     transparent, cursor: not-allowed" */
  .nav-item.is-disabled {
    color: var(--color-neutral-4);
    background: transparent;
    cursor: not-allowed;
  }
  .nav-item.is-disabled:hover { background: transparent; }

  .nav-item .nav-icon {
    width: var(--icon-base);
    height: var(--icon-base);
    flex: 0 0 var(--icon-base);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nav-item.is-disabled .nav-icon { color: var(--color-neutral-4); }

  .nav-label {
    /* Wraps, doesn't truncate — Container is a hard 240px max-width
       with no horizontal scroll. */
    white-space: normal;
    overflow-wrap: break-word;
    flex: 1;
  }

  /* Trailing count — "optional, caption/700/Neutral-5, right-aligned" */
  .nav-count-text {
    font-size: var(--text-caption-size);
    font-weight: 700;
    color: var(--color-neutral-5);
  }

  /* Collapsed — trailing count converts to an 8px dot badge in the
     owning element accent color, overlaid top-right on the icon */
  .nav-dot-badge {
    display: none;
    position: absolute;
    top: 4px;
    left: 26px;
    width: var(--spacing-8);
    height: var(--spacing-8);
    border-radius: 50%;
    background: var(--color-navy);
  }
  .sidebar.is-collapsed .nav-dot-badge { display: block; }
  .sidebar:not(.is-collapsed) .nav-item { justify-content: flex-start; }
  /* Collapsed — icons center-aligned within the rail */
  .sidebar.is-collapsed .nav-item { justify-content: center; padding: 0; }

  /* ============================================================
     Second-level navigation — parent chevron, accordion children.
     Tier 1, Regular (chevron-down/chevron-up, and expand/collapse
     generally, are both Iconography's own Tier 1 examples).
     ============================================================ */
  .nav-parent-toggle {
    margin-left: auto;
    width: var(--icon-base);
    height: var(--icon-base);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 var(--icon-base);
    transition: transform var(--duration-fast) var(--ease-standard);
  }

  /* "Active parent with active child — parent shows weight 700
     text, but no active fill" */
  .nav-item.is-parent-active-child { font-weight: 700; background: transparent; color: var(--color-neutral-9); }

  /* Expand/collapse transition — height, duration-slow/ease-standard,
     same "panel/section reveals" pairing as the Collapsible state's
     own width transition. Each parent is independent: opening one
     never closes another.
     Grid 0fr->1fr technique: animating max-height directly squeezed
     the fixed-height child buttons instead of properly sizing them
     (flex-shrink had nowhere else to go); a single-row grid track
     animates to the content's real height with no guessed cap. */
  .nav-children {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows var(--duration-slow) var(--ease-standard);
  }

  .nav-children.is-open {
    grid-template-rows: 1fr;
  }

  .nav-children-inner {
    overflow: hidden;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-4);
  }

  .sidebar.is-collapsed .nav-children,
  .sidebar.is-collapsed .nav-parent-toggle { display: none; }

  /* "Child item height: 36px" (one-off, not a named token)
     "Child item type: body2 (14px), weight 500 inactive, 700 active"
     Full width, spacing-16 (16px) left padding does the indent. */
  .nav-child {
    height: 36px;
    width: 100%;
    padding: 0 var(--spacing-12) 0 var(--spacing-16);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    font-size: var(--text-body2-size);
    line-height: var(--text-body2-lh);
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    color: var(--color-neutral-5);
    font-weight: var(--text-body2-weight);
    transition: background-color var(--duration-fast) var(--ease-standard);
  }
  .nav-child:hover { background: var(--color-neutral-2); }
  .nav-child:focus-visible { outline: 2px solid var(--color-obsidian); outline-offset: -2px; }

  /* "Active child — shows Nav item's own active state" */
  .nav-child.is-active {
    background: var(--color-neutral-2);
    color: var(--color-neutral-9);
    font-weight: 700;
  }

  /* ============================================================
     Footer — "pinned to the bottom (margin-top: auto), spacing-16
     padding-top"
     ============================================================ */
  .sidebar-footer {
    margin-top: auto;
    padding-top: var(--spacing-16);
    flex-shrink: 0;
  }

  .footer-text { color: var(--color-neutral-5); }

  /* ============================================================
     Collapsed — hover label. SidebarNav's own sub-pattern, changed
     2026-08-04 to stop being a reused Tooltip instance: it borrows
     Tooltip's visual tokens (6px/10px padding, radius-sm, Neutral-7
     fill, caption/500, opacity-only transition, pointer-events: none)
     but is built and owned independently here.

     Why: Tooltip's own spec assumes a plain relatively-positioned
     trigger wrapper around the trigger content — a simple absolutely-
     positioned child. That model breaks once the trigger lives inside
     a *scrolling* list: .nav-scroll needs `overflow-y: auto`, and the
     CSS overflow spec forces its `overflow-x` to compute as `auto`
     too (the legacy "visible paired with a non-visible axis becomes
     auto" rule) — so .nav-scroll became its own horizontal clipping
     context and was silently cutting the label off before it could
     render past the icon. No single element can have one axis truly
     `visible` while the other scrolls, so this can't be fixed by
     tweaking .nav-scroll's overflow-x. Instead SidebarNav renders a
     single shared label positioned outside the scrolling ancestor
     entirely, `position: fixed`, repositioned via JS to sit at the
     hovered icon's real coordinates — still hover/focus triggered,
     still an opacity-only transition, just no longer confined by an
     ancestor that has to clip horizontally to satisfy the Container's
     own "never horizontally scrollable" rule.
     ============================================================ */
  .nav-hover-label-text {
    display: none; /* text source only — read by JS, never shown itself */
  }
  .nav-hover-label {
    position: fixed;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    background: #222222; /* Neutral-7 — matches Tooltip's bubble color */
    color: var(--color-neutral-1);
    font-size: var(--text-caption-size);
    font-weight: 500;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--duration-fast) var(--ease-standard);
    z-index: 1000;
  }
  .nav-hover-label.is-visible {
    opacity: 1;
  }

  .nav-icon svg { width: 100%; height: 100%; }

  /* Review-only annotation — positioned OUTSIDE the 240px sidebar so
     it never eats into the component's own real width/label space. */
  .review-tag {
    position: absolute;
    left: 100%;
    top: 50%;
    transform: translateY(-50%);
    margin-left: var(--spacing-8);
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    color: var(--color-neutral-1);
    background: var(--color-obsidian);
    padding: 1px 6px;
    border-radius: 999px;
    white-space: nowrap;
    pointer-events: none;
  }

  .stage-col { overflow: visible; }
  .stage { padding-right: 140px; } /* room for the floated review tags */
</style>
</head>
<body>

<div class="page-header">
  <h1>SidebarNav — Stress Test</h1>
  <p>Every documented state rendered at once, expanded and collapsed
    side by side. Stress test only — not production code. Source:
    DESIGN-SYSTEM.md, SidebarNav section.</p>
</div>

<div class="nav-hover-label" id="navHoverLabel" role="tooltip"></div>

<script>
  // Toggle trigger — swaps expanded/collapsed AND swaps the logo asset
  // itself (not just resizing it), per the Collapsible state's
  // "Toggle behavior — logo asset" rule.
  document.querySelectorAll('.js-sidebar-toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var sidebar = document.getElementById(btn.getAttribute('data-toggle'));
      var collapsing = !sidebar.classList.contains('is-collapsed');
      sidebar.classList.toggle('is-collapsed');
      btn.setAttribute('aria-label', collapsing ? 'Expand sidebar' : 'Collapse sidebar');

      var img = sidebar.querySelector('.js-logo-img');
      img.src = collapsing ? img.getAttribute('data-collapsed-src') : img.getAttribute('data-expanded-src');
    });
  });

  // Second-level accordion — click anywhere on the parent toggles it;
  // each parent is independent (opening one never closes another);
  // the chevron swaps direction; the previously-active child stays
  // marked active since collapsing only hides the panel, it doesn't
  // unmount or reset anything.
  document.querySelectorAll('.js-accordion-trigger').forEach(function (trigger) {
    trigger.addEventListener('click', function () {
      var key = trigger.getAttribute('data-accordion');
      var panel = trigger.parentElement.querySelector('[data-accordion-panel="' + key + '"]');
      var opening = !panel.classList.contains('is-open');
      panel.classList.toggle('is-open');
      trigger.setAttribute('aria-expanded', String(opening));

      var chevronPath = trigger.querySelector('.nav-parent-toggle path');
      chevronPath.setAttribute('d', opening ? 'M4 6l4 4 4-4' : 'M6 4l4 4-4 4');
    });
  });

  // Custom overlay scrollbar thumb — sized/positioned to match the
  // real scroll state, drawn on top of content rather than reserving
  // a native gutter (see .nav-scroll-wrap's CSS comment for why the
  // native `scrollbar-width`/`overflow: overlay` approaches didn't
  // hold up).
  document.querySelectorAll('.js-scrollbar-thumb').forEach(function (thumb) {
    var wrap = thumb.closest('.nav-scroll-wrap');
    var scroll = wrap.querySelector('.nav-scroll');

    function update() {
      var trackHeight = scroll.clientHeight;
      var contentHeight = scroll.scrollHeight;
      if (contentHeight <= trackHeight) {
        thumb.style.display = 'none';
        return;
      }
      var thumbHeight = Math.max(24, (trackHeight / contentHeight) * trackHeight);
      var maxThumbTop = trackHeight - thumbHeight;
      var thumbTop = (scroll.scrollTop / (contentHeight - trackHeight)) * maxThumbTop;
      thumb.style.display = 'block';
      thumb.style.height = thumbHeight + 'px';
      thumb.style.top = thumbTop + 'px';
    }

    scroll.addEventListener('scroll', update);
    window.addEventListener('resize', update);
    update();
  });

  // Collapsed — hover label. SidebarNav's own sub-pattern (no longer
  // a reused Tooltip instance — see the .nav-hover-label CSS comment
  // for why): a single shared, fixed-position element repositioned to
  // whichever icon is hovered or focused, rather than a per-item
  // absolutely-positioned child of the nav item (that approach got
  // silently clipped by .nav-scroll's forced overflow-x). Each nav
  // item's own hidden .nav-hover-label-text span is kept purely as
  // the text source; hover and keyboard focus both trigger it.
  (function () {
    var label = document.getElementById('navHoverLabel');

    function showLabel(item) {
      var sidebar = item.closest('.sidebar');
      var source = item.querySelector('.nav-hover-label-text');
      if (!sidebar || !sidebar.classList.contains('is-collapsed') || !source) return;

      var iconRect = item.querySelector('.nav-icon').getBoundingClientRect();
      label.textContent = source.textContent;
      label.style.left = (iconRect.right + 8) + 'px';
      label.style.top = (iconRect.top + iconRect.height / 2) + 'px';
      label.style.transform = 'translateY(-50%)';
      label.classList.add('is-visible');
    }

    function hideLabel() {
      label.classList.remove('is-visible');
    }

    document.querySelectorAll('.nav-item').forEach(function (item) {
      item.addEventListener('mouseenter', function () { showLabel(item); });
      item.addEventListener('mouseleave', hideLabel);
      item.addEventListener('focus', function () { showLabel(item); });
      item.addEventListener('blur', hideLabel);
    });
  })();
</script>
