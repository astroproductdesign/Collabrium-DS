<script>
const names = ["wood","fire","earth","gold","water","sun","moon","cloud","mountain"];
const SLOT = 104;
const filmstrip = document.getElementById('filmstrip');

let slot = 0;

function easeInOut(t){return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;}

function step(){
  const fromY = -(slot * SLOT);
  const toY = -((slot+1) * SLOT);
  const moveDur = 480;
  const isGoldNext = names[(slot+1) % names.length] === "gold";
  const holdDur = isGoldNext ? 1300 : 320;
  const start = performance.now();

  function frame(now){
    const t = Math.min(1, (now - start) / moveDur);
    const y = fromY + (toY - fromY) * easeInOut(t);
    filmstrip.setAttribute('transform', 'translate(0,' + y + ')');
    if(t < 1){
      requestAnimationFrame(frame);
    } else {
      slot++;
      if(slot === names.length){
        setTimeout(() => {
          filmstrip.setAttribute('transform', 'translate(0,0)');
          slot = 0;
          setTimeout(() => requestAnimationFrame(step), holdDur * 0.3);
        }, holdDur);
      } else {
        setTimeout(() => requestAnimationFrame(step), holdDur);
      }
    }
  }
  requestAnimationFrame(frame);
}

step();
</script>
