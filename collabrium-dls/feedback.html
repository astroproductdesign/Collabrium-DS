/* ==========================================================================
   Prompt input bar — AI Native, Floating bar variant
   Everything the component owns is in components.css; what follows is the
   behaviour its spec defines and no stylesheet can carry — the entrance, the
   running placeholder line and the model switcher.
   There is no collapse here. The Floating bar's morph exists for screens
   where the assistant is a standing offer you scroll past; the Dashboard is
   the one screen where asking something IS the task, so it stays expanded
   and the FAB docks beside it rather than the bar shrinking out of the way.
   ========================================================================== */
var promptRevealed = false;
var PROMPT_LINE = 'Ask me anything about your surveys';
var ghostDone = false, ghostTick = null;

/* Every number the FAB's placement needs is read off the component here and
   written up onto the shell, because a custom property declared on the bar
   cannot be seen by its parent. Measure, never hardcode: the toolbar wraps
   at narrow widths and the card gets taller, and the pill's height is an
   11px-padding one-off the component could retune.
   offsetWidth/offsetHeight, never a client rect — this element transitions
   `width` and `grid-template-rows`, so a rect returns whichever frame of the
   420ms morph it happened to be asked on. */
function measurePromptBar(){
  var bar = $('#promptBar');
  if (bar.hidden) return;
  var w = getComputedStyle(bar).getPropertyValue('--prompt-bar-w').trim();
  if (w) $('.c-shell-main').style.setProperty('--bar-w-collapsed', w);
  var root = document.documentElement.style;
  var h = bar.offsetHeight;
  if (bar.classList.contains('is-collapsed')){
    root.setProperty('--prompt-bar-pill-h', h + 'px');
  } else {
    root.setProperty('--prompt-bar-h', h + 'px');
    /* The tallest pose, kept separately: the content reserve must not track
       the live height. It is the scroll position that collapses the bar, so
       a reserve that shrank on collapse would change the scroll height that
       caused it — a loop, not just a jump. */
    root.setProperty('--prompt-bar-rest-h', h + 'px');
  }
}

/* Scroll collapse, on the component's own documented thresholds: collapse
   once past 240, expand only back at 8. Asymmetric on purpose — a single
   threshold flip-flops either side of the boundary, and the hold is the
   point. */
var PROMPT_COLLAPSE_AT = 240, PROMPT_EXPAND_AT = 8;
function setPromptCollapsed(on){
  var bar = $('#promptBar');
  if (bar.classList.contains('is-collapsed') === on) return;
  /* A half-typed sentence must never be what ends up shuttling into the
     pill, so a collapse arriving mid-type lands the line outright. */
  if (on) finishGhost();
  bar.classList.toggle('is-collapsed', on);
  /* Re-measure once the morph has landed, not at the moment the class
     changes — the height is 420ms of transition away from its new value.
     Until then the CSS is on its first-paint fallbacks, which are the same
     numbers, so nothing visibly corrects. */
  setTimeout(measurePromptBar, 460);
}

function syncPromptBar(){
  var bar = $('#promptBar');
  if (bar.hidden) return;
  measurePromptBar();
  if (promptRevealed) return;
  promptRevealed = true;
  /* The component's entrance is a transition, and a transition cannot run
     from display:none — the class has to land on a frame where the bar is
     already laid out, which is what the reflow buys. */
  void bar.offsetWidth;
  bar.classList.add('is-revealed');
  startGhost();
  /* .is-morphable only after the entrance has played, and it is what makes
     collapse and expand take the same 420ms — without it the expansion
     falls through to the entrance rule's slower duration-reveal and reads
     as lag coming back. */
  setTimeout(function(){ bar.classList.add('is-morphable'); }, 1750);
}

/* Leaving the route resets the pose. go() puts the scroll container back to
   0 on every navigation, so a bar left collapsed would come back as a pill
   above a page that is scrolled to the top — the one combination the
   scroll rule above can never produce on its own. */
function resetPromptBar(){
  $('#promptBar').classList.remove('is-collapsed');
}
window.addEventListener('resize', measurePromptBar);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measurePromptBar);

/* The running line types itself in once and then holds. It is a span rather
   than the input's own ::placeholder because the component masks and
   measures it — see .c-prompt-bar-ghost. Under reduced motion the component
   swaps to its static line in CSS, so the typing is simply not started. */
function finishGhost(){
  if (ghostDone) return;
  ghostDone = true;
  if (ghostTick){ clearInterval(ghostTick); ghostTick = null; }
  var ghost = $('#promptGhost');
  ghost.textContent = PROMPT_LINE;
  ghost.classList.remove('is-caret-pulsing');
}

function startGhost(){
  var ghost = $('#promptGhost');
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still){ finishGhost(); return; }
  /* Begins after the component's own 1150ms entrance delay plus its
     550ms reveal, so the line is not already typing while the box is still
     flying in. */
  setTimeout(function(){
    if (ghostDone) return;
    ghost.classList.add('is-caret-pulsing');
    var i = 0;
    ghostTick = setInterval(function(){
      ghost.textContent = PROMPT_LINE.slice(0, ++i);
      if (i >= PROMPT_LINE.length){
        clearInterval(ghostTick); ghostTick = null; ghostDone = true;
        setTimeout(function(){ ghost.classList.remove('is-caret-pulsing'); }, 900);
      }
    }, 34);
  }, 1750);
  /* A guard, so a stalled interval cannot leave the line half-typed. */
  setTimeout(finishGhost, 4200);
}

(function promptBar(){
  var field = $('#promptField');
  var input = $('#promptInput');

  /* Listen on the scroll container, not window — .c-shell-content is the
     only thing that scrolls in this shell, and window never fires. Throttled
     through requestAnimationFrame and passive, so the handler can never
     delay the scroll it is watching. */
  (function(){
    var sc = $('#shellContent'), bar = $('#promptBar'), ticking = false;
    sc.addEventListener('scroll', function(){
      if (bar.hidden || ticking) return;
      ticking = true;
      requestAnimationFrame(function(){
        ticking = false;
        var y = sc.scrollTop;
        if (y > PROMPT_COLLAPSE_AT) setPromptCollapsed(true);
        else if (y <= PROMPT_EXPAND_AT) setPromptCollapsed(false);
      });
    }, { passive:true });
  })();

  /* The ghost is the hint, so it goes the moment there is real text to read
     — two lines of grey in the same box is the one thing this arrangement
     must never show. */
  input.addEventListener('input', function(){
    field.classList.toggle('is-typing', !!input.value.length);
  });

  function ask(){
    var q = input.value.trim();
    if (!q) { input.focus(); return; }
    toast('Asked: “' + q + '”');
    input.value = '';
    field.classList.remove('is-typing');
    input.focus();
  }
  $('#promptSend').addEventListener('click', ask);
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); ask(); }
  });
  $$('[data-prompt-todo]').forEach(function(b){
    b.addEventListener('click', function(){ toast('Not part of this prototype'); });
  });

  /* ---- Model switcher.
     The menu is position:fixed because .c-prompt-bar-more clips it
     otherwise, and fixed boxes are placed from the viewport — except that
     .c-prompt-bar carries a transform (its own -50% centring), which makes
     it the containing block for any fixed descendant. Placing from viewport
     coordinates therefore lands the menu a full half-bar-width off. So:
     park it at a known origin, read where that actually put it, and correct
     by the difference. The same measure-then-correct the FAB menu uses, and
     it needs no knowledge of which ancestor is transformed. */
  function closeModelMenu(){
    $$('.c-prompt-bar-model-menu.is-open').forEach(function(m){
      m.classList.remove('is-open');
      var t = $('.js-model-trigger', m.closest('.c-prompt-bar-model'));
      if (t) t.setAttribute('aria-expanded', 'false');
    });
  }
  document.addEventListener('click', function(e){
    var trigger = e.target.closest && e.target.closest('.js-model-trigger');
    if (trigger){
      e.stopPropagation();
      var menu = $('.js-model-menu', trigger.closest('.c-prompt-bar-model'));
      if (menu.classList.contains('is-open')){ closeModelMenu(); return; }
      closeModelMenu();
      var r = trigger.getBoundingClientRect();
      menu.style.right = '0px';
      menu.style.bottom = '0px';
      menu.classList.add('is-open');
      var at = menu.getBoundingClientRect();
      menu.style.right  = (at.right - r.right) + 'px';
      menu.style.bottom = (at.bottom - (r.top - 8)) + 'px';
      trigger.setAttribute('aria-expanded', 'true');
      return;
    }
    var option = e.target.closest && e.target.closest('.js-model-option');
    if (option){
      e.stopPropagation();
      var wrap = option.closest('.c-prompt-bar-model');
      $$('.js-model-option', wrap).forEach(function(o){
        o.classList.toggle('is-active', o === option);
        o.setAttribute('aria-selected', o === option ? 'true' : 'false');
      });
      $('.js-model-label', wrap).textContent = option.dataset.model;
      closeModelMenu();
      $('.js-model-trigger', wrap).focus();
      return;
    }
    if (!(e.target.closest && e.target.closest('.c-prompt-bar-model'))) closeModelMenu();
  });
  /* Its own Escape rather than a link into the page's modal chain: this menu
     can only be open when nothing else is, since every layer that owns that
     chain covers the bar. */
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && $('.c-prompt-bar-model-menu.is-open')) closeModelMenu();
  });
})();

/* ==========================================================================
   Boot
   ========================================================================== */
render();

/* Demo affordance only — lets a reviewer replay the FAB nudge without
   digging through devtools. Not part of the feature. */
window.replayFabNudge = function(){
  try { localStorage.removeItem('collabrium.fab.seen'); } catch (e) {}
  location.reload();
};

})();
</script>
</body>
</html>
