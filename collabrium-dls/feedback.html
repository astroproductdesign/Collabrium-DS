var DYNAMIC_ROUTES = { bugMine:'#routeBugMine', bugAdmin:'#routeBugAdmin' };

function render(){
  ['#routeDashboard','#routeLanding','#routeHub','#routeBuilder','#routeBugMine','#routeBugAdmin']
    .forEach(function(s){ $(s).hidden = true; });
  Object.keys(DYNAMIC_ROUTES).forEach(function(r){
    if (r !== state.route) $(DYNAMIC_ROUTES[r]).innerHTML = '';
  });
  /* The FAB is for someone who wants to say something, anywhere in the
     product. Inside the form builder it is the wrong offer twice over: the
     page is already about writing a feedback form, and the button floats
     over the add rail and the save bar. */
  $('#fab').hidden = state.route === 'builder';
  if (state.route === 'builder'){ $('#fabMenu').hidden = true; $('#fab').setAttribute('aria-expanded','false'); }
  $('#phActions').innerHTML = '';

  /* The Dashboard is the one route that is not a working screen, and it
     takes two things off the shell to say so: the Page header, which its own
     greeting replaces, and the assistant, which only this route offers. The
     bar is hidden rather than removed so the model menu's listeners, its
     chosen model and any half-typed question all survive a trip to the
     library and back. */
  var onDash = state.route === 'dashboard';
  $('#pageHeader').hidden = onDash;
  $('#promptBar').hidden = !onDash;
  if (onDash) syncPromptBar(); else resetPromptBar();
  $('.c-shell-main').classList.toggle('has-prompt-bar', onDash);
  /* The rail has to agree with the screen. Only two of its items are real
     destinations in this prototype, so only those two are ever current. */
  $('#navDashboard').classList.toggle('active', onDash);
  $('#navFeedback').classList.toggle('active', !onDash);
  (onDash ? $('#navDashboard') : $('#navFeedback')).setAttribute('aria-current', 'page');
  (onDash ? $('#navFeedback') : $('#navDashboard')).removeAttribute('aria-current');

  if (state.route === 'dashboard')      renderDashboard();
  else if (state.route === 'landing')   renderLanding();
  else if (state.route === 'hub')       renderHub();
  else if (state.route === 'builder')   renderBuilder();
  else if (state.route === 'bugMine')   renderBugMine();
  else if (state.route === 'bugAdmin')  renderBugAdmin();
}

/* Every render sets its own header, so the Back button is cleared here and
   opted into by the routes that have a parent — a stale Back pointing at the
   previous screen's parent is worse than none. */
/* badgeHtml is cleared rather than left alone when a caller omits it —
   every route calls through here, so a badge set by one screen would
   otherwise follow the user onto the next one. */
function setHeader(title, sub, actionsHtml, badgeHtml){
  $('#phTitle').textContent = title;
  $('#phSub').textContent = sub;
  $('#phActions').innerHTML = actionsHtml || '';
  $('#phBadge').innerHTML = badgeHtml || '';
  $('#backRow').hidden = true;
}
var backTo = null;
function setBack(label, route, opts){
  backTo = { route:route, opts:opts || {} };
  $('#backLabel').textContent = label;
  $('#backBtn').setAttribute('aria-label', 'Back to ' + label);
  $('#backRow').hidden = false;
}
$('#backBtn').addEventListener('click', function(){
  if (backTo) go(backTo.route, backTo.opts);
});
$('#navFeedback').addEventListener('click', function(){ go('landing'); });
$('#navDashboard').addEventListener('click', function(){ go('dashboard'); });

/* ==========================================================================
   Dashboard — the Overview home
   Four cards answering one question: what needs you today. Every figure on
   them is read from FORMS and BUGS, the same arrays the Feedback screens
   render, so a card cannot promise a number the screen behind it disagrees
   with — the same rule the Landing entry cards already follow. That is what
   the "derived, live" note on each card is claiming, and it has to stay true.
   ========================================================================== */
/* Greeting. The hour comes from NOW, the prototype's own frozen clock, not
   from the real one: every other date on this page is relative to NOW, and a
   dashboard that says "Good evening" above a survey closing "in 3 days"
   counted from a different today is two clocks disagreeing in one view. */
function greeting(){
  var h = NOW.getHours();
  if (h < 12)  return { word:'Good morning',   mark:'☀️' };
  if (h < 18)  return { word:'Good afternoon', mark:'☀️' };
  return { word:'Good evening', mark:'🌙' };
}

/* The candidate focuses, in the order they would matter if they all existed.
   Each returns null when it has nothing to say — a card reading "0 reports
   waiting on you" is not an attention item, it is noise wearing the same
   shape as one — and the first four that survive are what gets dealt. */
function dashFocuses(){
  var live = FORMS.filter(function(f){ return !f.archived; });

  var closing = live.filter(function(f){ return f.status === 'active' && f.ends && closesIn(f) >= 0; })
                    .sort(function(a, b){ return closesIn(a) - closesIn(b); })[0];

  var mine = BUGS.filter(function(b){ return b.who === ME.name && threadState(b) === 'awaiting'; });
  var openBugs = BUGS.filter(function(b){ return b.status !== 'resolved'; });

  var draft = live.filter(function(f){ return f.status === 'draft'; })
                  .sort(function(a, b){ return b.updated - a.updated; })[0];

  var quiet = live.filter(function(f){ return f.status === 'active' && formCount(f) === 0; })
                  .sort(function(a, b){ return b.updated - a.updated; })[0];

  var busiest = live.filter(function(f){ return f.status === 'active' && formCount(f) > 0; })
                    .sort(function(a, b){ return formCount(b) - formCount(a); })[0];

  var out = [];

  /* The invitation, written from the respondent's side rather than the
     owner's. Every fact on it is one the person being asked has a use for
     — how much of their time this is, and how long they have. How many
     responses are already in, and who owns the survey, are the author's
     business: a running total tells a respondent their answer is the
     hundredth and changes nothing they can act on, and an owner's name
     invites them to weigh the asker instead of the question. */
  if (closing){
    var d = closesIn(closing);
    var qn = (closing.questions || []).length;
    /* ~25 seconds a question, rounded to whole minutes and never zero. An
       estimate the person can hold you to is worth more than a precise one
       they have to work out for themselves. */
    var mins = Math.max(1, Math.round(qn * 25 / 60));
    out.push({
      label:'Your turn',
      title:closing.title,
      rows:[['Questions', String(qn), 'c-badge-neutral'],
            ['Takes about', mins + (mins === 1 ? ' minute' : ' minutes'), 'c-badge-neutral'],
            ['Closes', d === 0 ? 'Today' : d === 1 ? 'Tomorrow' : 'In ' + d + ' days',
             d <= 3 ? 'c-badge-warning' : 'c-badge-neutral']],
      rec:'A few minutes now, and the next release is shaped by what you actually ran into rather than what we guessed. Every answer is read by the team building it.',
      cta:'Start the survey',
      act:function(){ openPreview(closing); }
    });
  }

  if (mine.length || openBugs.length){
    var waiting = mine.length;
    out.push({
      label:waiting ? 'Waiting on you' : 'Open on the board',
      title:waiting ? (waiting === 1 ? 'One report is waiting on your reply'
                                     : waiting + ' reports are waiting on your reply')
                    : openBugs.length + ' reports are still open',
      rows:[['Waiting on you', String(waiting), waiting ? 'c-badge-warning' : 'c-badge-neutral'],
            ['Open in total', String(openBugs.length), 'c-badge-neutral'],
            ['Oldest', fmtDate((waiting ? mine : openBugs).reduce(function(a, b){
               return a.at < b.at ? a : b; }).at), 'c-badge-neutral']],
      rec:waiting ? 'The team has answered and the thread is back with you. Nothing moves until you reply.'
                  : 'None of these are yours to answer, but they are the queue your pods are in.',
      cta:waiting ? 'Open my reports' : 'Open the board',
      act:function(){ go(waiting ? 'bugMine' : 'bugAdmin'); }
    });
  }

  if (draft){
    out.push({
      label:'Not live yet',
      title:draft.title,
      rows:[['Questions', String((draft.questions || []).length), 'c-badge-neutral'],
            ['Owner', draft.owner ? draft.owner.name : 'Unassigned', 'c-badge-neutral'],
            ['Status', 'Draft', 'c-badge-neutral']],
      rec:'Written but never published, so it is collecting nothing. Publishing is the whole remaining step.',
      cta:'Open the builder',
      act:function(){ state.btab = 'questions'; go('builder', { formId:draft.id }); }
    });
  }

  if (quiet){
    out.push({
      label:'No answers yet',
      title:quiet.title,
      rows:[['Responses', '0', 'c-badge-warning'],
            ['Owner', quiet.owner ? quiet.owner.name : 'Unassigned', 'c-badge-neutral'],
            ['Window', quiet.ends ? rangeLabel(quiet) : 'No deadline', 'c-badge-neutral']],
      rec:'Live, and not one answer yet. Either nobody has the link or nobody has a reason to click it.',
      cta:'Share the link',
      act:function(){ go('builder', { formId:quiet.id }); }
    });
  }

  if (busiest){
    out.push({
      label:'Most to read',
      title:busiest.title,
      rows:[['Responses', formCount(busiest).toLocaleString(), 'c-badge-success'],
            ['Owner', busiest.owner ? busiest.owner.name : 'Unassigned', 'c-badge-neutral'],
            ['Window', busiest.ends ? rangeLabel(busiest) : 'No deadline', 'c-badge-neutral']],
      rec:'The busiest survey you own. The open-text answers are where the ones worth acting on are.',
      cta:'Read the responses',
      act:function(){ state.btab = 'responses'; go('builder', { formId:busiest.id }); }
    });
  }

  return out.slice(0, 4);
}

/* The fan pose, per card. Written as data rather than nth-child rules so the
   row still reads as a fan when there are three focuses instead of four:
   the rotations spread evenly about centre whatever the count, and the outer
   cards dip by the sine of their own angle rather than by a fixed number, so
   the tops of the cards sit on one arc instead of a sagging line. */
function fanPose(i, n){
  var SPREAD = 7;                                   /* degrees at the outermost card */
  var t = n === 1 ? 0 : (i / (n - 1)) * 2 - 1;      /* -1 .. 1 */
  var rot = t * SPREAD;
  return { rot:rot, y:Math.round(Math.abs(t) * 14), z:n - i };
}

function heroRow(r){
  return '<div class="hcard-fact"><span>' + esc(r[0]) + '</span>' +
    '<span class="c-badge ' + r[2] + '">' + esc(r[1]) + '</span></div>';
}

function heroCard(c, i, n){
  var p = fanPose(i, n);
  /* Jittered, not a fixed step: an even cadence reads as a machine dealing
     the cards. The spread is small enough that the order is never in doubt. */
  var delay = 180 + i * 120 + Math.round(Math.random() * 60);
  var dur   = 700 + Math.round(Math.random() * 120);
  return '<div class="c-herocard c-card-slide" data-role="hero" data-tilt-enabled="true" data-hero="' + i + '" ' +
      'style="--card-rot:' + p.rot.toFixed(1) + 'deg; --card-y:' + p.y + 'px; --card-z:' + p.z +
      '; --card-reveal-delay:' + delay + 'ms; --card-reveal-duration:' + dur + 'ms">' +
    '<div class="c-herocard-ribbon" role="img" aria-label="Focus ' + (i + 1) + ' of ' + n + '">' +
      '<span aria-hidden="true">Focus ' + (i + 1) + '</span></div>' +
    /* Sentence case, because Hero Card's Eyebrow is the one eyebrow in this
       system that is not uppercase and not tracked — it reads as a second
       headline rather than a label. The data was already sentence case; it
       was the old local rule that shouted it. */
    '<span class="c-herocard-eyebrow">' + esc(c.label) + '</span>' +
    '<h4 class="c-herocard-heading">' + esc(c.title) + '</h4>' +
    '<div class="c-herocard-body">' + c.rows.map(heroRow).join('') + '</div>' +
    '<p class="c-herocard-recommendation">' + esc(c.rec) + '</p>' +
    '<button class="c-btn c-btn-ghost c-btn-md c-herocard-cta" type="button" data-heroact="' + i + '">' +
      esc(c.cta) + '<i class="ph ph-arrow-right" aria-hidden="true"></i></button>' +
  '</div>';
}

/* The two lists under the fan. Same arrays, unfiltered and unranked — the
   cards say what to do first, this says what there is. Rows rather than
   cards: eight surveys in eight cards is eight times the chrome for the
   same eight facts. */
function dashListRow(title, meta, badge, tone){
  return '<div class="dash-list-row"><span>' +
      '<span class="dash-list-t">' + esc(title) + '</span>' +
      '<span class="dash-list-m">' + esc(meta) + '</span>' +
    '</span><span class="c-badge ' + tone + '">' + esc(badge) + '</span></div>';
}

function paintDashRest(){
  var live = FORMS.filter(function(f){ return !f.archived; })
                  .sort(function(a, b){ return b.updated - a.updated; });
  var surveys = live.map(function(f){
    var n = formCount(f);
    return dashListRow(f.title,
      (f.owner ? f.owner.name : 'Unassigned') + ' · ' + n.toLocaleString() + (n === 1 ? ' response' : ' responses'),
      f.status === 'active' ? 'Active' : f.status === 'draft' ? 'Draft' : 'Closed',
      f.status === 'active' ? 'c-badge-success' : 'c-badge-neutral');
  }).join('');

  var open = BUGS.filter(function(b){ return b.status !== 'resolved'; })
                 .sort(function(a, b){ return b.at - a.at; });
  var reports = open.map(function(b){
    var t = threadState(b);
    return dashListRow(b.title, b.pod + ' · ' + fmtDate(b.at),
      t === 'awaiting' ? 'Needs a reply' : t === 'replied' ? 'With the team' : 'New',
      t === 'awaiting' ? 'c-badge-warning' : 'c-badge-neutral');
  }).join('');

  $('#dashRestGrid').innerHTML =
    '<div class="c-card"><h3>Surveys in the library</h3><div class="dash-list">' + surveys + '</div></div>' +
    '<div class="c-card"><h3>Reports still open</h3><div class="dash-list">' + reports + '</div></div>';
}

/* Pointer tilt. Only on a settled card: the entrance owns `transform` until
   it is finished, and two timings on one property cannot both be honoured.
   The tilt is written as two custom properties the card's own transform
   already composes, so nothing here has to know the fan pose. */
function wireTilt(card){
  if (card.dataset.tiltEnabled !== 'true') return;
  var MAX = 6;
  card.addEventListener('mousemove', function(e){
    if (!card.classList.contains('is-settled')) return;
    var r = card.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width  - .5;
    var py = (e.clientY - r.top)  / r.height - .5;
    card.style.setProperty('--tilt-y', (px *  MAX).toFixed(2) + 'deg');
    card.style.setProperty('--tilt-x', (py * -MAX).toFixed(2) + 'deg');
  });
  card.addEventListener('mouseleave', function(){
    card.style.setProperty('--tilt-x', '0deg');
    card.style.setProperty('--tilt-y', '0deg');
  });
}

function renderDashboard(){
  $('#routeDashboard').hidden = false;
  /* Every other route calls setHeader, which clears the Back row on its way
     past. This one has no header to set, so it clears it itself — otherwise
     a Back button pointing at the library survives the trip to the
     Dashboard and offers to take you "back" somewhere you did not come
     from. */
  $('#backRow').hidden = true;

  var g = greeting();
  /* One source for the name: the account row in the rail. A second copy in
     here is a prototype that can greet you as somebody else. */
  /* Surname-first names are written "GAN, Jia Yi" here, so the given name
     is what follows the comma — splitting on the first space would greet
     someone as "GAN,". Names with no comma are unchanged. */
  var full = $('.c-sidebar-user-name').textContent.trim();
  var who = full.indexOf(',') > -1 ? full.slice(full.indexOf(',') + 1).trim()
                                   : full.split(' ')[0];
  $('#dashHello').textContent = g.word + ', ' + who + ' ' + g.mark;

  var focuses = dashFocuses();
  var host = $('#dashFan');
  host.innerHTML = focuses.map(function(c, i){ return heroCard(c, i, focuses.length); }).join('');

  $$('[data-heroact]', host).forEach(function(b){
    b.addEventListener('click', function(){ focuses[+b.dataset.heroact].act(); });
  });

  paintDashRest();

  var cards = $$('.c-card-slide', host);
  cards.forEach(function(card){
    wireTilt(card);
    /* Settled hands the transform from the entrance over to the interaction.
       Backed by a timeout because a backgrounded tab can drop transitionend
       outright, which would leave the card permanently unhoverable. */
    var settle = function(){ card.classList.add('is-settled'); };
    card.addEventListener('transitionend', function(e){
      if (e.propertyName === 'transform') settle();
    });
    setTimeout(settle, 2200);
  });

  /* One reflow, then the whole route is told to arrive at once — the timing
     differences are already written into each element's own delay. */
  void host.offsetWidth;
  $('#dashHello').classList.add('is-revealed');
  $('#dashSub').classList.add('is-revealed');
  cards.forEach(function(card){ card.classList.add('is-revealed'); });
}

/* ==========================================================================
   Landing — the two doors into this section
   Each card carries the two numbers that decide which one you want, read
   from the same data the subsections render, so they cannot disagree with
   what is behind them.
   ========================================================================== */
function entryCard(id, icon, tint, title, desc, facts, go){
  return '<button class="c-card c-card-interactive entry-card" type="button" data-entry="' + id + '">' +
    '<span class="entry-icon ' + tint + '" aria-hidden="true"><i class="ph-fill ' + icon + '"></i></span>' +
    '<span class="stack sm" style="align-items:flex-start">' +
      '<span class="entry-title">' + esc(title) + '</span>' +
      '<span class="entry-desc">' + esc(desc) + '</span>' +
    '</span>' +
    '<span class="entry-facts">' +
      facts.map(function(f){
        return '<span class="entry-fact"><b>' + esc(String(f[0])) + '</b><span>' + esc(f[1]) + '</span></span>';
      }).join('') +
    '</span>' +
    '<span class="entry-go">' + esc(go) +
      '<i class="ph ph-arrow-right" aria-hidden="true"></i></span>' +
  '</button>';
}

function renderLanding(){
  $('#routeLanding').hidden = false;
  setHeader('Feedback', 'Ask your team how it is going, and hear about it when something breaks.');

  var live = FORMS.filter(function(f){ return !f.archived && f.status === 'active'; }).length;
  var responses = FORMS.reduce(function(n, f){ return n + formCount(f); }, 0);
  var open = BUGS.filter(function(b){ return b.status !== 'resolved'; }).length;
  var mineWaiting = BUGS.filter(function(b){
    return b.who === ME.name && threadState(b) === 'awaiting';
  }).length;

  $('#entryGrid').innerHTML =
    entryCard('forms', 'ph-list-checks', '', 'Feedback Forms',
      'Build a survey, send it out, and read what comes back.',
      [[live, live === 1 ? 'live survey' : 'live surveys'],
       [responses.toLocaleString(), 'responses collected']],
      'Open the library') +
    entryCard('bugs', 'ph-bug', 'is-water', 'Bug Reports',
      'Report something broken, or work through what the pods have sent in.',
      [[open, open === 1 ? 'open report' : 'open reports'],
       [mineWaiting, 'waiting on you']],
      'Open reports');

  $$('[data-entry]', $('#entryGrid')).forEach(function(b){
    b.addEventListener('click', function(){
      go(b.dataset.entry === 'forms' ? 'hub' : 'bugMine');
    });
  });
}

/* ==========================================================================
   Feedback Hub
   ========================================================================== */
function formCount(f){ return f.responses.length || f.count || 0; }

/* --------------------------------------------------------------------------
   Search
   Character-aligned case/diacritic fold. Every output character records the
   index of the original character it came from, so a match found in the
   folded string can be mapped back onto the real text for highlighting.
   A plain `.normalize('NFD').replace(...)` cannot do that: a precomposed
   "ë" folds 1→1 but an already-decomposed "e"+U+0308 folds 2→1, so indices
   drift by an unpredictable amount and the highlight lands on the wrong
   letters.
   -------------------------------------------------------------------------- */
function fold(text){
  text = String(text);
  var out = '', map = [];
  for (var i = 0; i < text.length; i++){
    var c = text[i].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    for (var j = 0; j < c.length; j++){ out += c[j]; map.push(i); }
  }
  map.push(text.length);
  return { s:out, map:map };
}
/* Terms, not one string. The old search matched the whole query as a single
   substring of the title alone, so "Q3 product" found nothing in "Product
   experience survey — Q3", and no query at all could reach a description. */
function terms(q){ return fold(q).s.split(/\s+/).filter(Boolean); }
function matchAll(haystack, ts){
  var h = fold(haystack).s;
  return ts.every(function(t){ return h.indexOf(t) !== -1; });
}
/* Mark the matched runs, so a row that came back on a description or a
   status word says why rather than looking like a false positive. */
function mark(text, ts){
  text = String(text);
  if (!ts.length) return esc(text);
  var f = fold(text), hits = [];
  ts.forEach(function(t){
    var from = 0, i;
    while ((i = f.s.indexOf(t, from)) !== -1){ hits.push([i, i + t.length]); from = i + t.length; }
  });
  if (!hits.length) return esc(text);
  hits.sort(function(a, b){ return a[0] - b[0]; });
  var merged = [hits[0].slice()];
  hits.slice(1).forEach(function(h){
    var last = merged[merged.length - 1];
    if (h[0] <= last[1]) last[1] = Math.max(last[1], h[1]);
    else merged.push(h.slice());
  });
  var out = '', at = 0;
  merged.forEach(function(h){
    var a = f.map[h[0]], b = f.map[h[1]];
    out += esc(text.slice(at, a)) + '<mark class="hit">' + esc(text.slice(a, b)) + '</mark>';
    at = b;
  });
  return out + esc(text.slice(at));
}
/* What a form is searchable by. Status words are in here on purpose —
   "closed" is a thing people type into a search box. */
function formHaystack(f){
  return f.title + ' ' + f.desc + ' ' +
    /* The owning department is on the tile now, so it has to be typeable —
       a signal you can see but not search for is a dead end. */
    (f.owner ? f.owner.name + ' ' : '') +
    (f.status === 'active' ? 'active open live'
      : f.status === 'draft' ? 'draft unpublished not published' : 'closed ended') + ' ' +
    (f.archived ? 'archived archive' : '') + ' ' +
    (f.ends ? rangeLabel(f) : 'no deadline open ended ongoing');
}

function renderHub(){
  $('#routeHub').hidden = false;
  setHeader('Feedback Forms', 'Every survey your pod is running, and everything that has come back.',
    '<button class="c-btn c-btn-primary c-btn-md" type="button" id="newFormBtn"><i class="ph ph-plus"></i>New survey</button>');
  setBack('Feedback', 'landing');
  $('#newFormBtn').addEventListener('click', newForm);

  paintHubSort();

  var ts = terms(state.hubQuery);
  /* Chip counts count what the current query can actually reach, not the
     whole library. A chip reading "Closed 2" beside a search returning one
     row is the chip contradicting its own filter. */
  var found = FORMS.filter(function(f){ return matchAll(formHaystack(f), ts); });
  /* Archived surveys are out of the library entirely — they are not part of
     "All", which is why their count lives on its own chip. */
  var live = found.filter(function(f){ return !f.archived; });
  var filed = found.filter(function(f){ return f.archived; });
  $('#cntAll').textContent = live.length;
  $('#cntActive').textContent = live.filter(function(f){ return f.status === 'active'; }).length;
  /* Its own chip, because a status with no chip is a survey that can only
     be found under All — and it would leave the counts not adding up,
     which is the first thing anyone checks a filter row against. */
  $('#cntDraft').textContent  = live.filter(function(f){ return f.status === 'draft'; }).length;
  $('#cntClosed').textContent = live.filter(function(f){ return f.status === 'closed'; }).length;
  $('#cntArchived').textContent = filed.length;

  var archiveView = state.hubStatus === 'archived';
  var list = archiveView ? filed : live.filter(function(f){
    return state.hubStatus === 'all' || f.status === state.hubStatus;
  });

  var cnt = $('#hubSearchCount');
  if (ts.length){
    cnt.hidden = false;
    cnt.textContent = list.length + (list.length === 1 ? ' form matches ' : ' forms match ') +
      '“' + state.hubQuery.trim() + '”' +
      (state.hubStatus === 'all' ? '' : ' in ' + (archiveView ? 'the archive' : state.hubStatus + ' forms'));
  } else if (archiveView){
    cnt.hidden = false;
    cnt.textContent = 'Archived surveys are hidden from the library. Open one and choose Restore from archive to bring it back.';
  } else {
    cnt.hidden = true; cnt.textContent = '';
  }

  var host = $('#hubList');
  if (!list.length){
    host.innerHTML = '<div class="c-empty is-section">' +
      '<i class="ph ph-magnifying-glass" aria-hidden="true"></i>' +
      '<h4>No forms match</h4>' +
      '<p>' + (ts.length ? 'Nothing matching &ldquo;' + esc(state.hubQuery.trim()) + '&rdquo;' +
                   (state.hubStatus !== 'all' ? ' in ' + (archiveView ? 'the archive' : state.hubStatus + ' forms') : '') + '.'
                 : archiveView ? 'Nothing has been archived yet.'
                 : 'There are no ' + state.hubStatus + ' forms yet.') + '</p>' +
      '<div class="c-empty-actions"><button class="c-btn c-btn-secondary c-btn-md" type="button" id="clearHub">Clear filters</button></div>' +
      '</div>';
    $('#clearHub').addEventListener('click', function(){
      state.hubStatus = 'all';
      syncHubChips();
      clearHubSearch();
    });
    return;
  }

  list = hubSorted(list);
  host.innerHTML = state.hubView === 'grid' ? hubGrid(list, ts) : hubTable(list, ts);
  $$('[data-form]', host).forEach(function(b){
    b.addEventListener('click', function(){ go('builder', { formId:b.dataset.form }); });
    /* A table row is not a button, so it has to answer the keyboard itself
       — the grid's tiles already are buttons and get this for free. */
    if (b.tagName === 'TR') b.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go('builder', { formId:b.dataset.form }); }
    });
  });
  /* Header sort — cycles ascending, descending, then back to the library's
     default order. Focus goes back to the header the click came from, since
     the whole table is rebuilt underneath it. */
  $$('[data-hubcol]', host).forEach(function(th){
    function cycle(){
      var k = th.dataset.hubcol, c = hubCol(k);
      if (state.hubSortCol !== k){ state.hubSortCol = k; state.hubSortDir = c.def; }
      else if (state.hubSortDir === c.def){ state.hubSortDir = -c.def; }
      else { state.hubSortCol = 'updated'; state.hubSortDir = -1; }
      renderHub();
      var back = $('[data-hubcol="' + k + '"]', $('#hubList'));
      if (back) back.focus();
    }
    th.addEventListener('click', cycle);
    th.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); cycle(); }
    });
  });
  /* Scroll boundary shadow — the frozen columns only cast one while there is
     scrolled content underneath them. */
  var wrap = $('.c-table-scroll-x', host);
  if (wrap){
    var paintFreeze = function(){
      wrap.classList.toggle('is-scrolled-left', wrap.scrollLeft > 0);
      wrap.classList.toggle('is-scrolled-right', wrap.scrollLeft + wrap.clientWidth < wrap.scrollWidth - 1);
    };
    wrap.addEventListener('scroll', paintFreeze);
    paintFreeze();
  }
  $$('[data-libmenu]', host).forEach(function(btn){
    var pop = btn.nextElementSibling;
    btn.addEventListener('click', function(e){
      e.stopPropagation();                       /* never opens the survey */
      var open = pop.hidden;
      closeMenus();
      pop.hidden = !open;
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open && btn.closest('.lib-table')) placeRowMenu(btn, pop);
    });
    pop.addEventListener('click', function(e){ e.stopPropagation(); });
    $$('[data-rowkb]', pop).forEach(function(item){
      item.addEventListener('click', function(){
        closeMenus();
        formAction(FORMS.filter(function(x){ return x.id === btn.dataset.libmenu; })[0],
                   item.dataset.rowkb);
      });
    });
  });
}

/* A menu placed against the viewport does not travel with the row it belongs
   to, so scrolling closes it rather than leaving it behind. */
document.addEventListener('scroll', function(e){
  if ($$('.lib-table .menu-pop:not([hidden])').length) closeMenus();
}, true);

/* Inside the table the menu cannot be absolute — see .lib-table .menu-pop.
   It is measured after it is shown, right-aligned to the trigger, and flipped
   above it when there is not room below. */
function placeRowMenu(btn, pop){
  var r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  var left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8));
  var below = r.bottom + 8, above = r.top - 8 - h;
  pop.style.left = left + 'px';
  pop.style.top = (below + h <= window.innerHeight - 8 || above < 8 ? below : above) + 'px';
}

/* Three states, not two. Closed means a survey that ran and has stopped —
   it has a start, an end and usually responses behind it. A survey nobody
   has published yet has none of that, and calling it Closed says something
   untrue about it on the tile, in the library and beside its own title in
   the builder. The copy on the rest of this screen was already using the
   right word for it — "a draft cannot take responses", "Publish the form
   to accept responses" — while the badge said otherwise. */
function statusBadge(f){
  if (f.archived) return '<span class="c-badge c-badge-neutral">' +
    '<i class="ph ph-archive" aria-hidden="true"></i>Archived</span>';
  if (f.status === 'active') return '<span class="c-badge c-badge-success">Active</span>';
  /* Draft and Closed share Neutral. Both mean "not taking responses", and
     the difference between them is which one it is, not how much it
     matters — the word carries that, a second colour would only imply a
     severity neither has. */
  return '<span class="c-badge c-badge-neutral">' +
    (f.status === 'draft' ? 'Draft' : 'Closed') + '</span>';
}

/* Grid — Card's Functional grid and its Interactive variant, rendered as a
   <button> so the whole tile is the target, matching what the list rows
   already do. */
function hubGrid(list, ts){
  return '<div class="lib-grid">' + list.map(function(f){
    var n = formCount(f);
    /* Status and countdown sit together at the top; the whole tile is the
       target, so the old corner arrow was decoration repeating what the
       hover state and the cursor already say. */
    /* Reading order is chip, heading, state: who owns it, what it is called,
       where it stands. The badges sit under the heading rather than above it
       so the title is the first line of text on the tile and the two tiles
       either side of it line up on that title, not on a badge row whose
       height depends on how many badges the survey happens to warrant. */
    return '<div class="lib-card-wrap">' +
      '<button class="c-card c-card-interactive lib-card" type="button" data-form="' + f.id + '">' +
        ownerChip(f) +
        '<span class="lib-card-title">' + mark(f.title, ts) + '</span>' +
        '<span class="tag-row">' + statusBadge(f) + deadlinePill(f) + '</span>' +
        '<span class="lib-card-foot">' +
          '<span><b>' + n.toLocaleString() + '</b> <span class="lib-row-meta">' +
            (n === 1 ? 'response' : 'responses') + '</span></span>' +
          '<span class="lib-row-meta">' + esc(rangeLabel(f)) + '</span>' +
        '</span>' +
      '</button>' +
      formMenu(f) +
    '</div>';
  }).join('') + '</div>';
}

/* Everything a survey can be done to without opening it, written once and
   rendered identically on a grid tile and a list row. Grouped in the order
   the work happens: get into it, get it out to people, look after it, and
   the destructive one on its own at the bottom. */
function formMenuItem(kb, icon, label, cls){
  return '<button type="button" role="menuitem"' + (cls ? ' class="' + cls + '"' : '') +
    ' data-rowkb="' + kb + '"><i class="ph ' + icon + '" aria-hidden="true"></i>' + label + '</button>';
}
function formMenuItems(f){
  return formMenuItem('edit',    'ph-pencil-simple',    'Edit survey') +
    formMenuItem('preview', 'ph-eye',              'Preview survey') +
    formMenuItem('analyse', 'ph-chart-bar',        'Analyse results') +
    '<span class="menu-pop-sep" aria-hidden="true"></span>' +
    formMenuItem('send',    'ph-paper-plane-tilt', 'Send survey') +
    formMenuItem('share',   'ph-user-plus',        'Share') +
    '<span class="menu-pop-sep" aria-hidden="true"></span>' +
    formMenuItem('copy',    'ph-copy',             'Make a copy') +
    formMenuItem('archive', f.archived ? 'ph-arrow-counter-clockwise' : 'ph-archive',
                            f.archived ? 'Restore from archive' : 'Archive') +
    '<span class="menu-pop-sep" aria-hidden="true"></span>' +
    formMenuItem('trash',   'ph-trash',            'Delete', 'danger');
}
/* Trigger plus panel, so a tile and a row cannot drift apart. */
function formMenu(f){
  return '<span class="menu-wrap">' +
    '<button class="c-icon-btn" type="button" data-libmenu="' + f.id + '"' +
      ' aria-haspopup="menu" aria-expanded="false" aria-label="More options for ' + esc(f.title) + '">' +
      '<i class="ph ph-dots-three-vertical" aria-hidden="true"></i></button>' +
    '<div class="menu-pop is-flat" role="menu" aria-label="' + esc(f.title) + '" hidden>' +
      formMenuItems(f) + '</div>' +
  '</span>';
}

/* Sorting — one (column, direction) pair for the whole library, whichever
   view is showing. The list view's own sortable headers and the sort control
   above the views both read and write this, so they cannot disagree, and the
   grid gets an order without a header row to click.
   `def` is the direction a column takes on first click: dates and counts
   open on their largest value, text on A. */
var HUB_COLS = [
  { key:'title',     label:'Survey',    pick:'Title',        num:false, def:1,
    dir:['A to Z','Z to A'],
    val:function(f){ return f.title.toLowerCase(); } },
  /* Ownership is an attribute of the survey, so it sits next to the title
     rather than out past the metrics. Sorting by it groups the library by
     department, which is the whole reason the colour is in the data. An
     unowned survey sorts to the A-to-Z end with the other blanks. */
  { key:'owner',     label:'Owner',     pick:'Owner',        num:false, def:1,
    dir:['A to Z','Z to A'],
    val:function(f){ return f.owner ? f.owner.name.toLowerCase() : ''; } },
  { key:'status',    label:'Status',    pick:'Status',       num:true,  def:1,
    /* Ordered by how live the survey is, so the two ends of the sort are
       the two things anyone actually asks for: what is running, or what is
       out of the way. Draft sits between — not collecting, but not over. */
    dir:['Active first','Archived first'],
    val:function(f){ return f.archived ? 3 : f.status === 'active' ? 0 : f.status === 'draft' ? 1 : 2; } },
  { key:'deadline',  label:'Deadline',  pick:'Deadline',     num:true,  def:1,
    dir:['Closing soonest','Closing latest'],
    /* No deadline sorts last either way — it is not a date, so it cannot
       take a place in the middle of them. */
    val:function(f){ return f.ends ? f.ends.getTime() : Infinity; } },
  { key:'responses', label:'Responses', pick:'Responses',    num:true,  def:-1,
    dir:['Fewest first','Most first'],
    val:function(f){ return formCount(f); } },
  { key:'updated',   label:'Updated',   pick:'Last updated', num:true,  def:-1,
    dir:['Oldest first','Newest first'],
    val:function(f){ return f.updated.getTime(); } }
];
function hubCol(key){
  return HUB_COLS.filter(function(c){ return c.key === key; })[0] || HUB_COLS[4];
}
function hubSorted(list){
  var c = hubCol(state.hubSortCol), dir = state.hubSortDir;
  return list.slice().sort(function(x, y){
    var a = c.val(x), b = c.val(y);
    if (c.num) return (a === b ? 0 : a < b ? -1 : 1) * dir;
    return String(a).localeCompare(String(b)) * dir;
  });
}
/* Direction reads as what it does to the column in hand: a date does not
   run A to Z and a title does not run newest first. */
function hubDirLabel(dir){
  var c = hubCol(state.hubSortCol);
  return c.dir[dir === 1 ? 0 : 1];
}
function hubSortSet(key, dir){
  state.hubSortCol = key;
  state.hubSortDir = dir;
  renderHub();
}

/* Table's own documented header behaviour: every eligible column sortable,
   one active sort at a time, cycling through to the library's default order
   (most recently updated) as the third state — the table always has an
   order, so "unsorted" here means that default rather than no order at all.
   The Actions column is one of the two the spec exempts. */
function hubSortTh(c, extra){
  var on = state.hubSortCol === c.key;
  var asc = state.hubSortDir === 1;
  var icon = !on ? 'ph-arrows-down-up' : (asc ? 'ph-arrow-up' : 'ph-arrow-down');
  return '<th class="c-table-sort-th' + (on ? ' is-sorted' : '') + (extra || '') + '" data-hubcol="' + c.key + '"' +
    ' tabindex="0" role="columnheader" aria-sort="' + (on ? (asc ? 'ascending' : 'descending') : 'none') + '">' +
    esc(c.label) + '<i class="ph ' + icon + ' c-table-sort-icon" aria-hidden="true"></i></th>';
}

/* List — Table's Standalone variant. The rows used to be a div stack with a
   button per row, which was a table drawn by hand: no header, so nothing to
   sort by, and five values crammed into two lines. */
function hubTable(list, ts){
  return '<div class="c-table-standalone-wrap c-table-scroll-x">' +
    '<table class="c-table c-table-standalone lib-table">' +
    /* Frozen columns: once this table scrolls sideways (it does below
       820px), the row's identity and its actions are the two the spec keeps
       in reach — everything between them scrolls underneath. */
    '<thead><tr>' + HUB_COLS.map(function(c, i){
        return hubSortTh(c, i === 0 ? ' c-table-freeze-left' : '');
      }).join('') +
      '<th class="c-table-action-col c-table-freeze-right no-sort"><span class="sr-only">Actions</span></th>' +
    '</tr></thead><tbody>' + list.map(function(f){
      var n = formCount(f);
      return '<tr class="is-interactive is-clickable" data-form="' + f.id + '" tabindex="0"' +
        ' aria-label="' + esc(f.title) + '">' +
        '<td class="c-table-freeze-left"><span class="lib-cell-title">' + mark(f.title, ts) + '</span>' +
          (f.desc ? '<span class="lib-cell-sub">' + mark(f.desc, ts) + '</span>' : '') + '</td>' +
        '<td class="nowrap">' + ownerTag(f) + '</td>' +
        '<td class="nowrap">' + statusBadge(f) + '</td>' +
        '<td class="nowrap">' + deadlinePill(f) + '</td>' +
        '<td class="num nowrap"><b>' + n.toLocaleString() + '</b></td>' +
        '<td class="num nowrap">' + fmtDate(f.updated) + '</td>' +
        '<td class="c-table-action-col c-table-freeze-right">' + formMenu(f) + '</td>' +
      '</tr>';
    }).join('') + '</tbody></table></div>';
}

/* The chips live in persistent markup, so anything that changes hubStatus
   from elsewhere (archiving a survey, clearing filters) has to put them back
   in step through here rather than assuming a click did it. */
function syncHubChips(){
  $$('#routeHub .c-chip-filter').forEach(function(c){
    c.classList.toggle('is-active', c.dataset.status === state.hubStatus);
  });
}

/* Wired once, not per render: #hubViewSeg, the chips and the search box are
   all persistent DOM, so re-binding them inside renderHub would add one
   listener per keystroke. */
$$('#routeHub .c-chip-filter').forEach(function(c){
  c.addEventListener('click', function(){
    state.hubStatus = c.dataset.status;
    syncHubChips();
    renderHub();
  });
});
wireSeg($('#hubViewSeg'), state.hubView === 'grid' ? 0 : 1, function(i){
  state.hubView = i ? 'list' : 'grid';
  renderHub();
});

/* Sort control — the field in a Dropdown Single select, the direction in one
   toggle beside it. Both write the same state the table headers do, so this
   is repainted from that state rather than from its own last click. */
$('#hubSortList').innerHTML = HUB_COLS.map(function(c){
  return '<div class="c-dropdown-row" role="option" data-hubsort="' + c.key + '">' +
    '<span class="c-dropdown-row-label">' + esc(c.pick) + '</span>' +
    '<i class="ph ph-check c-dropdown-row-check" aria-hidden="true"></i></div>';
}).join('');
function paintHubSort(){
  var c = hubCol(state.hubSortCol), asc = state.hubSortDir === 1;
  $('#hubSortTrigger').value = c.pick;
  $$('#hubSortList [data-hubsort]').forEach(function(r){
    r.classList.toggle('selected', r.dataset.hubsort === c.key);
  });
  $('#hubSortDirIcon').className = 'ph ' + (asc ? 'ph-sort-ascending' : 'ph-sort-descending');
  var label = hubDirLabel(state.hubSortDir);
  $('#hubSortDir').setAttribute('title', label + ' — switch to ' + hubDirLabel(-state.hubSortDir).toLowerCase());
  $('#hubSortDir').setAttribute('aria-label', 'Sorted ' + label.toLowerCase() + '. Reverse the order');
}
(function wireHubSort(){
  var trig = $('#hubSortTrigger'), panel = $('#hubSortPanel'), field = trig.closest('.c-dropdown-field');
  function shut(){ panel.hidden = true; field.classList.remove('open'); trig.setAttribute('aria-expanded', 'false'); }
  trig.addEventListener('click', function(e){
    e.stopPropagation();
    var open = panel.hidden;
    closeMenus();
    closeDropdowns();
    panel.hidden = !open;
    field.classList.toggle('open', open);
    trig.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  panel.addEventListener('click', function(e){ e.stopPropagation(); });
  $$('[data-hubsort]', panel).forEach(function(r){
    r.addEventListener('click', function(){
      shut();
      /* Changing the field takes that column's own opening direction, the
         same as a first click on its header would. */
      hubSortSet(r.dataset.hubsort, hubCol(r.dataset.hubsort).def);
      trig.focus();
    });
  });
  $('#hubSortDir').addEventListener('click', function(){
    hubSortSet(state.hubSortCol, -state.hubSortDir);
  });
})();

function clearHubSearch(){
  state.hubQuery = '';
  $('#hubSearch').value = '';
  $('#hubSearchClear').hidden = true;
  renderHub();
  $('#hubSearch').focus();
}
$('#hubSearch').addEventListener('input', function(e){
  state.hubQuery = e.target.value;
  $('#hubSearchClear').hidden = !e.target.value;
  renderHub();
});
$('#hubSearch').addEventListener('keydown', function(e){
  /* Escape clears the field rather than falling through to the global
     handler, which would otherwise close a layer the reader never opened. */
  if (e.key === 'Escape' && $('#hubSearch').value){ e.stopPropagation(); clearHubSearch(); }
});
$('#hubSearchClear').addEventListener('click', clearHubSearch);

function newForm(){
  /* A new survey starts owned by the pod the author is actually in, so it
     carries a department from the first render instead of appearing as the
     one chipless tile in the grid. */
  var f = { id:'f' + (FORMS.length + 1), title:'Untitled survey', status:'draft', archived:false,
    owner:{ name:ME.pods[0], icon:'ph-clipboard-text' },
    desc:'', starts:new Date(NOW), ends:null,
    updated:new Date(NOW), questions:[], responses:[],
    settings:{ sendCopy:false, allowEdit:false, oneResponse:true, progressBar:true,
               confirm:'Thanks for your feedback!' } };
  FORMS.unshift(f);
  go('builder', { formId:f.id });
  toast('New survey created');
}

/* ==========================================================================
   Form builder
   ========================================================================== */
function currentForm(){ return FORMS.filter(function(f){ return f.id === state.formId; })[0]; }

function renderBuilder(){
  var f = currentForm();
  if (!f){ go('hub'); return; }
  $('#routeBuilder').hidden = false;
  var d = deadline(f);
  /* The status is a badge beside the title now, exactly as it reads on the
     library tile, which leaves the subtitle to say the one thing the badge
     cannot: when this survey closes. */
  setHeader(f.title, d.text, null, statusBadge(f));
  setBack(f.archived ? 'Archive' : 'Feedback Forms', 'hub');

  /* One menu item, two directions — the survey is either in the archive or
     it is not, and offering both at once would be offering a no-op. */
  var arch = $('[data-kb="archive"]');
  arch.innerHTML = '<i class="ph ' + (f.archived ? 'ph-arrow-counter-clockwise' : 'ph-archive') +
    '" aria-hidden="true"></i>' + (f.archived ? 'Restore from archive' : 'Archive');

  $('#qCount').textContent = f.questions.length;
  $('#rCount').textContent = formCount(f);
  $$('#builderTabs .c-tab').forEach(function(t){
    var on = t.dataset.btab === state.btab;
    t.classList.toggle('active', on); t.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  $('#tabQuestions').hidden = state.btab !== 'questions';
  $('#tabResponses').hidden = state.btab !== 'responses';
  $('#tabSettings').hidden  = state.btab !== 'settings';

  if (state.btab === 'questions')      renderQuestions(f);
  else if (state.btab === 'responses') renderResponses(f);
  else                                 renderSettings(f);
}

$$('#builderTabs .c-tab').forEach(function(t){
  t.addEventListener('click', function(){
    destroyCharts(); state.btab = t.dataset.btab; state.respIndex = 0; renderBuilder();
  });
});

/* Toolbar */
$$('.toolbar [data-tb]').forEach(function(b){
  b.addEventListener('click', function(){
    var f = currentForm(), a = b.dataset.tb;
    if (a === 'publish'){
      /* Re-opening a survey that already ran: its end date is behind us, and
         keeping it would leave the survey Active and over at the same time —
         "is accepting responses. Ended 22 Aug." Cleared rather than quietly
         carried, and the modal is the one that says it happened. */
      var stale = (f.ends && closesIn(f) < 0) ? f.ends : null;
      if (stale) f.ends = null;
      f.status = 'active';
      f.updated = new Date(NOW);
      renderBuilder();
      /* No toast behind it. The modal says the same thing and stays until
         it is dealt with; two announcements of one event is one too many. */
      openPublished(f, stale);
    }
    else if (a === 'link'){ copyResponderLink(f, 'Responder link copied'); }
    else if (a === 'preview'){ openPreview(f); }
    else if (a === 'users'){ openShare(f); }
    else if (a === 'undo'){ toast('Nothing to undo'); }
    else if (a === 'redo'){ toast('Nothing to redo'); }
  });
});
$('#kebabBtn').addEventListener('click', function(e){
  e.stopPropagation();
  var m = $('#kebabMenu'), open = m.hidden;
  m.hidden = !open; $('#kebabBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
});
/* One document-level handler closes every popover in the prototype. Adding a
   listener per render leaks one handler per navigation.
   Panels are found by class, not held in a registry: a registry has to be
   re-synced by every route re-render, and a stale entry in it points at a
   node that is no longer in the document. */
document.addEventListener('click', function(){
  $('#kebabMenu').hidden = true; $('#kebabBtn').setAttribute('aria-expanded','false');
  closeMenus();
  closeDropdowns();
  closePodFilter();
});
/* Every form-level action, in one place. The builder's kebab and every
   library menu call this, so the same action cannot mean two slightly
   different things depending on where it was pressed. */
function formAction(f, kb){
  if (!f) return;
  /* The three that open the survey land on the tab that does the job, so
     "Analyse results" is one click rather than one click and a tab. */
  if (kb === 'edit' || kb === 'analyse'){
    state.btab = kb === 'analyse' ? 'responses' : 'questions';
    state.respIndex = 0;
    go('builder', { formId:f.id });
  } else if (kb === 'preview'){
    go('builder', { formId:f.id });
    openPreview(f);
  } else if (kb === 'share'){
    openShare(f);
  } else if (kb === 'send'){
    /* Sending a survey nobody can answer is the one mistake worth catching
       here — a draft link opens for editors and dead-ends for everyone else. */
    if (f.status !== 'active'){
      toast('Publish this survey before sending it — a draft cannot take responses');
    } else {
      copyResponderLink(f);
    }
  } else if (kb === 'copy'){
    var c = JSON.parse(JSON.stringify({ questions:f.questions, settings:f.settings }));
    /* A copy has not been published either, whatever the survey it came
       from was doing. */
    FORMS.unshift({ id:'f' + (FORMS.length + 1), title:f.title + ' (copy)', status:'draft',
      archived:false, owner:f.owner, desc:f.desc, starts:new Date(NOW), ends:null,
      updated:new Date(NOW), questions:c.questions, responses:[], settings:c.settings });
    go('hub'); toast('Copy created');
  } else if (kb === 'archive'){
    f.archived = !f.archived;
    /* Land in the list the survey just moved into, so the move is visible
       rather than something that happened off-screen. */
    state.hubStatus = f.archived ? 'archived' : 'all';
    syncHubChips();
    go('hub');
    toast(f.archived ? 'Moved to the archive' : 'Restored from the archive', 'success');
  } else {
    /* Deleting a survey takes its responses with it and there is no undo,
       so it is the one action in this file that asks first. The count is
       shown rather than described: "128 responses" stops a hand that
       "this cannot be undone" does not. */
    var n = formCount(f);
    askConfirm({
      title: 'Delete this survey?',
      body: '<p><b>' + esc(f.title) + '</b> will be removed from the library for everyone in your pod.</p>' +
        (n ? '<div class="confirm-cost"><i class="ph-fill ph-warning" aria-hidden="true"></i>' +
             n.toLocaleString() + ' ' + (n === 1 ? 'response goes' : 'responses go') +
             ' with it, and cannot be recovered.</div>'
           : '<p>It has no responses yet.</p>'),
      confirmLabel: 'Delete survey',
      onConfirm: function(){
        FORMS = FORMS.filter(function(x){ return x.id !== f.id; });
        go('hub'); toast('Survey deleted');
      }
    });
    return;
  }
}
$$('#kebabMenu button').forEach(function(b){
  b.addEventListener('click', function(){ formAction(currentForm(), b.dataset.kb); });
});

/* ---------- Tab 1 — Questions ---------- */

/* The block types, declared once. Both the fixed bar and the floating rail
   read this list, so they can never drift apart. */
/* What the bar and the rail can add. Each one lands as a real question of
   that type rather than an empty block to retype: the type switcher on the
   block can still change it afterwards, but the point of a named Add button
   is that the thing it adds is already the thing.
   Order is Add question, then everything else alphabetically — the same
   ordering the type dropdown uses, so the icons in the strip and the rail
   sit in the order the dropdown lists them in. Add question keeps the top
   because it is the labelled primary and the one almost every visit is
   for; it is the only fixed position, and it is fixed by kind rather than
   by where it happens to be written below. */
var BLOCKS = [
  { kind:'question', label:'Add question',        icon:'ph-plus-circle' },
  { kind:'single',   label:'Add single choice',   icon:'ph-radio-button' },
  { kind:'multi',    label:'Add multiple choice', icon:'ph-check-square' },
  { kind:'matrix',   label:'Add rating table',    icon:'ph-table' },
  { kind:'stars',    label:'Add star rating',     icon:'ph-star' },
  { kind:'rank',     label:'Add ranking',         icon:'ph-list-numbers' },
  { kind:'slider',   label:'Add slider',          icon:'ph-faders-horizontal' },
  { kind:'poll',     label:'Add poll',            icon:'ph-chart-donut' },
  { kind:'image',    label:'Add image',           icon:'ph-image' },
  { kind:'video',    label:'Add video',           icon:'ph-video' }
];
function blockOrder(){
  var pinned = BLOCKS.filter(function(b){ return b.kind === 'question'; });
  return pinned.concat(BLOCKS.filter(function(b){ return b.kind !== 'question'; })
    .sort(function(a, b){ return a.label.localeCompare(b.label); }));
}
function addBarButtons(){
  return blockOrder().map(function(b, i){
    /* The first one carries its label; the rest are Button's own icon-only
       variant, which supplies the accessible name from aria-label. Six
       labelled buttons in a row came to 900px of controls for something
       that is one decision. */
    if (!i) return '<button class="c-btn c-btn-secondary c-btn-sm" type="button" data-add="' + b.kind + '">' +
      '<i class="ph ' + b.icon + '" aria-hidden="true"></i>' + b.label + '</button>' +
      '<span class="add-bar-sep" aria-hidden="true"></span>';
    return '<button class="c-btn c-btn-ghost c-btn-sm c-btn-icon" type="button" data-add="' + b.kind + '"' +
      ' title="' + b.label + '" aria-label="' + b.label + '">' +
      '<i class="ph ' + b.icon + '" aria-hidden="true"></i></button>';
  }).join('');
}
function addRailButtons(){
  /* Icon-only, because a rail wide enough for "Add question" would be a
     second column of the page rather than a control. Button's own icon-only
     variant carries the accessible name. */
  return blockOrder().map(function(b){
    return '<button class="c-btn c-btn-ghost c-btn-sm c-btn-icon" type="button" data-add="' + b.kind + '"' +
      ' title="' + b.label + '" aria-label="' + b.label + '">' +
      '<i class="ph ' + b.icon + '" aria-hidden="true"></i></button>';
  }).join('');
}

/* Questions are staged the same way Settings are. Everything on this tab —
   the title, the description, adding, deleting, reordering, retyping — is
   written to a draft of the form, and nothing reaches the survey until
   Save. Live edits on a published survey change what responders are looking
   at mid-answer, which is not something anyone should do by typing.
   The draft is keyed by form id, so switching surveys cannot carry edits
   from one into another. */
var qDraft = null;
function qDraftFor(f){
  if (!qDraft || qDraft.id !== f.id){
    qDraft = { id:f.id, title:f.title, desc:f.desc,
               questions: JSON.parse(JSON.stringify(f.questions)) };
    /* A table-edit session belongs to one question inside one draft. A new
       draft means a different survey, so any open editor is stale — left
       alone it would reopen against whichever question happened to share
       the id. */
    qcEdit = null; qcDraft = null;
  }
  return qDraft;
}
function qDirty(f){
  var d = qDraftFor(f);
  return d.title !== f.title || d.desc !== f.desc ||
         JSON.stringify(d.questions) !== JSON.stringify(f.questions);
}
/* Patched in place, never re-rendered: a repaint on every keystroke would
   take the caret out of whichever question is being typed into. There is
   one save cluster now, in the toolbar, and whichever tab is showing owns
   it — so the old per-tab scoping is gone with the per-tab bars. */
function refreshQSave(){
  var bar = $('#tbSave .set-save');
  if (!bar) return;
  var dirty = qDirty(currentForm());
  bar.classList.toggle('is-dirty', dirty);
  $('.set-save-state', bar).innerHTML = saveStateHtml(dirty);
  $('#qSave').disabled = !dirty;
  $('#qDiscard').disabled = !dirty;
}
/* Anything staged anywhere in the builder. Preview reads it to say whether
   what it is showing is what responders would currently get. */
function builderDirty(f){
  return (!!settingsDraft && settingsDraft.id === f.id && settingsDirty(f)) ||
         (!!qDraft && qDraft.id === f.id && qDirty(f));
}

function renderQuestions(form){
  var host = $('#tabQuestions');
  var f = qDraftFor(form);
  var dirty = qDirty(form);
  host.innerHTML =
    '<div class="c-card stack">' +
      '<label class="c-field field-wide"><span class="eyebrow">Form title</span>' +
        '<div class="input-wrap"><input type="text" id="fTitle" value="' + esc(f.title) + '" /></div></label>' +
      '<label class="c-field field-wide"><span class="eyebrow">Description</span>' +
        '<textarea id="fDesc" rows="2" placeholder="What is this form for?">' + esc(f.desc) + '</textarea></label>' +
    '</div>' +
    /* Two copies of the same six actions, on purpose.
       The bar sits after the list, where the block it adds lands, and it is
       the only one of the two that survives a narrow screen (the rail is
       hidden below 820px, where the content column cannot spare 56px).
       The rail follows the scroll for the rest of the session. It lives in
       its own grid column rather than floating over the content, so it
       rides alongside whichever question is in view and can never cover one
       — an overlay pinned to the viewport edge would sit on top of a
       question's own type switcher and delete button. */
    '<div class="builder-cols">' +
      '<div id="qList" class="stack"></div>' +
      '<div class="add-rail" role="group" aria-label="Add a block">' +
        addRailButtons() +
      '</div>' +
    '</div>' +
    '<div class="add-bar" role="group" aria-label="Add a block">' + addBarButtons() + '</div>';

  /* The save cluster lives in the toolbar, not at the foot of the tab. As a
     bar floating at the bottom of the viewport it sat permanently over the
     questions underneath it — and when nothing was staged it was occluding
     content to say so. In the toolbar it is beside the other form-level
     actions, where the reader already looks for Publish. */
  $('#tbSave').innerHTML = saveClusterHtml('q', dirty, 'Save form');

  /* The page header keeps saying the survey's saved name. It used to track
     this field keystroke by keystroke, which now would have the page titled
     something that does not exist yet; Save re-renders the header. */
  $('#fTitle').addEventListener('input', function(e){ f.title = e.target.value; refreshQSave(); });
  $('#fDesc').addEventListener('input', function(e){ f.desc = e.target.value; refreshQSave(); });
  $$('[data-add]', host).forEach(function(b){
    b.addEventListener('click', function(){ addBlock(f, b.dataset.add); });
  });

  $('#qSave').addEventListener('click', function(){
    form.title = f.title;
    form.desc  = f.desc;
    form.questions = JSON.parse(JSON.stringify(f.questions));
    form.updated = new Date(NOW);
    lastSavedAt[form.id] = Date.now();
    qDraft = null; qcEdit = null; qcDraft = null;
    renderBuilder();
    toast('Form saved', 'success');
  });
  $('#qDiscard').addEventListener('click', function(){
    qDraft = null; qcEdit = null; qcDraft = null;
    renderBuilder();
    toast('Changes discarded');
  });

  paintQuestions(f);
}

function paintQuestions(f){
  var list = $('#qList');
  if (!f.questions.length){
    list.innerHTML = '<div class="c-empty is-section">' +
      '<i class="ph ph-list-plus" aria-hidden="true"></i><h4>No questions yet</h4>' +
      '<p>Add your first question below. You can reorder blocks by dragging the handle, or with the keyboard.</p></div>';
    $('#qCount').textContent = 0;
    refreshQSave();
    return;
  }
  var n = 0;
  list.innerHTML = f.questions.map(function(q, i){
    var body;
    if (q.type === 'media'){
      body = uploadZoneHtml(q);
    } else {
      n++;
      body = questionBody(q);
    }
    var isMedia = q.type === 'media';
    return '<div class="qblock" draggable="true" data-q="' + q.id + '" data-idx="' + i + '">' +
      '<button class="qgrip" type="button" aria-label="Reorder: ' + esc(q.title || 'block') +
        '. Press up or down arrow to move." data-grip="' + i + '"><i class="ph ph-dots-six-vertical" aria-hidden="true"></i></button>' +
      '<div class="qblock-head">' +
        (isMedia ? '' : '<span class="qblock-num">' + n + '</span>') +
        '<div class="grow stack sm">' +
          '<input class="c-dropdown-input" style="border:0;padding:0;height:auto;font-size:var(--text-body1-size);line-height:var(--text-body1-lh);font-weight:700;font-family:inherit;color:var(--color-neutral-9);background:transparent;caret-color:auto;cursor:text;width:100%" value="' + esc(q.title) + '" data-title="' + q.id + '" aria-label="Question text" />' +
          (q.dependsOn ? '<span class="hint"><i class="ph ph-arrow-elbow-down-right" aria-hidden="true"></i> Shown when &ldquo;' + esc(q.dependsValue) + '&rdquo; is selected above</span>' : '') +
        '</div>' +
        '<div class="qblock-actions">' +
          (isMedia ? '' : typeSwitcher(q)) +
          '<button class="c-icon-btn" type="button" title="Duplicate" aria-label="Duplicate" data-dup="' + i + '"><i class="ph ph-copy" aria-hidden="true"></i></button>' +
          '<button class="c-icon-btn" type="button" title="Delete" aria-label="Delete" data-del="' + i + '"><i class="ph ph-trash" aria-hidden="true"></i></button>' +
        '</div>' +
      '</div>' +
      body +
      (isMedia ? '' :
      '<div class="qblock-foot">' +
        '<label class="c-choice switch"><input type="checkbox" data-req="' + i + '"' + (q.required ? ' checked' : '') + ' />' +
          '<span class="c-switch-track' + (q.required ? ' on' : '') + '"><span class="c-switch-thumb"></span></span>' +
          '<span class="text"><span class="label" style="font-size:var(--text-body2-size)">Required</span></span></label>' +
      '</div>') +
    '</div>';
