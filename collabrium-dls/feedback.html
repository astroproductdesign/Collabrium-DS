      '<div class="stack sm">' +
        '<span class="eyebrow">People with access</span>' +
        '<div class="share-people">' +
          people.map(function(p){
            return '<div class="share-person">' +
              '<span class="avatar">' + esc(initials(p.name)) + '</span>' +
              '<span class="td-stack" style="gap:0;flex:1 1 auto;min-width:0">' +
                '<b>' + esc(p.name) + (p.name === ME.name ? ' <span class="hint">(you)</span>' : '') + '</b>' +
                (p.role === 'owner' ? '<span class="hint">Owner &middot; created this survey</span>' : '') +
              '</span>' +
              (p.role === 'owner'
                ? '<span class="c-badge c-badge-neutral">Owner</span>'
                : '<div class="c-field c-dropdown-field dd-float align-right" style="width:150px">' +
                    '<div class="input-wrap has-trailing-icon">' +
                      '<input type="text" class="c-dropdown-input" id="role-' + esc(slug(p.name)) + '" readonly value="' + ROLES[p.role] + '"' +
                        ' aria-label="Role for ' + esc(p.name) + '" aria-haspopup="listbox" aria-expanded="false" />' +
                      '<span class="icon-trailing" aria-hidden="true"><i class="ph ph-caret-down c-dropdown-chevron"></i></span>' +
                    '</div>' +
                    '<div class="c-dropdown-panel" data-panelfor="role-' + esc(slug(p.name)) + '" hidden><div class="c-dropdown-list">' +
                      Object.keys(ROLES).map(function(k){
                        return '<div class="c-dropdown-row' + (p.role === k ? ' selected' : '') + '" role="option"' +
                          ' data-setrole="' + k + '" data-person="' + esc(p.name) + '">' +
                          '<span class="c-dropdown-row-label">' + ROLES[k] + '</span>' +
                          '<i class="ph ph-check c-dropdown-row-check" aria-hidden="true"></i></div>';
                      }).join('') +
                      '<div class="c-dropdown-row" role="option" data-removeperson="' + esc(p.name) + '">' +
                        '<span class="c-dropdown-row-label" style="color:var(--color-red)">Remove access</span></div>' +
                    '</div></div>' +
                  '</div>') +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>' +

      '<div class="stack sm">' +
        '<span class="eyebrow">General access</span>' +
        '<div class="share-access">' +
          '<div class="share-access-row">' +
            '<span class="share-access-icon" aria-hidden="true"><i class="ph-fill ph-pencil-simple-line"></i></span>' +
            '<span class="td-stack" style="gap:0;flex:1 1 auto;min-width:0">' +
              '<b>Editor view</b>' +
              '<span class="hint">' + esc(EDITOR_ACCESS[sh.editorAccess].desc) + '</span></span>' +
            accessSelect('editorAccess', EDITOR_ACCESS, sh.editorAccess, 'Editor view access') +
          '</div>' +
          '<div class="share-access-row">' +
            '<span class="share-access-icon" aria-hidden="true"><i class="ph-fill ph-chat-teardrop-text"></i></span>' +
            '<span class="td-stack" style="gap:0;flex:1 1 auto;min-width:0">' +
              '<b>Responder view</b>' +
              '<span class="hint">' + esc(RESPONDER_ACCESS[sh.responderAccess].desc) + '</span></span>' +
            accessSelect('responderAccess', RESPONDER_ACCESS, sh.responderAccess, 'Responder view access') +
          '</div>' +
        '</div>' +
      '</div>' +

      /* The one thing every access setting here depends on. Shown only while
         it is true — a banner that is always there stops being read. */
      (f.status === 'active'
        ? ''
        : '<div class="c-banner c-banner-info" role="status">' +
            '<i class="ph-fill ph-info icon" aria-hidden="true"></i>' +
            '<div class="body"><p class="message">Publish the form to accept responses. Until then these links open for editors only.</p></div>' +
          '</div>') +
    '</div>' +

    '<div class="c-modal-foot">' +
      '<button class="c-btn c-btn-secondary c-btn-md" type="button" id="shareCopy"><i class="ph ph-link" aria-hidden="true"></i>Copy link</button>' +
      /* The two ways a survey reaches somebody, side by side: take the link
         yourself, or have Collabrium deliver it. Sending is the primary —
         the access this screen grants does nothing until the people it was
         granted to know the survey exists. Closing is the X and Escape;
         nothing here is staged, every change on this screen has already
         applied, so there was never anything for a Done button to do. */
      '<button class="c-btn c-btn-primary c-btn-md" type="button" id="shareSend">' +
        '<i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>Send survey</button>' +
    '</div>';

  wireShare(f, sh);
}

function wireShare(f, sh){
  var root = $('#share');
  $('#shareClose').addEventListener('click', closeShare);
  $('#shareSend').addEventListener('click', function(){
    closeShare();
    setTimeout(function(){ openSend(f); }, 240);
  });
  $('#shareCopy').addEventListener('click', function(){
    toast(sh.responderAccess === 'none'
      ? 'Link copied — but the responder link is currently switched off'
      : 'Shareable link copied to clipboard', 'success');
  });

  /* Every single-select in the modal opens the same way; which value it
     writes is decided by the row's own attribute. */
  $$('.c-dropdown-input, .c-dropdown-multi-input', root).forEach(function(trig){
    var panel = trig.id === 'shareWho' ? $('#shareWhoPanel') : $('[data-panelfor="' + trig.id + '"]', root);
    if (!panel) return;
    var field = trig.closest('.c-dropdown-field, .c-dropdown-multi-field');
    trig.addEventListener('click', function(e){
      e.stopPropagation();
      var open = panel.hidden;
      closeDropdowns(root);
      panel.hidden = !open;
      field.classList.toggle('open', open);
      trig.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    panel.addEventListener('click', function(e){ e.stopPropagation(); });
  });

  /* People picker — repaint only the row that changed, so the panel stays
     open and in place while several people are ticked in a row. */
  var cands = shareCandidates(f);
  function paintPickBox(box, on, glyph){
    box.classList.toggle('on', on);
    box.innerHTML = on ? '<i class="ph ' + glyph + '" aria-hidden="true"></i>' : '';
  }
  function refreshPickAll(){
    var all = $('#sharePickAll', root);
    if (!all) return;
    var every = cands.length > 0 && sh.picked.length >= cands.length;
    all.checked = every;
    paintPickBox(all.nextElementSibling, sh.picked.length > 0, every ? 'ph-check' : 'ph-minus');
  }
  $$('[data-sharepick]', root).forEach(function(c){
    c.addEventListener('change', function(){
      var n = c.dataset.sharepick, at = sh.picked.indexOf(n);
      if (c.checked && at === -1) sh.picked.push(n);
      else if (!c.checked && at > -1) sh.picked.splice(at, 1);
      paintPickBox(c.nextElementSibling, c.checked, 'ph-check');
      refreshPickAll();
      $('#shareWho').value = sh.picked.length ? sh.picked.length + ' selected' : '';
      $('#shareInvite').disabled = !sh.picked.length;
    });
  });
  /* Select All writes every candidate at once, then repaints the rows the
     same way — in place, so the panel does not shut under the pointer. */
  if ($('#sharePickAll', root)){
    $('#sharePickAll', root).addEventListener('change', function(){
      var on = this.checked;
      sh.picked = on ? cands.slice() : [];
      $$('[data-sharepick]', root).forEach(function(c){
        c.checked = on;
        paintPickBox(c.nextElementSibling, on, 'ph-check');
      });
      refreshPickAll();
      $('#shareWho').value = sh.picked.length ? sh.picked.length + ' selected' : '';
      $('#shareInvite').disabled = !sh.picked.length;
    });
  }
  if ($('[data-shareclear]')){
    $('[data-shareclear]').addEventListener('click', function(){ sh.picked = []; paintShare(f); });
    $('[data-sharedone]').addEventListener('click', function(){
      $('#shareWhoPanel').hidden = true;
      $('#shareWho').closest('.c-dropdown-multi-field').classList.remove('open');
    });
  }
  $$('[data-pickrole]', root).forEach(function(r){
    r.addEventListener('click', function(){ sh.pickRole = r.dataset.pickrole; paintShare(f); });
  });
  $('#shareInvite').addEventListener('click', function(){
    var n = sh.picked.length;
    sh.picked.forEach(function(name){ sh.people.push({ name:name, role:sh.pickRole }); });
    sh.picked = [];
    paintShare(f);
    toast(n + (n === 1 ? ' person' : ' people') + ' added as ' +
      ROLES[sh.pickRole].toLowerCase() + (n === 1 ? '' : 's'), 'success');
  });

  /* Per-person role, and removal */
  $$('[data-setrole]', root).forEach(function(r){
    r.addEventListener('click', function(){
      var p = sh.people.filter(function(x){ return x.name === r.dataset.person; })[0];
      if (p) p.role = r.dataset.setrole;
      paintShare(f);
    });
  });
  $$('[data-removeperson]', root).forEach(function(r){
    r.addEventListener('click', function(){
      sh.people = sh.people.filter(function(x){ return x.name !== r.dataset.removeperson; });
      paintShare(f);
      toast('Access removed');
    });
  });

  /* General access */
  $$('[data-editorAccess]', root).forEach(function(r){
    r.addEventListener('click', function(){ sh.editorAccess = r.getAttribute('data-editorAccess'); paintShare(f); });
  });
  $$('[data-responderAccess]', root).forEach(function(r){
    r.addEventListener('click', function(){
      sh.responderAccess = r.getAttribute('data-responderAccess');
      paintShare(f);
      if (sh.responderAccess === 'none') toast('Responder link switched off');
    });
  });
}

$('#shareLayer').addEventListener('click', function(e){
  if (e.target === this) closeShare();
});

/* ==========================================================================
   Preview modal — the form as a responder sees it
   The Questions tab renders every block with its controls disabled, which is
   right for editing and useless for checking: a dead form cannot show a
   dependent question appearing, a required answer being caught, or the
   confirmation screen every responder actually ends on. So the preview is
   the real form — live inputs, live logic, the saved settings applied — with
   nothing recorded at the end of it.
   ========================================================================== */
var prevLastFocus = null;
var prevAns = {};          /* answers typed into the preview, question id -> value */
var prevMissing = [];      /* required questions the last submit caught */
var prevPage = 'form';     /* which page of the responder view is showing */
/* The height the form page last occupied, handed to the thank-you page so
   the modal keeps one size across both tabs. Reset with the rest of the
   preview state: a height measured against a different survey is worse than
   no height at all. */
var prevFormH = 0;

function previewOpen(){ return !$('#prevLayer').hidden; }
/* Fullscreen is a way of looking, not part of the survey being looked at,
   so it survives resetPreview and outlives one opening: someone who wants
   the responder's page full size wants it for the next survey too. */
var prevFull = false;

function resetPreview(){ prevAns = {}; prevMissing = []; prevPage = 'form'; prevFormH = 0; }

/* Both of these set classes on nodes paintPreview does not rebuild — it
   replaces the modal's innerHTML, not the modal — so they are applied here
   rather than written into the template. */
var PREV_ELEMENTS = ['fire','wood','earth','water','gold'];
function applyPrevAccent(f){
  var box = $('#prev');
  PREV_ELEMENTS.forEach(function(k){ box.classList.remove('el-' + k); });
  var el = ownerEl(f);
  if (el) box.classList.add('el-' + el);
}
function applyPrevFull(){
  $('#prevLayer').classList.toggle('is-full', prevFull);
  $('#prev').classList.toggle('is-full', prevFull);
}
function togglePrevFull(f){
  prevFull = !prevFull;
  applyPrevFull();
  /* The carried height was measured against the other mode's box. Dropping
     it costs one repaint of the thank-you page and avoids the real failure:
     a fullscreen measurement pinned as a min-height on a windowed modal,
     which would push it past the viewport it is supposed to sit inside. */
  prevFormH = 0;
  paintPreview(f);
  var btn = $('#prevFull');
  if (btn) btn.focus();
}

function openPreview(f){
  resetPreview();
  prevLastFocus = document.activeElement;
  var layer = $('#prevLayer');
  layer.hidden = false;
  applyPrevFull();
  paintPreview(f);
  void layer.offsetWidth;
  layer.classList.add('is-open');
  var c = $('#prevClose');
  if (c) c.focus();
}
function closePreview(){
  var layer = $('#prevLayer');
  layer.classList.remove('is-open');
  setTimeout(function(){ layer.hidden = true; $('#prev').innerHTML = ''; }, 240);
  if (prevLastFocus && prevLastFocus.focus) prevLastFocus.focus();
}

/* A dependent question does not exist for a responder until the answer it
   hangs off has been given — the one thing the builder's flat list can
   never show, because there it is always on screen. */
function prevVisible(f){
  return f.questions.filter(function(q){
    return !q.dependsOn || prevAns[q.dependsOn] === q.dependsValue;
  });
}
function prevAsks(f){
  return prevVisible(f).filter(function(q){ return q.type !== 'media'; });
}
function prevHas(q){
  var v = prevAns[q.id];
  if (v == null) return false;
  /* A rating table holds one answer per row, so a half-filled grid is not
     an answered question — String(v) on the object would say otherwise. */
  if (q.type === 'matrix') return matrixRowsLeft(q, v).length === 0;
  if (!(Array.isArray(v) ? v.length > 0 : String(v).trim() !== '')) return false;
  /* An answer that opened a follow-up is not a finished answer until the
     follow-up has been written — which is what keeps the counter honest at
     "of 5" instead of inventing a sixth question. */
  return followUpOn(q) ? !!followUpText(q) : true;
}

/* Choice rows reuse Radio and Checkbox verbatim. Both glyphs are class-
   driven in this system, so the .on state is written here rather than left
   to :checked — same as every other choice row in the file. */
function prevChoice(q, label, value, kind){
  var multi = kind === 'multi';
  var on = multi ? (prevAns[q.id] || []).indexOf(value) > -1 : prevAns[q.id] === value;
  return '<label class="c-choice">' +
    '<input type="' + (multi ? 'checkbox' : 'radio') + '" name="pv-' + q.id + '"' +
      ' data-pqpick="' + q.id + '" data-pqval="' + esc(value) + '"' + (on ? ' checked' : '') + ' />' +
    (multi
      ? '<span class="c-checkbox-box' + (on ? ' on' : '') + '">' +
          (on ? '<i class="ph ph-check" aria-hidden="true"></i>' : '') + '</span>'
      : '<span class="c-radio-circle' + (on ? ' on' : '') + '">' +
          (on ? '<span class="dot"></span>' : '') + '</span>') +
    '<span class="text"><span class="label" style="font-size:var(--text-body2-size)">' + esc(label) + '</span></span>' +
  '</label>';
}

/* A follow-up is a second box inside a question, shown only under the
   answers that need explaining. It is not a sixth question: it takes no
   number, it shares the parent's required flag, and it is stored under
   "<id>_more" so nothing else has to know it exists. */
function followUpOn(q, v){
  if (!q || !q.followUp) return false;
  return q.followUp.when.indexOf(v === undefined ? prevAns[q.id] : v) > -1;
}
function followUpText(q){ return String(prevAns[q.id + '_more'] || '').trim(); }
/* When the follow-up is the only thing still empty, the card-level "this
   question is required" would be pointing at a question that has been
   answered. The message moves down into the follow-up instead. */
function followUpMissOnly(q){
  return followUpOn(q) && !followUpText(q) && String(prevAns[q.id] || '').trim() !== '';
}
function followUpHtml(q, miss){
  if (!followUpOn(q)) return '';
  var v = prevAns[q.id + '_more'], bad = miss && !followUpText(q);
  return '<div class="q-followup' + (bad ? ' is-missing' : '') + '">' +
    '<span class="q-followup-title">' + esc(q.followUp.title) +
      (q.required ? '<span class="prev-req" aria-hidden="true">*</span>' +
        '<span class="sr-only"> (required)</span>' : '') + '</span>' +
    '<div class="c-field field-wide"><textarea rows="3" data-pqtext="' + q.id + '_more" placeholder="' +
      esc(q.followUp.placeholder || 'Your answer') + '">' + esc(v || '') + '</textarea></div>' +
    (bad ? '<span class="prev-miss" role="alert"><i class="ph-fill ph-warning-circle" aria-hidden="true"></i>' +
      'Tell us more to continue</span>' : '') +
  '</div>';
}
/* Text fields carry the question id, except a follow-up, which carries the
   parent's id with a suffix. Both have to resolve to the card they live in. */
function prevTextOwner(key){ return key.replace(/_more$/, ''); }

function prevField(q){
  var v = prevAns[q.id];
  /* A responder sees the file itself, or the placeholder while the author
     has not attached one — never the author's drop zone. */
  if (q.type === 'media'){
    if (q.src) return q.media === 'video'
      ? '<video class="qblock-media-el" src="' + esc(q.src) + '" controls preload="metadata"></video>'
      : '<img class="qblock-media-el" src="' + esc(q.src) + '" alt="' + esc(q.alt || q.fileName || '') + '" />';
    return '<div class="qblock-media"><i class="ph ' + (q.media === 'video' ? 'ph-video' : 'ph-image') +
      '" aria-hidden="true"></i><span class="hint">' +
      (q.media === 'video' ? 'No video attached yet' : 'No image attached yet') + '</span></div>';
  }
  if (q.type === 'short')
    return '<div class="c-field field-wide"><div class="input-wrap">' +
      '<input type="text" data-pqtext="' + q.id + '" value="' + esc(v || '') + '" placeholder="' +
      esc(q.placeholder || 'Your answer') + '" /></div></div>';
  if (q.type === 'long')
    return '<div class="c-field field-wide"><textarea rows="3" data-pqtext="' + q.id + '" placeholder="' +
      esc(q.placeholder || 'Your answer') + '">' + esc(v || '') + '</textarea></div>';
  if (q.type === 'yesno')
    return '<div class="row tight">' + ['Yes','No'].map(function(o){
      return prevChoice(q, o, o, 'single'); }).join('') + '</div>';
  if (q.type === 'scale'){
    var opts = '';
    for (var n = q.min; n <= q.max; n++){
      var on = prevAns[q.id] === String(n);
      opts += '<label class="c-scale-opt"><input type="radio" name="pv-' + q.id + '"' +
        ' data-pqpick="' + q.id + '" data-pqval="' + n + '"' + (on ? ' checked' : '') + ' />' +
        '<span>' + n + '</span></label>';
    }
    return '<div class="c-scale"><div class="c-scale-track">' + opts + '</div>' +
      '<div class="c-scale-ends"><span>' + esc(q.lo || '') + '</span><span>' + esc(q.hi || '') + '</span></div></div>';
  }
  if (q.type === 'slider')
    return sliderHtml(q, { value: prevAns[q.id], attr:'data-pqsl' });
  /* Stars ride the same data-pqpick wiring every other single-answer control
     uses — the cumulative fill is a property of how it renders, not of how
     the answer is stored. */
  if (q.type === 'stars')
    return starsHtml(q, { name:'pv-' + q.id, value: prevAns[q.id], attr:'data-pqpick' });
  if (q.type === 'rank')
    return rankHtml(q, { order: prevAns[q.id], attr:'data-pqrank' });
  if (q.type === 'matrix')
    return matrixHtml(q, { name:'pv-' + q.id, answers: prevAns[q.id] || {}, attr:'data-pqmx',
                           missingRows: prevMissing.indexOf(q.id) > -1
                             ? matrixRowsLeft(q, prevAns[q.id]) : null });
  if (q.type === 'single' || q.type === 'multi')
    return '<div class="q-choices">' + (q.options || []).map(function(o){
      return prevChoice(q, o, o, q.type); }).join('') + '</div>' +
      followUpHtml(q, prevMissing.indexOf(q.id) > -1);
  return '';
}

function prevFormHtml(f, asks, done){
  if (!f.questions.length)
    return '<div class="c-empty is-section"><i class="ph ph-note-blank" aria-hidden="true"></i>' +
      '<h4>Nothing to preview yet</h4>' +
      '<p>Add a question on the Questions tab and it will appear here exactly as a responder sees it.</p></div>';

  var pct = asks.length ? Math.round(done / asks.length * 100) : 0;
  var anyRequired = f.questions.some(function(q){ return q.required; });
  var num = 0;

  return (f.settings.progressBar
      ? '<div class="prev-progress">' +
          '<div class="c-progress-track size-default"><div class="c-progress-fill" style="width:' + pct + '%"></div></div>' +
          '<span class="hint">' + done + ' of ' + asks.length + ' answered</span>' +
        '</div>'
      : '') +
    '<div class="c-card prev-head stack sm">' +
      '<h3 class="prev-title">' + esc(f.title) + '</h3>' +
      (f.desc ? '<p class="prev-desc">' + esc(f.desc) + '</p>' : '') +
      (anyRequired ? '<p class="c-card-footer"><span class="prev-req lead">*</span>Required</p>' : '') +
    '</div>' +
    prevVisible(f).map(function(q){
      if (q.type === 'media') return '<div class="c-card prev-q">' + prevField(q) + '</div>';
      num++;
      var miss = prevMissing.indexOf(q.id) > -1;
      return '<div class="c-card prev-q stack sm' + (miss ? ' is-missing' : '') + '" data-pq="' + q.id + '">' +
        '<span class="prev-q-title"><span class="num">' + num + '.</span><span class="txt">' + esc(q.title) +
          (q.required ? '<span class="prev-req" aria-hidden="true">*</span><span class="sr-only"> (required)</span>' : '') + '</span></span>' +
        prevField(q) +
        (miss && !followUpMissOnly(q)
          ? '<span class="prev-miss" role="alert"><i class="ph-fill ph-warning-circle" aria-hidden="true"></i>' +
            'This question is required</span>' : '') +
      '</div>';
    }).join('') +
    '<div class="row prev-submit"><button class="c-btn c-btn-primary c-btn-md" type="button" id="prevSubmit">Submit</button></div>';
}

/* The confirmation screen. It is built out of the settings rather than
   hard-coded, because three of the four settings on that tab have no other
   visible effect anywhere — this is the only place anyone can see what
   "send a copy" or "allow editing" actually does. */
function prevThanksHtml(f){
  var s = f.settings;
  /* The heading is the system's line, not the survey's name: a person who
     has just pressed Submit needs to be told the submission landed, and
     they already know which survey they filled in. `confirm` is the
     paragraph under it, which is the part an author actually writes.
     Two things the responder page deliberately does not show are not shown
     here either — the survey title, and the one-response-per-person rule,
     which the system enforces without telling anyone. The email note stays,
     because that one IS a message a responder gets. */
  return '<div class="c-card prev-done stack">' +
    '<i class="ph-fill ph-check-circle prev-done-icon" aria-hidden="true"></i>' +
    '<h3 class="prev-done-title">Your response has been submitted.</h3>' +
    '<p class="prev-desc">' + esc(s.confirm || 'Thanks for your feedback!') + '</p>' +
    (s.sendCopy
      ? '<p class="hint prev-note"><i class="ph ph-envelope-simple" aria-hidden="true"></i>' +
        'A copy of your response has been emailed to you.</p>' : '') +
  '</div>' +
  /* Actions sit below the card rather than inside it, as they do on the
     responder page. Back to home is always there and always the primary;
     the two settings-driven actions are secondary and come first, which is
     the footer order this system uses everywhere else. */
  '<div class="row tight">' +
    (s.allowEdit ? '<button class="c-btn c-btn-secondary c-btn-md" type="button" id="prevEdit">' +
      '<i class="ph ph-pencil-simple" aria-hidden="true"></i>Edit your response</button>' : '') +
    (s.oneResponse ? '' : '<button class="c-btn c-btn-secondary c-btn-md" type="button" id="prevAgain">' +
      'Submit another response</button>') +
    '<button class="c-btn c-btn-primary c-btn-md" type="button" id="prevHome">' +
      'Back to home<i class="ph ph-arrow-right" aria-hidden="true"></i></button>' +
  '</div>';
}

function paintPreview(f){
  applyPrevAccent(f);
  var asks = prevAsks(f);
  var done = asks.filter(prevHas).length;
  var oldBody = $('#prev .c-modal-body');
  var keptScroll = oldBody ? oldBody.scrollTop : 0;

  $('#prev').innerHTML =
    '<div class="c-modal-head">' +
      '<span class="grow td-stack" style="gap:var(--spacing-4)">' +
        '<span class="eyebrow"><i class="ph-fill ph-eye" aria-hidden="true"></i> Responder view</span>' +
        '<h4 id="prevTitle">Preview</h4>' +
      '</span>' +
      /* No status badge: whether the survey is Active is a fact about the
         survey, not about the page being previewed, and the head is already
         saying whose view this is. */
      '<span class="prev-acts">' +
        /* aria-pressed, not two separate controls: it is one toggle whose
           state the label and glyph both report. */
        '<button class="c-icon-btn" type="button" id="prevFull" aria-pressed="' + (prevFull ? 'true' : 'false') + '"' +
          ' title="' + (prevFull ? 'Exit fullscreen' : 'Fullscreen') + '"' +
          ' aria-label="' + (prevFull ? 'Exit fullscreen' : 'Open preview fullscreen') + '">' +
          '<i class="ph ' + (prevFull ? 'ph-corners-in' : 'ph-corners-out') + '" aria-hidden="true"></i></button>' +
        '<button class="c-icon-btn" type="button" id="prevClose" aria-label="Close preview">' +
          '<i class="ph ph-x" aria-hidden="true"></i></button>' +
      '</span>' +
    '</div>' +

    /* A responder sees two pages, and the second one is built out of
       settings that have no other visible effect anywhere — so it has to be
       reachable without answering the form first, not only as the reward for
       completing it. Tabs rather than a Segmented Control, and on their own
       row rather than in the head: Tab's anatomy is a strip with a bottom
       rule sitting directly above the panel it switches, which is what this
       is. Same component the builder's own Questions/Responses/Settings
       strip uses. */
    '<div class="c-tabs prev-pages" role="tablist" aria-label="Preview page" id="prevPages">' +
      '<button class="c-tab' + (prevPage === 'form' ? ' active' : '') + '" type="button" role="tab"' +
        ' data-pp="form" aria-selected="' + (prevPage === 'form' ? 'true' : 'false') + '">Form</button>' +
      '<button class="c-tab' + (prevPage === 'thanks' ? ' active' : '') + '" type="button" role="tab"' +
        ' data-pp="thanks" aria-selected="' + (prevPage === 'thanks' ? 'true' : 'false') + '">Thank you</button>' +
    '</div>' +

    /* min-height on the thank-you page only, carrying the height the form
       page last measured, so switching tabs does not resize the modal under
       the reader's cursor. See prevFormH. */
    '<div class="c-modal-body"' +
      (prevPage === 'thanks' && prevFormH && !prevFull ? ' style="min-height:' + prevFormH + 'px"' : '') + '>' +
      (prevPage === 'thanks' ? prevThanksHtml(f) : prevFormHtml(f, asks, done)) +
    '</div>' +

    '<div class="c-modal-foot">' +
      /* Two things worth saying at the foot, and only one of them at a time:
         that nothing here is recorded, or — the more urgent one — that what
         is on screen is not what responders would currently get. */
      /* settingsDirty() would build a draft for whichever form it is asked
         about, discarding one held for another. Preview can be opened from
         the library, so it only asks when a draft for this form exists. */
      '<span class="hint grow">' + (builderDirty(f)
        ? 'This survey has unsaved changes. The preview shows the saved version.'
        : 'Preview only — nothing entered here is recorded.') + '</span>' +
      (prevPage === 'thanks' || !f.questions.length ? ''
        : '<button class="c-btn c-btn-secondary c-btn-md" type="button" id="prevReset">Clear answers</button>') +
      '<button class="c-btn c-btn-primary c-btn-md" type="button" id="prevCloseBtn">Close preview</button>' +
    '</div>';

  /* Measured, not guessed: clientHeight is the body's own visible box, so it
     already accounts for both cases — a form long enough to scroll reports
     the maximum the modal allows, and a short one reports its content. Using
     scrollHeight instead would hand the thank-you page the full scroll
     length of a long form and leave it scrolling through blank canvas.
     box-sizing:border-box is set globally in this file, so this number can
     go straight back out as a min-height without adjusting for padding. */
  /* Fullscreen is already a fixed height, so it neither needs the carried
     measurement nor may overwrite the windowed one with its own. */
  if (prevPage === 'form' && !prevFull) prevFormH = $('#prev .c-modal-body').clientHeight;

  /* The body the reader was scrolled in has just been replaced, so its
     scroll position has to be carried over by hand. Without this, every
     answer throws the preview back to question one. */
  var nowBody = $('#prev .c-modal-body');
  if (nowBody && keptScroll) nowBody.scrollTop = keptScroll;

  wirePreview(f);
}

/* Typing patches the progress bar in place. A repaint on every keystroke
   would take the caret out of the field — the same reason the Settings save
   bar is patched rather than re-rendered. */
/* Answering a question that the last Submit marked as missing clears the
   mark, without a repaint — the card and its message are patched, the same
   way the progress bar is. */
function clearPrevMiss(f, id){
  if (prevMissing.indexOf(id) === -1) return;
  var q = f.questions.filter(function(x){ return x.id === id; })[0];
  if (!q || !prevHas(q)) return;
  prevMissing = prevMissing.filter(function(x){ return x !== id; });
  var card = $('[data-pq="' + id + '"]');
  if (!card) return;
  card.classList.remove('is-missing');
  var fu = $('.q-followup', card);
  if (fu) fu.classList.remove('is-missing');
  $$('.prev-miss', card).forEach(function(m){ m.parentNode.removeChild(m); });
}

function refreshPrevProgress(f){
  var bar = $('.prev-progress');
  if (!bar) return;
  var asks = prevAsks(f), done = asks.filter(prevHas).length;
  $('.c-progress-fill', bar).style.width = (asks.length ? Math.round(done / asks.length * 100) : 0) + '%';
  $('.hint', bar).textContent = done + ' of ' + asks.length + ' answered';
}

function prevSubmit(f){
  prevMissing = prevAsks(f).filter(function(q){ return q.required && !prevHas(q); })
                           .map(function(q){ return q.id; });
  if (prevMissing.length){
    paintPreview(f);
    var el = $('[data-pq="' + prevMissing[0] + '"]');
    if (el) el.scrollIntoView({ block:'center' });
    toast(prevMissing.length === 1
      ? '1 required question still needs an answer'
      : prevMissing.length + ' required questions still need an answer');
    return;
  }
  prevPage = 'thanks';
  paintPreview(f);
  $('#prev .c-modal-body').scrollTop = 0;
}

function wirePreview(f){
  var root = $('#prev');
  /* Switching pages is not a failed submit, so it drops any required-answer
     marks the last Submit left behind. The answers themselves are kept —
     going to the confirmation and back is a look, not a reset. */
  $$('#prevPages .c-tab', root).forEach(function(t){
    t.addEventListener('click', function(){
      if (t.dataset.pp === prevPage) return;
      prevPage = t.dataset.pp;
      prevMissing = [];
      paintPreview(f);
      $('#prev .c-modal-body').scrollTop = 0;
      /* The strip is rebuilt by the repaint, so focus has to be put back on
         the tab that now owns it rather than left on a detached node. */
      var now = $('#prevPages .c-tab[data-pp="' + prevPage + '"]');
      if (now) now.focus();
    });
  });
  $('#prevFull').addEventListener('click', function(){ togglePrevFull(f); });
  $('#prevClose').addEventListener('click', closePreview);
  $('#prevCloseBtn').addEventListener('click', closePreview);
  if ($('#prevReset', root)) $('#prevReset').addEventListener('click', function(){
    resetPreview(); paintPreview(f); toast('Preview answers cleared');
  });
  if ($('#prevSubmit', root)) $('#prevSubmit').addEventListener('click', function(){ prevSubmit(f); });
  if ($('#prevEdit', root))   $('#prevEdit').addEventListener('click', function(){ prevPage = 'form'; paintPreview(f); });
  if ($('#prevAgain', root))  $('#prevAgain').addEventListener('click', function(){ resetPreview(); paintPreview(f); });
  /* Inside a preview there is nowhere to go, so this says where it would
     have gone rather than closing the thing being previewed. */
  if ($('#prevHome', root))   $('#prevHome').addEventListener('click', function(){
    toast('In the product this returns to the Collabrium home page.'); });

  $$('[data-pqtext]', root).forEach(function(el){
    el.addEventListener('input', function(){
      prevAns[el.dataset.pqtext] = el.value;
      clearPrevMiss(f, prevTextOwner(el.dataset.pqtext));
      refreshPrevProgress(f);
    });
  });

  /* Picking an answer does repaint: it can reveal or retract a dependent
     question, and it clears that question's own required flag. Focus is put
     back on the control that was just used, since the node it was on is
     gone. */
  /* A grid and a slider both patch in place. Neither can gate a dependent
     question — that hangs off a single named value — so there is nothing a
     repaint would reveal, and repainting would take focus out of the row or
     drop the thumb mid-drag. */
  $$('[data-pqmx]', root).forEach(function(el){
    el.addEventListener('change', function(){
      var id = el.dataset.pqmx, row = el.dataset.pqrow;
      var v = prevAns[id] || {};
      v[row] = el.dataset.pqval;
      prevAns[id] = v;
      var tr = el.closest('tr');
      $$('.c-radio-circle', tr).forEach(function(c){ c.classList.remove('on'); c.innerHTML = ''; });
      var mine = el.nextElementSibling;
      mine.classList.add('on');
      mine.innerHTML = '<span class="dot"></span>';
      tr.classList.remove('is-missing');
      clearPrevMiss(f, id);
      refreshPrevProgress(f);
    });
  });

  /* Reordering is a click, not typing, so it repaints — and focus goes back
     onto the same button on the row that just moved, which is now one place
     up or down the list. */
  $$('[data-pqrank]', root).forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.dataset.pqrank, from = +btn.dataset.rankfrom, dir = +btn.dataset.rankdir;
      var q = f.questions.filter(function(x){ return x.id === id; })[0];
      if (!q) return;
      var order = (prevAns[id] || (q.items || [])).slice();
      var to = from + dir;
      if (to < 0 || to >= order.length) return;
      order.splice(to, 0, order.splice(from, 1)[0]);
      prevAns[id] = order;
      prevMissing = prevMissing.filter(function(x){ return x !== id; });
      paintPreview(f);
      var back = $$('[data-pqrank]', $('#prev')).filter(function(n){
        return n.dataset.pqrank === id && +n.dataset.rankfrom === to && +n.dataset.rankdir === dir;
      })[0];
      if (back && !back.disabled) back.focus({ preventScroll:true });
    });
  });

  $$('[data-pqsl]', root).forEach(function(el){
    el.addEventListener('input', function(){
      var id = el.dataset.pqsl, min = +el.min, max = +el.max;
      prevAns[id] = el.value;
      var fill = $('[data-slfill="' + id + '"]', root);
      if (fill) fill.style.width = (max === min ? 0 : (el.value - min) / (max - min) * 100) + '%';
      var lab = $('[data-slval="' + id + '"]', root);
      if (lab){ lab.textContent = el.value + ' of ' + max; lab.classList.remove('is-unset'); }
      el.parentNode.classList.remove('is-unset');
      el.setAttribute('aria-valuetext', el.value + ' of ' + max);
      clearPrevMiss(f, id);
      refreshPrevProgress(f);
    });
  });

  $$('[data-pqpick]', root).forEach(function(el){
    el.addEventListener('change', function(){
      var id = el.dataset.pqpick, v = el.dataset.pqval;
      if (el.type === 'checkbox'){
        var arr = prevAns[id] || [], at = arr.indexOf(v);
        if (el.checked && at === -1) arr.push(v);
        else if (!el.checked && at > -1) arr.splice(at, 1);
        prevAns[id] = arr;
      } else {
        prevAns[id] = v;
        /* A dependent question whose trigger just moved is no longer being
           asked. Its answer goes with it — otherwise it reappears filled in
           if the responder switches back. */
        f.questions.forEach(function(q){
          if (q.dependsOn === id && v !== q.dependsValue) delete prevAns[q.id];
        });
        /* Same rule one level down: switch to an answer that asks for no
           explanation and the explanation goes, rather than waiting to
           reappear already filled in if the responder switches back. */
        var qf = f.questions.filter(function(x){ return x.id === id; })[0];
        if (qf && qf.followUp && !followUpOn(qf, v)) delete prevAns[id + '_more'];
      }
      prevMissing = prevMissing.filter(function(x){ return x !== id; });
      paintPreview(f);
      var back = $$('[data-pqpick]', $('#prev')).filter(function(n){
        return n.dataset.pqpick === id && n.dataset.pqval === v;
      })[0];
      /* preventScroll: the control was just clicked, so it is already in
         view — and without it the browser scrolls the window to "reveal"
         it, which reads as the whole page jumping. */
      if (back) back.focus({ preventScroll:true });
    });
  });
}

$('#prevLayer').addEventListener('click', function(e){
  if (e.target === this) closePreview();
});

/* ==========================================================================
   Record modal — one bug report, either side of it
   Centred rather than a right-edge drawer, and paged from its own header:
   triage is reading several reports in a row, so the arrows have to be
   part of the record view instead of a trip back to the list. The pager
   walks the list the reader opened the record from — the filtered, sorted
   admin table, or the reporter's own tickets — which is why the id list is
   captured at open time rather than recomputed here.
   ========================================================================== */
var recLastFocus = null;
var recShots = [];                  /* attachments on the reply being typed */

function currentRecord(){
  var id = state.recIds[state.recIndex];
  return BUGS.filter(function(b){ return b.id === id; })[0];
}
function recordOpen(){ return !$('#recLayer').hidden; }

function openRecord(ids, index, mode){
  if (index < 0 || !ids.length) return;
  state.recIds = ids.slice();
  state.recIndex = index;
  state.recMode = mode;
  recShots = [];
  recLastFocus = document.activeElement;
  var layer = $('#recLayer');
  layer.hidden = false;
  paintRecord();
  /* Force a reflow so the browser has a "closed" frame to transition FROM.
     requestAnimationFrame looks equivalent but isn't — it doesn't fire
     reliably in a throttled or headless tab, and the dialog then appears
     with no animation or, worse, at its pre-transition offset. */
  void layer.offsetWidth;
  layer.classList.add('is-open');
  var c = $('#recClose');
  if (c) c.focus();
}

function closeRecord(){
  var layer = $('#recLayer');
  layer.classList.remove('is-open');
  setTimeout(function(){ layer.hidden = true; $('#rec').innerHTML = ''; }, 240);
  recShots = [];
  if (recLastFocus && recLastFocus.focus) recLastFocus.focus();
}

function recStep(d){
  var i = state.recIndex + d;
  if (i < 0 || i >= state.recIds.length) return;
  state.recIndex = i;
  recShots = [];
  paintRecord();
  /* Keep the arrow under the pointer usable: if stepping disabled the one
     just pressed, hand focus to the close button rather than losing it to
     the body, which would take the arrow keys with it. */
  var btn = $(d > 0 ? '#recNext' : '#recPrev');
  if (btn && !btn.disabled) btn.focus();
  else { var c = $('#recClose'); if (c) c.focus(); }
}

function refreshBehind(){
  if (state.route === 'bugAdmin') renderBugAdmin();
  else if (state.route === 'bugMine') renderBugMine();
}

/* Read-only cell, for the sides of a record this viewer does not own. */
function recCell(label, valueHtml){
  return '<div class="rec-cell"><span class="eyebrow">' + esc(label) + '</span>' +
    '<span class="v">' + valueHtml + '</span></div>';
}
/* Single-select dropdown, floating so opening one does not push the rest of
   the record down inside a scrolling modal body. */
function recDropdown(id, value, rows, label){
  return '<div class="c-field c-dropdown-field dd-float" style="width:100%">' +
    '<label for="' + id + '">' + esc(label) + '</label>' +
    '<div class="input-wrap has-trailing-icon">' +
      '<input type="text" class="c-dropdown-input" id="' + id + '" readonly value="' + esc(value) + '"' +
        ' aria-haspopup="listbox" aria-expanded="false" />' +
      '<span class="icon-trailing" aria-hidden="true"><i class="ph ph-caret-down c-dropdown-chevron"></i></span>' +
    '</div>' +
    '<div class="c-dropdown-panel" data-panelfor="' + id + '" hidden><div class="c-dropdown-list">' +
      rows + '</div></div>' +
  '</div>';
}

function commentHtml(c){
  return '<div class="c-comment' + (c.role === 'team' ? ' is-team' : '') + '">' +
    '<span class="c-comment-avatar" aria-hidden="true">' + esc(initials(c.who)) + '</span>' +
    '<div class="c-comment-body">' +
      '<div class="c-comment-meta">' +
        '<b>' + esc(c.who) + '</b>' +
        '<time>' + fmtDateTime(c.at) + '</time>' +
      '</div>' +
      '<p class="c-comment-text">' + esc(c.body) + '</p>' +
      (c.shots.length
        ? '<div class="c-comment-shots">' + c.shots.map(function(u){
            return '<button class="thumb" type="button" data-shot="' + esc(u) + '" aria-label="Expand attachment">' +
              '<img src="' + u + '" alt="" /></button>';
          }).join('') + '</div>'
        : '') +
    '</div>' +
  '</div>';
}

function paintRecord(){
  var b = currentRecord();
  if (!b){ closeRecord(); return; }
  var admin = state.recMode === 'admin';
  var i = state.recIndex, n = state.recIds.length;
  var them = b.who.split(/\s+/)[0];

  $('#rec').innerHTML =
    '<div class="c-modal-head">' +
      '<div class="stack sm" style="min-width:0">' +
        '<span class="eyebrow">' + esc(b.pod) + ' · ' + fmtDateTime(b.at) + '</span>' +
        '<h4 id="recTitle">' + esc(b.title) + '</h4>' +
      '</div>' +
      '<div class="row tight" style="flex-wrap:nowrap">' +
        '<div class="c-modal-pager">' +
          '<button class="c-icon-btn" type="button" id="recPrev" aria-label="Previous report"' +
            (i === 0 ? ' disabled' : '') + '><i class="ph ph-caret-left" aria-hidden="true"></i></button>' +
          '<span class="pos">' + (i + 1) + ' of ' + n + '</span>' +
          '<button class="c-icon-btn" type="button" id="recNext" aria-label="Next report"' +
            (i === n - 1 ? ' disabled' : '') + '><i class="ph ph-caret-right" aria-hidden="true"></i></button>' +
        '</div>' +
        '<button class="c-icon-btn" type="button" id="recClose" aria-label="Close"><i class="ph ph-x" aria-hidden="true"></i></button>' +
      '</div>' +
    '</div>' +

    '<div class="c-modal-body">' +
      '<div class="row between">' +
        '<span class="row tight"><span class="avatar">' + esc(initials(b.who)) + '</span>' +
          '<span class="stack" style="gap:2px"><b style="font-size:var(--text-body2-size)">' + esc(b.who) +
          '</b><span class="hint">' + esc(b.pod) + '</span></span></span>' +
        '<span class="tag-row">' + threadBadge(b, admin ? 'admin' : 'user') +
          (admin ? '' : '<span class="c-badge ' + BUG_STATUS[b.status].badge + '">' + BUG_STATUS[b.status].label + '</span>') +
        '</span>' +
      '</div>' +

      /* Triage set. Editable for the team, stated for the reporter — same
         record, same fields, one of them read-only. */
      '<div class="rec-grid">' +
        (admin
          ? recDropdown('recStatus', BUG_STATUS[b.status].label,
              Object.keys(BUG_STATUS).map(function(k){
                return '<div class="c-dropdown-row' + (b.status === k ? ' selected' : '') + '" role="option" data-st="' + k + '">' +
                  '<span class="c-dropdown-row-label">' + BUG_STATUS[k].label + '</span>' +
                  '<i class="ph ph-check c-dropdown-row-check" aria-hidden="true"></i></div>';
              }).join(''), 'Status') +
            recDropdown('recPrio', b.priority ? prioLabel(b.priority) : 'Not set',
              PRIO_ORDER.map(function(k){
                return '<div class="c-dropdown-row has-desc' + (b.priority === k ? ' selected' : '') + '" role="option" data-pr="' + k + '">' +
                  '<span class="c-dropdown-row-text"><span class="c-dropdown-row-label">' + prioPill(k) + '</span>' +
                  '<span class="c-dropdown-row-desc">' + esc(PRIORITIES[k].desc) + '</span></span>' +
                  '<i class="ph ph-check c-dropdown-row-check" aria-hidden="true"></i></div>';
              }).join(''), 'Incident priority') +
            /* Dropdown's own media slot in its is-avatar form — initials
               only, and no description line: a name plus a job title in a
               four-person list is noise, and the initials are what people
               already recognise from the table's own Assigned to column. */
            recDropdown('recAssignee', b.assignee || 'Unassigned',
              ['Unassigned'].concat(TECH).map(function(name){
                var on = (b.assignee || 'Unassigned') === name;
                var media = name === 'Unassigned'
                  ? '<i class="ph ph-user-circle-dashed c-dropdown-row-media" aria-hidden="true"></i>'
                  : '<i class="c-dropdown-row-media is-avatar" aria-hidden="true">' + esc(initials(name)) + '</i>';
                return '<div class="c-dropdown-row' + (on ? ' selected' : '') + '" role="option" data-as="' + esc(name) + '">' +
                  media +
                  '<span class="c-dropdown-row-label">' + esc(name) + '</span>' +
                  '<i class="ph ph-check c-dropdown-row-check" aria-hidden="true"></i></div>';
              }).join(''), 'Assigned to')
          : recCell('Incident priority', b.priority
              ? prioPill(b.priority)
              : '<span class="muted">Not set yet — the team assigns this at triage</span>') +
            recCell('Assigned to', b.assignee ? esc(b.assignee) : '<span class="muted">Not assigned yet</span>')) +
        /* Both sides read these two, neither side edits them: impact is the
           reporter's judgement and the location is the page they were on,
           and a team that could overwrite either would be editing the
           evidence rather than triaging it. The description rides along as
           a title so "Medium" can be checked against what it means. */
        recCell('Operational impact', IMPACTS[b.impact]
          ? '<span title="' + esc(IMPACTS[b.impact].desc) + '">' + esc(IMPACTS[b.impact].name) + '</span>'
          : '<span class="muted">Not recorded</span>') +
        recCell('Location', b.location
          ? esc(b.location) : '<span class="muted">Not recorded</span>') +
        recCell('Affected services', '<span class="tag-row">' +
          (b.services.length
            ? b.services.map(function(sv){ return '<span class="c-badge c-badge-neutral">' + esc(sv) + '</span>'; }).join('')
            : '<span class="muted">None recorded</span>') + '</span>') +
      '</div>' +

      '<div class="stack sm"><span class="eyebrow">Description</span>' +
        '<p style="margin:0;font-size:var(--text-body2-size);line-height:1.6">' + esc(b.desc) + '</p></div>' +
      (b.extra ? '<div class="stack sm"><span class="eyebrow">Additional information</span>' +
        '<p style="margin:0;font-size:var(--text-body2-size);line-height:1.6;color:var(--color-neutral-5)">' + esc(b.extra) + '</p></div>' : '') +

      '<div class="stack sm"><span class="eyebrow">Screenshots</span>' +
        (b.shots.length
          ? '<div class="shot-grid">' + b.shots.map(function(u, k){
              return '<button class="thumb shot-tile" type="button" data-shot="' + esc(u) + '"' +
                ' aria-label="Expand screenshot ' + (k + 1) + ' of ' + b.shots.length + '"><img src="' + u + '" alt="" /></button>';
            }).join('') + '</div>' +
            '<span class="hint">Click a screenshot to open it full size.</span>'
          : '<p class="hint" style="margin:0">None attached.</p>') +
      '</div>' +

      /* Resolution — the team's own record of what was done. Written here,
         read by the reporter in the same place, so a fix never has to be
         explained twice. */
      '<div class="stack sm"><span class="eyebrow">Resolution</span>' +
        (admin
          ? '<div class="c-field field-wide"><textarea id="recResolution" rows="4" placeholder="What you found, what you changed, and where it shipped.">' + esc(b.resolution || '') + '</textarea>' +
            '<span class="c-helper">Visible to ' + esc(them) + ' as well — write it for them, not only for the next engineer.</span></div>'
          : (b.resolution
              ? '<p style="margin:0;font-size:var(--text-body2-size);line-height:1.6">' + esc(b.resolution) + '</p>'
              : '<p class="hint" style="margin:0">Nothing documented yet. The tech team will fill this in as they work on it.</p>')) +
      '</div>' +

      '<div class="c-comments"><span class="eyebrow">Comments' +
        ((b.comments || []).length ? ' (' + b.comments.length + ')' : '') + '</span>' +
        ((b.comments || []).length
          ? '<div class="c-comment-list">' + b.comments.map(commentHtml).join('') + '</div>'
          : '<p class="hint" style="margin:0">No comments yet.' +
            (admin ? ' Ask ' + esc(them) + ' anything you need to reproduce it.' : '') + '</p>') +
        '<div class="c-comment-form">' +
          '<div class="c-field field-wide"><label for="recReply">Your reply</label>' +
            '<textarea id="recReply" rows="3" placeholder="' +
              (admin ? 'Answer, or ask ' + esc(them) + ' for what you still need…'
                     : 'Answer the tech team, or add anything new you have noticed…') + '"></textarea></div>' +
          '<div class="c-uploader-zone" id="recZone" tabindex="0" role="button" aria-label="Attach screenshots to your reply">' +
            '<i class="ph ph-paperclip" aria-hidden="true"></i>' +
            '<span class="c-uploader-hint">Attach a screenshot — drag and drop, or click to browse</span>' +
          '</div>' +
          '<div class="thumbs" id="recThumbs"></div>' +
          '<div class="c-comment-form-foot">' +
            '<span class="hint">' + (admin
              ? esc(them) + ' is notified and can reply on this ticket.'
              : 'Visible to the tech team on this ticket.') + '</span>' +
            '<button class="c-btn c-btn-primary c-btn-md" type="button" id="recSend"><i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>Send</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="c-modal-foot">' +
      '<button class="c-btn c-btn-secondary c-btn-md" type="button" id="recClose2">Close</button>' +
      (admin
        ? '<button class="c-btn c-btn-primary c-btn-md" type="button" id="recResolve"' +
          (b.status === 'resolved' ? ' disabled' : '') + '>Mark resolved</button>'
        : '') +
    '</div>';

  wireRecord(b, admin);
}

function wireRecord(b, admin){
  var rec = $('#rec');

  $('#recClose').addEventListener('click', closeRecord);
  $('#recClose2').addEventListener('click', closeRecord);
  $('#recPrev').addEventListener('click', function(){ recStep(-1); });
  $('#recNext').addEventListener('click', function(){ recStep(1); });

  $$('[data-shot]', rec).forEach(function(x){
    x.addEventListener('click', function(){ openLightbox(x.dataset.shot); });
  });

  /* Every dropdown in the record shares one trigger wiring; which field it
     writes to is decided by the row attribute, not by a per-field handler. */
  $$('.c-dropdown-input', rec).forEach(function(trig){
    var panel = $('[data-panelfor="' + trig.id + '"]', rec);
    if (!panel) return;
    var field = trig.closest('.c-dropdown-field');
    trig.addEventListener('click', function(e){
      e.stopPropagation();
      var open = panel.hidden;
      closeDropdowns(rec);
      panel.hidden = !open;
      field.classList.toggle('open', open);
      trig.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  });
  $$('[data-st]', rec).forEach(function(r){
    r.addEventListener('click', function(){
      b.status = r.dataset.st; paintRecord(); refreshBehind();
      toast('Status set to ' + BUG_STATUS[b.status].label);
    });
  });
  $$('[data-pr]', rec).forEach(function(r){
    r.addEventListener('click', function(){
      b.priority = r.dataset.pr; paintRecord(); refreshBehind();
      toast('Priority set to ' + prioLabel(b.priority));
    });
  });
  $$('[data-as]', rec).forEach(function(r){
    r.addEventListener('click', function(){
      b.assignee = r.dataset.as === 'Unassigned' ? null : r.dataset.as;
      paintRecord(); refreshBehind();
      toast(b.assignee ? 'Assigned to ' + b.assignee : 'Unassigned');
    });
  });

  if (admin){
    $('#recResolution').addEventListener('input', function(e){ b.resolution = e.target.value; });
    $('#recResolve').addEventListener('click', function(){
      b.status = 'resolved'; paintRecord(); refreshBehind(); toast('Marked resolved', 'success');
    });
  }

  /* Reply composer */
  paintRecThumbs();
  wireZone($('#recZone'), function(img){ recShots.push(img); paintRecThumbs(); });
  $('#recSend').addEventListener('click', function(){
    var ta = $('#recReply'), body = ta.value.trim();
    if (!body){
      ta.closest('.c-field').classList.add('c-field-error');
      ta.focus(); toast('Write something before sending'); return;
    }
    b.comments = (b.comments || []).concat([
      cmt(admin ? (b.assignee || TECH[0]) : ME.name, admin ? 'team' : 'user',
          new Date(NOW), body, recShots.map(function(s){ return s.url; }))
    ]);
    recShots = [];
    paintRecord();
    refreshBehind();
    /* The newest comment is at the bottom of a chronological thread, so
       scroll it into view — the reader's own reply landing off-screen reads
       as the send having failed. */
    var list = $('.c-comment-list .c-comment:last-child', $('#rec'));
    if (list) list.scrollIntoView({ block:'nearest' });
    toast(admin ? 'Reply sent to ' + b.who.split(/\s+/)[0] : 'Reply sent to the tech team', 'success');
  });
}

function paintRecThumbs(){
  var host = $('#recThumbs');
  if (!host) return;
  host.innerHTML = recShots.map(function(s, i){
    return '<span class="thumb"><img src="' + s.url + '" alt="' + esc(s.name) + '" />' +
      '<button class="x" type="button" data-recrm="' + i + '" aria-label="Remove ' + esc(s.name) + '">' +
      '<i class="ph ph-x" aria-hidden="true"></i></button></span>';
  }).join('');
  $$('[data-recrm]', host).forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation(); recShots.splice(+btn.dataset.recrm, 1); paintRecThumbs();
    });
  });
}

/* The layer closes only on its own background, never on a click that
   started inside the dialog. */
$('#recLayer').addEventListener('click', function(e){
  if (e.target === this) closeRecord();
});

/* Lightbox */
function openLightbox(src){
  $('#lightboxImg').src = src;
  $('#lightbox').hidden = false;
}
$('#lightbox').addEventListener('click', function(){ $('#lightbox').hidden = true; });

/* Escape closes the topmost layer; the arrows page the record, but only
   when the reader is not typing — a left arrow inside the reply box has to
   move the caret. */
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    if (!$('#lightbox').hidden){ $('#lightbox').hidden = true; return; }
    /* First in the chain: a confirm can be raised on top of the preview or
       the record modal, so it is always the topmost layer when it exists. */
    if (confirmOpen()){ closeConfirm(); return; }
    if (publishedOpen()){ closePublished(); return; }
    if (sendOpen()){ closeSend(); return; }
    /* Escape closes the bug drawer without losing anything: every field is
       already in draftBug, and reopening restores it. */
    if (bugDrawerOpen()){ closeBugDrawer(); return; }
    if (previewOpen()){ closePreview(); return; }
    if (shareOpen()){ closeShare(); return; }
    if (recordOpen()){ closeRecord(); return; }
    if (!$('#fabMenu').hidden){ closeFabMenu(); }
    return;
  }
  if (!recordOpen() || shareOpen() || previewOpen()) return;
  var t = e.target, typing = t && (t.tagName === 'TEXTAREA' ||
    (t.tagName === 'INPUT' && !t.readOnly) || t.isContentEditable);
  if (typing) return;
  if (e.key === 'ArrowLeft'){ e.preventDefault(); recStep(-1); }
  if (e.key === 'ArrowRight'){ e.preventDefault(); recStep(1); }
});

/* ==========================================================================
   Entry point 1 — SidebarNav's own behaviour
   Collapse/expand, the collapsed hover label and the account menu are all
   part of the component, not this prototype: implemented here to the same
   recipe preview.html uses, so the rail behaves identically wherever it
   is dropped in.
   ========================================================================== */
/* The logo's rotating glyph, moved here from logo.html when the iframe
   became an inline SVG. Same filmstrip: five element marks on a 104px
   pitch, 480ms to move between them, a long hold on Gold and a short one
   on the rest, and a silent snap back to the top once past the last. */
(function(){
  var strip = $('#sbFilmstrip');
  if (!strip) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var SLOT = 104, COUNT = 5, slot = 0;
  function easeInOut(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }
  function step(){
    var fromY = -(slot * SLOT), toY = -((slot + 1) * SLOT);
    var moveDur = 480, holdDur = ((slot + 1) % COUNT === 0) ? 1300 : 320;
    var start = performance.now();
    function frame(now){
      var t = Math.min(1, (now - start) / moveDur);
      strip.setAttribute('transform', 'translate(0,' + (fromY + (toY - fromY) * easeInOut(t)) + ')');
      if (t < 1){ requestAnimationFrame(frame); return; }
      slot++;
      if (slot === COUNT){
        window.setTimeout(function(){
          strip.setAttribute('transform', 'translate(0,0)');
          slot = 0;
          window.setTimeout(function(){ requestAnimationFrame(step); }, holdDur * 0.3);
        }, holdDur);
      } else {
        window.setTimeout(function(){ requestAnimationFrame(step); }, holdDur);
      }
    }
    requestAnimationFrame(frame);
  }
  step();
})();

/* ==========================================================================
   Entry point 2 — floating action button
   ========================================================================== */
var fab = $('#fab'), fabMenu = $('#fabMenu');

/* The menu is placed from the button rather than pinned to the corner.
   The button sits bottom-right but is positioned against .c-shell-main,
   which is inset from the window — so the menu's own fixed right:24px is
   measured from a different edge than the button's, and pinning both to
   "24px" leaves them out of line by exactly the shell's inset. Park the
   menu at a known origin, read where that put it, and close the gap — the
   same measure-and-correct used elsewhere in this file, and it survives
   the button moving again (a sidebar collapse, the mobile branch) without
   a second set of numbers to keep in step.
   Right edges are what get matched: a 268px panel hung off the left edge
   of a 56px button in the right-hand corner runs off screen every time,
   so aligning the far edges is the placement, not a correction to one. */
function placeFabMenu(){
  var r = fab.getBoundingClientRect();
  fabMenu.style.left = 'auto';
  fabMenu.style.right = '0px';
  fabMenu.style.bottom = '0px';
  var at = fabMenu.getBoundingClientRect();
  var right = at.right - r.right;
  fabMenu.style.right = right + 'px';
  fabMenu.style.bottom = (at.bottom - (r.top - 8)) + 'px';
  /* The one case right-alignment cannot cover: a viewport narrower than the
     panel plus its gutters. Pushed back off the left edge rather than
     flipped — the menu still reads as belonging to the button under it. */
  var now = fabMenu.getBoundingClientRect(), edge = 16;
  if (now.left < edge) fabMenu.style.right = (right - (edge - now.left)) + 'px';
}
function openFabMenu(){
  fabMenu.hidden = false;
  placeFabMenu();
  fab.setAttribute('aria-expanded', 'true');
  fab.classList.remove('is-nudging');
  $('.c-fab-menu-item', fabMenu).focus();
}
function closeFabMenu(){
  fabMenu.hidden = true;
  fab.setAttribute('aria-expanded', 'false');
  fab.focus();
}
fab.addEventListener('click', function(e){
  e.stopPropagation();
  fabMenu.hidden ? openFabMenu() : closeFabMenu();
});
fabMenu.addEventListener('click', function(e){ e.stopPropagation(); });
document.addEventListener('click', function(){
  if (!fabMenu.hidden){ fabMenu.hidden = true; fab.setAttribute('aria-expanded','false'); }
});
$$('[data-fab]').forEach(function(b){
  b.addEventListener('click', function(){
    fabMenu.hidden = true; fab.setAttribute('aria-expanded','false');
    if (b.dataset.fab === 'bug'){ openBugDrawer(); return; }
    /* Share feedback hands over to the responder prototype, opened at the
       form itself rather than at the invitation — what the menu offers is
       answering a survey, and landing a step short of it makes the reader
       click twice to reach the thing they asked for. entry=dash because
       that is where this click actually came from: an in-app control, not
       an email, so the harness's Restart returns to the right origin.
       A new tab rather than a navigation. Everything in this prototype is
       held in memory, so Back would return to a freshly booted hub with the
       draft, any new survey and any filed bug report gone — and the
       responder's view is a different person's screen in any case. Falls
       back to navigating in place if the tab is blocked. */
    var url = 'feedback-respond.html?entry=dash&step=2';
    var w = window.open(url, '_blank');
    if (!w) window.location.href = url;
  });
});

/* First-appearance nudge: three pulses, plus the tooltip, then it settles
   down and never does it again for this user. Stored per-browser, so a
   demo reload shows it again only after clearing site data — and a storage
   failure (private window, blocked site data) degrades to simply not
   nudging rather than throwing. */
(function nudge(){
  var seen = false;
  try { seen = localStorage.getItem('collabrium.fab.seen') === '1'; } catch (e) {}
  if (seen) return;
  setTimeout(function(){
    fab.classList.add('is-nudging');
    var tip = document.createElement('span');
    tip.className = 'c-tooltip-bubble is-portaled is-visible';
    tip.textContent = 'Got feedback? Start here';
    tip.style.left = '0px';
    tip.style.right = 'auto';
    tip.style.bottom = '0px';
    tip.style.zIndex = '900';
    document.body.appendChild(tip);
    /* Above the button and centred on it. Beside it — where this used to
       sit — now points into the bar. Measured after appending, because a
       bubble sized by its own text cannot be centred before it has one. */
    var fr = fab.getBoundingClientRect(), tr = tip.getBoundingClientRect();
    tip.style.left = Math.round(fr.left + fr.width / 2 - tr.width / 2) + 'px';
    tip.style.bottom = Math.round(window.innerHeight - fr.top + 8) + 'px';
    setTimeout(function(){
      tip.classList.remove('is-visible');
      setTimeout(function(){ tip.remove(); }, 300);
      fab.classList.remove('is-nudging');
    }, 4200);
    try { localStorage.setItem('collabrium.fab.seen', '1'); } catch (e) {}
  }, 900);
})();

/* ==========================================================================
   Send modal — Share's second step
   Share answers "who can see this". It does not answer "and do they know?",
   which is the question that actually decides whether a survey gets any
   responses. This is that step: the people who will be told, whether to
   tell them, and what the email says.
   ========================================================================== */
var sendLastFocus = null;
function sendOpen(){ return !$('#sendLayer').hidden; }
function responders(f){
  return shareStateFor(f).people.filter(function(p){ return p.role === 'responder'; });
}
function defaultInvite(f){
  return 'Hi — could you spare a few minutes for “' + f.title + '”? ' +
    'Your answers go straight to the pod that owns it.';
}
function closeSend(){
  var layer = $('#sendLayer');
  layer.classList.remove('is-open');
  setTimeout(function(){ layer.hidden = true; $('#sendBox').innerHTML = ''; }, 240);
  if (sendLastFocus && sendLastFocus.focus) sendLastFocus.focus();
}
function openSend(f){
  var layer = $('#sendLayer');
  var sh = shareStateFor(f);
  var list = responders(f);
  /* The draft survives leaving and coming back — someone who steps back to
     add one more person should not lose the message they just wrote. */
  if (sh.notify == null) sh.notify = true;
  if (sh.message == null) sh.message = defaultInvite(f);
  var none = list.length === 0;

  sendLastFocus = document.activeElement;
  $('#sendBox').innerHTML =
    '<div class="c-modal-head">' +
      '<h4 id="sendTitle">Send &ldquo;' + esc(f.title) + '&rdquo;</h4>' +
      '<button class="c-icon-btn" type="button" id="sendClose" aria-label="Close">' +
        '<i class="ph ph-x" aria-hidden="true"></i></button>' +
    '</div>' +

    '<div class="c-modal-body">' +
      '<div class="stack sm">' +
        '<span class="eyebrow">Responders</span>' +
        (none
          ? '<p class="hint">Nobody has responder access yet. Go back and add people, ' +
            'or share the link and let anyone with it answer.</p>'
          : '<div class="send-people">' + list.map(function(p){
              return '<span class="send-person"><span class="avatar">' + esc(initials(p.name)) +
                '</span>' + esc(p.name) + '</span>';
            }).join('') + '</div>') +
      '</div>' +

      '<div class="stack sm">' +
        /* Checkbox, not a switch: it is one option inside a form that is
           committed by the Send button, and Switch's own spec is for
           settings that take effect the moment they are flipped. */
        '<label class="c-choice' + (none ? ' disabled' : '') + '">' +
          '<input type="checkbox" id="sendNotify"' + (sh.notify && !none ? ' checked' : '') +
            (none ? ' disabled' : '') + ' />' +
          '<span class="c-checkbox-box' + (sh.notify && !none ? ' on' : '') + '">' +
            (sh.notify && !none ? '<i class="ph ph-check" aria-hidden="true"></i>' : '') + '</span>' +
          '<span class="text"><span class="label">Notify these responders</span>' +
            '<span class="desc">The form will be included in the email notification.</span></span>' +
        '</label>' +

        '<div class="send-message" id="sendMessageWrap"' + (sh.notify && !none ? '' : ' hidden') + '>' +
          '<label class="c-field field-wide"><span class="eyebrow">Message</span>' +
            '<textarea id="sendMessage" rows="4" placeholder="Add a note so people know why they are being asked.">' +
              esc(sh.message) + '</textarea></label>' +
        '</div>' +
      '</div>' +

      /* Says what pressing Send actually does, which is the one thing a
         dialog called Send should never leave to inference. */
      '<p class="hint" id="sendSummary"></p>' +
    '</div>' +

    '<div class="c-modal-foot">' +
      '<button class="c-btn c-btn-ghost c-btn-md" type="button" id="sendBack">Back to sharing</button>' +
      '<span class="grow"></span>' +
      '<button class="c-btn c-btn-primary c-btn-md" type="button" id="sendGo">' +
        '<i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>Send survey</button>' +
    '</div>';

  layer.hidden = false;
  void layer.offsetWidth;
  layer.classList.add('is-open');

  var box   = $('#sendNotify');
  var wrap  = $('#sendMessageWrap');
  var msg   = $('#sendMessage');
  var go_   = $('#sendGo');
  var sum   = $('#sendSummary');

  /* One place decides what the state means, so the checkbox, the message,
     the summary line and the button can never disagree about it. */
  function sync(){
    var on = !none && box.checked;
    sh.notify = on;
    wrap.hidden = !on;
    go_.disabled = !on;
    $('.c-checkbox-box', box.parentNode).classList.toggle('on', on);
    $('.c-checkbox-box', box.parentNode).innerHTML = on
      ? '<i class="ph ph-check" aria-hidden="true"></i>' : '';
    sum.textContent = none
      ? 'Add a responder before sending, or copy the link instead.'
      : on
        ? 'An email goes to ' + list.length + (list.length === 1 ? ' person' : ' people') +
          ' with the survey and your message.'
        : 'Notifications are off, so there is nothing to send — turn them back on, ' +
          'or close this and copy the link instead.';
  }
  sync();

  box.addEventListener('change', function(){
    sync();
    if (box.checked) msg.focus();
  });
  msg.addEventListener('input', function(){ sh.message = msg.value; });

  $('#sendClose').addEventListener('click', closeSend);
  $('#sendBack').addEventListener('click', function(){
    closeSend();
    setTimeout(function(){ openShare(f); }, 240);
  });
  go_.addEventListener('click', function(){
    closeSend();

  });

  if (!none){ msg.focus(); msg.setSelectionRange(msg.value.length, msg.value.length); }
  else $('#sendClose').focus();
}

/* ==========================================================================
   Published — the exit point of the build flow
   Publishing used to be a toast: the one moment in this flow where the
   survey stops being the author's and becomes everyone else's, reported in
   a strip that disappears on its own and offers nothing. A survey nobody
   has been given is not finished, so the end of the flow is where the two
   ways of handing it over belong.
   ========================================================================== */
function responderLink(f){ return 'collabrium.app/s/' + f.id; }

/* One copy path for all three places that offer the link — this modal, the
   toolbar's link button and the row menu's Send — so they cannot drift into
   copying three different strings. The clipboard API is unavailable or
   refused often enough (an unfocused document is enough) that the textarea
   fallback is not legacy cruft; it is what actually runs in some of them. */
function copyText(text, done){
  function legacy(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      function(){ if (done) done(); },
      function(){ legacy(); if (done) done(); });
    return;
  }
  legacy();
  if (done) done();
}
function copyResponderLink(f, msg){
  copyText(responderLink(f), function(){
    toast(msg || 'Responder link copied — paste it wherever you are sending it', 'success');
  });
}

var liveLastFocus = null;
function publishedOpen(){ return !$('#liveLayer').hidden; }

  var layer = $('#liveLayer');
  layer.classList.remove('is-open');
  setTimeout(function(){ layer.hidden = true; $('#liveBox').innerHTML = ''; }, 240);
  if (liveLastFocus && liveLastFocus.focus) liveLastFocus.focus();
}
/* reopenedFrom: the stale end date a re-publish just cleared, or null. */
function openPublished(f, reopenedFrom){
  var layer = $('#liveLayer');
  liveLastFocus = document.activeElement;
  var d = deadline(f);
  var n = f.questions.length;

  $('#liveBox').innerHTML =
    '<div class="c-modal-head">' +
      '<i class="ph-fill ph-check-circle live-icon" aria-hidden="true"></i>' +
      '<span class="grow"><h4 id="liveTitle">Your survey is live</h4></span>' +

        '<i class="ph ph-x" aria-hidden="true"></i></button>' +
    '</div>' +

    '<div class="c-modal-body">' +
      /* States what is now true, in the terms the author cares about:

      '<p class="live-line"><b>' + esc(f.title) + '</b> is accepting responses' +
        (reopenedFrom ? ' again. Its old deadline of ' + esc(fmtDate(reopenedFrom)) +
