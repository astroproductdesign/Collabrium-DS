}

function typeKeys(){
  return Object.keys(TYPES).sort(function(a, b){
    return TYPES[a].label.localeCompare(TYPES[b].label);
  });
}

/* Question type switcher — Dropdown's Single select, Borderless, wired for
   real. The type badge used to be display-only, which made four of the six
   documented question types unreachable from the builder. */
function typeSwitcher(q){
  return '<span class="c-field c-dropdown-field style-borderless qtype" style="width:auto">' +
    '<span class="input-wrap has-trailing-icon">' +
      '<input type="text" class="c-dropdown-input" readonly value="' + TYPES[q.type].label + '"' +
        ' data-typetrigger="' + q.id + '" aria-label="Question type" aria-haspopup="listbox" aria-expanded="false" />' +
      '<span class="icon-trailing" aria-hidden="true"><i class="ph ph-caret-down c-dropdown-chevron"></i></span>' +
    '</span>' +
    '<span class="c-dropdown-panel" data-typepanel="' + q.id + '" hidden><span class="c-dropdown-list">' +
      /* Alphabetical by label, sorted at render rather than by the order the
         object happens to be written in — ten types have no inherent
         sequence, and a new one added to TYPES lands in its right place on
         its own instead of at the bottom. Same habit as the system's other
         orderless lists (persona badges, the platform list on Profile
         card), which are documented as alphabetical too. */
      typeKeys().map(function(k){
        return '<span class="c-dropdown-row' + (k === q.type ? ' selected' : '') + '" role="option" data-settype="' + k + '">' +
          '<i class="ph ' + TYPES[k].icon + ' c-dropdown-row-media"></i>' +
          '<span class="c-dropdown-row-label">' + TYPES[k].label + '</span>' +
          '<i class="ph ph-check c-dropdown-row-check"></i></span>';
      }).join('') +
    '</span></span>' +
  '</span>';
}

/* Changing type rewrites only the props that type owns, so switching away
   and back doesn't silently keep a stale scale range or option list. */
function setType(q, t){
  q.type = t;
  /* Scale and Slider share the min/max/end-label props but not their
     defaults: a scale is a handful of discrete targets, a slider is a
     continuous run (the component's own guidance is not to use it under
     about ten distinct values). */
  if (t === 'scale'){
    if (q.min == null){ q.min = 1; q.max = 5; q.lo = 'Not at all'; q.hi = 'Very much'; }
    delete q.step;
  } else if (t === 'slider'){
    if (q.min == null){ q.min = 0; q.max = 100; q.lo = 'Not at all'; q.hi = 'Completely'; }
    if (q.step == null) q.step = 1;
  } else if (t === 'stars'){
    /* Stars reuse max as the count — five is the number people read as a
       star rating without being told the scale. */
    if (q.max == null || q.max > 10) q.max = 5;
    delete q.min; delete q.lo; delete q.hi; delete q.step;
  } else { delete q.min; delete q.max; delete q.lo; delete q.hi; delete q.step; }
  if (t === 'rank'){
    if (!q.items) q.items = ['First option','Second option','Third option'];
  } else { delete q.items; }
  if (t === 'single' || t === 'multi'){
    if (!q.options) q.options = ['Option 1','Option 2','Option 3'];
  } else { delete q.options; }
  if (t === 'matrix'){
    if (!q.rows) q.rows = ['First aspect','Second aspect','Third aspect'];
    if (!q.cols) q.cols = ['Very poor','Poor','Average','Good','Excellent'];
  } else { delete q.rows; delete q.cols; }
}

/* Rating table and Slider markup, written once each and rendered in three
   places: the builder's disabled preview, the preview modal and — through
   the same functions — anything else that has to show a question the way a
   responder sees it. Passing the answers in rather than reading a global is
   what lets the builder render the same grid with nothing selected. */
function starsHtml(q, o){
  o = o || {};
  var max = q.max || 5, v = +(o.value || 0), out = '';
  for (var n = 1; n <= max; n++){
    var on = n <= v;
    out += '<label class="c-star' + (on ? ' on' : '') + '">' +
      '<input type="radio" name="' + o.name + '"' + (o.disabled ? ' disabled' : '') +
        (o.attr ? ' ' + o.attr + '="' + q.id + '" data-pqval="' + n + '"' : '') +
        (n === v ? ' checked' : '') + ' />' +
      '<i class="ph' + (on ? '-fill' : '') + ' ph-star" aria-hidden="true"></i>' +
      '<span class="sr-only">' + n + (n === 1 ? ' star' : ' stars') + ' out of ' + max + '</span>' +
    '</label>';
  }
  return '<div class="c-stars">' + out +
    (v ? '<span class="c-stars-value">' + v + ' of ' + max + '</span>' : '') + '</div>';
}
function rankBtnHtml(q, o, i, dir, off, label){
  return '<button class="c-icon-btn" type="button"' + (o.disabled || off ? ' disabled' : '') +
    (o.attr ? ' ' + o.attr + '="' + q.id + '" data-rankfrom="' + i + '" data-rankdir="' + dir + '"' : '') +
    ' aria-label="Move ' + esc(label) + ' ' + (dir < 0 ? 'up' : 'down') + '">' +
    '<i class="ph ' + (dir < 0 ? 'ph-caret-up' : 'ph-caret-down') + '" aria-hidden="true"></i></button>';
}
function rankHtml(q, o){
  o = o || {};
  var items = o.order && o.order.length ? o.order : (q.items || []);
  return '<div class="c-rank">' + items.map(function(it, i){
    return '<div class="c-rank-item">' +
      '<span class="c-rank-pos">' + (i + 1) + '</span>' +
      '<span class="c-rank-label">' + esc(it) + '</span>' +
      '<span class="c-rank-btns">' +
        rankBtnHtml(q, o, i, -1, i === 0, it) +
        rankBtnHtml(q, o, i, 1, i === items.length - 1, it) +
      '</span>' +
    '</div>';
  }).join('') + '</div>';
}
function matrixHtml(q, o){
  o = o || {};
  var ans = o.answers || {}, rows = q.rows || [], cols = q.cols || [];
  return '<div class="c-matrix"><table><thead><tr>' +
      '<th scope="col"><span class="sr-only">Aspect</span></th>' +
      cols.map(function(c){ return '<th scope="col">' + esc(c) + '</th>'; }).join('') +
    '</tr></thead><tbody>' +
    rows.map(function(r, ri){
      var picked = ans[r];
      var miss = o.missingRows && o.missingRows.indexOf(r) > -1;
      return '<tr' + (miss ? ' class="is-missing"' : '') + '>' +
        '<th scope="row">' + esc(r) + '</th>' +
        cols.map(function(c){
          var on = picked === c;
          return '<td><label class="c-matrix-cell">' +
            '<input type="radio" name="' + o.name + '-' + ri + '"' +
              (o.disabled ? ' disabled' : '') +
              (o.attr ? ' ' + o.attr + '="' + q.id + '" data-pqrow="' + esc(r) + '" data-pqval="' + esc(c) + '"' : '') +
              (on ? ' checked' : '') + ' />' +
            '<span class="c-radio-circle' + (on ? ' on' : '') + '">' +
              (on ? '<span class="dot"></span>' : '') + '</span>' +
            '<span class="sr-only">' + esc(r) + ': </span>' +
            '<span class="mx-col">' + esc(c) + '</span>' +
          '</label></td>';
        }).join('') +
      '</tr>';
    }).join('') +
  '</tbody></table></div>';
}
function matrixRowsLeft(q, ans){
  ans = ans || {};
  return (q.rows || []).filter(function(r){ return !ans[r]; });
}
function sliderHtml(q, o){
  o = o || {};
  var min = q.min == null ? 0 : q.min, max = q.max == null ? 100 : q.max;
  var has = o.value != null && o.value !== '';
  /* Unanswered still has to render a thumb somewhere — a range input always
     has one — so it sits at the midpoint and the label says the question is
     open rather than answered "50". */
  var at = has ? +o.value : Math.round((min + max) / 2);
  var pct = !has || max === min ? 0 : (at - min) / (max - min) * 100;
  return '<div class="c-slider-group">' +
    '<span class="slider-value' + (has ? '' : ' is-unset') + '"' +
      (o.attr ? ' data-slval="' + q.id + '"' : '') + '>' +
      (has ? at + ' of ' + max : 'Drag to answer') + '</span>' +
    '<div class="c-slider-rail' + (has ? '' : ' is-unset') + '">' +
      '<div class="c-slider-track"><div class="c-slider-fill" style="width:' + pct + '%"' +
        (o.attr ? ' data-slfill="' + q.id + '"' : '') + '></div></div>' +
      '<input class="c-slider-input" type="range" min="' + min + '" max="' + max + '"' +
        ' step="' + (q.step || 1) + '" value="' + at + '"' +
        (o.disabled ? ' disabled' : '') +
        (o.attr ? ' ' + o.attr + '="' + q.id + '"' : '') +
        ' aria-label="' + esc(q.title) + '" aria-valuetext="' + (has ? at + ' of ' + max : 'No answer yet') + '" />' +
    '</div>' +
    ((q.lo || q.hi)
      ? '<div class="c-slider-minmax"><span>' + esc(q.lo || '') + '</span><span>' + esc(q.hi || '') + '</span></div>'
      : '') +
  '</div>';
}

/* Rating table editing is its own mode, held per question rather than
   globally: entering it on one table does not disturb another, and the
   headers being edited live in a draft of their own so Cancel is a real
   cancel. That draft is deliberately NOT the builder's qDraft — a
   half-renamed column should not light up the form's Save bar, and Save
   table is what promotes it into qDraft, where the form's own Save bar
   picks it up like any other edit. */
var qcEdit  = null;   /* id of the question whose content is being edited */
var qcDraft = null;   /* a copy of just that question's editable content */

/* What each type lets an author change beyond the title, in one table so a
   new type is one entry rather than a new branch in four functions.
   `lists` are ordered string arrays; `fields` are single values. Types not
   listed here — short, long, yes/no, media — have nothing to edit but their
   title, and correctly get no Edit affordance at all. */
function qcSpec(q){
  if (q.type === 'matrix') return { verb:'Edit table', lists:[
    { key:'cols', legend:'Columns — the rating scale', noun:'column', add:'Add column' },
    { key:'rows', legend:'Rows — what is being rated',  noun:'row',    add:'Add row' } ] };
  if (q.type === 'single' || q.type === 'multi') return { verb:'Edit options', lists:[
    { key:'options', legend:'Options', noun:'option', add:'Add option' } ] };
  if (q.type === 'rank') return { verb:'Edit items', lists:[
    { key:'items', legend:'Items to rank', noun:'item', add:'Add item' } ] };
  if (q.type === 'scale') return { verb:'Edit scale', fields:[
    { key:'min', label:'Lowest',  type:'number', min:0, max:9 },
    { key:'max', label:'Highest', type:'number', min:2, max:10 },
    { key:'lo',  label:'Label at the low end',  type:'text' },
    { key:'hi',  label:'Label at the high end', type:'text' } ] };
  if (q.type === 'slider') return { verb:'Edit slider', fields:[
    { key:'min',  label:'Minimum', type:'number' },
    { key:'max',  label:'Maximum', type:'number' },
    { key:'step', label:'Step',    type:'number', min:1 },
    { key:'lo',   label:'Label at the low end',  type:'text' },
    { key:'hi',   label:'Label at the high end', type:'text' } ] };
  if (q.type === 'stars') return { verb:'Edit rating', fields:[
    { key:'max', label:'How many stars', type:'number', min:3, max:10 } ] };
  return null;
}
/* The one-line summary under a closed question, so the shape of the thing
   is readable without opening the editor. */
function qcSummary(q){
  var sp = qcSpec(q);
  if (!sp) return '';
  if (sp.lists) return sp.lists.map(function(l){
    var n = (q[l.key] || []).length;
    return n + ' ' + l.noun + (n === 1 ? '' : 's');
  }).join(' · ');
  if (q.type === 'stars')  return q.max + ' stars';
  if (q.type === 'slider') return q.min + '–' + q.max + ', step ' + (q.step || 1);
  return q.min + '–' + q.max;
}
function qcDraftFor(q){
  var sp = qcSpec(q), d = {};
  if (!sp) return d;
  (sp.lists || []).forEach(function(l){ d[l.key] = (q[l.key] || []).slice(); });
  (sp.fields || []).forEach(function(f){ d[f.key] = q[f.key]; });
  return d;
}
/* Everything that stops an author saving a question nobody can answer.
   Blank labels fall back to their position rather than rendering an
   unlabelled control that still collects answers; numbers are clamped to
   the range the control can actually draw, and a max that has fallen below
   its min is pushed back above it rather than rejected with an error the
   author then has to go and fix. */
function qcApply(q, d){
  var sp = qcSpec(q);
  if (!sp) return;
  (sp.lists || []).forEach(function(l){
    var noun = l.noun.charAt(0).toUpperCase() + l.noun.slice(1);
    q[l.key] = d[l.key].map(function(v, i){ return String(v).trim() || noun + ' ' + (i + 1); });
  });
  (sp.fields || []).forEach(function(f){
    if (f.type === 'number'){
      var n = parseInt(d[f.key], 10);
      if (isNaN(n)) n = q[f.key];
      if (f.min != null) n = Math.max(f.min, n);
      if (f.max != null) n = Math.min(f.max, n);
      q[f.key] = n;
    } else {
      q[f.key] = String(d[f.key] == null ? '' : d[f.key]).trim();
    }
  });
  if (q.type === 'scale' || q.type === 'slider'){
    if (q.max <= q.min) q.max = q.min + 1;
    if (q.type === 'slider'){
      q.step = Math.max(1, Math.min(q.step || 1, q.max - q.min));
    }
  }
}

function qcLineHtml(listKey, noun, i, value, total){
  return '<div class="qc-line">' +
    '<input class="qc-input" type="text" value="' + esc(value) + '"' +
      ' data-qcl="' + listKey + ':' + i + '" aria-label="' + esc(noun) + ' ' + (i + 1) + '" />' +
    /* The last one cannot be removed: a list with nothing in it is not a
       shorter question, it is a broken one. */
    '<button class="c-icon-btn" type="button" data-qcldel="' + listKey + ':' + i + '"' +
      (total < 2 ? ' disabled aria-disabled="true" title="Needs at least one"' : ' title="Remove"') +
      ' aria-label="Remove ' + esc(noun) + ' ' + (i + 1) + '">' +
      '<i class="ph ph-x" aria-hidden="true"></i></button>' +
  '</div>';
}
function qcFieldHtml(f, value){
  return '<label class="qc-field">' +
    '<span class="qc-legend">' + esc(f.label) + '</span>' +
    '<input class="qc-input" type="' + f.type + '" value="' + esc(value == null ? '' : value) + '"' +
      (f.min != null ? ' min="' + f.min + '"' : '') +
      (f.max != null ? ' max="' + f.max + '"' : '') +
      ' data-qcf="' + f.key + '" />' +
  '</label>';
}
function questionEditorHtml(q){
  var sp = qcSpec(q);
  var d = qcDraft || qcDraftFor(q);
  var body = '';
  (sp.lists || []).forEach(function(l){
    body += '<div class="qc-col">' +
      '<span class="qc-legend">' + esc(l.legend) + '</span>' +
      d[l.key].map(function(v, i){ return qcLineHtml(l.key, l.noun, i, v, d[l.key].length); }).join('') +
      '<button class="c-btn c-btn-ghost c-btn-sm" type="button" data-qcadd="' + l.key + '">' +
        '<i class="ph ph-plus" aria-hidden="true"></i>' + esc(l.add) + '</button>' +
    '</div>';
  });
  if (sp.fields)
    body += '<div class="qc-fields">' +
      sp.fields.map(function(f){ return qcFieldHtml(f, d[f.key]); }).join('') + '</div>';
  return '<div class="qc-editor">' + body +
    '<div class="qc-foot">' +
      '<button class="c-btn c-btn-ghost c-btn-sm" type="button" data-qccancel>Cancel</button>' +
      '<button class="c-btn c-btn-primary c-btn-sm" type="button" data-qcsave>Save ' +
        esc(sp.verb.replace(/^Edit /, '')) + '</button>' +
    '</div>' +
  '</div>';
}

/* Every question block's body: the responder-eye preview, plus — for the
   types that have content beyond a title — either the editor or the button
   that opens it. Wrapping questionPreview rather than editing each of its
   branches is what stops a new type quietly shipping with no way to edit
   it, which is exactly how the rating table ended up the only editable one.
*/
function questionBody(q){
  if (qcEdit === q.id) return questionEditorHtml(q);
  var sp = qcSpec(q);
  if (!sp) return questionPreview(q);
  return questionPreview(q) +
    '<div class="qc-editbar">' +
      '<button class="c-btn c-btn-secondary c-btn-sm" type="button" data-qcopen="' + q.id + '">' +
        '<i class="ph ph-pencil-simple" aria-hidden="true"></i>' + esc(sp.verb) + '</button>' +
      '<span class="hint">' + esc(qcSummary(q)) + '</span>' +
    '</div>';
}

function questionPreview(q){
  if (q.type === 'short')  return '<div class="c-field field-wide"><div class="input-wrap"><input type="text" placeholder="' + esc(q.placeholder || 'Short answer') + '" disabled /></div></div>';
  if (q.type === 'long')   return '<div class="c-field field-wide"><textarea rows="2" placeholder="' + esc(q.placeholder || 'Long answer') + '" disabled></textarea></div>';
  /* No .dot inside these circles: the dot is the picked state, and nothing
     is picked in a preview of an unanswered question. */
  if (q.type === 'yesno')  return '<div class="row tight">' +
      ['Yes','No'].map(function(o){ return '<label class="c-choice"><input type="radio" name="p-' + q.id + '" disabled />' +
        '<span class="c-radio-circle"></span><span class="text"><span class="label" style="font-size:var(--text-body2-size)">' + o + '</span></span></label>'; }).join('') + '</div>';
  if (q.type === 'scale'){
    var opts = '';
    for (var v = q.min; v <= q.max; v++)
      opts += '<label class="c-scale-opt"><input type="radio" name="p-' + q.id + '" disabled /><span>' + v + '</span></label>';
    return '<div class="c-scale"><div class="c-scale-track">' + opts + '</div>' +
      '<div class="c-scale-ends"><span>' + esc(q.lo || '') + '</span><span>' + esc(q.hi || '') + '</span></div></div>';
  }
  if (q.type === 'slider') return sliderHtml(q, { disabled:true });
  if (q.type === 'stars')   return starsHtml(q, { name:'p-' + q.id, disabled:true });
  if (q.type === 'rank')    return rankHtml(q, { disabled:true });
  if (q.type === 'matrix')  return matrixHtml(q, { name:'p-' + q.id, disabled:true });
  if (q.type === 'single' || q.type === 'multi'){
    return '<div class="stack sm">' + (q.options || ['Option 1','Option 2','Option 3']).map(function(o){
      return q.type === 'single'
        ? '<label class="c-choice"><input type="radio" name="p-' + q.id + '" disabled /><span class="c-radio-circle"></span><span class="text"><span class="label" style="font-size:var(--text-body2-size)">' + esc(o) + '</span></span></label>'
        : '<label class="c-choice"><input type="checkbox" disabled /><span class="c-checkbox-box"></span><span class="text"><span class="label" style="font-size:var(--text-body2-size)">' + esc(o) + '</span></span></label>';
    }).join('') + '</div>';
  }
  return '';
}

/* Reorder — real drag-and-drop, with arrow keys on the grip as the
   accessible equivalent. A drag-only reorder is unusable by keyboard and
   unreliable on touch, so both paths write through the same move(). */
var dragFrom = null;
function move(f, from, to){
  if (to < 0 || to >= f.questions.length || from === to) return;
  var it = f.questions.splice(from, 1)[0];
  f.questions.splice(to, 0, it);
  f.updated = new Date(NOW);
  paintQuestions(f);
  var grip = $('[data-grip="' + to + '"]');
  if (grip) grip.focus();
}

function wireQuestionBlocks(f){
  $$('#qList .qblock').forEach(function(block){
    var i = +block.dataset.idx;
    block.addEventListener('dragstart', function(e){
      dragFrom = i; block.classList.add('is-dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(i)); } catch (err) {}
    });
    block.addEventListener('dragend', function(){
      dragFrom = null;
      $$('#qList .qblock').forEach(function(b){
        b.classList.remove('is-dragging','is-drop-target','is-drop-target-after');
      });
    });
    block.addEventListener('dragover', function(e){
      if (dragFrom === null || dragFrom === i) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      block.classList.toggle('is-drop-target', i < dragFrom);
      block.classList.toggle('is-drop-target-after', i > dragFrom);
    });
    block.addEventListener('dragleave', function(){
      block.classList.remove('is-drop-target','is-drop-target-after');
    });
    block.addEventListener('drop', function(e){
      e.preventDefault();
      if (dragFrom !== null && dragFrom !== i) move(f, dragFrom, i);
      dragFrom = null;
    });
  });
  $$('#qList .qgrip').forEach(function(g){
    g.addEventListener('keydown', function(e){
      var i = +g.dataset.grip;
      if (e.key === 'ArrowUp'){ e.preventDefault(); move(f, i, i - 1); }
      if (e.key === 'ArrowDown'){ e.preventDefault(); move(f, i, i + 1); }
    });
  });
  $$('#qList [data-dup]').forEach(function(b){
    b.addEventListener('click', function(){
      var i = +b.dataset.dup;
      var copy = JSON.parse(JSON.stringify(f.questions[i]));
      copy.id = 'q' + Date.now() + Math.floor(Math.random() * 1000);
      delete copy.dependsOn; delete copy.dependsValue;
      f.questions.splice(i + 1, 0, copy);
      paintQuestions(f); toast('Question duplicated');
    });
  });
  $$('#qList [data-del]').forEach(function(b){
    b.addEventListener('click', function(){
      var i = +b.dataset.del, q = f.questions[i];
      /* A dependent follow-up cannot outlive its parent. */
      f.questions = f.questions.filter(function(x, j){
        return j !== i && x.dependsOn !== q.id;
      });
      paintQuestions(f); toast('Question deleted');
    });
  });
  $$('#qList [data-req]').forEach(function(c){
    c.addEventListener('change', function(){
      f.questions[+c.dataset.req].required = c.checked;
      c.nextElementSibling.classList.toggle('on', c.checked);
      refreshQSave();
    });
  });
  $$('#qList [data-typetrigger]').forEach(function(trig){
    var id = trig.dataset.typetrigger;
    var panel = $('[data-typepanel="' + id + '"]');
    var field = trig.closest('.c-dropdown-field');
    trig.addEventListener('click', function(e){
      e.stopPropagation();
      var open = panel.hidden;
      closeDropdowns($('#qList'));
      panel.hidden = !open;
      field.classList.toggle('open', open);
      trig.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    $$('[data-settype]', panel).forEach(function(row){
      row.addEventListener('click', function(){
        var q = f.questions.filter(function(x){ return x.id === id; })[0];
        if (!q) return;
        setType(q, row.dataset.settype);
        f.updated = new Date(NOW);
        paintQuestions(f);
        toast('Changed to ' + TYPES[q.type].label);
      });
    });
  });
  $$('#qList [data-title]').forEach(function(inp){
    inp.addEventListener('input', function(){
      var q = f.questions.filter(function(x){ return x.id === inp.dataset.title; })[0];
      if (q) q.title = inp.value;
      refreshQSave();
    });
  });

  /* ---- Media blocks: attach, drop, remove ---- */
  var qById = function(id){ return f.questions.filter(function(x){ return x.id === id; })[0]; };
  var attach = function(q, file){
    if (!q || !file) return;
    /* accept="" filters the browse dialog but not a drop, so the type is
       checked here too — dropping an MP4 on an image block would otherwise
       render a broken <img> with no explanation. */
    var wantVideo = q.media === 'video';
    if (file.type && wantVideo !== /^video\//.test(file.type)){
      toast('That block takes ' + (wantVideo ? 'a video' : 'an image') + ' — ' +
            (file.name || 'the file') + ' is not one', 'error');
      return;
    }
    q.src = URL.createObjectURL(file);
    q.fileName = file.name;
    q.fileSize = file.size;
    paintQuestions(f);
    refreshQSave();
  };
  $$('#qList [data-file]').forEach(function(inp){
    inp.addEventListener('change', function(){
      attach(qById(inp.dataset.file), inp.files && inp.files[0]);
    });
  });
  $$('#qList [data-unfile]').forEach(function(b){
    b.addEventListener('click', function(){
      var q = qById(b.dataset.unfile);
      if (!q) return;
      /* The block keeps its type and title — only the file goes, which puts
         the drop zone back rather than deleting the author's block. */
      delete q.src; delete q.fileName; delete q.fileSize;
      paintQuestions(f);
      refreshQSave();
    });
  });
  /* ---- Rating table: edit, add/remove, save, cancel ---- */
  /* ---- Question content: open, edit, save, cancel ---- */
  var qcOpen = function(id){
    var q = qById(id);
    if (!q) return;
    qcEdit = id;
    qcDraft = qcDraftFor(q);
    paintQuestions(f);
    var first = $('#qList .qc-editor .qc-input');
    if (first){ first.focus(); if (first.select) first.select(); }
  };
  var qcClose = function(){ qcEdit = null; qcDraft = null; paintQuestions(f); };
  /* Structural changes repaint, so focus is placed deliberately after:
     on the field just added, or on whichever took the removed one's place. */
  var qcRepaint = function(sel){
    paintQuestions(f);
    var el = sel && $('#qList ' + sel);
    if (el){ el.focus(); if (el.select) el.select(); }
  };
  $$('#qList [data-qcopen]').forEach(function(b){
    b.addEventListener('click', function(){ qcOpen(b.dataset.qcopen); });
  });
  /* Typing writes to the draft and repaints nothing — the same reason the
     question title input patches rather than re-renders. */
  $$('#qList [data-qcl]').forEach(function(inp){
    inp.addEventListener('input', function(){
      if (!qcDraft) return;
      var parts = inp.dataset.qcl.split(':');
      qcDraft[parts[0]][+parts[1]] = inp.value;
    });
  });
  $$('#qList [data-qcf]').forEach(function(inp){
    inp.addEventListener('input', function(){
      if (qcDraft) qcDraft[inp.dataset.qcf] = inp.value;
    });
  });
  $$('#qList [data-qcadd]').forEach(function(b){
    b.addEventListener('click', function(){
      if (!qcDraft) return;
      var key = b.dataset.qcadd;
      var q = qById(qcEdit);
      var sp = q && qcSpec(q);
      var l = sp && (sp.lists || []).filter(function(x){ return x.key === key; })[0];
      var noun = l ? l.noun.charAt(0).toUpperCase() + l.noun.slice(1) : 'Item';
      qcDraft[key].push(noun + ' ' + (qcDraft[key].length + 1));
      qcRepaint('[data-qcl="' + key + ':' + (qcDraft[key].length - 1) + '"]');
    });
  });
  $$('#qList [data-qcldel]').forEach(function(b){
    b.addEventListener('click', function(){
      if (!qcDraft) return;
      var parts = b.dataset.qcldel.split(':');
      var key = parts[0], i = +parts[1];
      if (qcDraft[key].length < 2) return;
      qcDraft[key].splice(i, 1);
      qcRepaint('[data-qcl="' + key + ':' + Math.min(i, qcDraft[key].length - 1) + '"]');
    });
  });
  $$('#qList [data-qcsave]').forEach(function(b){
    b.addEventListener('click', function(){
      var q = qById(qcEdit);
      if (!q || !qcDraft) return qcClose();
      qcApply(q, qcDraft);
      qcClose();
      refreshQSave();
      toast('Question updated — save the form to keep it', 'success');
    });
  });
  $$('#qList [data-qccancel]').forEach(function(b){
    b.addEventListener('click', qcClose);
  });

  $$('#qList [data-drop]').forEach(function(zone){
    /* dragenter and dragover both have to preventDefault or the browser
       navigates to the dropped file instead of handing it over. A counter
       rather than a boolean: dragging across a child fires leave on the
       parent, and a boolean would flicker the state off mid-drag. */
    var depth = 0;
    var over = function(on){ zone.classList.toggle('dragover', on); };
    zone.addEventListener('dragenter', function(e){ e.preventDefault(); depth++; over(true); });
    zone.addEventListener('dragover', function(e){ e.preventDefault(); });
    zone.addEventListener('dragleave', function(){ depth = Math.max(0, depth - 1); if (!depth) over(false); });
    zone.addEventListener('drop', function(e){
      e.preventDefault(); depth = 0; over(false);
      var dt = e.dataTransfer;
      attach(qById(zone.dataset.drop), dt && dt.files && dt.files[0]);
    });
  });
}

/* Object URLs, not data URLs. The draft is dirty-checked by
   JSON.stringify-ing every question on each keystroke, and a base64 video
   inlined into that string would make the comparison the slowest thing on
   the page. An object URL is a short string and stays valid for the life of
   the document, which is exactly as long as this prototype needs it. */
function fileSizeLabel(bytes){
  if (bytes == null) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}
function fileKind(name, media){
  var m = /\.([a-z0-9]+)$/i.exec(name || '');
  return m ? m[1] : (media === 'video' ? 'video' : 'image');
}
/* The zone and the attached file are the two states of one block, so they
   are built together — nothing else needs to know which is showing. */
function uploadZoneHtml(q){
  var isVid = q.media === 'video';
  if (!q.src)
    /* The zone is a <label> wrapping a real file input, so click and
       keyboard both reach the picker without a handler. The input is
       sr-only rather than display:none — a hidden input is not focusable
       and the label would then be mouse-only. */
    return '<div class="c-uploader">' +
      '<label class="c-uploader-zone" data-drop="' + q.id + '">' +
        '<i class="ph ph-upload-simple" aria-hidden="true"></i>' +
        '<span class="c-uploader-label">Drop ' + (isVid ? 'a video' : 'an image') +
          ' here, or click to browse</span>' +
        '<span class="c-uploader-hint">' +
          (isVid ? 'MP4 or WebM' : 'PNG, JPG, GIF or SVG') + ' · nothing leaves this prototype' +
        '</span>' +
        '<input class="sr-only" type="file" accept="' + (isVid ? 'video/*' : 'image/*') +
          '" data-file="' + q.id + '" />' +
      '</label>' +
    '</div>';
  return '<div class="c-uploader">' +
    (isVid
      ? '<video class="qblock-media-el" src="' + esc(q.src) + '" controls preload="metadata"></video>'
      : '<img class="qblock-media-el" src="' + esc(q.src) + '" alt="' + esc(q.alt || q.fileName || 'Uploaded image') + '" />') +
    '<div class="c-uploader-files">' +
      '<div class="c-uploader-row">' +
        '<span class="c-uploader-kind">' + esc(fileKind(q.fileName, q.media)) + '</span>' +
        '<span class="c-uploader-name">' + esc(q.fileName || 'Attached file') + '</span>' +
        '<span class="c-uploader-size">' + esc(fileSizeLabel(q.fileSize)) + '</span>' +
        '<button class="c-uploader-remove" type="button" data-unfile="' + q.id + '"' +
          ' title="Remove" aria-label="Remove ' + esc(q.fileName || 'file') + '">' +
          '<i class="ph ph-x" aria-hidden="true"></i></button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function addBlock(f, kind){
  var id = 'q' + Date.now() + Math.floor(Math.random() * 1000);
  if (kind === 'image' || kind === 'video'){
    f.questions.push({ id:id, type:'media', media:kind, title:kind === 'video' ? 'Video' : 'Image' });
  } else if (kind === 'poll'){
    f.questions.push({ id:id, type:'single', title:'Quick poll — which would you rather have first?',
      required:false, options:['Saved filters','Bulk export','Dark mode'] });
  } else if (kind === 'matrix' || kind === 'slider' || kind === 'stars' ||
             kind === 'rank' || kind === 'single' || kind === 'multi'){
    /* Built through setType so the starting rows, ratings and range are
       defined in exactly one place — the same defaults the type switcher
       hands out when an existing question is changed to one of these. */
    var q = { id:id, required:false,
              title: kind === 'matrix' ? 'Please rate the following' : 'Untitled question' };
    setType(q, kind);
    f.questions.push(q);
  } else {
    f.questions.push({ id:id, type:'short', title:'Untitled question', required:false });
  }
  f.updated = new Date(NOW);
  paintQuestions(f);
  var blocks = $$('#qList .qblock');
  if (blocks.length){
    blocks[blocks.length - 1].scrollIntoView({ block:'nearest' });
    var t = $('[data-title]', blocks[blocks.length - 1]);
    if (t) { t.focus(); t.select(); }
  }
}

/* ---------- Tab 2 — Responses ---------- */
/* One cohort filter for the whole tab, not one per chart. Reading a summary
   is a sequence of "and what did those people say to everything else?" —
   a per-chart filter answers the first half of that and drops the second.
   Held as {qid, value} rather than a closure so it can be described in a
   chip and cleared from anywhere. */
var respFilter = null;
function respMatches(f, r){
  if (!respFilter) return true;
  var a = r.answers[respFilter.qid];
  if (a == null) return false;
  /* A multi-select answer is a list, so membership rather than equality —
     someone who picked three options belongs in all three cohorts. */
  return Array.isArray(a) ? a.indexOf(respFilter.value) > -1 : a === respFilter.value;
}
function respPool(f){
  return respFilter ? f.responses.filter(function(r){ return respMatches(f, r); }) : f.responses;
}
function respFilterLabel(f){
  if (!respFilter) return '';
  var q = f.questions.filter(function(x){ return x.id === respFilter.qid; })[0];
  var short = q ? q.title.replace(/\s+/g, ' ') : 'Question';
  if (short.length > 42) short = short.slice(0, 41).trim() + '…';
  return short + ': ' + respFilter.value;
}
function setRespFilter(f, qid, value){
  /* Clicking the segment that is already the filter clears it — the same
     click that drilled in is the one hand available to come back out. */
  if (respFilter && respFilter.qid === qid && respFilter.value === value) respFilter = null;
  else respFilter = { qid:qid, value:value };
  /* Deferred out of the handler: this call arrives from inside Chart.js's
     own click dispatch, and tearing the chart down mid-dispatch leaves the
     library reaching for a listener on an object it no longer has. The
     guard covers the same hazard from the other side — a second click
     landing on a canvas that is already on its way out. */
  if (respRepaint) return;
  respRepaint = true;
  setTimeout(function(){ respRepaint = false; renderResponses(f); }, 0);
}
var respRepaint = false;
/* Only ever counts inside the current cohort. Every figure on this tab
   reads from here, so nothing can quietly stay global while the rest
   filters — the failure that makes a filtered dashboard untrustworthy. */
function answered(f, q){
  return respPool(f).filter(function(r){ return r.answers[q.id] != null; });
}

function renderResponses(f){
  /* Nothing on this tab is staged, so the toolbar's save slot empties
     rather than showing a control that would act on another tab's draft. */
  $('#tbSave').innerHTML = '';
  var host = $('#tabResponses');
  destroyCharts();

  if (!f.responses.length){
    host.innerHTML = '<div class="c-empty is-section">' +
      '<i class="ph ph-tray" aria-hidden="true"></i><h4>No responses yet</h4>' +
      '<p>' + (f.status === 'active'
        ? 'This form is live. Responses will appear here as they come in.'
        : 'Publish the form to start collecting responses.') + '</p></div>';
    return;
  }

  var pool = respPool(f);
  var total = pool.length;
  var complete = pool.filter(function(r){ return r.complete; }).length;
  var avgSec = total ? Math.round(pool.reduce(function(s, r){ return s + r.seconds; }, 0) / total) : 0;

  host.innerHTML =
    '<div class="sum-grid">' +
      statCard('Total responses', total.toLocaleString(), 'ph-users-three',
               respFilter ? 'of ' + f.responses.length.toLocaleString() + ' in total' : '') +

    (respFilter

      '<div class="c-segctl c-segctl-default" role="tablist" aria-label="Response view" id="respSeg">' +
        '<span class="c-seg-pill" aria-hidden="true"></span>' +

        /* Survey-wide, as opposed to the per-question button on each

        (f.responses.length >= 5

          : '') +
        '<span class="menu-wrap">' +
          '<button class="c-btn c-btn-secondary c-btn-md" type="button" id="expBtn" aria-haspopup="menu" aria-expanded="false">' +
            '<i class="ph ph-download-simple" aria-hidden="true"></i>Export' +
            '<i class="ph ph-caret-down" aria-hidden="true" style="font-size:var(--icon-micro)"></i></button>' +
          '<div class="menu-pop" id="expMenu" role="menu" aria-label="Export responses" hidden>' +

            '<button type="button" role="menuitem" data-exp="pdf"><i class="ph ph-file-pdf" aria-hidden="true"></i>' +

    /* Above the per-question cards and outside #respBody, so switching
       between Summary and Individual leaves the survey-wide summary standing

  wireSeg($('#respSeg'), state.respView === 'summary' ? 0 : 1, function(i){

  if ($('#respFilterClear')){

/* Every .menu-pop in the prototype closes through here, so the document
   handler and each trigger share one path rather than each knowing about
   the others. */
function closeMenus(){
  $$('.menu-pop').forEach(function(m){
    m.hidden = true;
    var trig = m.parentNode.querySelector('[aria-haspopup="menu"]');
    if (trig) trig.setAttribute('aria-expanded', 'false');
  });
}

function statCard(label, value, icon, sub){
  return '<div class="c-card stack sm">' +
    '<span class="eyebrow"><i class="ph ' + icon + '" aria-hidden="true"></i> ' + esc(label) + '</span>' +
    '<span style="font-size:var(--text-h3-size);line-height:var(--text-h3-lh);font-weight:var(--text-h3-weight);font-variant-numeric:tabular-nums">' + esc(value) + '</span>' +
    (sub ? '<span class="hint">' + esc(sub) + '</span>' : '') +
  '</div>';

/* Segmented Control's pill is positioned in JS from the track — same
   mechanic preview.html uses, not a second implementation. */
function wireSeg(track, activeIdx, onChange){
  var segs = $$('.c-seg', track), pill = $('.c-seg-pill', track);
  function place(i){
    var s = segs[i];
    pill.style.width = s.offsetWidth + 'px';
    pill.style.height = s.offsetHeight + 'px';
    pill.style.transform = 'translate(' + (s.offsetLeft - track.clientLeft) + 'px,' + (s.offsetTop - track.clientTop) + 'px)';
    segs.forEach(function(x, j){
      x.setAttribute('aria-selected', j === i ? 'true' : 'false');
      x.style.color = j === i ? 'var(--color-neutral-9)' : '';
      x.style.fontWeight = j === i ? '700' : '';
    });
  }
  segs.forEach(function(s, i){
    s.addEventListener('click', function(){ track.dataset.active = i; place(i); onChange(i); });
  });
  place(activeIdx);
  var onResize = function(){ if (document.contains(track)) place(+track.dataset.active || activeIdx); else window.removeEventListener('resize', onResize); };
  window.addEventListener('resize', onResize);
}

function paintRespBody(f){
  var host = $('#respBody');
  if (state.respView === 'individual'){ paintIndividual(f, host); return; }
  $('#respMeta').textContent = 'Aggregated across ' + respPool(f).length + ' responses';

  var html = '', charts = [];
  f.questions.forEach(function(q){
    if (q.type === 'media') return;
    var rows = answered(f, q);
    var id = 'ch-' + q.id;

    if (q.type === 'scale'){
      var buckets = [], labels = [];
      for (var v = q.min; v <= q.max; v++){ labels.push(String(v)); buckets.push(0); }
      rows.forEach(function(r){ buckets[r.answers[q.id] - q.min]++; });
      var avg = rows.reduce(function(s, r){ return s + r.answers[q.id]; }, 0) / (rows.length || 1);
      html += chartCard(id, q.title,
        'Average ' + avg.toFixed(2) + ' out of ' + q.max + ' · ' + rows.length + ' answers',
        labels.map(function(l, i){ return [l, buckets[i], pct(buckets[i], rows.length)]; }),
        ['Score','Responses','Share']);
      charts.push({ id:id, kind:'scale', labels:labels, data:buckets, q:q });

    } else if (q.type === 'yesno'){
      var yes = rows.filter(function(r){ return r.answers[q.id] === 'Yes'; }).length;
      var no = rows.length - yes;
      html += chartCard(id, q.title, pct(yes, rows.length) + ' answered Yes · ' + rows.length + ' answers',
        [['Yes', yes, pct(yes, rows.length)], ['No', no, pct(no, rows.length)]],
        ['Answer','Responses','Share']);
      charts.push({ id:id, kind:'yesno', data:[yes, no], q:q });

    } else if (q.type === 'single' || q.type === 'multi'){
      var opts = q.options || [], counts = opts.map(function(){ return 0; });
      rows.forEach(function(r){
        var a = r.answers[q.id];
        (Array.isArray(a) ? a : [a]).forEach(function(v){
          var i = opts.indexOf(v); if (i > -1) counts[i]++;
        });
      });
      html += chartCard(id, q.title, rows.length + ' answers',
        opts.map(function(o, i){ return [o, counts[i], pct(counts[i], rows.length)]; }),
        ['Option','Responses','Share']);
      charts.push({ id:id, kind:q.type, labels:opts, data:counts, q:q });

    } else {
      /* Open text — a list, not a chart, with its own search and its own
         Summarise with AI action. The action is offered only where there is
         something to summarise; under three answers the list *is* the
         summary. */
      html += '<div class="c-card stack">' +
        '<div class="row between"><h5 style="margin:0">' + esc(q.title) + '</h5>' +
        '<span class="row tight">' +
          '<span class="hint">' + rows.length + ' answers</span>' +
          (rows.length >= 3
            ? '<button class="c-btn c-btn-secondary c-btn-sm" type="button" data-ai="' + q.id + '">' +
                '<i class="ph-fill ph-sparkle" aria-hidden="true"></i>Summarise with AI</button>'
            : '') +
        '</span></div>' +
        '<div data-aislot="' + q.id + '"></div>' +
        '<div class="c-search-input" style="max-width:none"><div class="c-search-input-box">' +
          '<i class="ph ph-magnifying-glass c-search-input-icon" aria-hidden="true"></i>' +
          '<input type="search" placeholder="Search answers" aria-label="Search answers to: ' + esc(q.title) + '" data-tsearch="' + q.id + '" />' +
          '<button class="c-search-input-clear" type="button" data-tclear="' + q.id + '" aria-label="Clear search" hidden><i class="ph ph-x" aria-hidden="true"></i></button>' +
        '</div></div>' +
        '<div class="resp-list" data-tlist="' + q.id + '">' +
          rows.map(function(r){
            return '<div class="resp-item" data-text="' + esc(String(r.answers[q.id]).toLowerCase()) + '">' +
              esc(r.answers[q.id]) + '<span class="who">' + esc(r.who) + ' · ' + esc(r.pod) + ' · ' + fmtDate(r.at) + '</span></div>';
          }).join('') +
        '</div>' +
        '<p class="hint" data-tempty="' + q.id + '" hidden>No answers match that search.</p>' +
      '</div>';
    }
  });

  host.innerHTML = html;
  wireTableToggles(host);
  charts.forEach(drawChart);

  $$('[data-ai]', host).forEach(function(btn){
    btn.addEventListener('click', function(){ summarise(f, btn.dataset.ai, btn); });
  });

  $$('[data-tsearch]', host).forEach(function(inp){
    var clr = $('[data-tclear="' + inp.dataset.tsearch + '"]', host);
    function filter(){
      var v = inp.value.trim().toLowerCase();
      var list = $('[data-tlist="' + inp.dataset.tsearch + '"]', host);
      var shown = 0;
      $$('.resp-item', list).forEach(function(it){
        var hit = !v || it.dataset.text.indexOf(v) !== -1;
        it.hidden = !hit; if (hit) shown++;
      });
      $('[data-tempty="' + inp.dataset.tsearch + '"]', host).hidden = shown > 0;
      /* The Clear button is the component's, so it follows the value —
         WebKit's own x is suppressed system-wide and is not a fallback. */
      if (clr) clr.hidden = !inp.value;
    }
    inp.addEventListener('input', filter);
    inp.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && inp.value){ e.stopPropagation(); inp.value = ''; filter(); }
    });
    if (clr) clr.addEventListener('click', function(){ inp.value = ''; filter(); inp.focus(); });
  });
}
function pct(n, d){ return d ? Math.round(n / d * 100) + '%' : '0%'; }

/* Marks follow Chart chrome & marks: bars round 4px on the outer end only,
   24px max thickness, one Neutral-3 gridline on the value axis. Colour is
   sequential (one hue off the owning element) wherever the categories are
   points on one measure, and categorical only where they are genuinely
   different things. */
/* Chart color mapping's first rule is department-aligned: a series that
   belongs to a department is drawn in that department's element colour.
   Every survey now records its owner, so a single-measure chart stops
   defaulting to Navy and takes the colour its own card already wears.
   Water/Navy remains the fallback for a survey with no owner — it is the
   element the table lists for Data, which is what an unattributed set of
   response figures is. */
function elementColor(el){
  return el === 'fire'  ? ORANGE
       : el === 'wood'  ? SALMON
       : el === 'earth' ? GREEN
       : el === 'gold'  ? AMBER
       : NAVY;
}
function seriesColor(){
  var f = currentForm();
  return elementColor(f && ownerEl(f));
}

function drawChart(c){
  var SERIES = seriesColor();
  /* Clicking a bar or a slice filters the whole tab to the people who gave
     that answer. Reading the labels off the built config rather than off
     `c` matters for the multi chart, whose bars are re-ordered by frequency
     before they are drawn. */
  var pickFrom = function(cfg){
    return function(evt, els){
      if (!els || !els.length) return;
      var lbl = cfg.data.labels[els[0].index];
      var f = currentForm();
      if (f) setRespFilter(f, c.q.id, c.q.type === 'scale' ? Number(lbl) : lbl);
    };
  };
  var clickable = { onHover:function(e, els){
    var t = e && e.native && e.native.target;
    if (t) t.style.cursor = els.length ? 'pointer' : 'default';
  } };
  var ctx = document.getElementById(c.id);
  if (!ctx) return;
  var cfg;

  if (c.kind === 'scale'){
    /* A 1-5 or 0-10 scale is one measure, so the bars are one colour, not a
       rainbow — the number under each bar already distinguishes them. */
    cfg = { type:'bar',
      data:{ labels:c.labels, datasets:[{ data:c.data, backgroundColor:SERIES,
        hoverBackgroundColor:mix(SERIES, neutral9, 0.15), borderRadius:{topLeft:4,topRight:4},
        borderSkipped:'bottom', maxBarThickness:24 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:tooltip },
        scales:{ x:baseAxes().x, y:Object.assign(baseAxes().y, { beginAtZero:true, ticks:Object.assign({}, baseAxes().y.ticks, { precision:0 }) }) } } };

  } else if (c.kind === 'yesno'){
    /* Two mutually exclusive outcomes — categorical, and only two, so a
       donut reads faster than a pair of bars. Green stays Green here rather
       than taking the department colour: it is answering yes/no, and the
       pairing carries a meaning of its own that the owner's hue would
       overwrite. */
    cfg = { type:'doughnut',
      data:{ labels:['Yes','No'], datasets:[{ data:c.data, backgroundColor:[GREEN, neutral3],
        borderColor:neutral1, borderWidth:2 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',
        plugins:{ legend:legend(), tooltip:tooltip } } };

  } else if (c.kind === 'multi'){
    /* Multi-select: horizontal bars ranked by frequency, per the brief. */
    var order = c.data.map(function(v, i){ return i; })
                      .sort(function(a, b){ return c.data[b] - c.data[a]; });
    cfg = { type:'bar',
      data:{ labels:order.map(function(i){ return c.labels[i]; }),
        datasets:[{ data:order.map(function(i){ return c.data[i]; }), backgroundColor:SERIES,
          hoverBackgroundColor:mix(SERIES, neutral9, 0.15),
          borderRadius:{topRight:4,bottomRight:4}, borderSkipped:'left', maxBarThickness:24 }] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:tooltip },
        scales:{ x:Object.assign(baseAxes().y, { beginAtZero:true }), y:baseAxes().x } } };

  } else {
    /* Single-select: genuinely different options, so the categorical ramp —
       the department table order from Chart color mapping. */
    var palette = [ORANGE, SALMON, GREEN, NAVY, AMBER];
    cfg = { type:'doughnut',
      data:{ labels:c.labels, datasets:[{ data:c.data,
        backgroundColor:c.labels.map(function(_, i){ return palette[i % palette.length]; }),
        borderColor:neutral1, borderWidth:2 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',
        plugins:{ legend:legend(), tooltip:tooltip } } };
  }
  /* Free-text has no segments to click, and the yes/no donut does — every
     kind built above answers with a discrete value, so all of them filter. */
  cfg.options.onClick = pickFrom(cfg);
  cfg.options.onHover = clickable.onHover;
  CHARTS.push(new Chart(ctx, cfg));
}
function mix(a, b, amt){
  function rgb(h){ h = h.replace('#',''); if (h.length === 3) h = h.split('').map(function(c){return c+c;}).join('');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
  var A = rgb(a), B = rgb(b);
  return 'rgb(' + A.map(function(v, i){ return Math.round(v + (B[i] - v) * amt); }).join(',') + ')';
}

/* ==========================================================================
   Response export — Excel and PDF
   Both produce a real file rather than a toast: a spreadsheet the browser
   downloads, and the browser's own print-to-PDF driven by the @media print
   sheet at the top of this file. Neither needs a library.
   ========================================================================== */
function csvCell(v){
  if (v == null) return '';
  var s = String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function download(name, mime, text){
  var blob = new Blob([text], { type:mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function slug(s){
  return fold(s).s.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'export';
}
/* CSV with a UTF-8 BOM and CRLF endings — that pair is what makes Excel
   open the file directly, in the right encoding, with accented names
   intact. A genuine .xlsx would mean shipping a zip writer and a
   spreadsheet-XML builder for one button. */
function exportSheet(f){
  var qs = f.questions.filter(function(q){ return q.type !== 'media'; });
  var head = ['Response ID','Submitted','Respondent','Pod','Complete','Seconds on form']
    .concat(qs.map(function(q){ return q.title; }));
  var lines = [head.map(csvCell).join(',')];
  f.responses.forEach(function(r){
    var row = [r.id, fmtStamp(r.at), r.who, r.pod, r.complete ? 'Yes' : 'No', r.seconds];
    qs.forEach(function(q){
      var a = r.answers[q.id];
      row.push(a == null ? '' : (Array.isArray(a) ? a.join('; ') : a));
    });
    lines.push(row.map(csvCell).join(','));
  });
  download(slug(f.title) + '-responses.csv', 'text/csv;charset=utf-8', '\ufeff' + lines.join('\r\n'));
  toast(f.responses.length.toLocaleString() + ' responses exported', 'success');
}
function exportPdf(){
  toast('Opening the print dialog — choose “Save as PDF”');
  /* Let the toast paint before the dialog blocks the main thread. */
  setTimeout(function(){ window.print(); }, 450);
}

/* ==========================================================================
   Summarise with AI — free-text answers only
   The wait state is AI Native's Loading State, by its own rules: held back
   400ms before it renders at all (Rule 2), a live label driven by real
   phase changes rather than one fixed string (Rule 4), a timer computed
   from a start timestamp on every tick rather than an accumulated counter
   (Rule 5), a Stop in the hosting surface (Rule 9), one run per operation
   (Rule 7), and mounted in the slot the answer will fill so the swap reads
   as one thing resolving (Rule 10).
   The answer then renders whole, which is also a rule rather than a
   shortcut: Streaming Text's Rule 2 forbids animating a reveal over content
   already in hand, and here the summary is computed locally from the
   answers listed below it. Against a real model, this is the point where
   the first token would arrive and Streaming Text would take over.
   ========================================================================== */

/* Theme buckets. Deterministic and local — it groups answers by keyword
   set, counts each group and quotes the longest answer in it. This is the
   stand-in for the model call, and it is what makes the panel's content
   real rather than placeholder prose. */
/* Ordered most-specific first, because the first bucket a keyword hits wins.
   "I can never remember which pod owns which report" is about ownership, not
   about filters, and it only lands in the right bucket if the ownership keys
   are tested before the generic "filter"/"remember" ones. */
var THEMES = [
  { name:'Hard to tell who owns what',                keys:['owns which','who else','same campaign'] },
  { name:'Search does not find things',               keys:['search','fuzzy','typo','exact name'] },
  { name:'Exports and scheduled reporting',           keys:['export','screenshot the table','bulk','one file'] },
  { name:'Work is lost, or the numbers look stale',   keys:['logged me out','lost everything','autosave','draft','still refreshing','stale','last updated'] },
  { name:'Too many steps for routine work',           keys:['clicks','shortcut','twenty times','rebuilding','duplicate a report'] },
  { name:'Filters and view state are not remembered', keys:['filter','column widths','defaults to','pin the'] },
  { name:'Cramped on smaller screens',                keys:['laptop','mobile','phone','scrolls sideways','first column'] }
];
function longest(arr){
  return arr.slice().sort(function(a, b){ return b.length - a.length; })[0];
}
function themeAnswers(rows, qid){
  return themeTexts(rows.map(function(r){ return String(r.answers[qid]); }));
}
/* The bucketing itself takes a pool of strings, so it can be run over one
   question's answers or over every open-text answer in the survey at once. */
function themeTexts(texts){
  var buckets = THEMES.map(function(t){ return { name:t.name, hits:[] }; });
  var other = [];
  texts.forEach(function(txt){
    var h = fold(txt).s, placed = false;
    THEMES.forEach(function(t, i){
      if (placed) return;
      var hit = t.keys.some(function(k){ return h.indexOf(k) !== -1; });
      if (hit){ buckets[i].hits.push(txt); placed = true; }
    });
    if (!placed) other.push(txt);
  });
  var out = buckets.filter(function(b){ return b.hits.length; })
                   .sort(function(a, b){ return b.hits.length - a.hits.length; });
  var top = out.slice(0, 5);
  var spare = out.slice(5).reduce(function(n, b){ return n + b.hits.length; }, 0) + other.length;
  return { total:texts.length, themes:top, spare:spare, other:other };
}

var aiRuns = {};

function aiSummaryHtml(qid, res, secs){
  var covered = res.total - res.spare;
  var top = res.themes[0];
  var take = top
    ? covered + ' of ' + res.total + ' answers fall into ' + res.themes.length +
      ' recurring ' + (res.themes.length === 1 ? 'theme' : 'themes') + '. The largest — ' +
      top.name.charAt(0).toLowerCase() + top.name.slice(1) + ' — accounts for ' +
      top.hits.length + ' of them.'
    : 'No theme repeats across these ' + res.total + ' answers; each one raises something different.';
  return '<div class="ai-panel">' +
    '<div class="ai-panel-head">' +
      '<span class="eyebrow"><i class="ph-fill ph-sparkle" aria-hidden="true"></i> AI summary</span>' +
      '<span class="grow"></span>' +
      '<button class="c-btn c-btn-ghost c-btn-sm" type="button" data-airedo="' + qid + '"><i class="ph ph-arrow-clockwise" aria-hidden="true"></i>Redo</button>' +
      '<button class="c-icon-btn" type="button" data-aiclose="' + qid + '" aria-label="Dismiss summary"><i class="ph ph-x" aria-hidden="true"></i></button>' +
    '</div>' +
    '<p class="ai-take">' + esc(take) + '</p>' +
    (res.themes.length
      ? '<ul class="ai-themes">' + res.themes.map(function(t){
          return '<li><span class="n">' + t.hits.length + '&times;</span>' +
            '<span><b>' + esc(t.name) + '</b> &mdash; <q>' + esc(longest(t.hits)) + '</q></span></li>';
        }).join('') +
        (res.spare ? '<li><span class="n">' + res.spare + '&times;</span>' +
          '<span class="muted">Smaller and one-off themes, nothing repeating.</span></li>' : '') +
      '</ul>'
      : '') +
    '<p class="ai-disc">Generated from ' + res.total + ' free-text answers in ' + secs +
      's. Read it against the answers below before quoting it.</p>' +
  '</div>';
}

/* One runner behind both scopes of summary — a single free-text question,
   and the survey as a whole. Everything the two share is the part the rules
   govern (the 400ms hold, the live label, the timestamp-driven timer, the
   Stop, one run per key); all that differs is the phase copy and what gets
   rendered at the end. */
function aiLoadingHtml(label){
  return '<div class="ai-panel">' +
    '<div class="c-loading" role="status" aria-live="polite">' +
      '<span class="c-loading-grid orbit" aria-hidden="true">' +
        '<span class="c-loading-cell"></span><span class="c-loading-cell"></span><span class="c-loading-cell"></span>' +
        '<span class="c-loading-cell"></span><span class="c-loading-cell is-off"></span><span class="c-loading-cell"></span>' +
        '<span class="c-loading-cell"></span><span class="c-loading-cell"></span><span class="c-loading-cell"></span>' +
      '</span>' +
      '<span class="c-loading-label" data-ailabel>' + esc(label) + '</span>' +
      '<span class="c-loading-elapsed" aria-hidden="true" data-aitime>0.0s</span>' +
    '</div>' +
    '<div class="ai-foot"><button class="c-btn c-btn-ghost c-btn-sm" type="button" data-aistop><i class="ph ph-stop-circle" aria-hidden="true"></i>Stop</button></div>' +
  '</div>';
}
function runAi(key, slot, btn, spec){
  if (!slot || aiRuns[key]) return;                 /* Rule 7 — one per operation */
  var t0 = Date.now();
  var run = { stopped:false, timers:[], tick:null };
  aiRuns[key] = run;
  if (btn) btn.disabled = true;

  function clear(){
    run.timers.forEach(clearTimeout);
    if (run.tick) clearInterval(run.tick);
    delete aiRuns[key];
  }
  function stop(){
    run.stopped = true; clear();
    slot.innerHTML = '';
    if (btn) btn.disabled = false;
    toast('Summary stopped');
  }

  /* Rule 2 — nothing renders for the first 400ms. If the work finished
     inside that window the loader would never have appeared at all. */
  run.timers.push(setTimeout(function(){
    if (run.stopped) return;
    slot.innerHTML = aiLoadingHtml(spec.phases[0][1]);
    $('[data-aistop]', slot).addEventListener('click', stop);
    /* Rule 5 — read off the start timestamp every tick, never accumulate;
       a throttled tab makes an accumulated count wrong by an order of
       magnitude. */
    run.tick = setInterval(function(){
      var el = $('[data-aitime]', slot);
      if (el) el.textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's';
    }, 100);
    /* Rule 4 — the label is a live status, not a fixed string. */
    spec.phases.slice(1).forEach(function(p){
      run.timers.push(setTimeout(function(){
        var el = $('[data-ailabel]', slot);
        if (el) el.textContent = p[1];
      }, p[0] - 400));
    });
  }, 400));

  run.timers.push(setTimeout(function(){
    if (run.stopped) return;
    var secs = ((Date.now() - t0) / 1000).toFixed(1);
    clear();
    slot.innerHTML = spec.render(secs);
    if (btn) btn.disabled = false;
    $('[data-aiclose]', slot).addEventListener('click', function(){ slot.innerHTML = ''; });
    $('[data-airedo]', slot).addEventListener('click', function(){
      slot.innerHTML = ''; spec.rerun();
    });
  }, spec.done));
}

/* --------------------------------------------------------------------------
   Whole-survey analysis
   Reads the same answers the charts below are drawn from, so the panel can
   never disagree with them. Scales are compared on a normalised 0-1 position
   in their own range, because a 3.4 on a 1-5 and a 3.4 on a 0-10 are not the
   same answer and ranking them raw would put every 0-10 question last.
   -------------------------------------------------------------------------- */
function analyseSurvey(f){
  var qs = f.questions.filter(function(q){ return q.type !== 'media'; });
  var scales = [], yesno = [], choice = [], texts = [], nps = null;

  qs.forEach(function(q){
    var rows = answered(f, q);
    if (!rows.length) return;

    if (q.type === 'scale'){
      var avg = rows.reduce(function(a, r){ return a + r.answers[q.id]; }, 0) / rows.length;
      /* A 0-10 question is the recommendation question by convention, so it
         is read the way one is — promoters minus detractors — and it is kept
         out of the strongest/weakest ranking entirely. It measures a
         different thing from the rated questions, and leaving it in produced
         a panel that called it the strongest question two lines above
         reporting its score as negative. */
      if (q.min === 0 && q.max === 10){
        var pro = rows.filter(function(r){ return r.answers[q.id] >= 9; }).length;
        var det = rows.filter(function(r){ return r.answers[q.id] <= 6; }).length;
        var proPct = Math.round(pro / rows.length * 100), detPct = Math.round(det / rows.length * 100);
        nps = { q:q, score:proPct - detPct, proPct:proPct, detPct:detPct, n:rows.length };
      } else {
        scales.push({ q:q, avg:avg, norm:(avg - q.min) / (q.max - q.min), n:rows.length });
      }

    } else if (q.type === 'yesno'){
      var yes = rows.filter(function(r){ return r.answers[q.id] === 'Yes'; }).length;
      yesno.push({ q:q, pct:Math.round(yes / rows.length * 100), n:rows.length });

    } else if (q.type === 'single' || q.type === 'multi'){
      var opts = q.options || [], counts = opts.map(function(){ return 0; });
      rows.forEach(function(r){
        var a = r.answers[q.id];
        (Array.isArray(a) ? a : [a]).forEach(function(v){
          var i = opts.indexOf(v); if (i > -1) counts[i]++;
        });
      });
      if (opts.length){
        var top = 0;
        counts.forEach(function(c, i){ if (c > counts[top]) top = i; });
        choice.push({ q:q, top:opts[top], pct:Math.round(counts[top] / rows.length * 100), n:rows.length });
      }

    } else {
      rows.forEach(function(r){ texts.push(String(r.answers[q.id])); });
    }
  });

  scales.sort(function(a, b){ return b.norm - a.norm; });
  yesno.sort(function(a, b){ return a.pct - b.pct; });
  choice.sort(function(a, b){ return b.pct - a.pct; });

  /* Every open-text answer pooled rather than summarised question by
     question: a theme that turns up under two different questions is a
     stronger signal than one that turns up under one, and the per-question
     panels already cover them separately. */
  return {
    total:f.responses.length,
    complete:f.responses.filter(function(r){ return r.complete; }).length,
    questions:qs.length,
    scales:scales, yesno:yesno, choice:choice, nps:nps,
    themes:themeTexts(texts), textCount:texts.length
  };
}

function aiSurveyHtml(res, secs){
  var pct = Math.round(res.complete / res.total * 100);
  var meanNorm = res.scales.length
    ? res.scales.reduce(function(a, x){ return a + x.norm; }, 0) / res.scales.length : null;
  var mood = meanNorm === null ? '' : meanNorm >= 0.7 ? 'positive' : meanNorm >= 0.5 ? 'lukewarm' : 'poor';

  var take = res.total.toLocaleString() + ' responses across ' + res.questions +
    ' questions, ' + pct + '% of them complete.' +
    (meanNorm === null ? ''
      : ' The ' + res.scales.length + ' rated questions sit ' + Math.round(meanNorm * 100) +
        '% of the way up their scales — a ' + mood + ' read overall.');

  var lines = [];
  if (res.scales.length > 1){
    var best = res.scales[0], worst = res.scales[res.scales.length - 1];
    lines.push([worst.avg.toFixed(2), 'Weakest rated question',
      '&ldquo;' + esc(worst.q.title) + '&rdquo;, out of ' + worst.q.max + ', on ' + worst.n + ' answers.']);
    lines.push([best.avg.toFixed(2), 'Strongest rated question',
      '&ldquo;' + esc(best.q.title) + '&rdquo;, out of ' + best.q.max + '.']);
  }
  if (res.nps){
    lines.push([(res.nps.score > 0 ? '+' : '') + res.nps.score, 'Recommendation',
      res.nps.proPct + '% scored 9 or 10 against ' + res.nps.detPct + '% at 6 or below.']);
  }
  if (res.yesno.length){
    lines.push([res.yesno[0].pct + '%', 'Lowest agreement',
      'answered Yes to &ldquo;' + esc(res.yesno[0].q.title) + '&rdquo;.']);
  }
  if (res.choice.length){
    lines.push([res.choice[0].pct + '%', 'Most-picked option',
      '&ldquo;' + esc(res.choice[0].top) + '&rdquo; on &ldquo;' + esc(res.choice[0].q.title) + '&rdquo;.']);
  }
  if (res.themes.themes.length){
    var t = res.themes.themes[0];
    lines.push([t.hits.length + '&times;', 'Top theme in the free text',
      esc(t.name.charAt(0).toLowerCase() + t.name.slice(1)) + ' — the most repeated of ' +
      res.themes.themes.length + ' themes across ' + res.textCount + ' written answers.']);
  }

  return '<div class="ai-panel is-survey">' +
    '<div class="ai-panel-head">' +
      '<span class="eyebrow"><i class="ph-fill ph-sparkle" aria-hidden="true"></i> AI summary &middot; whole survey</span>' +
      '<span class="grow"></span>' +
      '<button class="c-btn c-btn-ghost c-btn-sm" type="button" data-airedo><i class="ph ph-arrow-clockwise" aria-hidden="true"></i>Redo</button>' +
      '<button class="c-icon-btn" type="button" data-aiclose aria-label="Dismiss summary"><i class="ph ph-x" aria-hidden="true"></i></button>' +
    '</div>' +
    '<p class="ai-take">' + esc(take) + '</p>' +
    (lines.length
      ? '<ul class="ai-themes">' + lines.map(function(l){
          return '<li><span class="n">' + l[0] + '</span><span><b>' + l[1] + '</b> &mdash; ' + l[2] + '</span></li>';
        }).join('') + '</ul>'
      : '') +
    '<p class="ai-disc">Generated from ' + res.total.toLocaleString() + ' responses in ' + secs +
      's. Read it against the charts below before quoting it.</p>' +
  '</div>';
}

function summariseSurvey(f, btn){
  var slot = $('#surveyAiSlot');
  if (!slot) return;
  runAi('survey', slot, btn, {
    phases: [[0, 'Reading ' + f.responses.length.toLocaleString() + ' responses'],
             [900, 'Comparing questions'],
             [1900, 'Grouping the written answers'],
             [2900, 'Drafting the summary']],
    done: 3600,
    render: function(secs){ return aiSurveyHtml(analyseSurvey(f), secs); },
    rerun: function(){ summariseSurvey(f, btn); }
  });
}

function summarise(f, qid, btn){
  var slot = $('[data-aislot="' + qid + '"]');
  var q = f.questions.filter(function(x){ return x.id === qid; })[0];
  if (!slot || !q) return;
  var rows = answered(f, q);
  runAi(qid, slot, btn, {
    phases: [[0, 'Reading ' + rows.length + ' answers'],
             [900, 'Grouping recurring themes'],
             [1750, 'Drafting the summary']],
    done: 2500,
    render: function(secs){ return aiSummaryHtml(qid, themeAnswers(rows, qid), secs); },
    rerun: function(){ summarise(f, qid, btn); }
  });
}

/* Individual view — one respondent at a time. */
function paintIndividual(f, host){
  var i = Math.max(0, Math.min(state.respIndex, f.responses.length - 1));
  state.respIndex = i;
  var r = f.responses[i];
  $('#respMeta').textContent = 'Response ' + (i + 1) + ' of ' + f.responses.length;

  host.innerHTML =
    '<div class="c-card stack">' +
      '<div class="row between">' +
        '<div class="row tight">' +
          '<span class="avatar">' + esc(initials(r.who)) + '</span>' +
          '<span class="stack" style="gap:2px">' +
            '<b style="font-size:var(--text-body2-size)">' + esc(r.who) + '</b>' +
            '<span class="hint">' + esc(r.pod) + ' · ' + fmtDateTime(r.at) + ' · ' +
              Math.floor(r.seconds / 60) + 'm ' + (r.seconds % 60) + 's</span>' +
          '</span>' +
        '</div>' +
        '<div class="indiv-nav">' +
          '<span class="c-badge ' + (r.complete ? 'c-badge-success' : 'c-badge-warning') + '">' +
            (r.complete ? 'Complete' : 'Partial') + '</span>' +
          '<button class="c-icon-btn" type="button" id="prevResp" aria-label="Previous response"' +
            (i === 0 ? ' disabled' : '') + '><i class="ph ph-caret-left" aria-hidden="true"></i></button>' +
          '<button class="c-icon-btn" type="button" id="nextResp" aria-label="Next response"' +
            (i === f.responses.length - 1 ? ' disabled' : '') + '><i class="ph ph-caret-right" aria-hidden="true"></i></button>' +
        '</div>' +
      '</div>' +
      '<div class="stack">' +
        f.questions.filter(function(q){ return q.type !== 'media'; }).map(function(q){
          var a = r.answers[q.id];
          var shown = a == null
            ? '<span class="muted" style="font-style:italic">No answer</span>'
            : esc(Array.isArray(a) ? a.join(', ') : String(a)) +
              (q.type === 'scale' ? ' <span class="muted">/ ' + q.max + '</span>' : '');
          return '<div class="indiv-qa"><span class="q">' + esc(q.title) + '</span>' +
                 '<span class="a">' + shown + '</span></div>';
        }).join('') +
      '</div>' +
    '</div>';

  var p = $('#prevResp'), n = $('#nextResp');
  if (p) p.addEventListener('click', function(){ state.respIndex--; paintIndividual(f, host); });
  if (n) n.addEventListener('click', function(){ state.respIndex++; paintIndividual(f, host); });
}

/* --------------------------------------------------------------------------
   Date picker — the DLS component, wired for real
   components.css ships the trigger, the panel and every day state, but no
   behaviour and no positioning: like Dropdown's own panel, .c-dp-panel sits
   in normal flow, so left alone it pushes the rest of Settings down the page
   when it opens. This adds the month arithmetic, the open/close, and floats
   the panel. Everything visual comes from the component.
   -------------------------------------------------------------------------- */
var dpView = {};                       /* which month each picker is showing */

function sameDay(a, b){
  return !!a && !!b && a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function dpGridHtml(id, value, min){
  var view = dpView[id];
  var y = view.getFullYear(), m = view.getMonth();
  var lead = new Date(y, m, 1).getDay();
  var days = new Date(y, m + 1, 0).getDate();
  var prevDays = new Date(y, m, 0).getDate();
  var cells = '';
  /* Days either side of the month are shown and unusable rather than left
     blank — the spec's "disabled / outside month" state — so the grid keeps
     its shape and the weekday columns stay honest. */
  for (var i = lead - 1; i >= 0; i--){
    cells += '<button class="c-dp-day disabled" type="button" disabled tabindex="-1">' + (prevDays - i) + '</button>';
  }
  for (var d = 1; d <= days; d++){
    var dt = new Date(y, m, d);
    var off = min && dt < dayStart(min);
    cells += '<button class="c-dp-day' + (off ? ' disabled' : '') +
      (sameDay(dt, NOW) ? ' today' : '') + (sameDay(dt, value) ? ' selected' : '') +
      '" type="button"' + (off ? ' disabled' : '') + ' data-dpday="' + isoDate(dt) + '"' +
      ' aria-label="' + esc(fmtDate(dt)) + '">' + d + '</button>';
  }
  var trail = (7 - ((lead + days) % 7)) % 7;
  for (var k = 1; k <= trail; k++){
    cells += '<button class="c-dp-day disabled" type="button" disabled tabindex="-1">' + k + '</button>';
  }
  return '<div class="c-dp-header">' +
      '<button class="c-icon-btn" type="button" data-dpnav="-1" aria-label="Previous month"><i class="ph ph-caret-left" aria-hidden="true"></i></button>' +
      '<h5>' + MONTHS[m] + ' ' + y + '</h5>' +
      '<button class="c-icon-btn" type="button" data-dpnav="1" aria-label="Next month"><i class="ph ph-caret-right" aria-hidden="true"></i></button>' +
    '</div>' +
    '<div class="c-dp-grid">' +
      ['S','M','T','W','T','F','S'].map(function(w){ return '<span class="c-dp-weekday">' + w + '</span>'; }).join('') +
      cells +
    '</div>';
}
function dpHtml(id, value, opts){
  opts = opts || {};
  if (!dpView[id]){
    dpView[id] = value ? new Date(value.getFullYear(), value.getMonth(), 1)
                       : new Date(NOW.getFullYear(), NOW.getMonth(), 1);
  }
  return '<div class="c-dp" data-dp="' + id + '"' + (opts.disabled ? ' data-dpdisabled' : '') + '>' +
    '<button class="c-dp-trigger" type="button" data-dptrigger' + (opts.disabled ? ' disabled' : '') +
      ' aria-haspopup="dialog" aria-expanded="false">' +
      '<i class="ph-fill ph-calendar" aria-hidden="true"></i>' +
      '<span class="c-dp-value' + (value ? '' : ' is-empty') + '">' +
        (value ? esc(fmtDate(value)) : esc(opts.placeholder || 'Pick a date')) + '</span>' +
    '</button>' +
    '<div class="c-dp-panel" data-dppanel hidden>' + dpGridHtml(id, value, opts.min) +
      (opts.clearable
        /* The documented footer is range-mode only. It is extended to single
           mode for the one field that is legitimately allowed to be empty —
           without it there is no way back to "opens immediately" once a date
           has been picked. */
        ? '<div class="c-dp-foot"><button class="c-btn c-btn-ghost c-btn-sm" type="button" data-dpclear>Clear date</button></div>'
        : '') +
    '</div>' +
  '</div>';
}
/* One wiring for every picker on the page. `onPick` receives a Date or null. */
function wireDp(id, getValue, opts, onPick){
  var root = $('[data-dp="' + id + '"]');
  if (!root) return;
  var trig = $('[data-dptrigger]', root), panel = $('[data-dppanel]', root);
  if (trig.disabled) return;

  function repaint(){
    panel.innerHTML = dpGridHtml(id, getValue(), opts.min) + (opts.clearable
      ? '<div class="c-dp-foot"><button class="c-btn c-btn-ghost c-btn-sm" type="button" data-dpclear>Clear date</button></div>'
      : '');
    bindPanel();
  }
  function bindPanel(){
    $$('[data-dpnav]', panel).forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        dpView[id] = new Date(dpView[id].getFullYear(), dpView[id].getMonth() + (+b.dataset.dpnav), 1);
        repaint();
      });
    });
    $$('[data-dpday]', panel).forEach(function(b){
      b.addEventListener('click', function(){ onPick(parseISODate(b.dataset.dpday)); });
    });
    var clr = $('[data-dpclear]', panel);
    if (clr) clr.addEventListener('click', function(){ onPick(null); });
  }
  bindPanel();

  trig.addEventListener('click', function(e){
    e.stopPropagation();
    var open = panel.hidden;
    closeDropdowns();
    if (open){
      /* Always open on the month the current value is in, not wherever the
         reader last browsed to and abandoned. */
      var v = getValue();
      dpView[id] = v ? new Date(v.getFullYear(), v.getMonth(), 1)
                     : new Date(NOW.getFullYear(), NOW.getMonth(), 1);
      repaint();
    }
    panel.hidden = !open;
    trig.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open){
      /* Flip above the trigger when a full calendar will not fit below it —
         the same `is-above` convention Dropdown's own panel uses. Measured
         after the panel is visible, because a hidden element has no height. */
      panel.classList.remove('is-above');
      var box = panel.getBoundingClientRect();
      if (box.bottom > window.innerHeight - 8 &&
          trig.getBoundingClientRect().top > box.height + 16){
        panel.classList.add('is-above');
      }
    }
  });
  panel.addEventListener('click', function(e){ e.stopPropagation(); });
}

/* ---------- Tab 3 — Settings ----------
   Settings are staged, not written straight through. Every control below
   writes to a draft, and nothing reaches the survey until Save settings is
   pressed — which is what makes a Save button mean anything. The draft is
   keyed by form id so switching surveys never carries edits across, and
   unsaved edits survive a trip to another tab and back rather than being
   silently dropped. */
var settingsDraft = null;

function draftFor(f){
  if (!settingsDraft || settingsDraft.id !== f.id){
    settingsDraft = {
      id: f.id,
      settings: JSON.parse(JSON.stringify(f.settings)),
      starts: f.starts ? new Date(f.starts) : null,
      ends: f.ends ? new Date(f.ends) : null,
      confirmLocked: true
    };
  }
  return settingsDraft;
}
function settingsDirty(f){
  var d = draftFor(f);
  if (JSON.stringify(d.settings) !== JSON.stringify(f.settings)) return true;
  return isoDate(d.starts) !== isoDate(f.starts) || isoDate(d.ends) !== isoDate(f.ends);
}

/* When the last save happened, per survey. Held in memory rather than on
   the form record: it answers "did my last edit land", which is a question
   about this session, not a property of the survey. */
var lastSavedAt = {};
/* Coarse on purpose. A save bar that ticks "37 seconds ago" invites the
   reader to watch it; the useful distinction is just-now vs a while back. */
function savedAgo(at){
  if (!at) return '';
  var mins = Math.floor((Date.now() - at) / 60000);
  if (mins < 1)  return 'just now';
  if (mins === 1) return '1 minute ago';
  if (mins < 60) return mins + ' minutes ago';
  var hrs = Math.floor(mins / 60);
  return hrs === 1 ? '1 hour ago' : hrs + ' hours ago';
}
/* One cluster, two callers. Save is Secondary, not Primary: Publish is the
   surface's primary action and sits 8px away, and two filled buttons side
   by side would make the reader choose between them rather than read a
   hierarchy. Discard is Ghost for the same reason — three weights in a row
   is a toolbar arguing with itself. */
function saveClusterHtml(kind, dirty, saveLabel){
  return '<span class="set-save' + (dirty ? ' is-dirty' : '') + '">' +
    '<span class="set-save-state">' + saveStateHtml(dirty) + '</span>' +
    '<button class="c-btn c-btn-ghost c-btn-sm" type="button" id="' + kind + 'Discard"' +
      (dirty ? '' : ' disabled') + '>Discard</button>' +
    '<button class="c-btn c-btn-secondary c-btn-sm" type="button" id="' + kind + 'Save"' +
      (dirty ? '' : ' disabled') + '>' + esc(saveLabel) + '</button>' +
  '</span>';
}
function saveStateHtml(dirty){
  if (dirty) return '<i class="ph-fill ph-circle" aria-hidden="true"></i>Unsaved changes';
  var f = currentForm();
  var ago = f ? savedAgo(lastSavedAt[f.id]) : '';
  return '<i class="ph ph-check-circle" aria-hidden="true"></i>' +
    (ago ? 'Saved ' + ago : 'All changes saved');
}
/* Update the save bar in place. Typing in the confirmation message cannot
   re-render the tab — that would take focus out of the textarea on every
   keystroke — so the one thing on screen that has to react to it is patched
   directly instead. */
function refreshSaveBar(f){
  var bar = $('#tbSave .set-save');
  if (!bar) return;
  var dirty = settingsDirty(f);
  bar.classList.toggle('is-dirty', dirty);
  $('.set-save-state', bar).innerHTML = saveStateHtml(dirty);
  $('#setSave').disabled = !dirty;
  $('#setDiscard').disabled = !dirty;
}

function renderSettings(f){
  var d = draftFor(f), s = d.settings;
  var dirty = settingsDirty(f);

  function toggle(key, title, desc){
    return '<div class="set-row"><span class="t"><b>' + esc(title) + '</b><span>' + esc(desc) + '</span></span>' +
      '<label class="c-choice switch"><input type="checkbox" data-set="' + key + '"' + (s[key] ? ' checked' : '') + ' />' +
      '<span class="c-switch-track' + (s[key] ? ' on' : '') + '"><span class="c-switch-thumb"></span></span>' +
      '<span class="sr-only">' + esc(title) + '</span></label></div>';
  }

  $('#tabSettings').innerHTML =
    '<div class="c-card stack"><h2 class="sect">General</h2><div>' +
      toggle('sendCopy',    'Send responders a copy of their response', 'Emails each person a receipt of what they submitted.') +
      toggle('allowEdit',   'Allow response editing',                   'Responders can come back and change their answers after submitting.') +
