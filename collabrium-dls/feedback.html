      toggle('oneResponse', 'Limit to 1 response per user',             'Requires sign-in. A second attempt reopens their first response.') +
    '</div></div>' +

    /* Time frame. "No deadline" is a switch rather than an empty date field
       because leaving a date blank is ambiguous — it reads as unfinished, and
       an open-ended survey is a decision, not an omission. */
    '<div class="c-card stack"><h2 class="sect">Time frame</h2>' +
      '<p class="hint">When the survey opens and closes. The library counts down to the closing date.</p>' +
      '<div>' +
        '<div class="set-row"><span class="t"><b>No deadline</b>' +
          '<span>Leave the survey open until someone closes it by hand.</span></span>' +
          '<label class="c-choice switch"><input type="checkbox" id="setNoEnd"' + (d.ends ? '' : ' checked') + ' />' +
          '<span class="c-switch-track' + (d.ends ? '' : ' on') + '"><span class="c-switch-thumb"></span></span>' +
          '<span class="sr-only">No deadline</span></label></div>' +
        '<div class="set-row" style="justify-content:flex-start;gap:var(--spacing-16);flex-wrap:wrap;align-items:flex-start">' +
          '<div class="c-field" style="width:200px"><label id="lblStart">Opens</label>' +
            dpHtml('dpStart', d.starts, { placeholder:'Opens immediately', clearable:true }) +
            '<span class="c-helper">Clear it to open immediately.</span></div>' +
          '<div class="c-field" style="width:200px" id="wrapEnd"><label id="lblEnd">Closes</label>' +
            dpHtml('dpEnd', d.ends, { placeholder:'No deadline', min:d.starts, disabled:!d.ends }) +
            '<span class="c-helper">' + (d.ends ? 'Responses stop at the end of this day.' : 'Off — this survey has no deadline.') + '</span></div>' +
          '<div class="c-field" style="width:auto"><label>Library will show</label>' +
            '<span class="tag-row" style="min-height:40px;align-items:center">' +
              deadlinePill({ ends:d.ends }) + '</span></div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="c-card stack"><h2 class="sect">Presentation</h2><div>' +
      toggle('progressBar', 'Show progress bar', 'Displays how far through the form the responder is.') +
      '<div class="set-row" style="flex-direction:column;align-items:stretch;gap:var(--spacing-8)">' +
        '<div class="row between" style="align-items:flex-start">' +
          '<span class="t"><b>After submission</b><span>The paragraph under \u201cYour response has been submitted.\u201d on the confirmation page.</span></span>' +
          /* Locked behind Edit: this is the one free-text setting, it is the
             last thing a responder sees, and a stray keystroke in an always-
             open textarea changes it without anyone noticing. */
          (d.confirmLocked
            ? '<button class="c-btn c-btn-secondary c-btn-sm" type="button" id="setConfirmEdit"><i class="ph ph-pencil-simple" aria-hidden="true"></i>Edit</button>'
            : '<button class="c-btn c-btn-primary c-btn-sm" type="button" id="setConfirmSave"><i class="ph ph-check" aria-hidden="true"></i>Save</button>') +
        '</div>' +
        '<div class="c-field field-wide"><textarea id="setConfirm" rows="2" placeholder="Thanks for your feedback!"' +
          (d.confirmLocked ? ' readonly' : '') + '>' + esc(s.confirm) + '</textarea>' +
        '<span class="c-helper">' + (d.confirmLocked
          ? 'Locked. Press Edit to change it.'
          : 'Editing. Press Save to lock it again — it is kept either way until you save the page.') + '</span></div>' +
      '</div>' +
    '</div></div>' +

    (s.progressBar ? '<div class="c-card stack sm"><span class="eyebrow">Preview</span>' +
      '<div class="c-progress-track size-default"><div class="c-progress-fill" style="width:40%"></div></div>' +
      '<span class="hint">Question 4 of 10</span></div>' : '') +

    /* One save for the page, pinned to the bottom of the viewport while the
       page scrolls: a Save that scrolls out of sight is a Save nobody
       presses. It states whether there is anything to save rather than
       offering an action that would do nothing. */
    '';

  $('#tbSave').innerHTML = saveClusterHtml('set', dirty, 'Save settings');

  /* ---- toggles ---- */
  $$('[data-set]').forEach(function(c){
    c.addEventListener('change', function(){
      s[c.dataset.set] = c.checked;
      renderSettings(f);
    });
  });

  /* ---- confirmation message ---- */
  $('#setConfirm').addEventListener('input', function(e){
    s.confirm = e.target.value;
    refreshSaveBar(f);
  });
  if ($('#setConfirmEdit')){
    $('#setConfirmEdit').addEventListener('click', function(){
      d.confirmLocked = false;
      renderSettings(f);
      var ta = $('#setConfirm');
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    });
  }
  if ($('#setConfirmSave')){
    $('#setConfirmSave').addEventListener('click', function(){
      d.confirmLocked = true;
      renderSettings(f);
      toast('Message updated — save the page to publish it');
    });
  }

  /* ---- time frame ---- */
  $('#setNoEnd').addEventListener('change', function(e){
    /* Turning the deadline back on needs a date to land on. A filled field
       the person can correct beats an empty one they have to discover — but
       it has to be a future date: counting from an opening date months back
       would set a deadline that has already passed, which reads as the
       switch having closed the survey. */
    d.ends = e.target.checked ? null
      : new Date(Math.max((d.starts || NOW).getTime(), NOW.getTime()) + 30 * 86400000);
    renderSettings(f);
  });
  wireDp('dpStart', function(){ return d.starts; },
    { placeholder:'Opens immediately', clearable:true }, function(v){
      d.starts = v;
      /* An opening date after the closing one is not a time frame either. */
      if (d.ends && v && d.ends < v) d.ends = new Date(v);
      renderSettings(f);
    });
  wireDp('dpEnd', function(){ return d.ends; },
    { placeholder:'No deadline', min:d.starts }, function(v){
      d.ends = v;
      renderSettings(f);
    });

  /* ---- page save ---- */
  $('#setSave').addEventListener('click', function(){
    f.settings = JSON.parse(JSON.stringify(d.settings));
    f.starts = d.starts ? new Date(d.starts) : null;
    f.ends = d.ends ? new Date(d.ends) : null;
    f.updated = new Date(NOW);
    lastSavedAt[f.id] = Date.now();
    d.confirmLocked = true;
    renderBuilder();
    toast('Settings saved', 'success');
  });
  $('#setDiscard').addEventListener('click', function(){
    settingsDraft = null;
    renderSettings(f);
    toast('Changes discarded');
  });
}

/* ==========================================================================
   Bug report — user view
   ========================================================================== */
var draftShots = [];
/* Draft state for the fields that survive a re-render of the form (the
   priority and services blocks repaint on every change, so their values
   cannot live in the DOM). */
var draftBug = { impact:'', location:'', hereNow:true, services:[], otherOn:false, other:'', title:'', desc:'', extra:'' };

/* Shared view switcher for the two bug list surfaces. Both are the same
   records read by different people, so this is a view switch, not
   navigation — Segmented Control, not tabs. */
function bugSegHtml(metaHtml){
  /* Addressed by attribute, not id: this markup is rendered into two
     different route sections and both stay in the document, so an id here
     would be a duplicate and every lookup would resolve to whichever copy
     came first — which is the hidden one, half the time. */
  /* The rule under the page header comes first, the same one the other two
     landing screens carry — it is here rather than in each route because
     both of them open on this row. */
  return '<hr class="route-rule" />' +
    '<div class="row between">' +
    '<div class="c-segctl c-segctl-default" role="tablist" aria-label="Bug report view" data-bugseg>' +
      '<span class="c-seg-pill" aria-hidden="true"></span>' +
      '<button class="c-seg" type="button" role="tab" data-bv="mine">My tickets</button>' +
      '<button class="c-seg" type="button" role="tab" data-bv="admin">All reports</button>' +
    '</div>' +
    (metaHtml || '') +
  '</div>';
}
/* What a ticket is searchable by. Status words are in here for the same
   reason the survey library puts them in: "resolved" is a thing people
   type into a search box. */
function bugHaystack(b){
  return [b.title, b.desc || '', b.pod, b.who, b.assignee || 'unassigned',
          BUG_STATUS[b.status].label].join(' ');
}
/* The control row both bug views share — the same shape the survey library
   carries: filter chips on the left, search on the right. All reports adds
   its pod filter to the right-hand group; My tickets has one pod by
   definition, so it does not. */
function bugFilterRow(scope, pool, podsHtml){
  return '<div class="row between bug-controls">' +
    '<div class="c-chip-group" role="group" aria-label="Filter reports">' +
      ['all','new','progress','resolved'].map(function(k){ return bugChip(k, pool); }).join('') +
      '<span class="chip-sep" aria-hidden="true"></span>' +
      /* These two cut across the first four — an In Progress ticket can be
         awaiting a reply — which is why they are a second group and not
         four more chips in the same one. */
      ['awaiting','replied'].map(function(k){ return bugChip(k, pool); }).join('') +
    '</div>' +
    '<div class="row tight">' +
      /* Search input's real recipe: the magnifier carries
         .c-search-input-icon, not Input field's .icon-leading — that class
         is scoped to .c-field and .c-filter-search, so inside a
         .c-search-input-box it matches nothing, the icon falls into flex
         flow outside the input's border, and the input's own 36px left
         padding is left standing as an empty gutter. The Clear button is
         part of the component too, not an extra. */
      '<div class="c-search-input" style="width:260px">' +
        '<div class="c-search-input-box">' +
          '<i class="ph ph-magnifying-glass c-search-input-icon" aria-hidden="true"></i>' +
          '<input type="search" data-bugsearch placeholder="Search reports" autocomplete="off"' +
            ' aria-label="Search reports by title, pod, reporter or status" value="' +
            esc(state.bugQuery) + '" />' +
          '<button class="c-search-input-clear" type="button" data-bugclear aria-label="Clear search"' +
            (state.bugQuery ? '' : ' hidden') + '><i class="ph ph-x" aria-hidden="true"></i></button>' +
        '</div>' +
      '</div>' +
      (podsHtml || '') +
    '</div>' +
  '</div>';
}
/* Applies the chips and the query to whichever pool the route hands in. */
function bugVisible(pool){
  var ts = terms(state.bugQuery);
  return pool.filter(function(b){
    return matchesBugChip(b, state.bugStatus) && matchAll(bugHaystack(b), ts);
  });
}
/* Clearing rebuilds the toolbar, so focus is put back on the field the
   rebuild replaced — the reader asked to empty the box, not to leave it. */
function clearBugSearch(root, rerender){
  state.bugQuery = '';
  rerender();
  var again = $('[data-bugsearch]', root);
  if (again) again.focus();
}
function wireBugControls(root, rerender){
  $$('[data-bs]', root).forEach(function(c){
    c.addEventListener('click', function(){ state.bugStatus = c.dataset.bs; rerender(); });
  });
  var box = $('[data-bugsearch]', root);
  if (box){
    box.addEventListener('input', function(){
      state.bugQuery = box.value;
      rerender();
      /* Re-render replaces the field, so the caret goes back where it was
         rather than to the start of the text the reader is mid-way through. */
      var again = $('[data-bugsearch]', root);
      if (again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    });
    /* Escape clears rather than falling through to the global handler,
       which would otherwise close a layer the reader never opened — the
       same bargain the library's own search box already strikes. */
    box.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && box.value){ e.stopPropagation(); clearBugSearch(root, rerender); }
    });
  }
  var clr = $('[data-bugclear]', root);
  if (clr) clr.addEventListener('click', function(){ clearBugSearch(root, rerender); });
}

function wireBugSeg(root, active){
  wireSeg($('[data-bugseg]', root), active === 'mine' ? 0 : 1, function(i){
    go(i ? 'bugAdmin' : 'bugMine');
  });
}

/* Incident priority — Dropdown Single select with a description line, so
   each step says what it means rather than leaving "High" to be read four
   different ways by four people. The severity dot rides inside the .prio
   pill in the label, not in the row's own media slot: Dropdown's media slot
   is documented as deliberately having no colour-dot modifier. */
/* Operational impact. Dropdown's own has-desc row, because the three levels
   are only distinguishable by their descriptions — "Medium" on its own is a
   word, not a judgement, and a reporter picking between three bare words
   picks the middle one. No default: a severity field that arrives pre-filled
   is a severity field nobody reads. */
function impactFieldHtml(){
  var chosen = IMPACTS[draftBug.impact];
  return '<div class="c-field field-wide c-dropdown-field dd-float" id="wrapImpact">' +
    '<label for="bugImpact">Operational impact <span class="required-mark" aria-hidden="true">*</span></label>' +
    '<div class="input-wrap has-trailing-icon">' +
      '<input type="text" id="bugImpact" class="c-dropdown-input" readonly value="' +
        esc(chosen ? chosen.name : '') + '" placeholder="How much is this holding work up?"' +
        ' aria-haspopup="listbox" aria-expanded="false" />' +
      '<span class="icon-trailing" aria-hidden="true"><i class="ph ph-caret-down c-dropdown-chevron"></i></span>' +
    '</div>' +
    '<div class="c-dropdown-panel" id="impactPanel" hidden><div class="c-dropdown-list">' +
      IMPACT_ORDER.map(function(k){
        return '<div class="c-dropdown-row has-desc' + (draftBug.impact === k ? ' selected' : '') +
          '" role="option" data-imp="' + k + '">' +
          '<span class="c-dropdown-row-text">' +
            '<span class="c-dropdown-row-label">' + esc(IMPACTS[k].name) + '</span>' +
            '<span class="c-dropdown-row-desc">' + esc(IMPACTS[k].desc) + '</span>' +
          '</span>' +
          '<i class="ph ph-check c-dropdown-row-check" aria-hidden="true"></i></div>';
      }).join('') +
    '</div></div>' +
    (chosen ? '<span class="c-helper">' + esc(chosen.desc) + '</span>' : '') +
  '</div>';
}

/* Where the reporter was when it happened, read off the page behind the
   drawer rather than asked for. The drawer is opened from the screen the bug
   is on, so the answer is already known — and a location typed from memory
   after navigating away is the field that most often sends a ticket to the
   wrong team. The tick is the escape hatch: untick it and the field becomes
   yours to write. */
function currentLocation(){
  var parts = ['Feedback'];
  var head = ($('#phTitle').textContent || '').trim();
  if (head && head !== 'Feedback') parts.push(head);
  if (state.route === 'builder'){
    var tab = $('#routeBuilder .c-tabs .c-tab.active');
    /* Tab labels carry their own counts — "Questions 5" is a tab, not a
       place. */
    if (tab) parts.push(tab.textContent.replace(/\s*\d+\s*$/, '').trim());
  }
  return parts.join(' › ');
}

function locationFieldHtml(){
  var here = draftBug.hereNow;
  return '<div class="c-field field-wide" id="wrapLoc">' +
      '<label for="bugLoc">Location of bug <span class="required-mark" aria-hidden="true">*</span></label>' +
      '<div class="input-wrap"><input type="text" id="bugLoc" value="' + esc(draftBug.location) + '"' +
        (here ? ' readonly disabled' : ' placeholder="Which screen is it on?"') + ' /></div>' +
    '</div>' +
    '<label class="c-choice" id="wrapHere">' +
      '<input type="checkbox" id="bugHere"' + (here ? ' checked' : '') + ' />' +
      '<span class="c-checkbox-box' + (here ? ' on' : '') + '">' +
        (here ? '<i class="ph ph-check" aria-hidden="true"></i>' : '') + '</span>' +
      '<span class="text"><span class="label">Current page</span>' +
        '<span class="desc">Untick if the problem is somewhere else.</span></span>' +
    '</label>';
}

/* Affected services — a fixed checkbox set, not free text, because this is
   the field that routes the ticket and a typo in it is a ticket nobody
   owns. Laid out in columns: ten one-line options in a single stack is a
   scroll, not a choice. */
function svcBox(on){
  return '<span class="c-checkbox-box' + (on ? ' on' : '') + '">' +
    (on ? '<i class="ph ph-check" aria-hidden="true"></i>' : '') + '</span>';
}
function svcFieldHtml(){
  var oth = draftBug.otherOn;
  return '<div class="c-field field-wide" id="wrapSvc">' +
    '<label id="svcLabel">Affected services <span class="required-mark" aria-hidden="true">*</span></label>' +
    '<div class="svc-grid" role="group" aria-labelledby="svcLabel">' +
      SERVICES.map(function(sv, i){
        var on = draftBug.services.indexOf(sv) > -1;
        return '<label class="c-choice"><input type="checkbox" data-svc="' + i + '"' + (on ? ' checked' : '') + ' />' +
          svcBox(on) +
          '<span class="text"><span class="label" style="font-size:var(--text-body2-size)">' + esc(sv) + '</span></span></label>';
      }).join('') +
      /* Other sits last, on its own line, behind a rule: a fixed list that
         routes tickets still has to have somewhere for the thing it does not
         cover to go, and this is the only option here that asks a question
         back rather than just being ticked. */
      '<label class="c-choice svc-other"><input type="checkbox" id="svcOther"' + (oth ? ' checked' : '') + ' />' +
        svcBox(oth) +
        '<span class="text"><span class="label" style="font-size:var(--text-body2-size)">Other — not in this list</span></span></label>' +
    '</div>' +
    '<span class="c-helper">Choose at least one.</span>' +
  '</div>' +
  '<div class="c-field field-wide" id="wrapOther"' + (oth ? '' : ' hidden') + '>' +
    '<label for="svcOtherText">Which service is affected? <span class="required-mark" aria-hidden="true">*</span></label>' +
    '<textarea id="svcOtherText" rows="2" placeholder="Name the part of Collabrium this affects, and where you were when it broke.">' +
      esc(draftBug.other) + '</textarea>' +
    '<span class="c-helper">It is not in the list above, so describe it — this is what the report gets routed on.</span>' +
  '</div>';
}

/* ==========================================================================
   Bug report form — lives in a drawer, not on a page of its own
   A bug is always about the screen the reporter is looking at. Sending them
   to a route to describe it costs them that screen — the scroll position,
   the filters, the half-finished thing that prompted the report — and makes
   getting back a second navigation. The drawer keeps the page behind it and
   closes back onto it, so filing a report is an interruption measured in
   seconds rather than a detour.
   ========================================================================== */
var bugSent = null;        /* the ticket just filed, while the drawer shows success */
var bugLastFocus = null;

function bugFormHtml(){
  /* No blurb above the fields and no Reported by / Pod block. Both said
     things the form already shows or the system already knows: the reporter
     is whoever is signed in, the pod comes off their profile, and a sentence
     explaining that the template is fixed is only readable to someone who
     has seen a different one. Both still land on the ticket — see submitBug
     — they are simply not questions.
     Every field is prefilled from the draft, so closing the drawer to go and
     check something on the page behind it — which is the whole reason this
     is a drawer — does not cost the reporter what they had already typed. */
  return '<div class="c-field field-wide" id="wrapTitle"><label for="bugTitle">Title <span class="required-mark" aria-hidden="true">*</span></label>' +
      '<div class="input-wrap"><input type="text" id="bugTitle" value="' + esc(draftBug.title) +
        '" placeholder="e.g. Export button unresponsive on Safari" required /></div></div>' +

    '<div class="c-field field-wide" id="wrapDesc"><label for="bugDesc">Description <span class="required-mark" aria-hidden="true">*</span></label>' +
      '<textarea id="bugDesc" rows="4" placeholder="What happened, and what you expected to happen instead." required>' +
        esc(draftBug.desc) + '</textarea></div>' +

    '<div id="locSlot" class="stack sm">' + locationFieldHtml() + '</div>' +
    '<div id="impactSlot">' + impactFieldHtml() + '</div>' +
    '<div id="svcSlot" class="stack lg">' + svcFieldHtml() + '</div>' +

    '<div class="stack sm">' +
      '<span class="eyebrow">Screenshot</span>' +
      '<div class="c-uploader field-wide">' +
        '<div class="c-uploader-zone" id="dropZone" tabindex="0" role="button" aria-label="Add screenshots — drag and drop, or press Enter to browse">' +
          '<i class="ph ph-image" aria-hidden="true"></i>' +
          '<span class="c-uploader-label">Drag screenshots here, or click to browse</span>' +
          '<span class="c-uploader-hint">PNG, JPG or GIF · multiple files welcome</span>' +
        '</div>' +
        '<div class="thumbs" id="shotThumbs"></div>' +
      '</div>' +
    '</div>' +

    '<div class="c-field field-wide"><label for="bugExtra">Additional information (optional)</label>' +
      '<textarea id="bugExtra" rows="3" placeholder="Steps to reproduce, browser and device, how often it happens.">' +
        esc(draftBug.extra) + '</textarea></div>';
}

/* Impact's own dropdown. Same open/select/repaint mechanic the rest of this
   form's dropdowns use — repaint the one slot, rewire it, leave the rest of
   the form and everything typed into it alone. */
function wireImpact(){
  var trig = $('#bugImpact'), panel = $('#impactPanel');
  if (!trig) return;
  var field = trig.closest('.c-dropdown-field');
  trig.addEventListener('click', function(e){
    e.stopPropagation();
    var open = panel.hidden;
    panel.hidden = !open;
    field.classList.toggle('open', open);
    trig.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  $$('[data-imp]', panel).forEach(function(r){
    r.addEventListener('click', function(){
      draftBug.impact = r.dataset.imp;
      $('#impactSlot').innerHTML = impactFieldHtml();
      wireImpact();
      $('#bugImpact').focus();
    });
  });
}

/* Location plus its tick. Ticked, the field states where the reporter was
   and cannot be edited; unticked, it empties and takes focus, because the
   only reason to untick is to type something else. */
function wireLocation(){
  var here = $('#bugHere');
  if (!here) return;
  $('#bugLoc').addEventListener('input', function(){ draftBug.location = this.value; });
  here.addEventListener('change', function(){
    draftBug.hereNow = here.checked;
    draftBug.location = here.checked ? currentLocation() : '';
    $('#locSlot').innerHTML = locationFieldHtml();
    wireLocation();
    var el = $('#bugHere');
    if (draftBug.hereNow) el.focus();
    else $('#bugLoc').focus();
  });
}

function wireBugForm(){
  paintThumbs();
  wireDropZone();
  wireLocation();
  wireImpact();
  wireSvc();
  /* Typed text goes back into the draft on every keystroke rather than being
     read only at submit — the drawer can be closed at any point, and the
     draft is what survives it. */
  [['bugTitle','title'], ['bugDesc','desc'], ['bugExtra','extra']].forEach(function(pair){
    var el = $('#' + pair[0]);
    if (!el) return;
    el.addEventListener('input', function(){ draftBug[pair[1]] = el.value; });
  });
}

function bugDrawerOpen(){ return !$('#bugLayer').hidden; }

function paintBugDrawer(){
  var box = $('#bugDrawer');

  if (bugSent){
    box.innerHTML =
      '<div class="c-drawer-head">' +
        '<span class="grow"><h4 id="bugDrawerTitle">Report a bug</h4></span>' +
        '<button class="c-icon-btn" type="button" id="bugDrawerClose" aria-label="Close">' +
          '<i class="ph ph-x" aria-hidden="true"></i></button>' +
      '</div>' +
      '<div class="c-drawer-body">' +
        '<div class="drawer-done">' +
          '<i class="ph-fill ph-check-circle drawer-done-icon" aria-hidden="true"></i>' +
          '<h3>Report submitted</h3>' +
          '<p><b>' + esc(bugSent.title) + '</b> is with the tech team. ' +
            'It is filed against ' + esc(bugSent.pod) + '.</p>' +
          /* What happens next, stated. The commonest thing a reporter wants
             after sending is not another screen — it is to know the report
             will not vanish into nothing. */
          '<div class="drawer-next"><ul>' +
            '<li><i class="ph ph-magnifying-glass" aria-hidden="true"></i>' +
              'It gets triaged and picked up by whoever owns ' +
              esc(bugSent.services[0] || 'the affected service') + '.</li>' +
            '<li><i class="ph ph-bell" aria-hidden="true"></i>' +
              'You are notified when someone replies or marks it resolved.</li>' +
            '<li><i class="ph ph-chat-teardrop-text" aria-hidden="true"></i>' +
              'The whole thread lives in My tickets, and you can answer there.</li>' +
          '</ul></div>' +
        '</div>' +
      '</div>' +
      '<div class="c-drawer-foot">' +
        '<button class="c-btn c-btn-ghost c-btn-md" type="button" id="bugAnother">Report another</button>' +
        '<span class="grow"></span>' +
        '<button class="c-btn c-btn-secondary c-btn-md" type="button" id="bugGoMine">View my tickets</button>' +
        /* Primary is the way back to what they were doing. That is the point
           of filing from a drawer, and the button ordering should say so. */
        '<button class="c-btn c-btn-primary c-btn-md" type="button" id="bugDone">Done</button>' +
      '</div>';

    $('#bugDrawerClose').addEventListener('click', closeBugDrawer);
    $('#bugDone').addEventListener('click', closeBugDrawer);
    $('#bugAnother').addEventListener('click', function(){ bugSent = null; paintBugDrawer(); });
    $('#bugGoMine').addEventListener('click', function(){ closeBugDrawer(); go('bugMine'); });
    $('#bugDone').focus();
    return;
  }

  box.innerHTML =
    '<div class="c-drawer-head">' +
      '<span class="grow"><h4 id="bugDrawerTitle">Report a bug</h4></span>' +
      '<button class="c-icon-btn" type="button" id="bugDrawerClose" aria-label="Close">' +
        '<i class="ph ph-x" aria-hidden="true"></i></button>' +
    '</div>' +
    '<div class="c-drawer-body">' + bugFormHtml() + '</div>' +
    /* Submit lives in the foot, not at the end of the fields: this form is
       long enough to scroll, and an action that scrolls away is an action
       people hunt for. */
    '<div class="c-drawer-foot">' +
      '<button class="c-btn c-btn-ghost c-btn-md" type="button" id="bugCancel">Cancel</button>' +
      '<span class="grow"></span>' +
      '<button class="c-btn c-btn-primary c-btn-md" type="button" id="bugSubmit">' +
        '<i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>Submit report</button>' +
    '</div>';

  wireBugForm();
  $('#bugDrawerClose').addEventListener('click', closeBugDrawer);
  $('#bugCancel').addEventListener('click', closeBugDrawer);
  $('#bugSubmit').addEventListener('click', submitBug);
}

function openBugDrawer(){
  var layer = $('#bugLayer');
  bugLastFocus = document.activeElement;
  bugSent = null;
  /* Read before the drawer paints, while the page behind it is still the
     page the reporter was looking at. Only while the tick is on — a reporter
     who has already named somewhere else keeps what they wrote. */
  if (draftBug.hereNow) draftBug.location = currentLocation();
  layer.hidden = false;
  paintBugDrawer();
  void layer.offsetWidth;
  layer.classList.add('is-open');
  /* Focus the first thing the reporter has to write, not the close button —
     the drawer opened because they already decided to file something. */
  var t = $('#bugTitle');
  if (t) t.focus();
}

function closeBugDrawer(){
  var layer = $('#bugLayer');
  var filed = !!bugSent;
  layer.classList.remove('is-open');
  setTimeout(function(){ layer.hidden = true; $('#bugDrawer').innerHTML = ''; bugSent = null; }, 240);
  /* The drawer's commonest opener is a FAB menu item, and that item is gone
     by the time we close — the menu shut behind it. Focusing a detached or
     hidden node drops focus to the body, which is exactly the lost place
     this drawer exists to protect, so it falls back to the button the menu
     belongs to. */
  var back = bugLastFocus;
  if (!back || !back.isConnected || !back.offsetParent) back = $('#fab').hidden ? null : $('#fab');
  if (back && back.focus) back.focus();
  /* A report filed while standing on one of the two bug lists has to appear
     in it — the list behind the drawer was rendered before the ticket
     existed. */
  if (filed && (state.route === 'bugMine' || state.route === 'bugAdmin')) render();
}

/* Repaint only the box that changed, never the grid — repainting the grid on
   every tick would move focus off the checkbox the person just used, and
   would tear down the Other textarea while they were typing in it. */
function paintSvcBox(input){
  var box = input.nextElementSibling;
  box.classList.toggle('on', input.checked);
  box.innerHTML = input.checked ? '<i class="ph ph-check" aria-hidden="true"></i>' : '';
}
function svcChosen(){
  return draftBug.services.length + (draftBug.otherOn && draftBug.other.trim() ? 1 : 0);
}
function wireSvc(){
  $$('[data-svc]').forEach(function(c){
    c.addEventListener('change', function(){
      var sv = SERVICES[+c.dataset.svc];
      var at = draftBug.services.indexOf(sv);
      if (c.checked && at === -1) draftBug.services.push(sv);
      else if (!c.checked && at > -1) draftBug.services.splice(at, 1);
      paintSvcBox(c);
      if (svcChosen()) $('#wrapSvc').classList.remove('c-field-error');
    });
  });

  var other = $('#svcOther');
  other.addEventListener('change', function(){
    draftBug.otherOn = other.checked;
    paintSvcBox(other);
    /* Show or hide the description rather than re-rendering the field, so
       the box the person is about to type into can take focus straight
       away. Unticking clears what was typed: a hidden required field
       holding text nobody can see is how a form blocks on nothing. */
    $('#wrapOther').hidden = !other.checked;
    if (other.checked){
      $('#svcOtherText').focus();
    } else {
      draftBug.other = '';
      $('#svcOtherText').value = '';
      $('#wrapOther').classList.remove('c-field-error');
    }
    if (svcChosen()) $('#wrapSvc').classList.remove('c-field-error');
  });
  $('#svcOtherText').addEventListener('input', function(e){
    draftBug.other = e.target.value;
    if (e.target.value.trim()){
      $('#wrapOther').classList.remove('c-field-error');
      $('#wrapSvc').classList.remove('c-field-error');
    }
  });
}

function paintThumbs(){
  var host = $('#shotThumbs');
  if (!host) return;
  host.innerHTML = draftShots.map(function(s, i){
    return '<span class="thumb"><img src="' + s.url + '" alt="' + esc(s.name) + '" />' +
      '<button class="x" type="button" data-rm="' + i + '" aria-label="Remove ' + esc(s.name) + '">' +
      '<i class="ph ph-x" aria-hidden="true"></i></button></span>';
  }).join('');
  $$('[data-rm]', host).forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation(); draftShots.splice(+b.dataset.rm, 1); paintThumbs();
    });
  });
}

/* One drop-zone wiring, used by both the bug form's Screenshot zone and the
   comment composer's attachment zone: click, keyboard and drag-and-drop all
   funnel into the same accept(). The file input lives inside the zone rather
   than on <body>, so a re-rendered zone takes its input with it instead of
   leaving one orphan per render. */
function wireZone(zone, onImage){
  if (!zone) return;
  var input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.multiple = true; input.style.display = 'none';
  zone.appendChild(input);

  function accept(files){
    [].slice.call(files).filter(function(f){ return /^image\//.test(f.type); }).forEach(function(f){
      var rd = new FileReader();
      rd.onload = function(){ onImage({ name:f.name, url:rd.result }); };
      rd.readAsDataURL(f);
    });
  }
  zone.addEventListener('click', function(e){ if (e.target !== input) input.click(); });
  zone.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); input.click(); }
  });
  input.addEventListener('change', function(){ accept(input.files); input.value = ''; });
  ['dragenter','dragover'].forEach(function(ev){
    zone.addEventListener(ev, function(e){ e.preventDefault(); zone.classList.add('dragover'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    zone.addEventListener(ev, function(e){ e.preventDefault(); zone.classList.remove('dragover'); });
  });
  zone.addEventListener('drop', function(e){ accept(e.dataTransfer.files); });
}
function wireDropZone(){
  wireZone($('#dropZone'), function(img){ draftShots.push(img); paintThumbs(); });
}


function submitBug(){
  var t = $('#bugTitle'), d = $('#bugDesc'), ok = true, firstBad = null;

  function fail(wrapSel, msg){
    ok = false;
    var wrap = $(wrapSel);
    wrap.classList.add('c-field-error');
    var h = $('.c-helper', wrap);
    if (h) h.textContent = msg;
    else wrap.insertAdjacentHTML('beforeend', '<span class="c-helper">' + esc(msg) + '</span>');
    if (!firstBad) firstBad = wrap;
  }

  [[t, '#wrapTitle'], [d, '#wrapDesc']].forEach(function(pair){
    var bad = !pair[0].value.trim();
    $(pair[1]).classList.toggle('c-field-error', bad);
    if (bad) fail(pair[1], 'This field is required.');
  });
  /* Affected services is required for the same reason it is a fixed list
     rather than free text: it is what routes the report. A ticket with no
     service on it is a ticket with no owner. */
  if (!svcChosen()) fail('#wrapSvc', 'Choose at least one affected service.');
  /* Impact has no default on purpose, so it has to be caught here rather
     than quietly shipping whatever the middle option happened to be. */
  if (!draftBug.impact) fail('#wrapImpact', 'Choose how much this is holding work up.');
  if (!(draftBug.hereNow ? currentLocation() : $('#bugLoc').value.trim()))
    fail('#wrapLoc', 'Say which screen this happens on.');
  /* Other ticked and nothing written is worse than Other not ticked: it
     claims a service the report never names. */
  if (draftBug.otherOn && !draftBug.other.trim()){
    fail('#wrapOther', 'Describe the service, or untick Other.');
  }

  if (!ok){
    var focusTarget = firstBad === $('#wrapSvc') ? $('[data-svc]') : $('input, textarea', firstBad);
    if (focusTarget) focusTarget.focus();
    toast('Fill in the required fields before submitting');
    return;
  }

  /* Reporter and pod are still on every ticket — they were never questions,
     only fields, and the answers were already in the session. Priority
     arrives as nothing at all rather than as a default: seeding it at the
     middle would have made every new ticket look triaged, and a queue where
     P3 means both "judged to be medium" and "nobody has looked yet" cannot
     be sorted or trusted. The team sets it on the record. */
  BUGS.unshift({ id:'b' + (BUGS.length + 1), at:new Date(NOW), who:ME.name,
    pod:ME.pods[0], status:'new',
    priority:null,
    impact:draftBug.impact,
    location:draftBug.hereNow ? currentLocation() : $('#bugLoc').value.trim(),
    /* The described service joins the list as a service, prefixed so the
       team can see it came from Other rather than the fixed set. */
    services:draftBug.services.concat(
      draftBug.otherOn && draftBug.other.trim() ? ['Other — ' + draftBug.other.trim()] : []),
    assignee:null, resolution:'',
    title:t.value.trim(), desc:d.value.trim(), extra:$('#bugExtra').value.trim(),
    shots:draftShots.map(function(s){ return s.url; }),
    comments:[] });
  draftShots = [];
  draftBug = { impact:'', location:'', hereNow:true, services:[], otherOn:false, other:'', title:'', desc:'', extra:'' };
  /* The drawer stays open and swaps to a confirmation rather than throwing
     the reporter onto a list they did not ask for. A toast would have said
     the same thing and then taken itself away — this is the one moment the
     reporter needs to be told what happens next, and it waits to be read. */
  bugSent = BUGS[0];
  paintBugDrawer();
  $('#bugDrawer .c-drawer-body').scrollTop = 0;
}

/* ==========================================================================
   Bug report — the reporter's own tickets
   Same records as the admin table, read by the person who filed them: no
   triage controls, but every field the team has set on the ticket, the full
   comment thread, and a reply box. A ticket whose thread ends on an
   unanswered question from the team is flagged here, because answering it
   is the one thing only the reporter can do.
   ========================================================================== */
function myBugs(){
  return BUGS.filter(function(b){ return b.who === ME.name; })
             .sort(function(a, b){ return lastActivity(b) - lastActivity(a); });
}

    /* A real Table rather than a list of rows: the three trailing values are
       columns of the same kind read down the page, and columns of the same

    (shown.length
      ? '<div class="c-table-standalone-wrap c-table-scroll-x">' +

        shown.map(function(b){

          var n = (b.comments || []).length;

              '" data-mine="' + b.id + '" tabindex="0">' +
            '<td><span class="td-stack" style="gap:2px">' +
              '<span class="mine-title">' + esc(b.title) + '</span>' +
              '<span class="mine-meta">' +
                '<span>' + esc(b.pod) + '</span><span aria-hidden="true">·</span>' +
                '<span>Reported ' + fmtDate(b.at) + '</span>' +
                '<span aria-hidden="true">·</span>' +
                '<span>' + (b.assignee ? esc(b.assignee) : 'Not assigned yet') + '</span>' +
                (n ? '<span aria-hidden="true">·</span><span><i class="ph ph-chat-circle" aria-hidden="true"></i> ' + n + '</span>' : '') +

            '</span></td>' +

          '</tr>';
        }).join('') +
        '</tbody></table></div>'
      /* Two different empty states: an author who has filed nothing needs
         the call to action, an author whose filter matched nothing needs

      : mine.length
        ? '<div class="c-empty is-section">' +
            '<i class="ph ph-magnifying-glass" aria-hidden="true"></i><h4>No reports match</h4>' +
            '<p>Nothing in your tickets matches the filters you have set.</p>' +

              'Clear filters</button></div>' +
          '</div>'
        : '<div class="c-empty is-section">' +
            '<i class="ph ph-bug" aria-hidden="true"></i><h4>You have not reported anything yet</h4>' +
            '<p>When something breaks, send it here with a screenshot and the tech team picks it up from this same record.</p>' +
            '<div class="c-empty-actions"><button class="c-btn c-btn-primary c-btn-md" type="button" id="emptyNewBug">' +
              '<i class="ph ph-plus"></i>Report a bug</button></div>' +
          '</div>');

  wireBugSeg($('#routeBugMine'), 'mine');
  wireBugControls($('#routeBugMine'), renderBugMine);

  if ($('#clearBugFilters')) $('#clearBugFilters').addEventListener('click', function(){

  });

  var ids = shown.map(function(b){ return b.id; });
  $$('[data-mine]').forEach(function(tr){
    function open(){ openRecord(ids, ids.indexOf(tr.dataset.mine), 'user'); }
    tr.addEventListener('click', open);
    tr.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }

}

/* ==========================================================================
   Bug report — admin view
   ========================================================================== */
function renderBugAdmin(){
  $('#routeBugAdmin').hidden = false;
  setHeader('Bug Reports', 'Every report submitted across the pods.',
    '<button class="c-btn c-btn-primary c-btn-md" type="button" id="reportBug"><i class="ph ph-plus"></i>Report a bug</button>');
  setBack('Feedback', 'landing');
  $('#reportBug').addEventListener('click', openBugDrawer);

  var pods = podsWithReports();

  $('#routeBugAdmin').innerHTML =
    bugSegHtml('') +
    bugFilterRow('admin', BUGS,
      /* .dd-float — without it the panel is position:static and opening this
         filter pushes the entire table down by the panel's own height, which
         is the one thing a filter sitting above a table must not do. */
      /* Multiple select, not Single: a triage queue is read pod by pod but
         also two pods at a time — "everything my two teams own" was three
         passes through a single select and no way to see them together.
         Select All is the component's own documented affordance for the
         opposite move, clearing back to the whole workspace in one tick
         rather than one per pod. */
      '<div class="c-field c-dropdown-multi-field dd-float" style="width:200px">' +
        '<div class="input-wrap has-trailing-icon">' +
          '<input type="text" class="c-dropdown-multi-input" id="podTrigger" readonly value="' +
            esc(podFilterLabel(pods)) + '" aria-label="Filter by pod"' +
            ' aria-haspopup="listbox" aria-expanded="false" />' +
          '<span class="icon-trailing" aria-hidden="true"><i class="ph ph-caret-down c-dropdown-multi-chevron"></i></span>' +
        '</div>' +
        '<div class="c-dropdown-multi-panel" id="podPanel" hidden>' +
          '<div class="c-dropdown-multi-list">' +
            /* Select All is a real checkbox so it can sit Indeterminate
               while the list is partly ticked — the component's own rule,
               and the only honest state for "some of them". */
            '<label class="c-dropdown-option select-all">' +
              '<input type="checkbox" id="podAll"' + (state.bugPods.length === pods.length ? ' checked' : '') + ' />' +
              podAllBox(pods) +
              '<span class="c-dropdown-option-label">Select All</span>' +
              '<span class="c-dropdown-option-desc">' + pods.length + ' pods</span>' +
            '</label>' +
            '<div class="c-dropdown-multi-divider"></div>' +
            pods.map(function(p){
              var on = state.bugPods.indexOf(p) > -1;
              return '<label class="c-dropdown-option">' +
                '<input type="checkbox" data-pod="' + esc(p) + '"' + (on ? ' checked' : '') + ' />' +
                '<span class="c-checkbox-box' + (on ? ' on' : '') + '">' +
                  (on ? '<i class="ph ph-check" aria-hidden="true"></i>' : '') + '</span>' +
                '<span class="c-dropdown-option-label">' + esc(p) + '</span>' +
                '<span class="c-dropdown-option-desc">' +
                  BUGS.filter(function(b){ return b.pod === p; }).length + '</span>' +
              '</label>';
            }).join('') +
          '</div>' +
        '</div>' +
      '</div>') +
    '<div class="c-table-standalone-wrap c-table-scroll-x"><table class="c-table c-table-standalone"><thead><tr>' +
      BUG_COLS.map(bugSortTh).join('') +
    '</tr></thead><tbody id="bugRows"></tbody></table></div>';

  wireBugSeg($('#routeBugAdmin'), 'admin');
  /* Scoped to this route. The unscoped lookup this replaces matched My
     tickets' chips too, because both routes stay in the document — the
     same duplicate-node trap bugSegHtml's own comment warns about. */
  wireBugControls($('#routeBugAdmin'), renderBugAdmin);
  /* Unsorted -> ascending -> descending -> unsorted, and picking a new
     column clears the old one. Enter and Space do what the click does. */
  $$('[data-bugcol]', $('#routeBugAdmin')).forEach(function(th){
    function cycle(){
      var k = th.dataset.bugcol;
      if (state.bugSortCol !== k){ state.bugSortCol = k; state.bugSortDir = 1; }
      else if (state.bugSortDir === 1){ state.bugSortDir = -1; }
      else { state.bugSortCol = null; }
      renderBugAdmin();
      var back = $('[data-bugcol="' + k + '"]', $('#routeBugAdmin'));
      if (back) back.focus();
    }
    th.addEventListener('click', cycle);
    th.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); cycle(); }
    });
  });

  /* Pod filter — Dropdown's Multiple select with Select All, wired for real. */
  var trig = $('#podTrigger'), panel = $('#podPanel'), field = trig.closest('.c-dropdown-multi-field');
  trig.addEventListener('click', function(e){
    e.stopPropagation();
    var open = panel.hidden;
    closeDropdowns();
    panel.hidden = !open;
    field.classList.toggle('open', open);
    trig.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  /* Ticking must not shut the panel — the whole point of a multiple select
     is picking more than one thing — so the panel swallows its own clicks
     rather than letting them reach the document-level closer. */
  panel.addEventListener('click', function(e){ e.stopPropagation(); });

  /* Patched in place, never re-rendered: re-rendering the route would tear
     the open panel down under the reader's cursor on the first tick. Only
     the boxes, the trigger's label and the table itself change. */
  function syncPods(){
    $$('[data-pod]', panel).forEach(function(c){
      var on = state.bugPods.indexOf(c.dataset.pod) > -1;
      c.checked = on;
      var box = c.nextElementSibling;
      box.classList.toggle('on', on);
      box.innerHTML = on ? '<i class="ph ph-check" aria-hidden="true"></i>' : '';
    });
    var all = $('#podAll', panel);
    all.checked = state.bugPods.length === pods.length;
    var allBox = all.nextElementSibling;
    allBox.classList.toggle('on', state.bugPods.length > 0);
    allBox.innerHTML = state.bugPods.length === pods.length
      ? '<i class="ph ph-check" aria-hidden="true"></i>'
      : state.bugPods.length ? '<i class="ph ph-minus" aria-hidden="true"></i>' : '';
    trig.value = podFilterLabel(pods);
    paintBugRows();
  }

  $$('[data-pod]', panel).forEach(function(c){
    c.addEventListener('change', function(){
      var p = c.dataset.pod, at = state.bugPods.indexOf(p);
      if (at > -1) state.bugPods.splice(at, 1); else state.bugPods.push(p);
      syncPods();
    });
  });
  $('#podAll', panel).addEventListener('change', function(){
    state.bugPods = this.checked ? pods.slice() : [];
    syncPods();
  });

  paintBugRows();
}

/* The pods that actually have reports against them. A filter listing a pod
   with nothing in it is a row that can only ever empty the table. */
function podsWithReports(){
  return PODS.filter(function(p){
    return BUGS.some(function(b){ return b.pod === p; });
  });
}
/* Reads as the answer to "what am I looking at", not as a count of ticks:
   none and all are both the whole workspace, one names the pod, and past
   that the number is what fits in a 200px trigger. */
function podFilterLabel(pods){
  var n = state.bugPods.length;
  if (n === 0 || n === pods.length) return 'All pods';
  if (n === 1) return state.bugPods[0];
  return n + ' pods';
}
function podAllBox(pods){
  var n = state.bugPods.length;
  return '<span class="c-checkbox-box' + (n ? ' on' : '') + '">' +
    (n === pods.length ? '<i class="ph ph-check" aria-hidden="true"></i>'
      : n ? '<i class="ph ph-minus" aria-hidden="true"></i>' : '') + '</span>';
}

/* The pod filter is a Multiple select, and closeDropdowns only sweeps the
   single-select panel class — deliberately, because the Share modal runs its
   own Multiple select and a blanket sweep would shut it mid-pick. So this
   one panel is closed by name, from the same single document-level handler
   everything else uses rather than a listener added per render. */
function closePodFilter(){
  var panel = $('#podPanel');
  if (!panel || panel.hidden) return;
  panel.hidden = true;
  var field = panel.closest('.c-dropdown-multi-field');
  if (field) field.classList.remove('open');
  var trig = $('#podTrigger');
  if (trig) trig.setAttribute('aria-expanded', 'false');
}

function bugChipLabel(k){
  if (k === 'all') return 'All';
  if (THREAD_STATE[k]) return THREAD_STATE[k].admin;
  return BUG_STATUS[k].label;
}
function matchesBugChip(b, k){
  if (k === 'all') return true;
  if (THREAD_STATE[k]) return threadState(b) === k;
  return b.status === k;
}
function bugChip(k, pool){
  /* Counted against the list this chip actually filters. On My tickets a
     chip reading the whole workspace's total would contradict the rows
     underneath it — the same reason the survey library counts its chips
     against the current query rather than the library. */
  var n = (pool || BUGS).filter(function(b){ return matchesBugChip(b, k); }).length;
  return '<button class="c-chip c-chip-filter' + (state.bugStatus === k ? ' is-active' : '') +
    '" type="button" data-bs="' + k + '">' + esc(bugChipLabel(k)) +
    ' <span class="count">' + n + '</span></button>';
}

/* Sorting — Table's own documented behaviour: every eligible column sortable,
   one active sort at a time, cycling unsorted -> ascending -> descending.
   The old Submitted control was a ghost button in the header cell, which is
   a second recipe for something the component already specifies.
   Each column declares what it sorts on rather than sorting the rendered
   cell: Priority reads P1..P4 as 1..4, so ascending is most urgent first,
   and Status reads the handover before the workflow state, because that is
   what the cell actually shows. */
var BUG_COLS = [
  { key:'date',     label:'Submitted',   num:true,  val:function(b){ return b.at.getTime(); } },
  { key:'who',      label:'Reported by', num:false, val:function(b){ return b.who; } },
  { key:'pod',      label:'Pod',         num:false, val:function(b){ return b.pod; } },
  /* Untriaged sorts past P4 in both directions' sense of the ramp: sorting
     by severity should not put the tickets that have no severity at the
     urgent end of it. Finding them is the New status chip's job. */
  { key:'priority', label:'Priority',    num:true,
    val:function(b){ return b.priority ? PRIO_ORDER.indexOf(b.priority) : PRIO_ORDER.length; } },
  { key:'title',    label:'Title',       num:false, val:function(b){ return b.title; } },
  { key:'assignee', label:'Assigned to', num:false, val:function(b){ return b.assignee || '\uffff'; } },
  { key:'status',   label:'Status',      num:true,  val:function(b){
      var t = threadState(b);
      if (t === 'awaiting') return 0;
      if (t === 'replied')  return 1;
      return { 'new':2, 'progress':3, 'resolved':4 }[b.status];
    } },
  { key:'comments', label:'Comments',    num:true,  val:function(b){ return (b.comments || []).length; } }
];
function bugCol(key){
  return BUG_COLS.filter(function(c){ return c.key === key; })[0];
}
function bugSortTh(c){
  var on = state.bugSortCol === c.key;
  var icon = !on ? 'ph-arrows-down-up' : (state.bugSortDir === 1 ? 'ph-arrow-up' : 'ph-arrow-down');
  return '<th class="c-table-sort-th' + (on ? ' is-sorted' : '') + '" data-bugcol="' + c.key + '"' +
    ' tabindex="0" role="columnheader" aria-sort="' +
    (on ? (state.bugSortDir === 1 ? 'ascending' : 'descending') : 'none') + '">' +
    esc(c.label) + '<i class="ph ' + icon + ' c-table-sort-icon" aria-hidden="true"></i></th>';
}

function filteredBugs(){
  var ts = terms(state.bugQuery);
  var list = BUGS.filter(function(b){
    return matchesBugChip(b, state.bugStatus)
        /* Nothing ticked reads as no filter rather than as no pods — an
           empty selection is where this control starts, and a table that
           begins empty teaches nobody anything. */
        && (!state.bugPods.length || state.bugPods.indexOf(b.pod) > -1)
        && matchAll(bugHaystack(b), ts);
  });
  var c = bugCol(state.bugSortCol);
  if (!c) return list;                       /* unsorted — the order they were filed in */
  var dir = state.bugSortDir;
  return list.sort(function(x, y){
    var a = c.val(x), b = c.val(y);
    if (c.num) return (a - b) * dir;
    return String(a).localeCompare(String(b)) * dir;
  });
}

function paintBugRows(){
  var rows = filteredBugs(), tb = $('#bugRows');
  if (!rows.length){
    tb.innerHTML = '<tr><td colspan="8"><div class="c-empty is-inline" style="align-items:center;text-align:center;max-width:none">' +
      '<i class="ph ph-bug" aria-hidden="true"></i><h4>No reports match</h4>' +
      '<p>Try a different status or pod.</p></div></td></tr>';
    return;
  }
  var ids = rows.map(function(b){ return b.id; });
  tb.innerHTML = rows.map(function(b){
    var t = threadState(b);
    return '<tr class="is-interactive is-clickable" data-bug="' + b.id + '" tabindex="0">' +
      '<td style="white-space:nowrap">' + fmtDateTime(b.at) + '</td>' +
      /* Name and pod are two columns, and neither carries an avatar. A
         32px disc per row is 11 discs down the page saying nothing the name
         does not already say, and it cost the width that the pod column
         now uses. Both columns sort. */
      '<td style="white-space:nowrap;font-weight:700">' + esc(b.who) + '</td>' +
      '<td style="white-space:nowrap">' + esc(b.pod) + '</td>' +
      '<td>' + prioPill(b.priority, true) + '</td>' +
      /* Title only. Attachments are a detail of the report, not something
         triage sorts or scans on, and the record modal shows them all
         properly the moment the row is opened. */
      '<td>' + esc(b.title) + '</td>' +
      '<td style="white-space:nowrap">' + (b.assignee
        ? esc(b.assignee)
        : '<span class="muted">Unassigned</span>') + '</td>' +
      /* Whose turn it is *is* the status here, not a note attached to one —
         a waiting ticket reads as one badge, the same as every other row.
         The workflow status is still on the record itself, where it is
         editable; repeating it under the badge only made the cell two lines
         tall and gave the column two answers to one question. */
      '<td>' + (t
        ? threadBadge(b, 'admin')
        : '<span class="c-badge ' + BUG_STATUS[b.status].badge + '">' + BUG_STATUS[b.status].label + '</span>') + '</td>' +
      '<td>' + cmtPill(b) + '</td>' +
    '</tr>';
  }).join('');

  $$('#bugRows tr[data-bug]').forEach(function(tr){
    function open(){ openRecord(ids, ids.indexOf(tr.dataset.bug), 'admin'); }
    tr.addEventListener('click', open);
    tr.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
    });
  });
}

/* ==========================================================================
   Share modal — Add users
   Built entirely out of components: Modal for the dialog, Dropdown's
   Multiple select for the people picker, Dropdown's Single select for every
   role and access control, and Banner for the publish notice. The only new
   things are the layer it mounts in and the access-row layout.
   ========================================================================== */
var ROLES = { editor:'Editor', responder:'Responder' };
var EDITOR_ACCESS = {
  restricted:{ label:'Restricted', desc:'Only the people listed above can open the builder' },
  link:      { label:'Anyone with the link', desc:'Anyone inside Collabrium with the link can edit' }
};
var RESPONDER_ACCESS = {
  link:  { label:'Anyone with the link', desc:'Anyone with the link can answer the survey' },
  none:  { label:'Remove link', desc:'The share link stops working; only invited responders can answer' }
};

/* Who a survey can be shared with, and who it is already shared with. Seeded
   per form on first open so the modal has real content to show. */
function shareStateFor(f){
  if (!f.share){
    f.share = {
      people: [
        { name:ME.name, role:'owner' },
        { name:'Nurul Kamal', role:'editor' },
        { name:'Priya Nair',  role:'responder' }
      ],
      editorAccess: 'restricted',
      responderAccess: 'link',
      picked: [],
      pickRole: 'responder'
    };
  }
  return f.share;
}
function shareCandidates(f){
  var have = shareStateFor(f).people.map(function(p){ return p.name; });
  return PEOPLE.concat(TECH).filter(function(n){ return have.indexOf(n) === -1; })
               .sort(function(a, b){ return a.localeCompare(b); });
}

/* Confirm dialog. One generic implementation rather than a bespoke panel
   per destructive action — the only things that vary are the sentence and
   the verb on the button. role="alertdialog" rather than "dialog": this
   interrupts to ask about consequences, which is the case that role exists
   for, and it makes the description part of the announcement.
   Escape and the scrim both cancel; nothing here destroys on a stray click
   because the confirming button is the only path forward. */
var confirmLastFocus = null;
var confirmAction = null;
function confirmOpen(){ return !$('#confirmLayer').hidden; }
function closeConfirm(){
  var layer = $('#confirmLayer');
  layer.classList.remove('is-open');
  setTimeout(function(){ layer.hidden = true; $('#confirmBox').innerHTML = ''; }, 240);
  confirmAction = null;
  if (confirmLastFocus && confirmLastFocus.focus) confirmLastFocus.focus();
}
function askConfirm(opts){
  confirmLastFocus = document.activeElement;
  confirmAction = opts.onConfirm;
  var layer = $('#confirmLayer');
  layer.hidden = false;
  $('#confirmBox').innerHTML =
    '<div class="c-modal-head">' +
      '<h4 id="confirmTitle">' + esc(opts.title) + '</h4>' +
      '<button class="c-icon-btn" type="button" id="confirmClose" aria-label="Cancel">' +
        '<i class="ph ph-x" aria-hidden="true"></i></button>' +
    '</div>' +
    '<div class="c-modal-body" id="confirmBody">' + opts.body + '</div>' +
    '<div class="c-modal-foot">' +
      '<button class="c-btn c-btn-secondary c-btn-md" type="button" id="confirmCancel">Cancel</button>' +
      /* No .c-btn-danger exists in this system — components.css calls that
         out as a real gap and hands destructive buttons the established
         workaround instead: Ghost/Secondary plus a scoped --color-red
         override, the recipe .c-permission-prompt-deny and Table's bulk
         danger action both already use. Inventing a filled red Button
         variant here would be inventing a component in a prototype. */
      '<button class="c-btn c-btn-secondary c-btn-md is-danger" type="button" id="confirmGo">' +
        esc(opts.confirmLabel || 'Delete') + '</button>' +
    '</div>';
  void layer.offsetWidth;
  layer.classList.add('is-open');
  /* Focus lands on Cancel, not on the destructive button — a stray Enter
     from the keystroke that opened this should not complete the deletion. */
  $('#confirmCancel').focus();
  $('#confirmClose').addEventListener('click', closeConfirm);
  $('#confirmCancel').addEventListener('click', closeConfirm);
  $('#confirmGo').addEventListener('click', function(){
    var run = confirmAction;
    closeConfirm();
    if (run) run();
  });
}
$('#confirmLayer').addEventListener('click', function(e){ if (e.target === this) closeConfirm(); });
$('#liveLayer').addEventListener('click', function(e){ if (e.target === this) closePublished(); });
$('#sendLayer').addEventListener('click', function(e){ if (e.target === this) closeSend(); });
$('#bugLayer').addEventListener('click', function(e){ if (e.target === this) closeBugDrawer(); });

function openShare(f){
  var layer = $('#shareLayer');
  shareLastFocus = document.activeElement;
  layer.hidden = false;
  paintShare(f);
  void layer.offsetWidth;
  layer.classList.add('is-open');
  var c = $('#shareClose');
  if (c) c.focus();
}
var shareLastFocus = null;
function closeShare(){
  var layer = $('#shareLayer');
  layer.classList.remove('is-open');
  setTimeout(function(){ layer.hidden = true; $('#share').innerHTML = ''; }, 240);
  if (shareLastFocus && shareLastFocus.focus) shareLastFocus.focus();
}
function shareOpen(){ return !$('#shareLayer').hidden; }

/* Single select, in the shape this modal needs: a labelled trigger over a
   floating panel of plain rows. No descriptions in the panel — the row the
   reader lands on already has its description on the page, under "Editor
   view" / "Responder view", and it updates with the selection. Printing the
   same sentence twice makes the picker a wall of text to scan through for
   two options. */
function accessSelect(id, map, current, label){
  return '<div class="c-field c-dropdown-field dd-float align-right" style="width:230px">' +
    '<div class="input-wrap has-trailing-icon">' +
      '<input type="text" class="c-dropdown-input" id="' + id + '" readonly value="' + esc(map[current].label) + '"' +
        ' aria-label="' + esc(label) + '" aria-haspopup="listbox" aria-expanded="false" />' +
      '<span class="icon-trailing" aria-hidden="true"><i class="ph ph-caret-down c-dropdown-chevron"></i></span>' +
    '</div>' +
    '<div class="c-dropdown-panel" data-panelfor="' + id + '" hidden><div class="c-dropdown-list">' +
      Object.keys(map).map(function(k){
        return '<div class="c-dropdown-row' + (current === k ? ' selected' : '') + '" role="option" data-' + id + '="' + k + '">' +
          '<span class="c-dropdown-row-label">' + esc(map[k].label) + '</span>' +
          '<i class="ph ph-check c-dropdown-row-check" aria-hidden="true"></i></div>';
      }).join('') +
    '</div></div>' +
  '</div>';
}

function paintShare(f){
  var sh = shareStateFor(f);
  var cands = shareCandidates(f);
  var allPicked = cands.length > 0 && sh.picked.length >= cands.length;
  /* Owner first, then everyone else in the order they were added — the
     person who owns the survey is the one fact in this list that cannot be
     changed here, so it is stated once, at the top. */
  var people = sh.people.slice().sort(function(a, b){
    return (a.role === 'owner' ? 0 : 1) - (b.role === 'owner' ? 0 : 1);
  });

  $('#share').innerHTML =
    '<div class="c-modal-head">' +
      '<h4 id="shareTitle">Share &ldquo;' + esc(f.title) + '&rdquo;</h4>' +
      '<button class="c-icon-btn" type="button" id="shareClose" aria-label="Close"><i class="ph ph-x" aria-hidden="true"></i></button>' +
    '</div>' +

    '<div class="c-modal-body">' +
      /* Add row: who, then as what. Multiple select for the people because
         inviting one person at a time is the common case done badly. */
      '<div class="share-add">' +
        '<div class="c-field c-dropdown-multi-field dd-float grow" style="width:auto">' +
          '<div class="input-wrap has-trailing-icon">' +
            '<input type="text" class="c-dropdown-multi-input" id="shareWho" readonly' +
              ' placeholder="Add people" value="' +
              (sh.picked.length ? sh.picked.length + ' selected' : '') + '"' +
              ' aria-label="Add people" aria-haspopup="listbox" aria-expanded="false" />' +
            '<span class="icon-trailing" aria-hidden="true"><i class="ph ph-caret-down c-dropdown-multi-chevron"></i></span>' +
          '</div>' +
          '<div class="c-dropdown-multi-panel" id="shareWhoPanel" hidden>' +
            '<div class="c-dropdown-multi-list">' +
              (cands.length
                /* Select All — Multiple select's own documented behaviour,
                   pinned above the list behind a divider. Opening a survey
                   to the whole platform is one tick, not one per person, and
                   it is a real checkbox so it can sit at Indeterminate while
                   the list is partly ticked. */
                ? '<label class="c-dropdown-option select-all">' +
                    '<input type="checkbox" id="sharePickAll"' + (allPicked ? ' checked' : '') + ' />' +
                    '<span class="c-checkbox-box' + (sh.picked.length ? ' on' : '') + '">' +
                      (allPicked ? '<i class="ph ph-check" aria-hidden="true"></i>'
                        : sh.picked.length ? '<i class="ph ph-minus" aria-hidden="true"></i>' : '') + '</span>' +
                    '<span class="c-dropdown-option-label">Select All</span>' +
                    '<span class="c-dropdown-option-desc">' + cands.length + ' people</span>' +
                  '</label>' +
                  '<div class="c-dropdown-multi-divider"></div>' +
                  cands.map(function(n){
                    var on = sh.picked.indexOf(n) > -1;
                    return '<label class="c-dropdown-option"><input type="checkbox" data-sharepick="' + esc(n) + '"' + (on ? ' checked' : '') + ' />' +
                      '<span class="c-checkbox-box' + (on ? ' on' : '') + '">' + (on ? '<i class="ph ph-check" aria-hidden="true"></i>' : '') + '</span>' +
                      '<i class="c-dropdown-option-media is-avatar" aria-hidden="true">' + esc(initials(n)) + '</i>' +
                      '<span class="c-dropdown-option-label">' + esc(n) + '</span></label>';
                  }).join('')
                : '<div class="c-dropdown-empty"><i class="ph ph-users" aria-hidden="true"></i>' +
                  '<span>Everyone already has access.</span></div>') +
            '</div>' +
            '<div class="c-dropdown-multi-footer">' +
              '<button type="button" class="clear" data-shareclear>Clear</button>' +
              '<button type="button" class="done" data-sharedone>Done</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="c-field c-dropdown-field dd-float align-right" style="width:150px">' +
          '<div class="input-wrap has-trailing-icon">' +
            '<input type="text" class="c-dropdown-input" id="shareRole" readonly value="' + ROLES[sh.pickRole] + '"' +
              ' aria-label="Role for the people being added" aria-haspopup="listbox" aria-expanded="false" />' +
            '<span class="icon-trailing" aria-hidden="true"><i class="ph ph-caret-down c-dropdown-chevron"></i></span>' +
          '</div>' +
          '<div class="c-dropdown-panel" data-panelfor="shareRole" hidden><div class="c-dropdown-list">' +
            Object.keys(ROLES).map(function(k){
              return '<div class="c-dropdown-row' + (sh.pickRole === k ? ' selected' : '') + '" role="option" data-pickrole="' + k + '">' +
                '<span class="c-dropdown-row-label">' + ROLES[k] + '</span>' +
                '<i class="ph ph-check c-dropdown-row-check" aria-hidden="true"></i></div>';
            }).join('') +
          '</div></div>' +
        '</div>' +
        '<button class="c-btn c-btn-primary c-btn-md" type="button" id="shareInvite"' +
          (sh.picked.length ? '' : ' disabled') + '>Invite</button>' +
