/* Slider fill. Not a documented override — Slider's spec calls Obsidian
   "the value-committed color" — but a track fill is the same class of
   indicator as Progress's, and leaving one of the two dark would read as a
   bug rather than a rule. Flagged as a departure rather than done quietly.
   The thumb keeps its Obsidian border: #FFA425 on white measures 1.87:1,
   under the 3:1 floor for a non-text boundary. */
.c-modal.is-preview .c-slider-fill{background:var(--form-accent);}
/* Selected circle takes the accent, and its text flips to Neutral-9 —
   white on Amber measures 2.13:1 against Neutral-9's 10.10:1, the same
   reason Badge Warning pairs an amber tint with dark text. Dark text still
   clears the floor on the four darker elements. */
.c-modal.is-preview .c-scale-opt input:checked + span{background:var(--form-accent); border-color:var(--form-accent); color:var(--color-neutral-9);}
/* Three things deliberately do not read it. Radio, Checkbox and the rating
   table's cells keep Obsidian, because a chosen option is a value and not a
   department — the accent classifies the survey, it does not restate every
   answer inside it. Submit keeps it too: Obsidian is the only primary-
   action colour in this system. And the star's fill is the entire signal
   with no text inside it to carry the state, so it cannot take a colour
   that measures 1.87:1 against the card it sits on. */
/* Submit sits where the reader's eye lands at the end of a form: the same
   end of the row as the modal's own footer actions, directly under the last
   question's own controls. */
.prev-submit{justify-content:flex-end;}
.prev-title{margin:0; font-size:var(--text-h4-size); line-height:var(--text-h4-lh); font-weight:var(--text-h4-weight); color:var(--color-neutral-9); overflow-wrap:anywhere;}
.prev-desc{margin:0; font-size:var(--text-body2-size); line-height:var(--text-body2-lh); color:var(--color-neutral-5); white-space:pre-wrap;}
/* The number is a hanging indent, never the first word of the question. A
   title that runs past one line wraps back to its own first letter, so the
   left column holds the number and nothing else — "Compared" and "work
   faster" start at the same x. Grid rather than text-indent because the
   column has to be exactly as wide as the number is, and "10." is not the
   same width as "1.". The asterisk stays inside the text column so it
   trails the last word instead of becoming a third column. */
.prev-q-title{display:grid; grid-template-columns:auto 1fr; column-gap:var(--spacing-4); font-size:var(--text-body1-size); line-height:var(--text-body1-lh); font-weight:700; color:var(--color-neutral-9);}
.prev-q-title > .num{font-variant-numeric:tabular-nums;}
.prev-q-title > .txt{min-width:0; overflow-wrap:anywhere;}
.prev-req{color:var(--color-red); margin-left:var(--spacing-4);}
/* Leading the legend rather than trailing a title: the marker comes first
   there, so the space goes on the other side. */
.prev-req.lead{margin-left:0; margin-right:var(--spacing-4);}
/* The legend is a key to the asterisks above it, not a third line of the
   description — Card's own Footer sub-part (hairline above, caption,
   Neutral-5) gives it that job. Restated at this specificity because
   .c-card p (0,1,1) sets body2 and beats .c-card-footer (0,1,0) — the trap
   components.css documents twice for exactly this reason. */
.prev-head > .c-card-footer{margin:var(--spacing-8) 0 0; padding-top:var(--spacing-12);
  font-size:var(--text-caption-size); line-height:var(--text-caption-lh); color:var(--color-neutral-5);}
/* Slider's own optional static value label — caption/Neutral-9, right
   aligned above the rail's end. It is used instead of the drag tooltip
   (the component documents the two as mutually exclusive) because a survey
   answer has to be readable at rest, not only while a thumb is held. */
.slider-value{display:block; text-align:right; font-family:var(--font-primary); font-size:var(--text-caption-size); line-height:var(--text-caption-lh); font-weight:700; color:var(--color-neutral-9); margin-bottom:var(--spacing-4); font-variant-numeric:tabular-nums;}
.slider-value.is-unset{font-weight:400; color:var(--color-neutral-5);}
/* Unanswered. A range input always draws a thumb somewhere, so it sits at
   the midpoint — but nothing has been committed yet, so the track stays
   unfilled and the thumb takes a Neutral-4 outline instead of Obsidian's
   "the value is here". Otherwise an untouched required question reads as
   though it has already been answered 50. */
.c-slider-rail.is-unset .c-slider-input::-webkit-slider-thumb{border-color:var(--color-neutral-4);}
.c-slider-rail.is-unset .c-slider-input::-moz-range-thumb{border-color:var(--color-neutral-4);}
/* A missed required answer marks the whole card. The controls underneath are
   radio rows and scale tracks — there is no single field border to redden,
   and reddening every radio in a group would read as ten errors, not one. */
.prev-q.is-missing{border-color:var(--color-red);}
.prev-miss{display:flex; align-items:center; gap:var(--spacing-4); font-size:var(--text-caption-size); line-height:var(--text-caption-lh); font-weight:700; color:var(--color-red);}
.prev-miss i{font-size:var(--icon-sm);}
/* The confirmation matches feedback-user.html's .done-card exactly — 44px
   tick, h3 heading, card holding only the message, actions in their own row
   underneath. The preview's whole claim is that it shows what a responder
   sees, so where the two disagreed the responder page was the one that was
   right. */
.prev-done{align-items:flex-start; text-align:left;}
.prev-done-icon{font-size:44px; color:var(--color-green); line-height:1;}
/* h3, where .prev-title is h4: this is the page's own heading, not a card
   title inside a form. Mirrors .form-title on the responder page. */
.prev-done-title{margin:0; font-size:var(--text-h3-size); line-height:var(--text-h3-lh); font-weight:var(--text-h3-weight); color:var(--color-neutral-9); overflow-wrap:anywhere;}
.prev-note{display:flex; align-items:center; gap:var(--spacing-4);}

/* Multiple select ships its panel position:static like the single one, so
   it needs the same float when it sits above other content. */
.dd-float > .c-dropdown-multi-panel{position:absolute; top:calc(100% + var(--spacing-4)); left:0; right:0; z-index:60; margin-top:0;}
.c-dropdown-multi-panel[hidden]{display:none;}
/* Select All's count belongs at the right end of the row, not beside the
   label: the label is the action and the count is a fact about it. Left
   inline, the desc slot's flex:1 squeezes "Select All" onto two lines. */
.c-dropdown-option.select-all .c-dropdown-option-label{white-space:nowrap;}
.c-dropdown-option.select-all .c-dropdown-option-desc{flex:none; margin-left:auto;}

/* Date picker — the component ships no positioning (its panel is in normal
   flow), so the float and the full-width trigger live here. Everything else
   is .c-dp-* from components.css. */
.c-dp{position:relative; width:100%;}
.c-dp-trigger{width:100%; justify-content:flex-start; cursor:pointer;}
.c-dp-trigger:hover:not(:disabled){background:var(--color-neutral-2);}
.c-dp-trigger:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:2px;}
.c-dp-trigger:disabled{background:var(--color-neutral-2); color:var(--color-neutral-4); cursor:not-allowed;}
.c-dp-trigger:disabled i{color:var(--color-neutral-4);}
.c-dp-value.is-empty{color:var(--color-neutral-5);}
.c-dp > .c-dp-panel{position:absolute; top:calc(100% + var(--spacing-8)); left:0; z-index:60;}
.c-dp > .c-dp-panel.is-above{top:auto; bottom:calc(100% + var(--spacing-8));}
.c-dp-panel[hidden]{display:none;}
/* Footer, borrowed from the documented range-mode one, for the single field
   that is allowed to be empty. */
.c-dp-foot{display:flex; justify-content:flex-end; margin-top:var(--spacing-12); padding-top:var(--spacing-12); border-top:1px solid var(--color-neutral-3);}

/* Settings save bar. Sticky at the foot of the viewport rather than parked
   at the end of the page: Settings is three cards tall, and a Save the
   reader has to scroll back down to find is a Save that gets missed. */
/* Docked in the toolbar rather than floating. It used to be a sticky pill
   at the bottom of the viewport, which meant it sat over the questions it
   was reporting on — permanently, since it rendered in the clean state too.
   Here it is inline, carries no chrome of its own, and the toolbar's own
   border is the container it needed. */
.set-save{display:inline-flex; align-items:center; gap:var(--spacing-8); flex:none;}
/* Nothing staged: the bar is only reporting a state, so it drops to the
   label and keeps a Save that says so — a full-width bar carrying two dead
   buttons was the page's loudest element for saying there was nothing to
   do. Discard appears with the changes there is something to discard. */
/* Clean state shows the state text alone — Discard and Save would both be
   no-ops, and a disabled pair of buttons is two dead controls in a toolbar
   that already has Undo and Redo doing nothing. */
.set-save:not(.is-dirty) .c-btn{display:none;}
/* Separates the save group from Publish without a second divider rule. */
.tb-save:not(:empty){margin-right:var(--spacing-4); padding-right:var(--spacing-8); border-right:1px solid var(--color-neutral-3);}
.set-save-state{display:inline-flex; align-items:center; gap:var(--spacing-8); font-family:var(--font-primary); font-size:var(--text-label2-size); font-weight:700; color:var(--color-neutral-5); white-space:nowrap;}
.set-save-state i{font-size:var(--icon-sm);}
.set-save.is-dirty .set-save-state{color:var(--color-neutral-9);}
.set-save.is-dirty .set-save-state i{font-size:8px; color:var(--color-amber);}

/* Comment count in the table. A bordered pill rather than a caption, so it
   reads as a countable thing at a glance, and tinted by whose turn the
   thread is on so a row that needs someone is visible without reading it. */
.cmt-pill{display:inline-flex; align-items:center; gap:var(--spacing-4); height:24px; padding:0 var(--spacing-8); border-radius:var(--radius-pill); border:1px solid var(--color-neutral-3); background:var(--color-neutral-2); color:var(--color-neutral-9); font-family:var(--font-primary); font-size:var(--text-label2-size); font-weight:700; font-variant-numeric:tabular-nums;}
.cmt-pill i{font-size:var(--icon-micro); color:var(--color-neutral-5);}
/* "Reply received" — the ball is back with the tech team. It takes the same
   Water (Data) tint the team's own comments do rather than a second amber,
   which would read as the same alert as "Awaiting response". */
.c-badge.badge-water{background:var(--color-water-bg); color:var(--color-navy); border-color:var(--color-water-bg-strong);}
/* Two lines inside one table cell — a name over its pod. align-items keeps
   an inline-flex child from stretching to the column's full width, which is
   what a flex column does to one by default. */
.td-stack{display:flex; flex-direction:column; align-items:flex-start; gap:var(--spacing-4);}

/* Screenshot tiles in the record modal — a grid of real thumbnails, so a
   report with three attachments stays one screen rather than three. */
.shot-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:var(--spacing-8);}
.shot-tile{width:100%; height:auto; aspect-ratio:16/10;}

/* --------------------------------------------------------------------------
   Dashboard — the Overview home
   A different shape from every other route in this file: those are working
   screens with a left-aligned Page header over a list. This one is a landing
   moment — a centred greeting, four cards fanned like a hand you have been
   dealt, and the assistant underneath. So it hides the shell's own page
   header rather than fighting it, and everything here is page-local.
   -------------------------------------------------------------------------- */
/* Greeting. Built from the same h1/body1 type tokens .c-pageheader itself
   uses — the only new thing is the centring. The name is read from the
   account row in the sidebar rather than written twice: one source for it,
   so a prototype cannot greet you as someone other than who it says you
   are signed in as. */
.dash-greet{text-align:center; padding:var(--spacing-32) var(--page-gutter) 0;}
.dash-greet h1{margin:0 0 var(--spacing-8); font-family:var(--font-primary); font-size:var(--text-h1-size); line-height:var(--text-h1-lh); font-weight:var(--text-h1-weight); color:var(--color-neutral-9);}
.dash-greet p{margin:0; font-family:var(--font-primary); font-size:var(--text-body1-size); line-height:var(--text-body1-lh); font-weight:var(--text-body1-weight); color:var(--color-neutral-5);}
/* Held invisible until the route paints, then fade + rise, the subtitle one
   beat behind the heading. One shared .is-revealed trigger, CSS does the
   staggering — the cards below stagger far more elaborately and set their
   own numbers from script instead. */
.dash-greet h1, .dash-greet p{opacity:0; transform:translateY(16px); transition:opacity var(--duration-reveal) var(--ease-reveal), transform var(--duration-reveal) var(--ease-reveal);}
.dash-greet h1.is-revealed, .dash-greet p.is-revealed{opacity:1; transform:translateY(0);}
.dash-greet p.is-revealed{transition-delay:130ms;}

/* The fan. justify-content:center with a negative margin between cards, so
   the row stays centred however many cards it holds — a fixed left offset
   would have to be recomputed the moment a fifth focus appears.
   perspective lives here, on the parent: a perspective declared on the
   rotating element itself is applied per-element and flattens, which is why
   the tilt below reads as a skew rather than a turn if it moves. */
.dash-fan{display:flex; justify-content:center; align-items:stretch; perspective:1400px; padding:var(--spacing-40) 0 var(--spacing-32);}
/* The overlap is capped at the base Card's own padding (spacing-16, less a
   hair), and that ceiling is the whole rule: z-index descends left to right
   so each card is covered along its LEFT edge by the one before it, and any
   overlap wider than the padding starts eating the first characters of every
   line on the card underneath. Tested at -30px, where the recommendation
   sentence on cards 2-4 lost its first letter. */
.dash-fan .c-card-slide + .c-card-slide{margin-left:-14px;}

/* One card. --card-rot/--card-y are the fan pose, --tilt-x/--tilt-y the
   live pointer tilt, and they compose in one transform rather than nesting
   wrappers — a rotate on a parent would take the child's hover lift with
   it and the two would multiply.
   transform-origin is the bottom edge: cards in a held fan pivot about
   where the hand is, not about their middle. */
.c-card-slide{
  --card-rot:0deg; --card-y:0px; --card-z:1; --tilt-x:0deg; --tilt-y:0deg;
  position:relative; z-index:var(--card-z); flex:none; width:300px;
  transform-origin:50% 100%;
  opacity:0;
  transform:translateY(calc(var(--card-y) + 28px)) rotate(var(--card-rot)) scale(.96);
  transition:opacity var(--card-reveal-duration, 700ms) var(--ease-reveal),
             transform var(--card-reveal-duration, 700ms) var(--ease-reveal);
  transition-delay:var(--card-reveal-delay, 0ms);
}
.c-card-slide.is-revealed{opacity:1; transform:translateY(var(--card-y)) rotate(var(--card-rot)) scale(1);}
/* Settled is added on transitionend, and it is what hands the transform over
   from the entrance to the interaction. Two separate timings on one property
   cannot co-exist, so the hover lift is simply unavailable until the card has
   finished arriving — which is also the honest behaviour: a card still flying
   in is not yet something to point at. */
.c-card-slide.is-settled{
  transition:transform var(--duration-base) var(--ease-standard), box-shadow var(--duration-base) var(--ease-standard);
  transition-delay:0ms;
  transform:translateY(var(--card-y)) rotate(var(--card-rot)) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
}
/* Hover straightens the card out of the fan and lifts it. focus-within, not
   just hover: the card carries two real controls, so a keyboard reader has
   to be able to bring it to the front the same way a pointer does. */
.c-card-slide.is-settled:hover, .c-card-slide.is-settled:focus-within{
  z-index:20;
  transform:translateY(calc(var(--card-y) - 12px)) rotate(0deg) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
  box-shadow:var(--shadow-4);
}
@media (prefers-reduced-motion:reduce){
  .c-card-slide{opacity:1; transform:translateY(var(--card-y)) rotate(var(--card-rot)); transition:none;}
  .c-card-slide.is-settled:hover, .c-card-slide.is-settled:focus-within{transform:translateY(var(--card-y)) rotate(0deg);}
  .dash-greet h1, .dash-greet p{opacity:1; transform:none; transition:none;}
}

/* Sizing for the two inline logo SVGs. components.css styles the wrappers
   (.c-sidebar-logo-live-wrap is a 118x22 window, .c-sidebar-logo-collapsed a
   24x24 box) but was written when the expanded logo was an iframe and the
   collapsed one an <img>, so neither has a rule for an SVG child. The
   wordmark's 1022x182 viewBox at 118px wide is 21px tall, which is what the
   window was already cut for. */
.c-sidebar-logo-svg{display:block; width:118px; height:auto;}
.c-sidebar-logo-collapsed-svg{display:block; width:100%; height:100%;}

/* --------------------------------------------------------------------------
   The focus cards are Hero Cards.

   Everything the component defines is the component's: shell, Eyebrow,
   Heading (with its 2-line clamp and Ribbon clearance), Body, the
   Recommendation, the Ribbon, and a Ghost/md CTA with a trailing arrow.
   Two things are added here, and both are layout or a slot's contents —
   neither restyles a part Hero Card already owns.

   The Ribbon is the component's Fire-orange corner flag now, not the
   Obsidian pill this card used to carry. It reads as a flag rather than a
   rank badge, which is a real change of meaning, but "Focus 1" beside a
   diagonal flag still reads as an order and the alternative was a card
   claiming to be a Hero Card while drawing its own ribbon.
   -------------------------------------------------------------------------- */
/* 1. The Body slot holds a definition list rather than prose — the three
      facts are what this card is for. The slot supplies the type (body2,
      Neutral-5); only the stacking is here. */
.dash-fan .c-herocard-body{display:flex; flex-direction:column; gap:var(--spacing-8);}
.hcard-fact{display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-8);}
/* 2. Pin the Recommendation to the bottom so cards of different text
      lengths still line their CTAs up across the fan. Layout only. */
.dash-fan .c-herocard-recommendation{margin-top:auto;}
/* 3. Ribbon clearance for the Eyebrow — a gap in the component, patched
      here rather than in components.css so preview.html is not disturbed.
      Hero Card reserves spacing-60 on the Heading and nothing on the
      Eyebrow, but the Eyebrow is h2 (26px), the largest text on the card,
      and it sits at the top of the card where the ribbon's band reaches
      furthest in. Measured here: "No answers yet" runs under the flag
      without this. Same token the Heading's own clearance uses. */
.dash-fan .c-herocard:has(.c-herocard-ribbon) .c-herocard-eyebrow{padding-right:var(--spacing-60);}

/* The fan has a hard minimum width: four 300px cards overlapping by 14 is
   1158px, and the content column is the viewport less the rail and its
   gutters (~320px of it) — so it needs about 1480px before it fits.
   300px, not the 264 this fan used before Hero Card: the component's
   Eyebrow is h2 (26px) where the old local one was 11px, and the Heading
   reserves 60px on its right for the Ribbon. At 264 the Heading had 172px
   of usable width and clamped two lines off most survey names. Below that it is not a
   fan, it is a horizontal scrollbar, and .c-shell-content's overflow-y:auto
   computes the cross axis to auto, so it would genuinely scroll.
   Two steps down rather than one: a 2x2 grid keeps four cards comparable at
   laptop widths, and only the phone gets a single column.
   The pose properties are written inline by heroCard(), and an inline custom
   property beats any selector — hence !important, which is doing real work
   here rather than papering over a specificity accident. */
@media (max-width:1480px){
  .dash-fan{flex-wrap:wrap; justify-content:center; align-items:stretch;
    gap:var(--spacing-16); max-width:616px; margin:0 auto; perspective:none;
    padding:var(--spacing-32) 0;}
  .dash-fan .c-card-slide + .c-card-slide{margin-left:0;}
  .c-card-slide{--card-rot:0deg !important; --card-y:0px !important;}
  .c-card-slide.is-settled:hover, .c-card-slide.is-settled:focus-within{transform:translateY(-6px);}
}
@media (max-width:900px){
  .dash-fan{flex-direction:column; align-items:center; max-width:none;}
  .c-card-slide{width:min(340px, 100%);}
}

/* --------------------------------------------------------------------------
   Prompt input bar — AI Native, Floating bar variant, on the Dashboard only
   The component ships whole in components.css and nothing about it is
   redefined here. What is local is the surface it was dropped into: the bar
   anchors to "the bottom of the content region, not the viewport", which on
   this page is .c-shell-main, and the FAB docks to its right-hand edge.
   Both are scoped to .has-prompt-bar, set by the router: on every other
   route there is no bar, and the FAB belongs back in its own corner.
   -------------------------------------------------------------------------- */
/* Three geometry terms, and every one of them is read off the component
   rather than copied from its spec — a custom property declared on the bar
   cannot be read by its parent, so script mirrors them up (see
   measurePromptBar). --bar-w is what the bar is currently as wide as,
   --bar-h how tall, and --fab-size what the button should be against it.
   The expanded width is the one literal left here, because it is the
   component's own `min(620px, 100% - spacing-32)` and has no custom
   property to read. */
.c-shell-main.has-prompt-bar{
  --bar-w:min(620px, calc(100% - var(--spacing-32)));
  --bar-h:var(--prompt-bar-h, 100px);
  --fab-size:56px;
}
/* Collapsed. --bar-w-collapsed and --prompt-bar-pill-h are both measured
   from the real element once it has morphed, so if the component ever
   retunes its 406px width or its 11px-padding pill height, this follows
   without a second set of numbers to keep in step. The literals are
   first-paint fallbacks for the frame before script has measured. */
.c-shell-main.has-prompt-bar:has(#promptBar.is-collapsed){
  --bar-w:var(--bar-w-collapsed, 406px);
  --bar-h:var(--prompt-bar-pill-h, 46px);
  --fab-size:var(--prompt-bar-pill-h, 46px);
}
/* The reserve at the end of the page uses the bar's TALLEST pose, not its
   live height. Using --bar-h would resize the scroll region on every
   collapse and jump the page under the reader — and since the collapse is
   itself driven by scroll position, that is a feedback loop, not just a
   jolt. */
.c-shell-main.has-prompt-bar .c-shell-content{padding-bottom:calc(var(--page-gutter) + var(--prompt-bar-rest-h, 124px));}
/* Docked to the bar's right edge and centred on its midline. Both boxes
   bottom out at spacing-24, so centring is the bar's height less the
   button's, halved — which lands the pair flush when the two heights are
   equal, i.e. exactly when the bar is a pill and the button has taken the
   pill's own height. Expanded, a 56px button sits centred on a 100px card
   instead of hanging off its bottom edge.
   left/bottom/width/height all travel on the component's own morph timing,
   so the button moves with the bar rather than after it. */
.c-shell-main.has-prompt-bar .c-fab{
  left:calc(50% + (var(--bar-w) / 2) + var(--spacing-12));
  right:auto;
  width:var(--fab-size); height:var(--fab-size);
  bottom:calc(var(--spacing-24) + (var(--bar-h) - var(--fab-size)) / 2);
  transition:background-color var(--duration-fast) var(--ease-standard),
             transform var(--duration-fast) var(--ease-standard),
             left var(--duration-morph) var(--ease-morph),
             bottom var(--duration-morph) var(--ease-morph),
             width var(--duration-morph) var(--ease-morph),
             height var(--duration-morph) var(--ease-morph);
}
/* Below 640px the component goes full-bleed to both gutters and there is no
   room beside it, so the button returns to the corner and rides above the
   bar — the same relationship, stacked rather than in a row. It still takes
   the bar's collapsed height, so the pair still reads as one set. */
@media (max-width:640px){
  .c-shell-main.has-prompt-bar .c-fab{
    left:auto; right:var(--spacing-24);
    bottom:calc(var(--spacing-24) + var(--bar-h) + var(--spacing-8));
  }
}
@media (prefers-reduced-motion:reduce){
  .c-shell-main.has-prompt-bar .c-fab{transition:background-color var(--duration-fast) var(--ease-standard);}
}

/* --------------------------------------------------------------------------
   Dashboard — everything the four cards left out
   The focus cards are an argument about what matters today; this is the
   ground they were picked from, so it has to be visible or the argument
   cannot be checked. It is also what gives the route enough height to
   scroll, which is what drives the bar's own collapse.
   -------------------------------------------------------------------------- */
.dash-rest{max-width:1014px; margin:0 auto; padding:var(--spacing-24) var(--page-gutter) 0;}
.dash-rest > h2{margin:0 0 var(--spacing-16); text-align:center; font-family:var(--font-primary); font-size:var(--text-h4-size); line-height:var(--text-h4-lh); font-weight:var(--text-h4-weight); color:var(--color-neutral-9);}
.dash-rest-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:var(--spacing-16); align-items:start;}
.dash-rest h3{margin:0; font-family:var(--font-primary); font-size:var(--text-label1-size); line-height:var(--text-label1-lh); font-weight:var(--text-label1-weight); color:var(--color-neutral-9);}
.dash-list{display:flex; flex-direction:column;}
/* Rows divide rather than box: a list of eight surveys inside eight cards
   is eight times the chrome for the same eight facts. */
.dash-list-row{display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-12); padding:var(--spacing-12) 0; border-top:1px solid var(--color-neutral-2);}
.dash-list-row:first-child{border-top:0;}
.dash-list-row > span:first-child{min-width:0; display:flex; flex-direction:column; gap:2px;}
.dash-list-t{font-family:var(--font-primary); font-size:var(--text-body2-size); line-height:var(--text-body2-lh); font-weight:700; color:var(--color-neutral-9); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dash-list-m{font-family:var(--font-primary); font-size:var(--text-caption-size); line-height:var(--text-caption-lh); color:var(--color-neutral-5);}
.dash-list-row > .c-badge{flex:none;}

/* --------------------------------------------------------------------------
   Floating action button — placement
   The component ships whole above; these two rules are only about the box
   it floats in. It sits bottom-right, the corner the component ships in,
   at its own 56px — it briefly wore 46px and a centre-relative left offset
   while it docked beside the AI-native prompt bar, and both of those were
   only ever descriptions of that bar, which is no longer on this screen.
   Restoring 56px also puts .c-fab-menu back where its own offset assumes:
   that menu is placed at 24 + 56 + 8, so against a 46px button it was
   sitting 18px clear instead of the intended spacing-8.
   -------------------------------------------------------------------------- */
/* The anchor is .c-shell-main, the box that does not scroll — anchoring to
   .c-shell-content instead would scroll the button away with the page. The
   inset is then measured from the content region's own right edge rather
   than the window's, which is the same place right up until something
   outside that region claims width. */
.c-shell-main{position:relative;}
.c-fab{position:absolute; left:auto; right:var(--spacing-24); bottom:var(--spacing-24);}

/* Print — the PDF export route. Chrome's own "Save as PDF" is the only
   way to a real PDF without shipping a rendering library, so the export
   prints a purpose-built sheet instead of the app. */
@media print{
  /* Everything that is a control rather than content comes out: the reader
     of a PDF cannot use a filter, a view switcher or a search box. */
  .c-sidebar-shell, .c-fab, .c-fab-menu, .c-toast-host, .c-tabs, .toolbar,
  .c-pageheader-actions, .c-back-button-row, .c-modal-layer, .lightbox, .c-chart-table-btn,
  .c-segctl, .menu-wrap, .c-search-input, .c-chip-group, .add-bar, .add-rail, .set-save,
  #hubSearchCount, .ai-panel-head .c-btn, .ai-panel-head .c-icon-btn{display:none !important;}
  /* With the switcher and the Export button gone, the row they shared has
     nothing left to space apart. */
  .row.between:has(> .c-segctl){display:block;}
  body{background:#fff;}
  /* The scrolling content region has to become plain flow, or print takes
     one viewport's worth of it and stops. */
  .c-shell, .c-shell-main, .c-shell-content{height:auto; overflow:visible; padding:0;}
  .c-card, .c-table-standalone-wrap{box-shadow:none; break-inside:avoid;}
  .resp-list{max-height:none; overflow:visible;}
  .c-chart-card .c-chart-canvas-wrap{display:none;}
  .c-chart-card .c-chart-table-wrap{display:flex !important; min-height:0;}
}



/* Below this the content column is too narrow to give up 56px, and the
   fixed bar at the top of the page is doing the job on its own. */
@media (max-width:820px){
  .builder-cols{grid-template-columns:minmax(0,1fr);}
  .add-rail{display:none;}
}

@media (max-width:700px){
  .svc-grid{grid-template-columns:1fr;}
  /* Preview's footer carries a sentence and two buttons. Side by side at
     this width all three wrap; the sentence takes its own line instead and
     the buttons split what is left. */
  .c-modal.is-preview .c-modal-foot{flex-wrap:wrap;}
  .c-modal.is-preview .c-modal-foot .hint{flex:1 1 100%;}
  .c-modal.is-preview .c-modal-foot .c-btn{flex:1 1 0; min-width:0;}
  /* The strip keeps the body's narrow padding so the tabs stay aligned with
     the cards under them. Two tabs fit this width; .c-tabs' own
     overflow-x:auto is the fallback if a third ever joins them. */
  .prev-pages{padding:0 var(--spacing-12);}
}
</style>

  <main class="c-shell-main">
    <div class="c-shell-content" id="shellContent">

      <!-- Back button — the documented Level-2+ affordance, and what
           replaced the sub-tabs: the two subsections are siblings under the
           landing page now, not two tabs of one screen, so getting between
           them is going back up rather than across. Its label is always the
           parent screen's own name, never "Back". -->
      <div class="c-back-button-row" id="backRow" hidden>
        <button class="c-back-button" type="button" id="backBtn">
          <i class="ph ph-arrow-left" aria-hidden="true"></i><span id="backLabel"></span>
        </button>
      </div>

      <header class="c-pageheader" id="pageHeader">
        <div class="c-pageheader-row">
          <div class="c-pageheader-text">
            <div class="ph-title-row">
              <h1 id="phTitle">Feedback</h1>
              <span class="ph-badge" id="phBadge"></span>
            </div>
            <p class="sub" id="phSub">Collect feedback from your team and triage the bugs they report.</p>
          </div>
          <div class="c-pageheader-actions" id="phActions"></div>
        </div>
      </header>

      <!-- ===== Route: Dashboard — the Overview home =====
           The one route with no Page header: the greeting IS the header
           here, and a left-aligned "Dashboard / subtitle" above a centred
           greeting would be the same thing said twice, in two alignments.
           renderDashboard() hides #pageHeader and puts it back on exit. -->
      <section class="route" id="routeDashboard" hidden>
        <div class="dash-greet">
          <h1 id="dashHello"></h1>
          <p id="dashSub">Here is what needs your attention today</p>
        </div>
        <div class="dash-fan" id="dashFan"></div>
        <!-- The ground the four cards were picked from. It is here to be
             checkable, and it is also what gives this route the height the
             bar's own scroll collapse needs to have anything to react to. -->
        <section class="dash-rest" aria-labelledby="dashRestH">
          <h2 id="dashRestH">Everything else</h2>
          <div class="dash-rest-grid" id="dashRestGrid"></div>
        </section>
      </section>

      <!-- ===== Route: Landing — the two things this section is =====
           Two entry cards rather than dropping straight into one of the two
           subsections, because the section has two audiences: someone here
           to run a survey and someone here about a bug. Landing on one of
           them made the other look like a tab of the first. -->
      <section class="route stack lg" id="routeLanding" hidden>
        <hr class="route-rule" />
        <div class="entry-grid" id="entryGrid"></div>
      </section>

      <!-- ===== Route: Feedback Hub (form library) ===== -->
      <section class="route stack lg" id="routeHub">
        <hr class="route-rule" />
        <div class="row between">
          <div class="c-chip-group" role="group" aria-label="Filter by status">
            <button class="c-chip c-chip-filter is-active" type="button" data-status="all">All <span class="count" id="cntAll">0</span></button>
            <button class="c-chip c-chip-filter" type="button" data-status="active">Active <span class="count" id="cntActive">0</span></button>
            <button class="c-chip c-chip-filter" type="button" data-status="draft">Draft <span class="count" id="cntDraft">0</span></button>
            <button class="c-chip c-chip-filter" type="button" data-status="closed">Closed <span class="count" id="cntClosed">0</span></button>
            <!-- The archive is a separate place, not a fourth status: All /
                 Active / Closed all mean "not archived". The rule says so. -->
            <span class="chip-sep" aria-hidden="true"></span>
            <button class="c-chip c-chip-filter" type="button" data-status="archived"><i class="ph ph-archive icon" aria-hidden="true"></i>Archive <span class="count" id="cntArchived">0</span></button>
          </div>
          <div class="row tight">
            <!-- Search input's real recipe: the magnifier carries
                 .c-search-input-icon (it is absolutely positioned into the
                 input's own 36px left padding — without the class it sits in
                 flex flow and the padding becomes an empty gutter) and the
                 clear button is part of the component, not an extra. -->
            <div class="c-search-input">
              <div class="c-search-input-box" id="hubSearchBox">
                <i class="ph ph-magnifying-glass c-search-input-icon" aria-hidden="true"></i>
                <input type="search" id="hubSearch" placeholder="Search forms" autocomplete="off"
                       aria-label="Search forms by title, description, owner or status" aria-describedby="hubSearchCount" />
                <button class="c-search-input-clear" type="button" id="hubSearchClear" aria-label="Clear search" hidden><i class="ph ph-x" aria-hidden="true"></i></button>
              </div>
            </div>
            <!-- Sort — Dropdown's Single select for the field, and a
                 direction toggle beside it, rather than a menu of every
                 field-plus-direction pair. It is the same (column,
                 direction) state the list view's own sortable headers
                 drive, so the two controls can never disagree, and grid
                 view gets the sort it otherwise had no header row for. -->
            <div class="c-field c-dropdown-field dd-float hub-sort">
              <div class="input-wrap has-trailing-icon">
                <input type="text" class="c-dropdown-input" id="hubSortTrigger" readonly value="Last updated"
                       aria-label="Sort by" aria-haspopup="listbox" aria-expanded="false" />
                <span class="icon-trailing" aria-hidden="true"><i class="ph ph-caret-down c-dropdown-chevron"></i></span>
              </div>
              <div class="c-dropdown-panel" id="hubSortPanel" hidden><div class="c-dropdown-list" id="hubSortList"></div></div>
            </div>
            <button class="c-btn c-btn-secondary c-btn-md c-btn-icon" type="button" id="hubSortDir">
              <i class="ph ph-sort-descending" id="hubSortDirIcon" aria-hidden="true"></i>
            </button>
            <div class="c-segctl c-segctl-default" role="tablist" aria-label="Library view" id="hubViewSeg">
              <span class="c-seg-pill" aria-hidden="true"></span>
              <button class="c-seg" type="button" role="tab" data-hv="grid" aria-label="Grid view" title="Grid view"><i class="ph ph-squares-four" aria-hidden="true"></i></button>
              <button class="c-seg" type="button" role="tab" data-hv="list" aria-label="List view" title="List view"><i class="ph ph-rows" aria-hidden="true"></i></button>
            </div>
          </div>
        </div>
        <p class="hint" id="hubSearchCount" role="status" aria-live="polite" hidden></p>
        <div id="hubList"></div>
      </section>

      <!-- ===== Route: Form builder ===== -->
      <section class="route stack lg" id="routeBuilder" hidden>
        <div class="toolbar" role="toolbar" aria-label="Form actions">
          <button class="c-btn c-btn-ghost c-btn-sm c-btn-icon" type="button" title="Preview" aria-label="Preview" data-tb="preview"><i class="ph ph-eye" aria-hidden="true"></i></button>
          <button class="c-btn c-btn-ghost c-btn-sm c-btn-icon" type="button" title="Undo" aria-label="Undo" data-tb="undo"><i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i></button>
          <button class="c-btn c-btn-ghost c-btn-sm c-btn-icon" type="button" title="Redo" aria-label="Redo" data-tb="redo"><i class="ph ph-arrow-clockwise" aria-hidden="true"></i></button>
          <span class="sep" aria-hidden="true"></span>
          <button class="c-btn c-btn-ghost c-btn-sm c-btn-icon" type="button" title="Copy shareable link" aria-label="Copy shareable link" data-tb="link"><i class="ph ph-link" aria-hidden="true"></i></button>
          <button class="c-btn c-btn-ghost c-btn-sm c-btn-icon" type="button" title="Add users" aria-label="Add users" data-tb="users"><i class="ph ph-user-plus" aria-hidden="true"></i></button>
          <span class="grow"></span>
          <!-- Save state and its two actions dock here, filled by whichever
               tab is showing. Empty on Responses, which stages nothing. -->
          <span class="tb-save" id="tbSave"></span>
          <button class="c-btn c-btn-primary c-btn-sm" type="button" data-tb="publish"><i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>Publish</button>
          <span class="kebab-wrap">
            <button class="c-btn c-btn-ghost c-btn-sm c-btn-icon" type="button" title="More options" aria-label="More options" aria-haspopup="menu" aria-expanded="false" id="kebabBtn"><i class="ph ph-dots-three-vertical" aria-hidden="true"></i></button>
            <div class="kebab-menu" id="kebabMenu" role="menu" hidden>
              <button type="button" role="menuitem" data-kb="copy"><i class="ph ph-copy" aria-hidden="true"></i>Make a copy</button>
              <!-- Label and icon are set in renderBuilder: the same item both
                   archives and restores, depending on where the survey is. -->
              <button type="button" role="menuitem" data-kb="archive"></button>
              <button type="button" role="menuitem" class="danger" data-kb="trash"><i class="ph ph-trash" aria-hidden="true"></i>Delete</button>
            </div>
          </span>
        </div>

        <div class="c-tabs" role="tablist" aria-label="Form builder" id="builderTabs">
          <button class="c-tab active" type="button" role="tab" data-btab="questions" aria-selected="true">Questions <span class="count" id="qCount">0</span></button>
          <button class="c-tab" type="button" role="tab" data-btab="responses" aria-selected="false">Responses <span class="count" id="rCount">0</span></button>
          <button class="c-tab" type="button" role="tab" data-btab="settings" aria-selected="false">Settings</button>
        </div>

        <div id="tabQuestions" class="stack lg"></div>
        <div id="tabResponses" class="stack lg" hidden></div>
        <div id="tabSettings" class="stack lg" hidden></div>
      </section>

      <!-- ===== Route: Bug report — reporter's own tickets ===== -->
      <section class="route stack lg" id="routeBugMine" hidden></section>

      <!-- ===== Route: Bug report — admin view ===== -->
      <section class="route stack lg" id="routeBugAdmin" hidden></section>

    </div>

    <!-- ===== Entry point 3 — Prompt input bar (AI Native), Floating bar
         variant, taken as it ships. It sits here rather than inside
         .c-shell-content because the component anchors to the content
         region, not to the scroller inside it: a sibling of the scroll box
         stays put while the page moves under it.
         Expanded is its only pose on this page — there is no collapse, no
         morph and no scroll state, because the Dashboard is where you are
         meant to ask something. Centred and bottom-aligned is the variant's
         own default (left:50% + translateX(-50%), bottom:spacing-24), so no
         positioning is overridden; --prompt-bar-shift stays 0 and the FAB
         docks to the right of it instead of the bar moving aside.
         Hidden on every other route — see render(). -->
    <div class="c-prompt-bar" id="promptBar" role="group" aria-label="Ask Collabrium" hidden>
      <div class="c-prompt-bar-glow-outer" aria-hidden="true"></div>
      <div class="c-prompt-bar-glow-inner" aria-hidden="true"></div>
      <div class="c-prompt-bar-surface">
        <div class="c-btn c-btn-primary c-btn-icon c-btn-sm c-prompt-bar-mark" aria-hidden="true"><i class="ph-fill ph-sparkle"></i></div>
        <div class="c-prompt-bar-field" id="promptField">
          <input type="text" id="promptInput" aria-label="Ask anything" placeholder="Ask me anything" />
          <div class="c-prompt-bar-ghost" aria-hidden="true">
            <span class="c-prompt-bar-ghost-text" id="promptGhost"></span>
          </div>
          <span class="c-prompt-bar-ghost-static">Ask me anything</span>
        </div>
        <div class="c-prompt-bar-more">
          <div class="c-prompt-bar-toolbar">
            <div class="c-prompt-bar-group">

<script>
(function(){
'use strict';

/* ==========================================================================
   Utilities
   ========================================================================== */
var $  = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return [].slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function initials(name){ return name.split(/\s+/).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase(); }

/* Deterministic PRNG — the mock response set must be identical on every
   load, otherwise the Summary charts and the Individual view disagree
   between reloads and the numbers stop being checkable. */
function rng(seed){ var s = seed >>> 0; return function(){
  s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function pick(rand, arr){ return arr[Math.floor(rand() * arr.length)]; }
/* Weighted integer in [lo,hi], skewed toward `centre` — real satisfaction
   data clusters, it isn't uniform, and a uniform mock makes every chart
   look flat and identical. */
function skewed(rand, lo, hi, centre){
  var a = rand(), b = rand(), t = (a + b) / 2;
  var span = hi - lo;
  var v = Math.round(lo + t * span + (centre - (lo + hi) / 2) * 0.6);
  return Math.max(lo, Math.min(hi, v));
}

var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d){ return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtDateTime(d){
  var h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  var ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ', ' + h + ':' + m + ap;
}
/* Sortable, unambiguous timestamp for exported data. fmtDateTime is tuned
   for reading on screen and drops the year, which is wrong in a spreadsheet
   column Excel is going to parse and sort. */
function fmtStamp(d){
  function p(n){ return String(n).padStart(2, '0'); }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
    ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function relDays(n){ var d = new Date(NOW.getTime() - n * 86400000); return d; }
function ymd(y, m, d){ return new Date(y, m - 1, d); }
/* Whole-day arithmetic. Subtracting two timestamps and dividing gives the
   wrong answer across a DST boundary and whenever the two times of day
   differ — "closes in 4 days" has to count dates, not elapsed hours. */
function dayStart(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function daysBetween(a, b){ return Math.round((dayStart(b) - dayStart(a)) / 86400000); }
function fmtDayMon(d){ return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
/* <input type="date"> only speaks YYYY-MM-DD, and only in local terms —
   toISOString() would shift the date by the timezone offset. */
function isoDate(d){
  if (!d) return '';
  function p(n){ return String(n).padStart(2, '0'); }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function parseISODate(v){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || '');
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
var NOW = new Date(2026, 8, 8, 10, 30);

/* Screenshot stand-ins. Real bug reports carry real screenshots; this is a
   file:// prototype with no network, so each one is a generated SVG data
   URI of a plausible app frame rather than an external image that would
   silently 404. */
function shot(seed, caption){
  var r = rng(seed);
  var bars = '';
  for (var i = 0; i < 5; i++){
    var w = 40 + Math.floor(r() * 120);
    bars += '<rect x="16" y="' + (56 + i * 18) + '" width="' + w + '" height="8" rx="4" fill="#E0E0E0"/>';
  }
  var accent = pick(r, ['#FF5825','#1473E6','#00C26E','#FFA425','#FF7A90']);
  var svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">' +
    '<rect width="320" height="200" fill="#FAFAFA"/>' +
    '<rect width="320" height="28" fill="#F0F0F0"/>' +
    '<circle cx="14" cy="14" r="4" fill="#FD3343"/><circle cx="28" cy="14" r="4" fill="#FFA425"/><circle cx="42" cy="14" r="4" fill="#00C26E"/>' +
    '<rect x="0" y="28" width="72" height="172" fill="#F0F0F0"/>' +
    '<rect x="12" y="40" width="48" height="6" rx="3" fill="#E0E0E0"/>' +
    '<rect x="12" y="54" width="40" height="6" rx="3" fill="#E0E0E0"/>' +
    '<rect x="88" y="40" width="140" height="10" rx="5" fill="#BDBDBD"/>' +
    '<g transform="translate(72,0)">' + bars + '</g>' +
    '<rect x="232" y="150" width="72" height="26" rx="12" fill="' + accent + '"/>' +
    '<text x="88" y="192" font-family="sans-serif" font-size="9" fill="#9E9E9E">' + esc(caption) + '</text>' +
    '</svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

/* Toast, built to the component's own recipe rather than a lookalike.
   Three things were off before:
   - the icon carried no `tone` class, so it missed the 2px optical offset
     that lands it on the first line of text, and set its size and colour
     from inline styles instead of the component's tokens;
   - it was `ph` (Regular) where Iconography puts status icons on Fill;
   - the message was a bare <p>, whose 1em UA margin pushed the text 16px
     below the icon and made a one-line toast 80px tall. Toast's own markup
     uses a <div> here, which is why the component never had to defend
     against it. */
function toast(msg, tone){
  var host = $('#toastHost');
  var t = document.createElement('div');
  t.className = 'c-toast is-message-only is-entering';
  t.setAttribute('role', 'status');
  t.innerHTML =
    '<i class="ph-fill ' + (tone === 'success' ? 'ph-check-circle' : 'ph-info') +
      ' tone ' + (tone === 'success' ? 'tone-success' : 'tone-neutral') + '" aria-hidden="true"></i>' +
    '<div class="body"><div class="message">' + esc(msg) + '</div></div>';
  host.appendChild(t);
  /* Reflow before dropping .is-entering, so the browser has a frame to
     transition from — the same reason the record modal forces one. */
  void t.offsetWidth;
  t.classList.remove('is-entering');
  setTimeout(function(){
    t.classList.add('is-exiting');
    setTimeout(function(){ t.remove(); }, 260);
  }, 2600);
}

/* Close every open Dropdown panel under `root` (the document by default),
   restoring the field's open class and the trigger's aria-expanded. Used by
   the document-level click handler and by any trigger that has to close its
   siblings before opening itself. */
function closeDropdowns(root){
  $$('.c-dropdown-panel', root).forEach(function(p){
    if (p.hidden) return;
    p.hidden = true;
    var field = p.closest('.c-dropdown-field');
    if (!field) return;
    field.classList.remove('open');
    var trig = field.querySelector('.c-dropdown-input');
    if (trig) trig.setAttribute('aria-expanded', 'false');
  });
  /* Date picker panels close the same way and through the same handler —
     they are the other popover in this file that has to shut when the
     reader clicks anywhere else. */
  $$('.c-dp-panel', root).forEach(function(p){
    if (p.hidden) return;
    p.hidden = true;
    var trig = p.parentNode.querySelector('[data-dptrigger]');
    if (trig) trig.setAttribute('aria-expanded', 'false');
  });
}

/* ==========================================================================
   Data
   ========================================================================== */
var PODS = ['CollabSales','CollabMedia','CollabContent','CollabInfluence','CollabStudio'];
var ME = { name:'GAN, Jia Yi', pods:['CollabMedia','CollabContent'] };

var PEOPLE = ['Jason Lim','Nurul Kamal','Tan Wei Ming','Priya Nair','Daniel Wong','Siti Aminah',
  'Marcus Tan','Farah Idris','Kelvin Cheah','Rachel Ong','Hafiz Rahman','Yee Ling Chong'];

var TECH = ['Wei Sheng Loh','Divya Menon','Arif Zulkifli','Chen Yi Xuan'];

/* Incident priority — a four-step severity ramp. Each step carries what it
   actually means, because "High" on its own is a word the reporter and the
   person triaging will read differently every time. */
var PRIORITIES = {
  p1:{ short:'P1', name:'Critical', desc:'Work is stopped and there is no workaround' },
  p2:{ short:'P2', name:'High',     desc:'A core task is broken; the workaround costs real time' },
  p3:{ short:'P3', name:'Medium',   desc:'Something is wrong but the work still gets done' },
  p4:{ short:'P4', name:'Low',      desc:'Cosmetic, or an annoyance worth logging' }
};
var PRIO_ORDER = ['p1','p2','p3','p4'];

/* Operational impact — the reporter's field, where priority is the team's.
   They are not the same judgement and should not be made by the same person:
   the reporter knows what the bug is stopping them doing, the team knows
   what it costs against everything else in the queue. Asking a reporter for
   a P-level asks them to rank their problem against work they cannot see,
   which is why every ticket used to arrive P3. */
var IMPACTS = {
  low:    { name:'Low',    desc:'Minor issue with little or no impact on daily operations. Cosmetic or non-critical defects that do not affect task completion.' },
  medium: { name:'Medium', desc:'Some disruption or inefficiency in daily operations, but users can continue working with a workaround.' },
  high:   { name:'High',   desc:'Significantly disrupts daily operations, preventing users from completing essential tasks. Requires immediate attention.' }
};
var IMPACT_ORDER = ['low','medium','high'];
function impactLabel(k){ return IMPACTS[k] ? IMPACTS[k].name : ''; }
function prioLabel(k){ return PRIORITIES[k].short + ' — ' + PRIORITIES[k].name; }
/* Two shapes. Anywhere a priority is being chosen or read on its own it
   spells itself out — "P2 — High". In a table it is the code and the dot,
   with the name still on the cell for hover and for screen readers: eight
   columns do not have room for a word that P1..P4 already says, and the
   record modal spells it out the moment a row is opened. */
/* A ticket arrives with no priority at all, so the pill has a fourth shape:
   the absence itself. Stated rather than blank — a priority column with
   empty cells in it reads as a rendering fault, where "Not set" reads as a
   ticket waiting for triage, which is exactly what it is. Neutral weight
   and colour, because it is not a value on the ramp. */
function prioPill(k, sm){
  if (!k || !PRIORITIES[k])
    return '<span class="prio is-unset' + (sm ? ' sm' : '') + '" title="Priority is set by the tech team at triage">' +
      '<span class="dot" aria-hidden="true"></span>Not set</span>';
  return '<span class="prio ' + k + (sm ? ' sm' : '') + '"' +
    (sm ? ' title="' + esc(prioLabel(k)) + '"' : '') + '>' +
    '<span class="dot" aria-hidden="true"></span>' +
    (sm ? PRIORITIES[k].short + '<span class="sr-only"> — ' + esc(PRIORITIES[k].name) + '</span>'
        : esc(prioLabel(k))) + '</span>';
}

/* Affected services — the surfaces a report can be filed against. A fixed
   list rather than free text, because this is the field that routes the
   ticket; a typo in it is a ticket nobody owns. */
var SERVICES = ['Dashboards','Reports & exports','Campaigns','Briefs & approvals','Asset library',
  'Quotes & billing','Notifications','Search','Sign-in & access','Integrations'];

var TYPES = {
  short:  { label:'Short text',            icon:'ph-text-aa' },
  long:   { label:'Long text',             icon:'ph-text-align-left' },
  /* Named for the answer, not the control: "Multiple choice" traditionally
     means pick one of several, which is the opposite of what it reads as,
     and "Checkboxes" names the widget rather than what it does. One answer
     is Single choice, several is Multiple choice; the radio and checkbox
     glyphs still say which control each one uses. */
  single: { label:'Single choice',         icon:'ph-radio-button' },
  multi:  { label:'Multiple choice',       icon:'ph-check-square' },
  scale:  { label:'Linear scale',          icon:'ph-sliders-horizontal' },
  slider: { label:'Slider',                icon:'ph-faders-horizontal' },
  stars:  { label:'Star rating',           icon:'ph-star' },
  rank:   { label:'Ranking',               icon:'ph-list-numbers' },
  matrix: { label:'Rating table',          icon:'ph-table' },
  yesno:  { label:'Yes / No',              icon:'ph-toggle-left' }
};

/* The seed form — the 10 questions from the brief, verbatim. Q6 carries the
   "if no, why not?" follow-up as its own dependent open-text question, since
   a Yes/No answer and a free-text answer can't share one response field. */
function seedQuestions(){
  return [
    { id:'q1',  type:'scale', title:'How easy was it to complete what you came here to do?', required:true, min:1, max:5, lo:'Very difficult', hi:'Very easy' },
    { id:'q2',  type:'scale', title:'How easy was it to find what you were looking for?', required:true, min:1, max:5, lo:'Very difficult', hi:'Very easy' },
    { id:'q3',  type:'scale', title:'How would you rate the look and feel?', required:true, min:1, max:5, lo:'Poor', hi:'Excellent' },
    { id:'q4',  type:'yesno', title:'Did the site/app feel fast and responsive?', required:true },
    { id:'q5',  type:'scale', title:'Was the information clear and easy to understand?', required:true, min:1, max:5, lo:'Not at all', hi:'Completely' },
    { id:'q6',  type:'yesno', title:'Were you able to complete your task/goal today?', required:true },
    { id:'q6b', type:'long',  title:'If no, why not?', required:false, dependsOn:'q6', dependsValue:'No', placeholder:'Tell us what got in the way' },
    { id:'q7',  type:'scale', title:'How satisfied are you with your experience overall?', required:true, min:1, max:5, lo:'Very dissatisfied', hi:'Very satisfied' },
    { id:'q8',  type:'scale', title:'How likely are you to recommend this to a colleague?', required:true, min:0, max:10, lo:'Not at all likely', hi:'Extremely likely' },
    { id:'q9',  type:'long',  title:'What was the most frustrating part of your experience?', required:false, placeholder:'Optional' },
    { id:'q10', type:'long',  title:"What's one thing we could improve?", required:false, placeholder:'Optional' }
  ];
}

var FRUSTRATIONS = [
  'Having to re-apply the same filters every time I come back to the dashboard.',
  'The export takes so long I usually give up and screenshot the table instead.',
  'I can never remember which pod owns which report, and nothing on the page tells me.',
  'Search only matches the start of a title, so I have to know the exact name already.',
  'Too many clicks to get from a campaign to the numbers for that campaign.',
  'It logged me out mid-form and I lost everything I had typed.',
  'The date picker defaults to this month and I almost always want last month.',
  'Nothing tells me a report is still refreshing, so I read stale numbers for ten minutes.',
  'Column widths reset every single time.',
  'On my laptop screen the table scrolls sideways and I lose the first column.'
];
var IMPROVEMENTS = [
  'Remember my last filter set per report.',
  'A proper bulk export — one click, all pods, one file.',
  'Let me pin the four reports I actually use to the top.',
  'Keyboard shortcuts for the things I do twenty times a day.',
  'Show me who else is looking at the same campaign right now.',
  'Autosave drafts. Please.',
  'Make the mobile view usable — I approve things from my phone.',
  'One clear "last updated" timestamp on every dashboard.',
  'Fuzzy search that copes with a typo.',
  'Let me duplicate a report instead of rebuilding it from scratch.',
  'Dark mode would genuinely help on late shifts.'
];

/* Response set — 128 responses against the seed form, generated once from a
   fixed seed so Summary and Individual always agree. */
function buildResponses(qs, n, seed){
  var r = rng(seed), out = [];
  for (var i = 0; i < n; i++){
    var completed = r() > 0.13;              /* ~87% completion */
    var a = {};
    var mood = r();                          /* one respondent-level mood drives every answer */
    var centre = mood > 0.72 ? 4.4 : mood > 0.30 ? 3.6 : 2.4;
    qs.forEach(function(q){
      if (q.type === 'scale'){
        a[q.id] = q.max === 10
          ? skewed(r, 0, 10, Math.round(centre * 2))
          : skewed(r, q.min, q.max, Math.round(centre));
      } else if (q.type === 'yesno'){
        var pYes = q.id === 'q4' ? 0.68 : 0.79;
        a[q.id] = (mood * 0.5 + r() * 0.5) < pYes ? 'Yes' : 'No';
      } else if (q.type === 'long'){
        if (q.dependsOn && a[q.dependsOn] !== q.dependsValue) { a[q.id] = null; return; }
        var p = q.id === 'q6b' ? 0.85 : (q.id === 'q9' ? 0.42 : 0.38);
        a[q.id] = r() < p
          ? pick(r, q.id === 'q10' ? IMPROVEMENTS : FRUSTRATIONS)
          : null;
      }
    });
    if (!completed){ a['q8'] = null; a['q9'] = null; a['q10'] = null; }
    out.push({
      id: 'r' + (i + 1),
      who: pick(r, PEOPLE),
      pod: pick(r, PODS),
      at: new Date(NOW.getTime() - Math.floor(r() * 19 * 86400000)),
      seconds: Math.round(60 + r() * 240),
      complete: completed,
      answers: a
    });
  }
  out.sort(function(x, y){ return y.at - x.at; });
  return out;
}

/* UNREFERENCED since the Product experience survey was removed: no form in
   FORMS below seeds responses any more, so seedQuestions()/buildResponses()
   have no caller and the Responses tab has nothing to chart. Kept, not
   deleted — attaching `questions: SEED_QS, responses: buildResponses(SEED_QS,
   128, 20260908)` to a form is the one-line way to get that demo back. */
var SEED_QS = seedQuestions();

/* The CollabSales beta round. Five questions, five cards.
   Q2 and Q3 used to be asked twice — once as a rating table, once as
   single choice — so the two styles could be compared. Single choice won:
   one subject and five points is a list of radios, and a rating table with
   a single row was only ever that list wearing a table. The rating-table
   twins are gone and `no` is back to matching the card's position, which
   is also what the renderer counts. */
var SALES_QS = [
  /* The one rating table left, and the one that earns it: three subjects
     against one scale is a grid, not a list. */
  { id:'s1', no:1, type:'matrix',
    title:'Please rate the user experience of the following features', required:true,
    rows:['Brief generation','Proposal deck generation','Client intelligence'],
    cols:['Very poor','Poor','Average','Good','Excellent'] },

  { id:'s2', no:2, type:'single',
    title:'How much of what Collabrium generates can you use as-is without needing to rework it?', required:true,
    options:['Rebuild completely','Major rework','Partial rework','Minor tweaks','No rework'],
    /* The two answers that say the output did not land. A rating on its own
       cannot be acted on, so this is where the reason gets typed — in the
       card that prompted it, while the question is still in front of the
       person answering. */
    followUp:{ when:['Rebuild completely','Major rework'], title:'Tell us more about this' } },

/* Every survey carries a time frame and an archive flag.
   `starts`/`ends` are whole dates, and `ends: null` is a real, chosen state
   — an open-ended survey, not a missing value — which is why the library
   prints "No deadline" rather than leaving the slot blank.
   `archived` is deliberately separate from `status`: an archived survey
   keeps whatever it was (active or closed) so restoring it puts it back the
   way it was, and the library hides it either way. */
/* Department -> element. Lifted straight from DESIGN-SYSTEM.md's own two
   tables: the named sub-brand products (CollabSales is Gold, CollabMedia is
   Water, CollabContent is Wood) and the department table for everything
   else. A survey stores the department that owns it and the colour is looked
   up here, never typed per row — that is what keeps a survey from drifting
   onto an element that does not own its content, which the Card don't-list
   forbids outright. An unlisted owner returns null and simply renders no
   chip, rather than borrowing someone else's colour. */
var OWNERS = {
  'CollabSales':   'gold',   'QA & Audit':     'gold',   'Finance':  'gold',
  'CollabMedia':   'water',  'Data Analytics': 'water',
  'CollabContent': 'wood',   'Product Design': 'wood',
  'CollabInfluence': 'earth',
  'People Ops':    'earth',  'Customer Success': 'earth',
  'Marketing':     'fire'
};
function ownerEl(f){ return (f.owner && OWNERS[f.owner.name]) || null; }
/* The chip is the whole ownership signal on a tile, so a survey with no
   owner shows nothing here rather than a grey placeholder implying one. */
function ownerChip(f){
  var el = ownerEl(f);
  if (!el) return '';
  /* The tile prints no owner name, so the chip is the only place ownership
     appears — which makes colour the sole carrier of it, and colour alone is
     never allowed to be. The name goes in a title for a pointer and in
     sr-only text for the button's accessible name, so the signal survives
     both a screen reader and a monochrome print. */
  return '<span class="icon-chip icon-chip-' + el + '" title="' + esc(f.owner.name) + '">' +
    '<i class="ph-fill ' + f.owner.icon + '" aria-hidden="true"></i>' +
    '<span class="sr-only">' + esc(f.owner.name) + '</span></span>';
}
function ownerTag(f){
  var el = ownerEl(f);
  if (!el) return '<span class="lib-row-meta">—</span>';
  return '<span class="c-tag c-tag-' + el + '"><span class="dot" aria-hidden="true"></span>' +
    esc(f.owner.name) + '</span>';
}

/* --------------------------------------------------------------------------
   Time frame, as the library reads it
   -------------------------------------------------------------------------- */
function rangeLabel(f){
  if (!f.starts && !f.ends) return 'No fixed dates';
  if (!f.ends)   return 'Open since ' + fmtDate(f.starts);
  if (!f.starts) return 'Until ' + fmtDate(f.ends);
  /* Drop the repeated year off the start date where both fall in one year —
     "1 Jul – 30 Sep 2026" says everything "1 Jul 2026 – 30 Sep 2026" does. */
  return (f.starts.getFullYear() === f.ends.getFullYear() ? fmtDayMon(f.starts) : fmtDate(f.starts)) +
    ' – ' + fmtDate(f.ends);
}
/* Days to close, or null where there is nothing to count down to — the
   caller needs to tell "no deadline" apart from "closes today". */
function closesIn(f){ return f.ends ? daysBetween(NOW, f.ends) : null; }
function deadline(f){
  var n = closesIn(f);
  if (n === null)  return { text:'No deadline',  tone:'none', icon:'ph-infinity' };
  if (n < 0)       return { text:'Ended ' + fmtDate(f.ends), tone:'past', icon:'ph-check-circle' };
  if (n === 0)     return { text:'Closes today', tone:'soon', icon:'ph-clock-countdown' };
  if (n === 1)     return { text:'Closes tomorrow', tone:'soon', icon:'ph-clock-countdown' };
  return { text:'Closes in ' + n + ' days', tone: n <= 7 ? 'soon' : 'open',
           icon: n <= 7 ? 'ph-clock-countdown' : 'ph-calendar-dots' };
}
function deadlinePill(f){
  var d = deadline(f);
  return '<span class="c-badge ' + (d.tone === 'soon' ? 'c-badge-warning' : 'c-badge-neutral') + '">' +
    '<i class="ph ' + d.icon + '" aria-hidden="true"></i>' + esc(d.text) + '</span>';
}

var BUG_STATUS = {
  'new':      { label:'New',         badge:'c-badge-warning' },

};

/* Whose turn the thread is on. Derived from the comments themselves, never
   stored — a stored flag goes stale the moment either side posts, and the
   whole point of the state is that it is always current.
     'awaiting' — the team spoke last, so the ball is with the reporter.
     'replied'  — the reporter spoke last, so the ball is back with the team
                  and the ticket needs picking up.
     null       — nobody has said anything yet, or the ticket is closed.
   Who spoke last is the whole rule. There is no separate "this one is a
   question" flag: every comment reaches the other side and every comment
   is worth reading, so marking some of them as the ones that count meant
   an unflagged reply sat in a thread nobody was told to look at.
   A resolved ticket is not waiting on anybody, so it drops out of the
   handover entirely and the Status column goes back to saying Resolved. */
function threadState(b){
  var c = b.comments || [];
  if (!c.length || b.status === 'resolved') return null;
  return c[c.length - 1].role === 'team' ? 'awaiting' : 'replied';
}
var THREAD_STATE = {
  awaiting:{ admin:'Awaiting response',  user:'Response needed', icon:'ph-fill ph-question',           badge:'c-badge-warning' },
  replied: { admin:'Reply received',    user:'Reply sent',    icon:'ph-fill ph-arrow-bend-up-left',  badge:'badge-water' }
};
/* The badge says the same fact from either side of the ticket: the team
   reads "Awaiting response", the person who filed it reads "Response
   needed" — the second one is addressed to them, so it names the thing they
   have to do rather than the state the queue is in. */
function threadBadge(b, mode){
  var t = threadState(b);
  if (!t) return '';
  var m = THREAD_STATE[t];
  return '<span class="c-badge ' + m.badge + '"><i class="' + m.icon + '" aria-hidden="true"></i>' +
    m[mode] + '</span>';
}
/* Comments in the table were a 12px counter tucked in after the title, which
   is invisible in a scan of eleven rows. Own column, own pill — and neutral,
   because it answers "how much conversation is on this ticket", not "whose
   turn is it". The Status column next to it already carries the turn, and
   tinting both made one fact look like two. */
function cmtPill(b){
  var n = (b.comments || []).length;
  if (!n) return '<span class="muted">—</span>';
  return '<span class="cmt-pill">' +
    '<i class="ph-fill ph-chat-circle" aria-hidden="true"></i>' + n + '</span>';
}
