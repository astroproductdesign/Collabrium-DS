<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

<style>
/* ==========================================================================
   CANDIDATE COMPONENTS — not in components.css yet.
   Four patterns this feature needs that the DLS does not have. Written to
   house conventions (tokens only, .c- prefix, same commenting style) so that
   promoting any of them is a copy-paste rather than a rewrite. Everything
   below the second banner is prototype-only scaffolding and would NOT be
   promoted.
   ========================================================================== */

/* --------------------------------------------------------------------------
   CANDIDATE 1 — Floating action button (.c-fab)
   Nothing in the system is a persistent, viewport-anchored action. Button's
   own Primary recipe is reused for fill, text colour and hover; what's new
   is only the fixed anchoring, the circular 56px box and the attention ring.
   Sits at z-index 900 — below Toast (1000) so a toast never lands behind it,
   below Tutorial Modal (1100), above Chat (95) and Command brief (400).
   -------------------------------------------------------------------------- */
.c-fab{position:fixed; right:var(--spacing-24); bottom:var(--spacing-24); z-index:900; display:inline-flex; align-items:center; justify-content:center; width:56px; height:56px; padding:0; border:0; border-radius:var(--radius-pill); background:var(--color-obsidian); color:var(--color-neutral-1); font-family:var(--font-primary); font-size:var(--icon-md); cursor:pointer; box-shadow:var(--shadow-4); transition:background-color var(--duration-fast) var(--ease-standard), transform var(--duration-fast) var(--ease-standard);}
.c-fab:hover{background:var(--color-neutral-8); transform:translateY(-1px);}
.c-fab:active{transform:translateY(0);}
.c-fab:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:3px;}
/* Attention ring — one-shot, three pulses then stop, so it nudges on first
   appearance without becoming ambient motion the user has to tune out. A
   pseudo-element rather than a box-shadow on the button itself, so the
   button's own resting elevation is untouched while it runs. */
.c-fab::after{content:""; position:absolute; inset:0; border-radius:inherit; border:2px solid var(--color-obsidian); opacity:0; pointer-events:none;}
.c-fab.is-nudging::after{animation:c-fab-pulse var(--duration-ambient) var(--ease-standard) 3;}
@keyframes c-fab-pulse{
  0%{transform:scale(1); opacity:.55;}
  100%{transform:scale(1.45); opacity:0;}
}
/* The FAB is decoration the moment motion is off — the ring is the only
   part that carries no information, so it's the only part suppressed. */
@media (prefers-reduced-motion: reduce){
  .c-fab.is-nudging::after{animation:none;}
  .c-fab:hover{transform:none;}
}
/* Menu — a small popover above the button. Reuses the Filters/Dropdown
   popover convention (radius-md, 1px Neutral-3, shadow-3) rather than a
   third popover recipe, and opens upward for the same reason SidebarNav's
   user menu does: the trigger is pinned to the viewport bottom. */
.c-fab-menu{position:fixed; right:var(--spacing-24); bottom:calc(var(--spacing-24) + 56px + var(--spacing-8)); z-index:900; width:268px; background:var(--color-neutral-1); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); box-shadow:var(--shadow-3); padding:var(--spacing-8); display:flex; flex-direction:column; gap:var(--spacing-4);}
.c-fab-menu[hidden]{display:none;}
.c-fab-menu-title{padding:var(--spacing-8) var(--spacing-8) var(--spacing-4); font-family:var(--font-primary); font-size:var(--text-label3-size); line-height:var(--text-label3-lh); font-weight:var(--text-label3-weight); letter-spacing:var(--tracking-eyebrow); text-transform:uppercase; color:var(--color-neutral-5);}
.c-fab-menu-item{display:flex; align-items:flex-start; gap:var(--spacing-12); width:100%; padding:var(--spacing-8) var(--spacing-12); border:0; border-radius:var(--radius-sm); background:transparent; text-align:left; cursor:pointer; font-family:var(--font-primary);}
.c-fab-menu-item:hover{background:var(--color-neutral-2);}
.c-fab-menu-item:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:-2px;}
.c-fab-menu-item > i{flex:none; margin-top:2px; font-size:var(--icon-base); color:var(--color-neutral-5);}
.c-fab-menu-item .t{display:flex; flex-direction:column; gap:2px; min-width:0;}
.c-fab-menu-item .t b{font-size:var(--text-body2-size); line-height:var(--text-body2-lh); font-weight:700; color:var(--color-neutral-9);}
.c-fab-menu-item .t span{font-size:var(--text-caption-size); line-height:var(--text-caption-lh); color:var(--color-neutral-5);}

/* --------------------------------------------------------------------------
   CANDIDATE 2 — Record modal (.c-modal-layer + .c-modal.is-record)
   A centred dialog holding one record out of a list, with prev/next built
   into its own header so the reader can walk the list without going back
   to it. Modal is the right component and its head/body/foot classes are
   reused verbatim — what's new is only (a) a layer to mount and scrim it,
   which components.css does not ship at all (.c-modal is a bare box), and
   (b) a size variant, because Modal's own 400px cap is a confirm-dialog
   width and a record needs a reading width.
   z-index 950/951: a record view is a modal surface, so it has to clear
   the FAB (900), which otherwise paints over the dialog's own footer.
   Still below Toast (1000) and the screenshot lightbox (1050), which both
   outrank any record view.
   -------------------------------------------------------------------------- */
.c-modal-layer{position:fixed; inset:0; z-index:950; display:flex; align-items:center; justify-content:center; padding:var(--spacing-24); background:var(--shadow-overlay); opacity:0; transition:opacity var(--duration-base) var(--ease-standard);}
.c-modal-layer.is-open{opacity:1;}
.c-modal-layer[hidden]{display:none;}
/* Modal's own radius, fill and shadow are inherited from .c-modal; only the
   box and the internal scroll are new. max-height + a scrolling body rather
   than a scrolling page, so the head (which carries the pager) and the foot
   (which carries the actions) stay put while the record scrolls. */
.c-modal.is-record{position:relative; z-index:951; display:flex; flex-direction:column; width:min(760px, 100%); max-width:none; max-height:100%; transform:translateY(8px) scale(.99); opacity:0; transition:transform var(--duration-base) var(--ease-settle), opacity var(--duration-base) var(--ease-settle);}
.c-modal-layer.is-open .c-modal.is-record{transform:none; opacity:1;}
.c-modal.is-record .c-modal-head{flex:none; align-items:flex-start; gap:var(--spacing-12); padding:var(--spacing-20) var(--spacing-24); border-bottom:1px solid var(--color-neutral-3);}
.c-modal.is-record .c-modal-head h4{overflow-wrap:anywhere;}
.c-modal.is-record .c-modal-body{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:var(--spacing-24); padding:var(--spacing-24);}
.c-modal.is-record .c-modal-foot{flex:none; padding:var(--spacing-16) var(--spacing-24);}
/* Pager — the prev/next pair plus its position readout. Lives in the head
   rather than flanking the dialog: arrows outside the box fall off-screen
   the moment the viewport is narrower than the modal plus two hit targets. */
.c-modal-pager{flex:none; display:flex; align-items:center; gap:var(--spacing-4);}
.c-modal-pager .pos{font-family:var(--font-primary); font-size:var(--text-caption-size); color:var(--color-neutral-5); font-variant-numeric:tabular-nums; white-space:nowrap; padding:0 var(--spacing-4);}
.c-modal-pager .c-icon-btn:disabled{color:var(--color-neutral-4); cursor:not-allowed;}
.c-modal-pager .c-icon-btn:disabled:hover{background:transparent;}
@media (prefers-reduced-motion: reduce){
  .c-modal-layer, .c-modal.is-record{transition:none;}
}

/* --------------------------------------------------------------------------
   CANDIDATE 3 — Comment thread (.c-comments)
   A chronological thread on one record, written to by two sides — the
   team that owns the record and the person who filed it. Chat window is
   the closest existing surface but it is a full-screen AI conversation
   with one human in it; this is a small, embedded, two-party log with no
   streaming and no assistant.
   The two sides differ by fill, not by alignment: both columns stay left,
   because a chronological record read as a transcript is easier to follow
   in one column than zig-zagged. The team side takes the Water (Data)
   8% tint — the platform/engineering side is the Water cluster in the
   5-element mapping, so it owns that content and the tint is a permitted
   colored background rather than decoration. Every bubble also carries a
   named role pill, so the colour is never the only thing saying who spoke.
   -------------------------------------------------------------------------- */
.c-comments{display:flex; flex-direction:column; gap:var(--spacing-16);}
.c-comment-list{display:flex; flex-direction:column; gap:var(--spacing-12);}
.c-comment{display:flex; gap:var(--spacing-12);}
.c-comment-body{flex:1 1 auto; min-width:0; padding:var(--spacing-12) var(--spacing-16); border-radius:var(--radius-md); border:1px solid var(--color-neutral-3); background:var(--color-neutral-1);}
.c-comment.is-team .c-comment-body{background:var(--color-water-bg); border-color:var(--color-water-bg-strong);}
.c-comment-meta{display:flex; align-items:center; flex-wrap:wrap; gap:var(--spacing-8); margin-bottom:var(--spacing-4);}
.c-comment-meta b{font-size:var(--text-body2-size); font-weight:700; color:var(--color-neutral-9);}
.c-comment-meta time{font-size:var(--text-caption-size); color:var(--color-neutral-5); font-variant-numeric:tabular-nums;}
.c-comment-text{margin:0; font-size:var(--text-body2-size); line-height:1.6; color:var(--color-neutral-9); overflow-wrap:anywhere;}
.c-comment-shots{display:flex; flex-wrap:wrap; gap:var(--spacing-8); margin-top:var(--spacing-8);}
/* A question waiting on the other side is the one thing in a thread that
   needs to be findable without reading it, so it gets a rule rather than
   only a pill. */
.c-comment.is-asking .c-comment-body{border-left:3px solid var(--color-amber);}
.c-comment-avatar{flex:none; width:32px; height:32px; border-radius:var(--radius-pill); display:flex; align-items:center; justify-content:center; font-family:var(--font-primary); font-size:var(--text-caption-size); font-weight:700; background:var(--color-neutral-2); color:var(--color-neutral-9);}
.c-comment.is-team .c-comment-avatar{background:var(--color-navy); color:var(--color-neutral-1);}
/* Composer — label, textarea, a compact drop zone and the send action.
   The zone is Uploader's own recipe at a smaller padding, not a new one. */
.c-comment-form{display:flex; flex-direction:column; gap:var(--spacing-8); padding-top:var(--spacing-16); border-top:1px solid var(--color-neutral-3);}
.c-comment-form .c-uploader-zone{padding:var(--spacing-12);}
.c-comment-form-foot{display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-12); flex-wrap:wrap;}

/* --------------------------------------------------------------------------
   CANDIDATE 4 — Scale input (.c-scale)
   A 1-5 / 0-10 linear-scale answer. Radio is the right semantics but its
   own circle+label stack reads as a vertical list, and Segmented Control is
   a view switcher, not a form answer. This is a radiogroup rendered as a row
   of equal-width numbered targets: real <input type="radio">, so keyboard
   arrow-key navigation and form semantics come free.
   -------------------------------------------------------------------------- */
.c-scale{display:flex; flex-direction:column; gap:var(--spacing-8);}
.c-scale-track{display:flex; gap:var(--spacing-8); flex-wrap:wrap;}
.c-scale-opt{position:relative; flex:1 1 0; min-width:40px;}
.c-scale-opt input{position:absolute; opacity:0; width:0; height:0;}
.c-scale-opt span{display:flex; align-items:center; justify-content:center; height:40px; border:1px solid var(--color-neutral-3); border-radius:var(--radius-sm); background:var(--color-neutral-1); font-family:var(--font-primary); font-size:var(--text-body2-size); font-weight:700; color:var(--color-neutral-9); cursor:pointer; font-variant-numeric:tabular-nums; transition:background-color var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);}
.c-scale-opt:hover span{background:var(--color-neutral-2);}
.c-scale-opt input:checked + span{background:var(--color-obsidian); border-color:var(--color-obsidian); color:var(--color-neutral-1);}
.c-scale-opt input:focus-visible + span{outline:2px solid var(--color-obsidian); outline-offset:2px;}
.c-scale-opt input:disabled + span{background:var(--color-neutral-2); color:var(--color-neutral-4); cursor:not-allowed;}
/* End labels — the numbers alone never say which end is good. */
.c-scale-ends{display:flex; justify-content:space-between; gap:var(--spacing-12); font-family:var(--font-primary); font-size:var(--text-caption-size); line-height:var(--text-caption-lh); color:var(--color-neutral-5);}

/* ==========================================================================
   PROTOTYPE SCAFFOLDING — layout glue for this demo only. Nothing here is a
   component and nothing here would be promoted. Every value is a token.
   ========================================================================== */
*{box-sizing:border-box;}
html,body{margin:0; height:100%;}
/* The UA's own [hidden]{display:none} is a type-selector-strength rule, so
   any class that sets display — .stack{display:flex} here — silently beats
   it and a "hidden" panel stays on screen. Toggling .hidden is the whole
   routing mechanism in this file, so it has to win everywhere. */
[hidden]{display:none !important;}
body{background:var(--color-canvas-warm); color:var(--color-neutral-9); font-family:var(--font-primary);}

.app{display:flex; min-height:100vh;}
.app-nav{flex:0 0 auto; padding:var(--spacing-16) 0 var(--spacing-16) var(--spacing-16); position:sticky; top:0; height:100vh;}
.app-nav .c-sidebar{height:100%;}
.app-main{flex:1 1 auto; min-width:0; padding:var(--spacing-32) var(--spacing-32) var(--spacing-120);}
.app-inner{max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:var(--spacing-24);}

.route[hidden]{display:none;}
.row{display:flex; align-items:center; gap:var(--spacing-12); flex-wrap:wrap;}
.row.between{justify-content:space-between;}
.row.tight{gap:var(--spacing-8);}
.grow{flex:1 1 auto; min-width:0;}
.stack{display:flex; flex-direction:column; gap:var(--spacing-16);}
.stack.sm{gap:var(--spacing-8);}
.stack.lg{gap:var(--spacing-24);}
.muted{color:var(--color-neutral-5);}
.eyebrow{font-size:var(--text-label3-size); line-height:var(--text-label3-lh); font-weight:var(--text-label3-weight); letter-spacing:var(--tracking-eyebrow); text-transform:uppercase; color:var(--color-neutral-5);}
.hint{font-size:var(--text-caption-size); line-height:var(--text-caption-lh); color:var(--color-neutral-5);}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;}
h2.sect{margin:0; font-size:var(--text-h5-size); line-height:var(--text-h5-lh); font-weight:var(--text-h5-weight);}

/* Avatar — Search input's own 32px recipe, reused verbatim rather than a
   fourth copy (Card profile, SidebarNav user and Search input each already
   carry one; this is the reason a shared .c-avatar is worth proposing). */
.avatar{flex:none; width:32px; height:32px; border-radius:var(--radius-pill); background:var(--color-neutral-2); color:var(--color-neutral-9); display:flex; align-items:center; justify-content:center; font-family:var(--font-primary); font-size:var(--text-caption-size); font-weight:700; font-style:normal;}
.avatar.sm{width:24px; height:24px; font-size:var(--text-label3-size);}
.avatar.lg{width:40px; height:40px; font-size:var(--text-label2-size);}

/* Form library rows */
.lib{display:flex; flex-direction:column; border:1px solid var(--color-neutral-3); border-radius:var(--radius-lg); background:var(--color-neutral-1); overflow:hidden;}
.lib-row{display:flex; align-items:center; gap:var(--spacing-16); width:100%; padding:var(--spacing-16) var(--spacing-20); border:0; border-bottom:1px solid var(--color-neutral-3); background:transparent; text-align:left; cursor:pointer; font-family:inherit; transition:background-color var(--duration-fast) var(--ease-standard);}
.lib-row:last-child{border-bottom:0;}
.lib-row:hover{background:var(--color-neutral-2);}
.lib-row:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:-2px;}
.lib-row-title{font-size:var(--text-body1-size); font-weight:700; color:var(--color-neutral-9);}
.lib-row-meta{font-size:var(--text-caption-size); color:var(--color-neutral-5);}
.lib-row-num{flex:none; text-align:right; font-variant-numeric:tabular-nums;}
.lib-row-num b{display:block; font-size:var(--text-body1-size); font-weight:700;}

/* Builder toolbar */
.toolbar{display:flex; align-items:center; gap:var(--spacing-4); padding:var(--spacing-8); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); background:var(--color-neutral-1); position:sticky; top:var(--spacing-16); z-index:30;}
.toolbar .sep{width:1px; align-self:stretch; margin:0 var(--spacing-4); background:var(--color-neutral-3);}
.kebab-wrap{position:relative;}
.kebab-menu{position:absolute; right:0; top:calc(100% + var(--spacing-8)); z-index:40; width:200px; padding:var(--spacing-8); background:var(--color-neutral-1); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); box-shadow:var(--shadow-3); display:flex; flex-direction:column; gap:2px;}
.kebab-menu[hidden]{display:none;}
.kebab-menu button{display:flex; align-items:center; gap:var(--spacing-8); padding:var(--spacing-8) var(--spacing-12); border:0; border-radius:var(--radius-sm); background:transparent; font-family:inherit; font-size:var(--text-body2-size); color:var(--color-neutral-9); cursor:pointer; text-align:left;}
.kebab-menu button:hover{background:var(--color-neutral-2);}
.kebab-menu button.danger{color:var(--color-red);}

/* Question blocks */
.qblock{position:relative; display:flex; flex-direction:column; gap:var(--spacing-12); padding:var(--spacing-20); padding-left:var(--spacing-32); border:1px solid var(--color-neutral-3); border-radius:var(--radius-lg); background:var(--color-neutral-1);}
.qblock.is-dragging{opacity:.4;}
.qblock.is-drop-target{box-shadow:inset 0 3px 0 var(--color-obsidian);}
.qblock.is-drop-target-after{box-shadow:inset 0 -3px 0 var(--color-obsidian);}
.qgrip{position:absolute; left:var(--spacing-8); top:var(--spacing-20); display:flex; align-items:center; justify-content:center; width:20px; height:24px; border:0; background:transparent; color:var(--color-neutral-4); cursor:grab; padding:0; border-radius:var(--radius-sm);}
.qgrip:hover{color:var(--color-neutral-9); background:var(--color-neutral-2);}
.qgrip:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:1px;}
.qgrip:active{cursor:grabbing;}
.qblock-head{display:flex; align-items:flex-start; gap:var(--spacing-12);}
.qblock-num{flex:none; font-size:var(--text-caption-size); font-weight:700; color:var(--color-neutral-5); padding-top:10px; font-variant-numeric:tabular-nums;}
.qblock-actions{flex:none; display:flex; align-items:center; gap:var(--spacing-4);}
.qblock-actions .qtype{position:relative; flex:none;}
.qblock-actions .qtype input{height:32px; width:150px; padding:0 var(--spacing-8); padding-right:28px; font-size:var(--text-caption-size); font-weight:700; cursor:pointer;}
.qblock-actions .qtype .icon-trailing{right:var(--spacing-8); font-size:var(--icon-micro);}
.qblock-actions .qtype .c-dropdown-panel{position:absolute; top:calc(100% + var(--spacing-4)); right:0; width:200px; z-index:20; margin-top:0;}
.qblock-foot{display:flex; align-items:center; justify-content:flex-end; gap:var(--spacing-16); padding-top:var(--spacing-12); border-top:1px solid var(--color-neutral-3);}
.qblock-media{border-radius:var(--radius-md); overflow:hidden; background:var(--color-neutral-2); display:flex; align-items:center; justify-content:center; min-height:160px; color:var(--color-neutral-5); gap:var(--spacing-8); flex-direction:column;}
.qblock-media i{font-size:var(--icon-lg);}
.add-bar{display:flex; flex-wrap:wrap; gap:var(--spacing-8); padding:var(--spacing-16); border:1px dashed var(--color-neutral-3); border-radius:var(--radius-lg); background:var(--color-neutral-1);}

/* Responses */
.sum-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:var(--spacing-16);}
.resp-list{display:flex; flex-direction:column; gap:var(--spacing-8); max-height:360px; overflow-y:auto; padding-right:var(--spacing-4);}
.resp-item{padding:var(--spacing-12) var(--spacing-16); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); background:var(--color-neutral-1); font-size:var(--text-body2-size); line-height:1.55;}
.resp-item .who{display:block; margin-top:var(--spacing-4); font-size:var(--text-caption-size); color:var(--color-neutral-5);}
.indiv-nav{display:flex; align-items:center; gap:var(--spacing-8);}
.indiv-qa{display:flex; flex-direction:column; gap:var(--spacing-4); padding-bottom:var(--spacing-16); border-bottom:1px solid var(--color-neutral-3);}
.indiv-qa:last-child{border-bottom:0; padding-bottom:0;}
.indiv-qa .q{font-size:var(--text-caption-size); color:var(--color-neutral-5);}
.indiv-qa .a{font-size:var(--text-body2-size); font-weight:500; color:var(--color-neutral-9); overflow-wrap:anywhere;}

/* Settings */
.set-row{display:flex; align-items:flex-start; justify-content:space-between; gap:var(--spacing-24); padding:var(--spacing-16) 0; border-bottom:1px solid var(--color-neutral-3);}
.set-row:last-child{border-bottom:0;}
.set-row .t b{display:block; font-size:var(--text-body2-size); font-weight:700;}
.set-row .t span{display:block; margin-top:2px; font-size:var(--text-caption-size); color:var(--color-neutral-5);}

/* Bug report */
.thumbs{display:flex; flex-wrap:wrap; gap:var(--spacing-8);}
.thumb{position:relative; width:88px; height:64px; border-radius:var(--radius-sm); border:1px solid var(--color-neutral-3); overflow:hidden; background:var(--color-neutral-2); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;}
.thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.thumb .x{position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:var(--radius-pill); border:0; background:var(--color-obsidian); color:var(--color-neutral-1); font-size:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;}
.thumb-sm{width:52px; height:36px;}
.lightbox{position:fixed; inset:0; z-index:1050; display:flex; align-items:center; justify-content:center; padding:var(--spacing-32); background:var(--shadow-overlay);}
.lightbox[hidden]{display:none;}
.lightbox img{max-width:100%; max-height:100%; border-radius:var(--radius-md); box-shadow:var(--shadow-4);}

.field-wide{width:100%; max-width:none;}
.c-field.field-wide input, .c-field.field-wide textarea{width:100%;}
.c-uploader.field-wide{max-width:none;}


/* Form library — grid view. Card's own Functional grid and Interactive
   variant, rendered as a <button> so the whole tile is one target (the
   list view's rows already are). */
.lib-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:var(--spacing-16);}
.lib-card{align-items:stretch; text-align:left; font-family:inherit; cursor:pointer; padding:var(--spacing-20); gap:var(--spacing-12);}
.lib-card:focus-visible{box-shadow:var(--shadow-focus); outline:none;}
.lib-card-title{font-size:var(--text-body1-size); line-height:var(--text-body1-lh); font-weight:700; color:var(--color-neutral-9); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.lib-card-desc{flex:1 1 auto; font-size:var(--text-caption-size); line-height:var(--text-caption-lh); color:var(--color-neutral-5); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
.lib-card-foot{display:flex; align-items:baseline; justify-content:space-between; gap:var(--spacing-8); padding-top:var(--spacing-12); border-top:1px solid var(--color-neutral-3);}
.lib-card-foot b{font-size:var(--text-h5-size); font-weight:800; font-variant-numeric:tabular-nums;}
/* Search hit — a plain background mark, not a brand tint: it marks the
   matched substring, it doesn't classify the row. */
.hit{background:var(--color-gold-bg-strong); border-radius:3px; padding:0 1px;}

/* Floating dropdown panel. components.css ships .c-dropdown-panel as
   position:static, so an open panel reflows whatever sits under it — a
   filter above a table pushes the table down by the panel's full height.
   Wherever the trigger sits above content that must not move, the field
   gets .dd-float and the panel overlays instead. (The question-type
   switcher solves the same problem with its own scoped rule above, which
   also fixes the panel's width and right-edge.) */
.dd-float{position:relative;}
.dd-float > .c-dropdown-panel{position:absolute; top:calc(100% + var(--spacing-4)); left:0; right:0; z-index:60; margin-top:0;}
.dd-float.align-right > .c-dropdown-panel{left:auto; right:0; width:220px;}

/* Popover menu on a button — the kebab menu's own recipe, reused for the
   Responses export menu rather than a second popover. */
.menu-wrap{position:relative;}
.menu-pop{position:absolute; right:0; top:calc(100% + var(--spacing-8)); z-index:60; width:248px; padding:var(--spacing-8); background:var(--color-neutral-1); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); box-shadow:var(--shadow-3); display:flex; flex-direction:column; gap:2px;}
.menu-pop[hidden]{display:none;}
.menu-pop button{display:flex; align-items:flex-start; gap:var(--spacing-8); width:100%; padding:var(--spacing-8) var(--spacing-12); border:0; border-radius:var(--radius-sm); background:transparent; font-family:inherit; text-align:left; cursor:pointer;}
.menu-pop button:hover{background:var(--color-neutral-2);}
.menu-pop button:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:-2px;}
.menu-pop button > i{flex:none; margin-top:2px; font-size:var(--icon-base); color:var(--color-neutral-5);}
.menu-pop .t{display:flex; flex-direction:column; gap:1px; min-width:0;}
.menu-pop .t b{font-size:var(--text-body2-size); font-weight:700; color:var(--color-neutral-9);}
.menu-pop .t span{font-size:var(--text-caption-size); color:var(--color-neutral-5);}

/* Priority — a severity ramp, so it reads as one measure with a dot per
   step rather than four unrelated badge colours. Red is the functional
   token; amber is the same amber Badge's own Warning variant already
   uses; the bottom two steps are neutrals. The P-number is always in the
   label, so the dot is reinforcement and never the only signal. */
.prio{display:inline-flex; align-items:center; gap:var(--spacing-8); white-space:nowrap; font-size:var(--text-body2-size); font-weight:700; color:var(--color-neutral-9);}
.prio .dot{flex:none; width:8px; height:8px; border-radius:var(--radius-pill); background:var(--color-neutral-4);}
.prio.p1 .dot{background:var(--color-red);}
.prio.p2 .dot{background:var(--color-amber);}
.prio.p3 .dot{background:var(--color-neutral-5);}
.prio.p4 .dot{background:var(--color-neutral-4);}
.prio.sm{font-size:var(--text-caption-size);}

/* Affected services — a checkbox set, laid out in columns because ten
   one-line options in a single stack is a scroll, not a choice. */
.svc-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:var(--spacing-8) var(--spacing-16); padding:var(--spacing-12) var(--spacing-16); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); background:var(--color-neutral-1);}
.c-field-error .svc-grid{border:2px solid var(--color-red); padding:11px 15px;}
.tag-row{display:flex; flex-wrap:wrap; gap:var(--spacing-4);}

/* AI summary panel. Sits where the result will be (Loading State Rule 10)
   and replaces the wait state in place. Not a brand tint — an AI answer
   is prose about the content, it doesn't belong to an element. */
.ai-panel{display:flex; flex-direction:column; gap:var(--spacing-8); padding:var(--spacing-16); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); background:var(--color-canvas-warm-card);}
.ai-panel-head{display:flex; align-items:center; gap:var(--spacing-8);}
.ai-panel-head .eyebrow{display:flex; align-items:center; gap:var(--spacing-4);}
.ai-panel-head .grow{flex:1 1 auto;}
.ai-take{margin:0; font-size:var(--text-body1-size); line-height:1.6; font-weight:500; color:var(--color-neutral-9);}
.ai-themes{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:var(--spacing-8);}
.ai-themes li{display:flex; gap:var(--spacing-8); font-size:var(--text-body2-size); line-height:1.55; color:var(--color-neutral-9);}
.ai-themes li .n{flex:none; min-width:34px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--color-neutral-5);}
.ai-themes li q{color:var(--color-neutral-5); font-style:italic;}
.ai-foot{display:flex; align-items:center; gap:var(--spacing-8); flex-wrap:wrap;}
.ai-disc{font-size:var(--text-caption-size); color:var(--color-neutral-5);}

/* My tickets — the reporter's own list. Same row recipe as the form
   library, plus a status column and an attention flag. */
.mine-row{display:flex; align-items:center; gap:var(--spacing-16); width:100%; padding:var(--spacing-16) var(--spacing-20); border:0; border-bottom:1px solid var(--color-neutral-3); background:transparent; text-align:left; cursor:pointer; font-family:inherit; transition:background-color var(--duration-fast) var(--ease-standard);}
.mine-row:last-child{border-bottom:0;}
.mine-row:hover{background:var(--color-neutral-2);}
.mine-row:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:-2px;}
.mine-row.needs-reply{background:var(--color-gold-bg);}
.mine-row.needs-reply:hover{background:var(--color-gold-bg-strong);}
.mine-title{font-size:var(--text-body1-size); font-weight:700; color:var(--color-neutral-9);}
.mine-meta{display:flex; align-items:center; flex-wrap:wrap; gap:var(--spacing-8); font-size:var(--text-caption-size); color:var(--color-neutral-5);}
.mine-side{flex:none; display:flex; align-items:center; gap:var(--spacing-8);}

/* Segmented Control's own .c-seg is flex:1 with basis 0, so every segment
   gets the same width regardless of its label — and its uppercase transform
   makes a two-word label ("ALL REPORTS") wrap onto a second line, which
   changes the control's height. Scoped here rather than patched into
   components.css, which would need a matching DESIGN-SYSTEM.md + preview.html
   pass; it is a candidate fix for the component itself. */
[data-bugseg] .c-seg, #respSeg .c-seg, #hubViewSeg .c-seg{white-space:nowrap;}

/* Bug table — eight columns need more than the content region's own width,
   so the wrap takes the system's .c-table-scroll-x variant and the table
   declares a real min-width rather than letting every column squash to the
   point where a title wraps four times. */
#routeBugAdmin .c-table{min-width:1200px;}
#routeBugAdmin .c-table td:nth-child(5),
#routeBugAdmin .c-table th:nth-child(5){min-width:300px;}

/* Record modal — read-only field rows, for the sides of a record the
   viewer cannot edit. */
.rec-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:var(--spacing-16);}
.rec-cell{display:flex; flex-direction:column; gap:var(--spacing-4); min-width:0;}
.rec-cell .v{font-size:var(--text-body2-size); font-weight:700; color:var(--color-neutral-9); overflow-wrap:anywhere;}

/* Screenshot tiles in the record modal — a grid of real thumbnails, so a
   report with three attachments stays one screen rather than three. */
.shot-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:var(--spacing-8);}
.shot-tile{width:100%; height:auto; aspect-ratio:16/10;}

/* Print — the PDF export route. Chrome's own "Save as PDF" is the only
   way to a real PDF without shipping a rendering library, so the export
   prints a purpose-built sheet instead of the app. */
@media print{
  /* Everything that is a control rather than content comes out: the reader
     of a PDF cannot use a filter, a view switcher or a search box. */
  .app-nav, .c-fab, .c-fab-menu, .c-toast-host, .c-tabs, .toolbar,
  .c-pageheader-actions, .c-modal-layer, .lightbox, .c-chart-table-btn,
  .c-segctl, .menu-wrap, .c-search-input, .c-chip-group, .add-bar,
  #hubSearchCount, .ai-panel-head .c-btn, .ai-panel-head .c-icon-btn{display:none !important;}
  /* With the switcher and the Export button gone, the row they shared has
     nothing left to space apart. */
  .row.between:has(> .c-segctl){display:block;}
  body{background:#fff;}
  .app-main{padding:0;}
  .c-card, .lib, .c-table-standalone-wrap{box-shadow:none; break-inside:avoid;}
  .resp-list{max-height:none; overflow:visible;}
  .c-chart-card .c-chart-canvas-wrap{display:none;}
  .c-chart-card .c-chart-table-wrap{display:flex !important; min-height:0;}
}

@media (max-width:900px){
  .app-nav{display:none;}
  .app-main{padding:var(--spacing-20) var(--spacing-16) var(--spacing-120);}
}
</style>
</head>

<div class="app">

            <button class="c-chip c-chip-filter" type="button" data-status="active">Active <span class="count" id="cntActive">0</span></button>

            <!-- Search input's real recipe: the magnifier carries

                       aria-label="Search forms by title, description or status" aria-describedby="hubSearchCount" />
                <button class="c-search-input-clear" type="button" id="hubSearchClear" aria-label="Clear search" hidden><i class="ph ph-x" aria-hidden="true"></i></button>
              </div>

            </div>

      <!-- ===== Route: Form builder ===== -->

<script>
(function(){
'use strict';

/* ==========================================================================
   Utilities
   ========================================================================== */
var $  = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return [].slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function initials(name){ return name.split(/\s+/).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase(); }

/* Deterministic PRNG — the mock response set must be identical on every
   load, otherwise the Summary charts and the Individual view disagree
   between reloads and the numbers stop being checkable. */
function rng(seed){ var s = seed >>> 0; return function(){
  s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function pick(rand, arr){ return arr[Math.floor(rand() * arr.length)]; }
/* Weighted integer in [lo,hi], skewed toward `centre` — real satisfaction
   data clusters, it isn't uniform, and a uniform mock makes every chart
   look flat and identical. */
function skewed(rand, lo, hi, centre){
  var a = rand(), b = rand(), t = (a + b) / 2;
  var span = hi - lo;
  var v = Math.round(lo + t * span + (centre - (lo + hi) / 2) * 0.6);
  return Math.max(lo, Math.min(hi, v));
}

var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d){ return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtDateTime(d){
  var h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  var ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ', ' + h + ':' + m + ap;
}
/* Sortable, unambiguous timestamp for exported data. fmtDateTime is tuned
   for reading on screen and drops the year, which is wrong in a spreadsheet
   column Excel is going to parse and sort. */
function fmtStamp(d){
  function p(n){ return String(n).padStart(2, '0'); }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
    ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function relDays(n){ var d = new Date(NOW.getTime() - n * 86400000); return d; }
var NOW = new Date(2026, 8, 8, 10, 30);

/* Screenshot stand-ins. Real bug reports carry real screenshots; this is a
   file:// prototype with no network, so each one is a generated SVG data
   URI of a plausible app frame rather than an external image that would
   silently 404. */
function shot(seed, caption){
  var r = rng(seed);
  var bars = '';
  for (var i = 0; i < 5; i++){
    var w = 40 + Math.floor(r() * 120);
    bars += '<rect x="16" y="' + (56 + i * 18) + '" width="' + w + '" height="8" rx="4" fill="#E0E0E0"/>';
  }
  var accent = pick(r, ['#FF5825','#1473E6','#00C26E','#FFA425','#FF7A90']);
  var svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">' +

/* Close every open Dropdown panel under `root` (the document by default),
   restoring the field's open class and the trigger's aria-expanded. Used by
   the document-level click handler and by any trigger that has to close its
   siblings before opening itself. */
function closeDropdowns(root){
  $$('.c-dropdown-panel', root).forEach(function(p){
    if (p.hidden) return;
    p.hidden = true;
    var field = p.closest('.c-dropdown-field');
    if (!field) return;
    field.classList.remove('open');
    var trig = field.querySelector('.c-dropdown-input');
    if (trig) trig.setAttribute('aria-expanded', 'false');
  });
}

/* Response set — 128 responses against the seed form, generated once from a
   fixed seed so Summary and Individual always agree. */
function buildResponses(qs, n, seed){
  var r = rng(seed), out = [];
  for (var i = 0; i < n; i++){
    var completed = r() > 0.13;              /* ~87% completion */
    var a = {};
    var mood = r();                          /* one respondent-level mood drives every answer */
    var centre = mood > 0.72 ? 4.4 : mood > 0.30 ? 3.6 : 2.4;
    qs.forEach(function(q){
      if (q.type === 'scale'){
        a[q.id] = q.max === 10
          ? skewed(r, 0, 10, Math.round(centre * 2))
          : skewed(r, q.min, q.max, Math.round(centre));
      } else if (q.type === 'yesno'){
        var pYes = q.id === 'q4' ? 0.68 : 0.79;
        a[q.id] = (mood * 0.5 + r() * 0.5) < pYes ? 'Yes' : 'No';
      } else if (q.type === 'long'){
        if (q.dependsOn && a[q.dependsOn] !== q.dependsValue) { a[q.id] = null; return; }
        var p = q.id === 'q6b' ? 0.85 : (q.id === 'q9' ? 0.42 : 0.38);
        a[q.id] = r() < p
          ? pick(r, q.id === 'q10' ? IMPROVEMENTS : FRUSTRATIONS)
          : null;
      }
    });
    if (!completed){ a['q8'] = null; a['q9'] = null; a['q10'] = null; }
    out.push({
      id: 'r' + (i + 1),
      who: pick(r, PEOPLE),
      pod: pick(r, PODS),
      at: new Date(NOW.getTime() - Math.floor(r() * 19 * 86400000)),
      seconds: Math.round(60 + r() * 240),
      complete: completed,
      answers: a
    });
  }
  out.sort(function(x, y){ return y.at - x.at; });
  return out;
}

              /* Which list the record modal is paging through, and where in
                 it — the pager walks the view the reader opened the record
                 from, so it has to be captured at open time. */
              recIds:[], recIndex:0, recMode:'user' };

function go(route, opts){
  opts = opts || {};
  destroyCharts();
  state.route = route;
  if (opts.formId !== undefined) state.formId = opts.formId;
  state.section = (route === 'hub' || route === 'builder') ? 'forms' : 'bugs';
  render();
  window.scrollTo(0, 0);
}

/* The three bug routes render their whole body on entry, so the one being
   left has nothing worth keeping — and leaving it in the document means
   every document-wide lookup (and every duplicate id) can still reach it. */
var DYNAMIC_ROUTES = { bugNew:'#routeBugNew', bugMine:'#routeBugMine', bugAdmin:'#routeBugAdmin' };

function render(){
  ['#routeHub','#routeBuilder','#routeBugNew','#routeBugMine','#routeBugAdmin'].forEach(function(s){ $(s).hidden = true; });
  Object.keys(DYNAMIC_ROUTES).forEach(function(r){
    if (r !== state.route) $(DYNAMIC_ROUTES[r]).innerHTML = '';
  });
  $$('#sectionTabs .c-tab').forEach(function(t){
    var on = t.dataset.section === state.section;
    t.classList.toggle('active', on); t.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  $('#phActions').innerHTML = '';

  if (state.route === 'hub')            renderHub();
  else if (state.route === 'builder')   renderBuilder();
  else if (state.route === 'bugNew')    renderBugNew();
  else if (state.route === 'bugMine')   renderBugMine();
  else if (state.route === 'bugAdmin')  renderBugAdmin();
}

function setHeader(title, sub, actionsHtml){
  $('#phTitle').textContent = title;
  $('#phSub').textContent = sub;
  $('#phActions').innerHTML = actionsHtml || '';
}

$$('#sectionTabs .c-tab').forEach(function(t){
  t.addEventListener('click', function(){
    /* The bugs section lands on the reporter's own tickets, not the blank
       report form: the common case for someone opening this tab is checking
       what happened to what they already sent, and Report a bug is one
       primary CTA away in the page header. */
    go(t.dataset.section === 'forms' ? 'hub' : 'bugMine');
  });
});
$('#navFeedback').addEventListener('click', function(){ go('hub'); });

/* ==========================================================================
   Feedback Hub
   ========================================================================== */
function formCount(f){ return f.responses.length || f.count || 0; }

/* --------------------------------------------------------------------------
   Search
   Character-aligned case/diacritic fold. Every output character records the
   index of the original character it came from, so a match found in the
   folded string can be mapped back onto the real text for highlighting.
   A plain `.normalize('NFD').replace(...)` cannot do that: a precomposed
   "ë" folds 1→1 but an already-decomposed "e"+U+0308 folds 2→1, so indices
   drift by an unpredictable amount and the highlight lands on the wrong
   letters.
   -------------------------------------------------------------------------- */
function fold(text){
  text = String(text);
  var out = '', map = [];
  for (var i = 0; i < text.length; i++){
    var c = text[i].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    for (var j = 0; j < c.length; j++){ out += c[j]; map.push(i); }
  }
  map.push(text.length);
  return { s:out, map:map };
}
/* Terms, not one string. The old search matched the whole query as a single
   substring of the title alone, so "Q3 product" found nothing in "Product
   experience survey — Q3", and no query at all could reach a description. */
function terms(q){ return fold(q).s.split(/\s+/).filter(Boolean); }
function matchAll(haystack, ts){
  var h = fold(haystack).s;
  return ts.every(function(t){ return h.indexOf(t) !== -1; });
}
/* Mark the matched runs, so a row that came back on a description or a
   status word says why rather than looking like a false positive. */
function mark(text, ts){
  text = String(text);
  if (!ts.length) return esc(text);
  var f = fold(text), hits = [];
  ts.forEach(function(t){
    var from = 0, i;
    while ((i = f.s.indexOf(t, from)) !== -1){ hits.push([i, i + t.length]); from = i + t.length; }
  });
  if (!hits.length) return esc(text);
  hits.sort(function(a, b){ return a[0] - b[0]; });
  var merged = [hits[0].slice()];
  hits.slice(1).forEach(function(h){
    var last = merged[merged.length - 1];
    if (h[0] <= last[1]) last[1] = Math.max(last[1], h[1]);
    else merged.push(h.slice());
  });
  var out = '', at = 0;
  merged.forEach(function(h){
    var a = f.map[h[0]], b = f.map[h[1]];
    out += esc(text.slice(at, a)) + '<mark class="hit">' + esc(text.slice(a, b)) + '</mark>';
    at = b;
  });
  return out + esc(text.slice(at));
}
/* What a form is searchable by. Status words are in here on purpose —
   "closed" is a thing people type into a search box. */
function formHaystack(f){
  return f.title + ' ' + f.desc + ' ' +
    (f.status === 'active' ? 'active open live' : 'closed archived');
}

function renderHub(){
  $('#routeHub').hidden = false;
  setHeader('Feedback', 'Collect feedback from your team and triage the bugs they report.',
    '<button class="c-btn c-btn-primary c-btn-md" type="button" id="newFormBtn"><i class="ph ph-plus"></i>New survey</button>');
  $('#newFormBtn').addEventListener('click', newForm);

  var ts = terms(state.hubQuery);
  /* Chip counts count what the current query can actually reach, not the
     whole library. A chip reading "Closed 2" beside a search returning one
     row is the chip contradicting its own filter. */
  var found = FORMS.filter(function(f){ return matchAll(formHaystack(f), ts); });
  $('#cntAll').textContent = found.length;
  $('#cntActive').textContent = found.filter(function(f){ return f.status === 'active'; }).length;
  $('#cntClosed').textContent = found.filter(function(f){ return f.status === 'closed'; }).length;

  var list = found.filter(function(f){
    return state.hubStatus === 'all' || f.status === state.hubStatus;
  });

  var cnt = $('#hubSearchCount');
  if (ts.length){
    cnt.hidden = false;
    cnt.textContent = list.length + (list.length === 1 ? ' form matches ' : ' forms match ') +
      '“' + state.hubQuery.trim() + '”' +
      (state.hubStatus === 'all' ? '' : ' in ' + state.hubStatus + ' forms');
  } else {
    cnt.hidden = true; cnt.textContent = '';
  }

  var host = $('#hubList');
  if (!list.length){
    host.innerHTML = '<div class="c-empty is-section">' +
      '<i class="ph ph-magnifying-glass" aria-hidden="true"></i>' +
      '<h4>No forms match</h4>' +
      '<p>' + (ts.length ? 'Nothing matching &ldquo;' + esc(state.hubQuery.trim()) + '&rdquo;' +
                   (state.hubStatus !== 'all' ? ' in ' + state.hubStatus + ' forms' : '') + '.'
                 : 'There are no ' + state.hubStatus + ' forms yet.') + '</p>' +
      '<div class="c-empty-actions"><button class="c-btn c-btn-secondary c-btn-md" type="button" id="clearHub">Clear filters</button></div>' +
      '</div>';
    $('#clearHub').addEventListener('click', function(){
      state.hubStatus = 'all';
      $$('.c-chip-filter').forEach(function(c){ c.classList.toggle('is-active', c.dataset.status === 'all'); });
      clearHubSearch();
    });
    return;
  }

  host.innerHTML = state.hubView === 'grid' ? hubGrid(list, ts) : hubRows(list, ts);
  $$('[data-form]', host).forEach(function(b){
    b.addEventListener('click', function(){ go('builder', { formId:b.dataset.form }); });
  });
}

function statusBadge(f){
  return '<span class="c-badge ' + (f.status === 'active' ? 'c-badge-success' : 'c-badge-neutral') + '">' +
    (f.status === 'active' ? 'Active' : 'Closed') + '</span>';
}

/* Grid — Card's Functional grid and its Interactive variant, rendered as a
   <button> so the whole tile is the target, matching what the list rows
   already do. */
function hubGrid(list, ts){
  return '<div class="lib-grid">' + list.map(function(f){
    var n = formCount(f);
    return '<button class="c-card c-card-interactive lib-card" type="button" data-form="' + f.id + '">' +
      '<span class="row between" style="align-items:flex-start">' + statusBadge(f) +
        '<i class="ph ph-arrow-up-right" aria-hidden="true" style="color:var(--color-neutral-4)"></i></span>' +
      '<span class="lib-card-title">' + mark(f.title, ts) + '</span>' +
      '<span class="lib-card-desc">' + (f.desc ? mark(f.desc, ts) : 'No description yet.') + '</span>' +
      '<span class="lib-card-foot">' +
        '<span><b>' + n.toLocaleString() + '</b> <span class="lib-row-meta">' +
          (n === 1 ? 'response' : 'responses') + '</span></span>' +
        '<span class="lib-row-meta">Updated ' + fmtDate(f.updated) + '</span>' +
      '</span>' +
    '</button>';
  }).join('') + '</div>';
}

function hubRows(list, ts){
  return '<div class="lib">' + list.map(function(f){
    var n = formCount(f);
    return '<button class="lib-row" type="button" data-form="' + f.id + '">' +
      '<span class="grow stack sm">' +
        '<span class="lib-row-title">' + mark(f.title, ts) + '</span>' +
        '<span class="lib-row-meta">Updated ' + fmtDate(f.updated) + '</span>' +
      '</span>' +
      statusBadge(f) +
      '<span class="lib-row-num"><b>' + n.toLocaleString() + '</b>' +
        '<span class="lib-row-meta">' + (n === 1 ? 'response' : 'responses') + '</span></span>' +
      '<i class="ph ph-caret-right" aria-hidden="true" style="color:var(--color-neutral-4)"></i>' +
    '</button>';
  }).join('') + '</div>';
}

/* Wired once, not per render: #hubViewSeg, the chips and the search box are
   all persistent DOM, so re-binding them inside renderHub would add one
   listener per keystroke. */
$$('.c-chip-filter').forEach(function(c){
  c.addEventListener('click', function(){
    state.hubStatus = c.dataset.status;
    $$('.c-chip-filter').forEach(function(x){ x.classList.toggle('is-active', x === c); });
    renderHub();
  });
});
wireSeg($('#hubViewSeg'), state.hubView === 'grid' ? 0 : 1, function(i){
  state.hubView = i ? 'list' : 'grid';
  renderHub();
});

function clearHubSearch(){
  state.hubQuery = '';
  $('#hubSearch').value = '';
  $('#hubSearchClear').hidden = true;
  renderHub();
  $('#hubSearch').focus();
}
$('#hubSearch').addEventListener('input', function(e){
  state.hubQuery = e.target.value;
  $('#hubSearchClear').hidden = !e.target.value;
  renderHub();
});
$('#hubSearch').addEventListener('keydown', function(e){
  /* Escape clears the field rather than falling through to the global
     handler, which would otherwise close a layer the reader never opened. */
  if (e.key === 'Escape' && $('#hubSearch').value){ e.stopPropagation(); clearHubSearch(); }
});
$('#hubSearchClear').addEventListener('click', clearHubSearch);

function newForm(){
  var f = { id:'f' + (FORMS.length + 1), title:'Untitled survey', status:'closed',
    desc:'', updated:new Date(NOW), questions:[], responses:[],
    settings:{ sendCopy:false, allowEdit:false, oneResponse:true, progressBar:true,
               confirm:'Thanks for your feedback!' } };
  FORMS.unshift(f);
  go('builder', { formId:f.id });
  toast('New survey created');
}

/* ==========================================================================
   Form builder
   ========================================================================== */
function currentForm(){ return FORMS.filter(function(f){ return f.id === state.formId; })[0]; }

function renderBuilder(){
  var f = currentForm();
  if (!f){ go('hub'); return; }
  $('#routeBuilder').hidden = false;
  setHeader(f.title, f.status === 'active' ? 'Active · accepting responses' : 'Not published',
    '<button class="c-btn c-btn-secondary c-btn-md" type="button" id="backHub"><i class="ph ph-arrow-left"></i>All forms</button>');
  $('#backHub').addEventListener('click', function(){ go('hub'); });

  $('#qCount').textContent = f.questions.length;
  $('#rCount').textContent = formCount(f);
  $$('#builderTabs .c-tab').forEach(function(t){
    var on = t.dataset.btab === state.btab;
    t.classList.toggle('active', on); t.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  $('#tabQuestions').hidden = state.btab !== 'questions';
  $('#tabResponses').hidden = state.btab !== 'responses';
  $('#tabSettings').hidden  = state.btab !== 'settings';

  if (state.btab === 'questions')      renderQuestions(f);
  else if (state.btab === 'responses') renderResponses(f);
  else                                 renderSettings(f);
}

$$('#builderTabs .c-tab').forEach(function(t){
  t.addEventListener('click', function(){
    destroyCharts(); state.btab = t.dataset.btab; state.respIndex = 0; renderBuilder();
  });
});

/* Toolbar */
$$('.toolbar [data-tb]').forEach(function(b){
  b.addEventListener('click', function(){
    var f = currentForm(), a = b.dataset.tb;
    if (a === 'publish'){ f.status = 'active'; f.updated = new Date(NOW); renderBuilder(); toast('Form published — it is now accepting responses', 'success'); }
    else if (a === 'link'){ toast('Shareable link copied to clipboard', 'success'); }
    else if (a === 'preview'){ toast('Preview opens the form as a responder sees it'); }
    else if (a === 'users'){ toast('Add users — manage responders and editors'); }
    else if (a === 'undo'){ toast('Nothing to undo'); }
    else if (a === 'redo'){ toast('Nothing to redo'); }
  });
});
$('#kebabBtn').addEventListener('click', function(e){
  e.stopPropagation();
  var m = $('#kebabMenu'), open = m.hidden;
  m.hidden = !open; $('#kebabBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
});
/* One document-level handler closes every popover in the prototype. Adding a
   listener per render leaks one handler per navigation.
   Panels are found by class, not held in a registry: a registry has to be
   re-synced by every route re-render, and a stale entry in it points at a
   node that is no longer in the document. */
document.addEventListener('click', function(){
  $('#kebabMenu').hidden = true; $('#kebabBtn').setAttribute('aria-expanded','false');
  closeMenus();
  closeDropdowns();
});
$$('#kebabMenu button').forEach(function(b){
  b.addEventListener('click', function(){
    var f = currentForm();
    if (b.dataset.kb === 'copy'){
      var c = JSON.parse(JSON.stringify({ questions:f.questions, settings:f.settings }));
      FORMS.unshift({ id:'f' + (FORMS.length + 1), title:f.title + ' (copy)', status:'closed',
        desc:f.desc, updated:new Date(NOW), questions:c.questions, responses:[], settings:c.settings });
      go('hub'); toast('Copy created');
    } else {
      FORMS = FORMS.filter(function(x){ return x.id !== f.id; });
      go('hub'); toast('Moved to trash');
    }
  });
});

/* ---------- Tab 1 — Questions ---------- */
function renderQuestions(f){
  var host = $('#tabQuestions');
  host.innerHTML =
    '<div class="c-card stack">' +
      '<label class="c-field field-wide"><span class="eyebrow">Form title</span>' +
        '<div class="input-wrap"><input type="text" id="fTitle" value="' + esc(f.title) + '" /></div></label>' +
      '<label class="c-field field-wide"><span class="eyebrow">Description</span>' +
        '<textarea id="fDesc" rows="2" placeholder="What is this form for?">' + esc(f.desc) + '</textarea></label>' +
    '</div>' +
    '<div id="qList" class="stack"></div>' +
    '<div class="add-bar">' +
      '<button class="c-btn c-btn-secondary c-btn-sm" type="button" data-add="question"><i class="ph ph-plus-circle"></i>Add question</button>' +
      '<button class="c-btn c-btn-ghost c-btn-sm" type="button" data-add="image"><i class="ph ph-image"></i>Add image</button>' +
      '<button class="c-btn c-btn-ghost c-btn-sm" type="button" data-add="video"><i class="ph ph-video"></i>Add video</button>' +
      '<button class="c-btn c-btn-ghost c-btn-sm" type="button" data-add="poll"><i class="ph ph-chart-donut"></i>Add poll</button>' +
    '</div>';

  $('#fTitle').addEventListener('input', function(e){ f.title = e.target.value; $('#phTitle').textContent = e.target.value; });
  $('#fDesc').addEventListener('input', function(e){ f.desc = e.target.value; });
  $$('[data-add]', host).forEach(function(b){
    b.addEventListener('click', function(){ addBlock(f, b.dataset.add); });
  });
  paintQuestions(f);
}

function paintQuestions(f){
  var list = $('#qList');
  if (!f.questions.length){
    list.innerHTML = '<div class="c-empty is-section">' +
      '<i class="ph ph-list-plus" aria-hidden="true"></i><h4>No questions yet</h4>' +
      '<p>Add your first question below. You can reorder blocks by dragging the handle, or with the keyboard.</p></div>';
    $('#qCount').textContent = 0;
    return;
  }
  var n = 0;
  list.innerHTML = f.questions.map(function(q, i){
    var body;
    if (q.type === 'media'){
      body = '<div class="qblock-media"><i class="ph ' + (q.media === 'video' ? 'ph-video' : 'ph-image') +
             '" aria-hidden="true"></i><span class="hint">' +
             (q.media === 'video' ? 'Embedded video' : 'Embedded image') + '</span></div>';
    } else {
      n++;
      body = questionPreview(q);
    }
    var isMedia = q.type === 'media';
    return '<div class="qblock" draggable="true" data-q="' + q.id + '" data-idx="' + i + '">' +
      '<button class="qgrip" type="button" aria-label="Reorder: ' + esc(q.title || 'block') +
        '. Press up or down arrow to move." data-grip="' + i + '"><i class="ph ph-dots-six-vertical" aria-hidden="true"></i></button>' +
      '<div class="qblock-head">' +
        (isMedia ? '' : '<span class="qblock-num">' + n + '</span>') +
        '<div class="grow stack sm">' +
          '<input class="c-dropdown-input" style="border:0;padding:0;height:auto;font-size:var(--text-body1-size);font-weight:700;font-family:inherit;color:var(--color-neutral-9);background:transparent;caret-color:auto;cursor:text;width:100%" value="' + esc(q.title) + '" data-title="' + q.id + '" aria-label="Question text" />' +
          (q.dependsOn ? '<span class="hint"><i class="ph ph-arrow-elbow-down-right" aria-hidden="true"></i> Shown when &ldquo;' + esc(q.dependsValue) + '&rdquo; is selected above</span>' : '') +
        '</div>' +
        '<div class="qblock-actions">' +
          (isMedia ? '' : typeSwitcher(q)) +
          '<button class="c-icon-btn" type="button" title="Duplicate" aria-label="Duplicate" data-dup="' + i + '"><i class="ph ph-copy" aria-hidden="true"></i></button>' +
          '<button class="c-icon-btn" type="button" title="Delete" aria-label="Delete" data-del="' + i + '"><i class="ph ph-trash" aria-hidden="true"></i></button>' +
        '</div>' +
      '</div>' +
      body +
      (isMedia ? '' :
      '<div class="qblock-foot">' +
        '<label class="c-choice switch"><input type="checkbox" data-req="' + i + '"' + (q.required ? ' checked' : '') + ' />' +
          '<span class="c-switch-track' + (q.required ? ' on' : '') + '"><span class="c-switch-thumb"></span></span>' +
          '<span class="text"><span class="label" style="font-size:var(--text-body2-size)">Required</span></span></label>' +
      '</div>') +
    '</div>';
  }).join('');
  $('#qCount').textContent = n;
  wireQuestionBlocks(f);
}

/* Question type switcher — Dropdown's Single select, Borderless, wired for
   real. The type badge used to be display-only, which made four of the six
   documented question types unreachable from the builder. */
function typeSwitcher(q){
  return '<span class="c-field c-dropdown-field style-borderless qtype" style="width:auto">' +
    '<span class="input-wrap has-trailing-icon">' +
      '<input type="text" class="c-dropdown-input" readonly value="' + TYPES[q.type].label + '"' +
        ' data-typetrigger="' + q.id + '" aria-label="Question type" aria-haspopup="listbox" aria-expanded="false" />' +
      '<span class="icon-trailing" aria-hidden="true"><i class="ph ph-caret-down c-dropdown-chevron"></i></span>' +
    '</span>' +
    '<span class="c-dropdown-panel" data-typepanel="' + q.id + '" hidden><span class="c-dropdown-list">' +
      Object.keys(TYPES).map(function(k){
        return '<span class="c-dropdown-row' + (k === q.type ? ' selected' : '') + '" role="option" data-settype="' + k + '">' +
          '<i class="ph ' + TYPES[k].icon + ' c-dropdown-row-media"></i>' +
          '<span class="c-dropdown-row-label">' + TYPES[k].label + '</span>' +
          '<i class="ph ph-check c-dropdown-row-check"></i></span>';
      }).join('') +
    '</span></span>' +
  '</span>';
}

/* Changing type rewrites only the props that type owns, so switching away
   and back doesn't silently keep a stale scale range or option list. */
function setType(q, t){
  q.type = t;
  if (t === 'scale'){
    if (q.min == null){ q.min = 1; q.max = 5; q.lo = 'Not at all'; q.hi = 'Very much'; }
  } else { delete q.min; delete q.max; delete q.lo; delete q.hi; }
  if (t === 'single' || t === 'multi'){
    if (!q.options) q.options = ['Option 1','Option 2','Option 3'];
  } else { delete q.options; }
}

function questionPreview(q){
  if (q.type === 'short')  return '<div class="c-field field-wide"><div class="input-wrap"><input type="text" placeholder="' + esc(q.placeholder || 'Short answer') + '" disabled /></div></div>';
  if (q.type === 'long')   return '<div class="c-field field-wide"><textarea rows="2" placeholder="' + esc(q.placeholder || 'Long answer') + '" disabled></textarea></div>';
  if (q.type === 'yesno')  return '<div class="row tight">' +
      ['Yes','No'].map(function(o){ return '<label class="c-choice"><input type="radio" name="p-' + q.id + '" disabled />' +
        '<span class="c-radio-circle"><span class="dot"></span></span><span class="text"><span class="label" style="font-size:var(--text-body2-size)">' + o + '</span></span></label>'; }).join('') + '</div>';
  if (q.type === 'scale'){
    var opts = '';
    for (var v = q.min; v <= q.max; v++)
      opts += '<label class="c-scale-opt"><input type="radio" name="p-' + q.id + '" disabled /><span>' + v + '</span></label>';
    return '<div class="c-scale"><div class="c-scale-track">' + opts + '</div>' +
      '<div class="c-scale-ends"><span>' + esc(q.lo || '') + '</span><span>' + esc(q.hi || '') + '</span></div></div>';
  }
  if (q.type === 'single' || q.type === 'multi'){
    return '<div class="stack sm">' + (q.options || ['Option 1','Option 2','Option 3']).map(function(o){
      return q.type === 'single'
        ? '<label class="c-choice"><input type="radio" name="p-' + q.id + '" disabled /><span class="c-radio-circle"><span class="dot"></span></span><span class="text"><span class="label" style="font-size:var(--text-body2-size)">' + esc(o) + '</span></span></label>'
        : '<label class="c-choice"><input type="checkbox" disabled /><span class="c-checkbox-box"></span><span class="text"><span class="label" style="font-size:var(--text-body2-size)">' + esc(o) + '</span></span></label>';
    }).join('') + '</div>';
  }
  return '';
}

/* Reorder — real drag-and-drop, with arrow keys on the grip as the
   accessible equivalent. A drag-only reorder is unusable by keyboard and
   unreliable on touch, so both paths write through the same move(). */
var dragFrom = null;
function move(f, from, to){
  if (to < 0 || to >= f.questions.length || from === to) return;
  var it = f.questions.splice(from, 1)[0];
  f.questions.splice(to, 0, it);
  f.updated = new Date(NOW);
  paintQuestions(f);
  var grip = $('[data-grip="' + to + '"]');
  if (grip) grip.focus();
}

function wireQuestionBlocks(f){
  $$('#qList .qblock').forEach(function(block){
    var i = +block.dataset.idx;
    block.addEventListener('dragstart', function(e){
      dragFrom = i; block.classList.add('is-dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(i)); } catch (err) {}
    });
    block.addEventListener('dragend', function(){
      dragFrom = null;
      $$('#qList .qblock').forEach(function(b){
        b.classList.remove('is-dragging','is-drop-target','is-drop-target-after');
      });
    });
    block.addEventListener('dragover', function(e){
      if (dragFrom === null || dragFrom === i) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      block.classList.toggle('is-drop-target', i < dragFrom);
      block.classList.toggle('is-drop-target-after', i > dragFrom);
    });
    block.addEventListener('dragleave', function(){
      block.classList.remove('is-drop-target','is-drop-target-after');
    });
    block.addEventListener('drop', function(e){
      e.preventDefault();
      if (dragFrom !== null && dragFrom !== i) move(f, dragFrom, i);
      dragFrom = null;
    });
  });
  $$('#qList .qgrip').forEach(function(g){
    g.addEventListener('keydown', function(e){
      var i = +g.dataset.grip;
      if (e.key === 'ArrowUp'){ e.preventDefault(); move(f, i, i - 1); }
      if (e.key === 'ArrowDown'){ e.preventDefault(); move(f, i, i + 1); }
    });
  });
  $$('#qList [data-dup]').forEach(function(b){
    b.addEventListener('click', function(){
      var i = +b.dataset.dup;
      var copy = JSON.parse(JSON.stringify(f.questions[i]));
      copy.id = 'q' + Date.now() + Math.floor(Math.random() * 1000);
      delete copy.dependsOn; delete copy.dependsValue;
      f.questions.splice(i + 1, 0, copy);
      paintQuestions(f); toast('Question duplicated');
    });
  });
  $$('#qList [data-del]').forEach(function(b){
    b.addEventListener('click', function(){
      var i = +b.dataset.del, q = f.questions[i];
      /* A dependent follow-up cannot outlive its parent. */
      f.questions = f.questions.filter(function(x, j){
        return j !== i && x.dependsOn !== q.id;
      });
      paintQuestions(f); toast('Question deleted');
    });
  });
  $$('#qList [data-req]').forEach(function(c){
    c.addEventListener('change', function(){
      f.questions[+c.dataset.req].required = c.checked;
      c.nextElementSibling.classList.toggle('on', c.checked);
    });
  });
  $$('#qList [data-typetrigger]').forEach(function(trig){
    var id = trig.dataset.typetrigger;
    var panel = $('[data-typepanel="' + id + '"]');
    var field = trig.closest('.c-dropdown-field');
    trig.addEventListener('click', function(e){
      e.stopPropagation();
      var open = panel.hidden;
      closeDropdowns($('#qList'));
      panel.hidden = !open;
      field.classList.toggle('open', open);
      trig.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    $$('[data-settype]', panel).forEach(function(row){
      row.addEventListener('click', function(){
        var q = f.questions.filter(function(x){ return x.id === id; })[0];
        if (!q) return;
        setType(q, row.dataset.settype);
        f.updated = new Date(NOW);
        paintQuestions(f);
        toast('Changed to ' + TYPES[q.type].label);
      });
    });
  });
  $$('#qList [data-title]').forEach(function(inp){
    inp.addEventListener('input', function(){
      var q = f.questions.filter(function(x){ return x.id === inp.dataset.title; })[0];
      if (q) q.title = inp.value;
    });
  });
}

function addBlock(f, kind){
  var id = 'q' + Date.now() + Math.floor(Math.random() * 1000);
  if (kind === 'image' || kind === 'video'){
    f.questions.push({ id:id, type:'media', media:kind, title:kind === 'video' ? 'Video' : 'Image' });

    f.questions.push({ id:id, type:'single', title:'Quick poll — which would you rather have first?',
      required:false, options:['Saved filters','Bulk export','Dark mode'] });
  } else {
    f.questions.push({ id:id, type:'short', title:'Untitled question', required:false });

  if (blocks.length){
    blocks[blocks.length - 1].scrollIntoView({ block:'nearest' });
    var t = $('[data-title]', blocks[blocks.length - 1]);

}

function statCard(label, value, icon, sub){

    (sub ? '<span class="hint">' + esc(sub) + '</span>' : '') +

/* Segmented Control's pill is positioned in JS from the track — same
   mechanic preview.html uses, not a second implementation. */
function wireSeg(track, activeIdx, onChange){
  var segs = $$('.c-seg', track), pill = $('.c-seg-pill', track);
  function place(i){
    var s = segs[i];
    pill.style.width = s.offsetWidth + 'px';
    pill.style.height = s.offsetHeight + 'px';
    pill.style.transform = 'translate(' + (s.offsetLeft - track.clientLeft) + 'px,' + (s.offsetTop - track.clientTop) + 'px)';
    segs.forEach(function(x, j){
      x.setAttribute('aria-selected', j === i ? 'true' : 'false');
      x.style.color = j === i ? 'var(--color-neutral-9)' : '';
      x.style.fontWeight = j === i ? '700' : '';
    });
  }
  segs.forEach(function(s, i){
    s.addEventListener('click', function(){ track.dataset.active = i; place(i); onChange(i); });
  });
  place(activeIdx);
  var onResize = function(){ if (document.contains(track)) place(+track.dataset.active || activeIdx); else window.removeEventListener('resize', onResize); };
  window.addEventListener('resize', onResize);
}

function paintRespBody(f){
  var host = $('#respBody');
  if (state.respView === 'individual'){ paintIndividual(f, host); return; }
  $('#respMeta').textContent = 'Aggregated across ' + f.responses.length + ' responses';

  var html = '', charts = [];
  f.questions.forEach(function(q){
    if (q.type === 'media') return;
    var rows = answered(f, q);
    var id = 'ch-' + q.id;

    if (q.type === 'scale'){
      var buckets = [], labels = [];
      for (var v = q.min; v <= q.max; v++){ labels.push(String(v)); buckets.push(0); }
      rows.forEach(function(r){ buckets[r.answers[q.id] - q.min]++; });
      var avg = rows.reduce(function(s, r){ return s + r.answers[q.id]; }, 0) / (rows.length || 1);
      html += chartCard(id, q.title,
        'Average ' + avg.toFixed(2) + ' out of ' + q.max + ' · ' + rows.length + ' answers',
        labels.map(function(l, i){ return [l, buckets[i], pct(buckets[i], rows.length)]; }),
        ['Score','Responses','Share']);
      charts.push({ id:id, kind:'scale', labels:labels, data:buckets, q:q });

    } else if (q.type === 'yesno'){
      var yes = rows.filter(function(r){ return r.answers[q.id] === 'Yes'; }).length;
      var no = rows.length - yes;
      html += chartCard(id, q.title, pct(yes, rows.length) + ' answered Yes · ' + rows.length + ' answers',
        [['Yes', yes, pct(yes, rows.length)], ['No', no, pct(no, rows.length)]],
        ['Answer','Responses','Share']);
      charts.push({ id:id, kind:'yesno', data:[yes, no], q:q });

    } else if (q.type === 'single' || q.type === 'multi'){
      var opts = q.options || [], counts = opts.map(function(){ return 0; });
      rows.forEach(function(r){
        var a = r.answers[q.id];
        (Array.isArray(a) ? a : [a]).forEach(function(v){
          var i = opts.indexOf(v); if (i > -1) counts[i]++;
        });
      });
      html += chartCard(id, q.title, rows.length + ' answers',
        opts.map(function(o, i){ return [o, counts[i], pct(counts[i], rows.length)]; }),
        ['Option','Responses','Share']);
      charts.push({ id:id, kind:q.type, labels:opts, data:counts, q:q });

    } else {
      /* Open text — a list, not a chart, with its own search and its own
         Summarise with AI action. The action is offered only where there is
         something to summarise; under three answers the list *is* the
         summary. */
      html += '<div class="c-card stack">' +
        '<div class="row between"><h5 style="margin:0">' + esc(q.title) + '</h5>' +
        '<span class="row tight">' +

            : '') +

          '<input type="search" placeholder="Search answers" aria-label="Search answers to: ' + esc(q.title) + '" data-tsearch="' + q.id + '" />' +
        '</div></div>' +

          rows.map(function(r){
            return '<div class="resp-item" data-text="' + esc(String(r.answers[q.id]).toLowerCase()) + '">' +
              esc(r.answers[q.id]) + '<span class="who">' + esc(r.who) + ' · ' + esc(r.pod) + ' · ' + fmtDate(r.at) + '</span></div>';
          }).join('') +

  host.innerHTML = html;

    inp.addEventListener('input', function(){
      var v = inp.value.trim().toLowerCase();
      var list = $('[data-tlist="' + inp.dataset.tsearch + '"]', host);
      var shown = 0;
      $$('.resp-item', list).forEach(function(it){
        var hit = !v || it.dataset.text.indexOf(v) !== -1;
        it.hidden = !hit; if (hit) shown++;
      });
      $('[data-tempty="' + inp.dataset.tsearch + '"]', host).hidden = shown > 0;
