var NOW = new Date(2026, 8, 8, 10, 30);

/* Screenshot stand-ins. Real bug reports carry real screenshots; this is a
   file:// prototype with no network, so each one is a generated SVG data
   URI of a plausible app frame rather than an external image that would
   silently 404. */
function shot(seed, caption){
  var r = rng(seed);
  var bars = '';
  for (var i = 0; i < 5; i++){
    var w = 40 + Math.floor(r() * 120);
    bars += '<rect x="16" y="' + (56 + i * 18) + '" width="' + w + '" height="8" rx="4" fill="#E0E0E0"/>';
  }
  var accent = pick(r, ['#FF5825','#1473E6','#00C26E','#FFA425','#FF7A90']);
  var svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">' +
    '<rect width="320" height="200" fill="#FAFAFA"/>' +
    '<rect width="320" height="28" fill="#F0F0F0"/>' +
    '<circle cx="14" cy="14" r="4" fill="#FD3343"/><circle cx="28" cy="14" r="4" fill="#FFA425"/><circle cx="42" cy="14" r="4" fill="#00C26E"/>' +
    '<rect x="0" y="28" width="72" height="172" fill="#F0F0F0"/>' +
    '<rect x="12" y="40" width="48" height="6" rx="3" fill="#E0E0E0"/>' +
    '<rect x="12" y="54" width="40" height="6" rx="3" fill="#E0E0E0"/>' +
    '<rect x="88" y="40" width="140" height="10" rx="5" fill="#BDBDBD"/>' +
    '<g transform="translate(72,0)">' + bars + '</g>' +
    '<rect x="232" y="150" width="72" height="26" rx="12" fill="' + accent + '"/>' +
    '<text x="88" y="192" font-family="sans-serif" font-size="9" fill="#9E9E9E">' + esc(caption) + '</text>' +
    '</svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

/* Toast, built to the component's own recipe rather than a lookalike.
   Three things were off before:
   - the icon carried no `tone` class, so it missed the 2px optical offset
     that lands it on the first line of text, and set its size and colour
     from inline styles instead of the component's tokens;
   - it was `ph` (Regular) where Iconography puts status icons on Fill;
   - the message was a bare <p>, whose 1em UA margin pushed the text 16px
     below the icon and made a one-line toast 80px tall. Toast's own markup
     uses a <div> here, which is why the component never had to defend
     against it. */
function toast(msg, tone){
  var host = $('#toastHost');
  var t = document.createElement('div');
  t.className = 'c-toast is-message-only is-entering';
  t.setAttribute('role', 'status');
  t.innerHTML =
    '<i class="ph-fill ' + (tone === 'success' ? 'ph-check-circle' : 'ph-info') +
      ' tone ' + (tone === 'success' ? 'tone-success' : 'tone-neutral') + '" aria-hidden="true"></i>' +
    '<div class="body"><div class="message">' + esc(msg) + '</div></div>';
  host.appendChild(t);
  /* Reflow before dropping .is-entering, so the browser has a frame to
     transition from — the same reason the record modal forces one. */
  void t.offsetWidth;
  t.classList.remove('is-entering');
  setTimeout(function(){
    t.classList.add('is-exiting');
    setTimeout(function(){ t.remove(); }, 260);
  }, 2600);
}

/* Close every open Dropdown panel under `root` (the document by default),
   restoring the field's open class and the trigger's aria-expanded. Used by
   the document-level click handler and by any trigger that has to close its
   siblings before opening itself. */
function closeDropdowns(root){
  $$('.c-dropdown-panel', root).forEach(function(p){
    if (p.hidden) return;
    p.hidden = true;
    var field = p.closest('.c-dropdown-field');
    if (!field) return;
    field.classList.remove('open');
    var trig = field.querySelector('.c-dropdown-input');
    if (trig) trig.setAttribute('aria-expanded', 'false');
  });
  /* Date picker panels close the same way and through the same handler —
     they are the other popover in this file that has to shut when the
     reader clicks anywhere else. */
  $$('.c-dp-panel', root).forEach(function(p){
    if (p.hidden) return;
    p.hidden = true;
    var trig = p.parentNode.querySelector('[data-dptrigger]');
    if (trig) trig.setAttribute('aria-expanded', 'false');
  });

   Data
   ========================================================================== */
var PODS = ['CollabSales','CollabMedia','CollabContent','CollabInfluence','CollabStudio'];
var ME = { name:'Aisyah Rahman', pods:['CollabMedia','CollabContent'] };

var PEOPLE = ['Jason Lim','Nurul Kamal','Tan Wei Ming','Priya Nair','Daniel Wong','Siti Aminah',
  'Marcus Tan','Farah Idris','Kelvin Cheah','Rachel Ong','Hafiz Rahman','Yee Ling Chong'];

/* Incident priority — a four-step severity ramp. Each step carries what it
   actually means, because "High" on its own is a word the reporter and the
   person triaging will read differently every time. */
var PRIORITIES = {
  p1:{ short:'P1', name:'Critical', desc:'Work is stopped and there is no workaround' },
  p2:{ short:'P2', name:'High',     desc:'A core task is broken; the workaround costs real time' },
  p3:{ short:'P3', name:'Medium',   desc:'Something is wrong but the work still gets done' },

/* Response set — 128 responses against the seed form, generated once from a
   fixed seed so Summary and Individual always agree. */
function buildResponses(qs, n, seed){
  var r = rng(seed), out = [];
  for (var i = 0; i < n; i++){
    var completed = r() > 0.13;              /* ~87% completion */
    var a = {};
    var mood = r();                          /* one respondent-level mood drives every answer */
    var centre = mood > 0.72 ? 4.4 : mood > 0.30 ? 3.6 : 2.4;
    qs.forEach(function(q){
      if (q.type === 'scale'){
        a[q.id] = q.max === 10
          ? skewed(r, 0, 10, Math.round(centre * 2))
          : skewed(r, q.min, q.max, Math.round(centre));
      } else if (q.type === 'yesno'){
        var pYes = q.id === 'q4' ? 0.68 : 0.79;
        a[q.id] = (mood * 0.5 + r() * 0.5) < pYes ? 'Yes' : 'No';
      } else if (q.type === 'long'){
        if (q.dependsOn && a[q.dependsOn] !== q.dependsValue) { a[q.id] = null; return; }
        var p = q.id === 'q6b' ? 0.85 : (q.id === 'q9' ? 0.42 : 0.38);
        a[q.id] = r() < p
          ? pick(r, q.id === 'q10' ? IMPROVEMENTS : FRUSTRATIONS)
          : null;
      }
    });
    if (!completed){ a['q8'] = null; a['q9'] = null; a['q10'] = null; }
    out.push({
      id: 'r' + (i + 1),
      who: pick(r, PEOPLE),
      pod: pick(r, PODS),
      at: new Date(NOW.getTime() - Math.floor(r() * 19 * 86400000)),
      seconds: Math.round(60 + r() * 240),
      complete: completed,
      answers: a
    });
  }
  out.sort(function(x, y){ return y.at - x.at; });
  return out;
}

/* --------------------------------------------------------------------------
   Time frame, as the library reads it
   -------------------------------------------------------------------------- */
function rangeLabel(f){
  if (!f.starts && !f.ends) return 'No fixed dates';
  if (!f.ends)   return 'Open since ' + fmtDate(f.starts);
  if (!f.starts) return 'Until ' + fmtDate(f.ends);
  /* Drop the repeated year off the start date where both fall in one year —
     "1 Jul – 30 Sep 2026" says everything "1 Jul 2026 – 30 Sep 2026" does. */
  return (f.starts.getFullYear() === f.ends.getFullYear() ? fmtDayMon(f.starts) : fmtDate(f.starts)) +
    ' – ' + fmtDate(f.ends);
}
/* Days to close, or null where there is nothing to count down to — the
   caller needs to tell "no deadline" apart from "closes today". */
function closesIn(f){ return f.ends ? daysBetween(NOW, f.ends) : null; }
function deadline(f){
  var n = closesIn(f);
  if (n === null)  return { text:'No deadline',  tone:'none', icon:'ph-infinity' };
  if (n < 0)       return { text:'Ended ' + fmtDate(f.ends), tone:'past', icon:'ph-check-circle' };
  if (n === 0)     return { text:'Closes today', tone:'soon', icon:'ph-clock-countdown' };
  if (n === 1)     return { text:'Closes tomorrow', tone:'soon', icon:'ph-clock-countdown' };
  return { text:'Closes in ' + n + ' days', tone: n <= 7 ? 'soon' : 'open',
           icon: n <= 7 ? 'ph-clock-countdown' : 'ph-calendar-dots' };
}
function deadlinePill(f){
  var d = deadline(f);
  return '<span class="c-badge ' + (d.tone === 'soon' ? 'c-badge-warning' : 'c-badge-neutral') + '">' +
    '<i class="ph ' + d.icon + '" aria-hidden="true"></i>' + esc(d.text) + '</span>';
}

var BUG_STATUS = {
  'new':      { label:'New',         badge:'c-badge-warning' },
  'progress': { label:'In Progress', badge:'c-badge-neutral' },
  'resolved': { label:'Resolved',    badge:'c-badge-success' }
};

/* Whose turn the thread is on. Derived from the comments themselves, never
   stored — a stored flag goes stale the moment either side posts, and the
   whole point of the state is that it is always current.
     'awaiting' — the team spoke last, so the ball is with the reporter.
     'replied'  — the reporter spoke last, so the ball is back with the team
                  and the ticket needs picking up.
     null       — nobody has said anything yet, or the ticket is closed.
   Who spoke last is the whole rule. There is no separate "this one is a
   question" flag: every comment reaches the other side and every comment
   is worth reading, so marking some of them as the ones that count meant
   an unflagged reply sat in a thread nobody was told to look at.
   A resolved ticket is not waiting on anybody, so it drops out of the
   handover entirely and the Status column goes back to saying Resolved. */
function threadState(b){
  var c = b.comments || [];
  if (!c.length || b.status === 'resolved') return null;
  return c[c.length - 1].role === 'team' ? 'awaiting' : 'replied';
}
var THREAD_STATE = {
  awaiting:{ admin:'Awaiting response',  user:'Response needed', icon:'ph-fill ph-question',           badge:'c-badge-warning' },
  replied: { admin:'Reply received',    user:'Reply sent',    icon:'ph-fill ph-arrow-bend-up-left',  badge:'badge-water' }
};
/* The badge says the same fact from either side of the ticket: the team
   reads "Awaiting response", the person who filed it reads "Response
   needed" — the second one is addressed to them, so it names the thing they
   have to do rather than the state the queue is in. */
function threadBadge(b, mode){
  var t = threadState(b);
  if (!t) return '';
  var m = THREAD_STATE[t];
  return '<span class="c-badge ' + m.badge + '"><i class="' + m.icon + '" aria-hidden="true"></i>' +
    m[mode] + '</span>';
}
/* Comments in the table were a 12px counter tucked in after the title, which
   is invisible in a scan of eleven rows. Own column, own pill — and neutral,
   because it answers "how much conversation is on this ticket", not "whose
   turn is it". The Status column next to it already carries the turn, and
   tinting both made one fact look like two. */
function cmtPill(b){
  var n = (b.comments || []).length;
  if (!n) return '<span class="muted">—</span>';
  return '<span class="cmt-pill">' +
    '<i class="ph-fill ph-chat-circle" aria-hidden="true"></i>' + n + '</span>';
}

  return c.length ? c[c.length - 1].at : b.at;
}

   Feedback Hub
   ========================================================================== */
function formCount(f){ return f.responses.length || f.count || 0; }

/* --------------------------------------------------------------------------
   Search
   Character-aligned case/diacritic fold. Every output character records the
   index of the original character it came from, so a match found in the
   folded string can be mapped back onto the real text for highlighting.
   A plain `.normalize('NFD').replace(...)` cannot do that: a precomposed
   "ë" folds 1→1 but an already-decomposed "e"+U+0308 folds 2→1, so indices
   drift by an unpredictable amount and the highlight lands on the wrong
   letters.
   -------------------------------------------------------------------------- */
function fold(text){
  text = String(text);
  var out = '', map = [];
  for (var i = 0; i < text.length; i++){
    var c = text[i].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    for (var j = 0; j < c.length; j++){ out += c[j]; map.push(i); }
  }
  map.push(text.length);
  return { s:out, map:map };
}
/* Terms, not one string. The old search matched the whole query as a single
   substring of the title alone, so "Q3 product" found nothing in "Product
   experience survey — Q3", and no query at all could reach a description. */
function terms(q){ return fold(q).s.split(/\s+/).filter(Boolean); }
function matchAll(haystack, ts){
  var h = fold(haystack).s;
  return ts.every(function(t){ return h.indexOf(t) !== -1; });
}
/* Mark the matched runs, so a row that came back on a description or a
   status word says why rather than looking like a false positive. */
function mark(text, ts){
  text = String(text);
  if (!ts.length) return esc(text);
  var f = fold(text), hits = [];
  ts.forEach(function(t){
    var from = 0, i;
    while ((i = f.s.indexOf(t, from)) !== -1){ hits.push([i, i + t.length]); from = i + t.length; }
  });
  if (!hits.length) return esc(text);
  hits.sort(function(a, b){ return a[0] - b[0]; });
  var merged = [hits[0].slice()];
  hits.slice(1).forEach(function(h){
    var last = merged[merged.length - 1];
    if (h[0] <= last[1]) last[1] = Math.max(last[1], h[1]);
    else merged.push(h.slice());
  });
  var out = '', at = 0;
  merged.forEach(function(h){
    var a = f.map[h[0]], b = f.map[h[1]];
    out += esc(text.slice(at, a)) + '<mark class="hit">' + esc(text.slice(a, b)) + '</mark>';
    at = b;
  });
  return out + esc(text.slice(at));
}
/* What a form is searchable by. Status words are in here on purpose —
   "closed" is a thing people type into a search box. */
function formHaystack(f){
  return f.title + ' ' + f.desc + ' ' +
    /* The owning department is on the tile now, so it has to be typeable —
       a signal you can see but not search for is a dead end. */
    (f.owner ? f.owner.name + ' ' : '') +
    (f.status === 'active' ? 'active open live' : 'closed ended') + ' ' +
    (f.archived ? 'archived archive' : '') + ' ' +
    (f.ends ? rangeLabel(f) : 'no deadline open ended ongoing');
}

function renderHub(){

  setBack('Feedback', 'landing');
  $('#newFormBtn').addEventListener('click', newForm);

  paintHubSort();

  var ts = terms(state.hubQuery);
  /* Chip counts count what the current query can actually reach, not the
     whole library. A chip reading "Closed 2" beside a search returning one
     row is the chip contradicting its own filter. */
  var found = FORMS.filter(function(f){ return matchAll(formHaystack(f), ts); });
  /* Archived surveys are out of the library entirely — they are not part of
     "All", which is why their count lives on its own chip. */
  var live = found.filter(function(f){ return !f.archived; });
  var filed = found.filter(function(f){ return f.archived; });

  } else if (archiveView){

  var host = $('#hubList');

    host.innerHTML = '<div class="c-empty is-section">' +

      '<p>' + (ts.length ? 'Nothing matching &ldquo;' + esc(state.hubQuery.trim()) + '&rdquo;' +
                   (state.hubStatus !== 'all' ? ' in ' + (archiveView ? 'the archive' : state.hubStatus + ' forms') : '') + '.'
                 : archiveView ? 'Nothing has been archived yet.'
                 : 'There are no ' + state.hubStatus + ' forms yet.') + '</p>' +
      '<div class="c-empty-actions"><button class="c-btn c-btn-secondary c-btn-md" type="button" id="clearHub">Clear filters</button></div>' +
      '</div>';

  list = hubSorted(list);
  host.innerHTML = state.hubView === 'grid' ? hubGrid(list, ts) : hubTable(list, ts);
  $$('[data-form]', host).forEach(function(b){
    b.addEventListener('click', function(){ go('builder', { formId:b.dataset.form }); });
    /* A table row is not a button, so it has to answer the keyboard itself
       — the grid's tiles already are buttons and get this for free. */

    });

  /* Header sort — cycles ascending, descending, then back to the library's
     default order. Focus goes back to the header the click came from, since

  $$('[data-hubcol]', host).forEach(function(th){
    function cycle(){
      var k = th.dataset.hubcol, c = hubCol(k);
      if (state.hubSortCol !== k){ state.hubSortCol = k; state.hubSortDir = c.def; }
      else if (state.hubSortDir === c.def){ state.hubSortDir = -c.def; }

  var wrap = $('.c-table-scroll-x', host);

  $$('[data-libmenu]', host).forEach(function(btn){

      item.addEventListener('click', function(){

                   item.dataset.rowkb);

/* A menu placed against the viewport does not travel with the row it belongs
   to, so scrolling closes it rather than leaving it behind. */
document.addEventListener('scroll', function(e){
  if ($$('.lib-table .menu-pop:not([hidden])').length) closeMenus();
}, true);

/* Inside the table the menu cannot be absolute — see .lib-table .menu-pop.
   It is measured after it is shown, right-aligned to the trigger, and flipped
   above it when there is not room below. */
function placeRowMenu(btn, pop){
  var r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  var left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8));
  var below = r.bottom + 8, above = r.top - 8 - h;
  pop.style.left = left + 'px';
  pop.style.top = (below + h <= window.innerHeight - 8 || above < 8 ? below : above) + 'px';
}

function statusBadge(f){
  if (f.archived) return '<span class="c-badge c-badge-neutral">' +
    '<i class="ph ph-archive" aria-hidden="true"></i>Archived</span>';
  return '<span class="c-badge ' + (f.status === 'active' ? 'c-badge-success' : 'c-badge-neutral') + '">' +
    (f.status === 'active' ? 'Active' : 'Closed') + '</span>';
}

/* Grid — Card's Functional grid and its Interactive variant, rendered as a
   <button> so the whole tile is the target, matching what the list rows
   already do. */
function hubGrid(list, ts){
  return '<div class="lib-grid">' + list.map(function(f){
    var n = formCount(f);
    /* Status and countdown sit together at the top; the whole tile is the
       target, so the old corner arrow was decoration repeating what the
       hover state and the cursor already say. */
    /* Reading order is chip, heading, state: who owns it, what it is called,
       where it stands. The badges sit under the heading rather than above it
       so the title is the first line of text on the tile and the two tiles
       either side of it line up on that title, not on a badge row whose
       height depends on how many badges the survey happens to warrant. */
    return '<div class="lib-card-wrap">' +
      '<button class="c-card c-card-interactive lib-card" type="button" data-form="' + f.id + '">' +
        ownerChip(f) +
        '<span class="lib-card-title">' + mark(f.title, ts) + '</span>' +
        '<span class="tag-row">' + statusBadge(f) + deadlinePill(f) + '</span>' +
        '<span class="lib-card-foot">' +
          '<span><b>' + n.toLocaleString() + '</b> <span class="lib-row-meta">' +
            (n === 1 ? 'response' : 'responses') + '</span></span>' +
          '<span class="lib-row-meta">' + esc(rangeLabel(f)) + '</span>' +
        '</span>' +
      '</button>' +
      formMenu(f) +
    '</div>';
  }).join('') + '</div>';
}

/* Everything a survey can be done to without opening it, written once and
   rendered identically on a grid tile and a list row. Grouped in the order
   the work happens: get into it, get it out to people, look after it, and
   the destructive one on its own at the bottom. */
function formMenuItem(kb, icon, label, cls){
  return '<button type="button" role="menuitem"' + (cls ? ' class="' + cls + '"' : '') +
    ' data-rowkb="' + kb + '"><i class="ph ' + icon + '" aria-hidden="true"></i>' + label + '</button>';
}
function formMenuItems(f){
  return formMenuItem('edit',    'ph-pencil-simple',    'Edit survey') +
    formMenuItem('preview', 'ph-eye',              'Preview survey') +
    formMenuItem('analyse', 'ph-chart-bar',        'Analyse results') +
    '<span class="menu-pop-sep" aria-hidden="true"></span>' +
    formMenuItem('send',    'ph-paper-plane-tilt', 'Send survey') +
    formMenuItem('share',   'ph-user-plus',        'Share') +
    '<span class="menu-pop-sep" aria-hidden="true"></span>' +
    formMenuItem('copy',    'ph-copy',             'Make a copy') +
    formMenuItem('archive', f.archived ? 'ph-arrow-counter-clockwise' : 'ph-archive',
                            f.archived ? 'Restore from archive' : 'Archive') +
    '<span class="menu-pop-sep" aria-hidden="true"></span>' +
    formMenuItem('trash',   'ph-trash',            'Delete', 'danger');
}
/* Trigger plus panel, so a tile and a row cannot drift apart. */
function formMenu(f){
  return '<span class="menu-wrap">' +
    '<button class="c-icon-btn" type="button" data-libmenu="' + f.id + '"' +
      ' aria-haspopup="menu" aria-expanded="false" aria-label="More options for ' + esc(f.title) + '">' +
      '<i class="ph ph-dots-three-vertical" aria-hidden="true"></i></button>' +
    '<div class="menu-pop is-flat" role="menu" aria-label="' + esc(f.title) + '" hidden>' +
      formMenuItems(f) + '</div>' +
  '</span>';
}

/* Sorting — one (column, direction) pair for the whole library, whichever
   view is showing. The list view's own sortable headers and the sort control
   above the views both read and write this, so they cannot disagree, and the
   grid gets an order without a header row to click.
   `def` is the direction a column takes on first click: dates and counts
   open on their largest value, text on A. */
var HUB_COLS = [
  { key:'title',     label:'Survey',    pick:'Title',        num:false, def:1,
    dir:['A to Z','Z to A'],
    val:function(f){ return f.title.toLowerCase(); } },
  /* Ownership is an attribute of the survey, so it sits next to the title
     rather than out past the metrics. Sorting by it groups the library by
     department, which is the whole reason the colour is in the data. An
     unowned survey sorts to the A-to-Z end with the other blanks. */
  { key:'owner',     label:'Owner',     pick:'Owner',        num:false, def:1,
    dir:['A to Z','Z to A'],
    val:function(f){ return f.owner ? f.owner.name.toLowerCase() : ''; } },
  { key:'status',    label:'Status',    pick:'Status',       num:true,  def:1,
    dir:['Active first','Closed first'],
    val:function(f){ return f.archived ? 2 : f.status === 'active' ? 0 : 1; } },
  { key:'deadline',  label:'Deadline',  pick:'Deadline',     num:true,  def:1,
    dir:['Closing soonest','Closing latest'],
    /* No deadline sorts last either way — it is not a date, so it cannot
       take a place in the middle of them. */
    val:function(f){ return f.ends ? f.ends.getTime() : Infinity; } },
  { key:'responses', label:'Responses', pick:'Responses',    num:true,  def:-1,
    dir:['Fewest first','Most first'],
    val:function(f){ return formCount(f); } },
  { key:'updated',   label:'Updated',   pick:'Last updated', num:true,  def:-1,
    dir:['Oldest first','Newest first'],
    val:function(f){ return f.updated.getTime(); } }
];
function hubCol(key){
  return HUB_COLS.filter(function(c){ return c.key === key; })[0] || HUB_COLS[4];
}
function hubSorted(list){
  var c = hubCol(state.hubSortCol), dir = state.hubSortDir;
  return list.slice().sort(function(x, y){
    var a = c.val(x), b = c.val(y);
    if (c.num) return (a === b ? 0 : a < b ? -1 : 1) * dir;
    return String(a).localeCompare(String(b)) * dir;
  });
}
/* Direction reads as what it does to the column in hand: a date does not
   run A to Z and a title does not run newest first. */
function hubDirLabel(dir){
  var c = hubCol(state.hubSortCol);
  return c.dir[dir === 1 ? 0 : 1];
}
function hubSortSet(key, dir){
  state.hubSortCol = key;
  state.hubSortDir = dir;
  renderHub();
}

/* Table's own documented header behaviour: every eligible column sortable,
   one active sort at a time, cycling through to the library's default order
   (most recently updated) as the third state — the table always has an
   order, so "unsorted" here means that default rather than no order at all.
   The Actions column is one of the two the spec exempts. */
function hubSortTh(c, extra){
  var on = state.hubSortCol === c.key;
  var asc = state.hubSortDir === 1;
  var icon = !on ? 'ph-arrows-down-up' : (asc ? 'ph-arrow-up' : 'ph-arrow-down');
  return '<th class="c-table-sort-th' + (on ? ' is-sorted' : '') + (extra || '') + '" data-hubcol="' + c.key + '"' +
    ' tabindex="0" role="columnheader" aria-sort="' + (on ? (asc ? 'ascending' : 'descending') : 'none') + '">' +
    esc(c.label) + '<i class="ph ' + icon + ' c-table-sort-icon" aria-hidden="true"></i></th>';
}

/* List — Table's Standalone variant. The rows used to be a div stack with a
   button per row, which was a table drawn by hand: no header, so nothing to
   sort by, and five values crammed into two lines. */
function hubTable(list, ts){
  return '<div class="c-table-standalone-wrap c-table-scroll-x">' +
    '<table class="c-table c-table-standalone lib-table">' +
    /* Frozen columns: once this table scrolls sideways (it does below
       820px), the row's identity and its actions are the two the spec keeps
       in reach — everything between them scrolls underneath. */
    '<thead><tr>' + HUB_COLS.map(function(c, i){
        return hubSortTh(c, i === 0 ? ' c-table-freeze-left' : '');
      }).join('') +
      '<th class="c-table-action-col c-table-freeze-right no-sort"><span class="sr-only">Actions</span></th>' +
    '</tr></thead><tbody>' + list.map(function(f){
      var n = formCount(f);
      return '<tr class="is-interactive is-clickable" data-form="' + f.id + '" tabindex="0"' +
        ' aria-label="' + esc(f.title) + '">' +
        '<td class="c-table-freeze-left"><span class="lib-cell-title">' + mark(f.title, ts) + '</span>' +
          (f.desc ? '<span class="lib-cell-sub">' + mark(f.desc, ts) + '</span>' : '') + '</td>' +
        '<td class="nowrap">' + ownerTag(f) + '</td>' +
        '<td class="nowrap">' + statusBadge(f) + '</td>' +
        '<td class="nowrap">' + deadlinePill(f) + '</td>' +
        '<td class="num nowrap"><b>' + n.toLocaleString() + '</b></td>' +
        '<td class="num nowrap">' + fmtDate(f.updated) + '</td>' +
        '<td class="c-table-action-col c-table-freeze-right">' + formMenu(f) + '</td>' +
      '</tr>';
    }).join('') + '</tbody></table></div>';
}

/* The chips live in persistent markup, so anything that changes hubStatus
   from elsewhere (archiving a survey, clearing filters) has to put them back
   in step through here rather than assuming a click did it. */
function syncHubChips(){
  $$('#routeHub .c-chip-filter').forEach(function(c){
    c.classList.toggle('is-active', c.dataset.status === state.hubStatus);
  });
}

/* Wired once, not per render: #hubViewSeg, the chips and the search box are
   all persistent DOM, so re-binding them inside renderHub would add one
   listener per keystroke. */
$$('#routeHub .c-chip-filter').forEach(function(c){
  c.addEventListener('click', function(){
    state.hubStatus = c.dataset.status;
    syncHubChips();
    renderHub();
  });
});
wireSeg($('#hubViewSeg'), state.hubView === 'grid' ? 0 : 1, function(i){
  state.hubView = i ? 'list' : 'grid';
  renderHub();
});

/* Sort control — the field in a Dropdown Single select, the direction in one
   toggle beside it. Both write the same state the table headers do, so this
   is repainted from that state rather than from its own last click. */
$('#hubSortList').innerHTML = HUB_COLS.map(function(c){
  return '<div class="c-dropdown-row" role="option" data-hubsort="' + c.key + '">' +
    '<span class="c-dropdown-row-label">' + esc(c.pick) + '</span>' +
    '<i class="ph ph-check c-dropdown-row-check" aria-hidden="true"></i></div>';
}).join('');
function paintHubSort(){
  var c = hubCol(state.hubSortCol), asc = state.hubSortDir === 1;
  $('#hubSortTrigger').value = c.pick;
  $$('#hubSortList [data-hubsort]').forEach(function(r){
    r.classList.toggle('selected', r.dataset.hubsort === c.key);
  });
  $('#hubSortDirIcon').className = 'ph ' + (asc ? 'ph-sort-ascending' : 'ph-sort-descending');
  var label = hubDirLabel(state.hubSortDir);
  $('#hubSortDir').setAttribute('title', label + ' — switch to ' + hubDirLabel(-state.hubSortDir).toLowerCase());
  $('#hubSortDir').setAttribute('aria-label', 'Sorted ' + label.toLowerCase() + '. Reverse the order');
}
(function wireHubSort(){
  var trig = $('#hubSortTrigger'), panel = $('#hubSortPanel'), field = trig.closest('.c-dropdown-field');
  function shut(){ panel.hidden = true; field.classList.remove('open'); trig.setAttribute('aria-expanded', 'false'); }
  trig.addEventListener('click', function(e){
    e.stopPropagation();
    var open = panel.hidden;
    closeMenus();
    closeDropdowns();
    panel.hidden = !open;
    field.classList.toggle('open', open);
    trig.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  panel.addEventListener('click', function(e){ e.stopPropagation(); });
  $$('[data-hubsort]', panel).forEach(function(r){
    r.addEventListener('click', function(){
      shut();
      /* Changing the field takes that column's own opening direction, the
         same as a first click on its header would. */
      hubSortSet(r.dataset.hubsort, hubCol(r.dataset.hubsort).def);
      trig.focus();
    });
  });
  $('#hubSortDir').addEventListener('click', function(){
    hubSortSet(state.hubSortCol, -state.hubSortDir);
  });
})();

function clearHubSearch(){
  state.hubQuery = '';
  $('#hubSearch').value = '';
  $('#hubSearchClear').hidden = true;
  renderHub();
  $('#hubSearch').focus();
}
$('#hubSearch').addEventListener('input', function(e){
  state.hubQuery = e.target.value;
  $('#hubSearchClear').hidden = !e.target.value;
  renderHub();
});
$('#hubSearch').addEventListener('keydown', function(e){
  /* Escape clears the field rather than falling through to the global
     handler, which would otherwise close a layer the reader never opened. */
  if (e.key === 'Escape' && $('#hubSearch').value){ e.stopPropagation(); clearHubSearch(); }
});
$('#hubSearchClear').addEventListener('click', clearHubSearch);

function newForm(){
  /* A new survey starts owned by the pod the author is actually in, so it
     carries a department from the first render instead of appearing as the
     one chipless tile in the grid. */
  var f = { id:'f' + (FORMS.length + 1), title:'Untitled survey', status:'closed', archived:false,
    owner:{ name:ME.pods[0], icon:'ph-clipboard-text' },
    desc:'', starts:new Date(NOW), ends:null,
    updated:new Date(NOW), questions:[], responses:[],
    settings:{ sendCopy:false, allowEdit:false, oneResponse:true, progressBar:true,
               confirm:'Thanks for your feedback!' } };
  FORMS.unshift(f);
  go('builder', { formId:f.id });
  toast('New survey created');
}

/* ==========================================================================
   Form builder
   ========================================================================== */
function currentForm(){ return FORMS.filter(function(f){ return f.id === state.formId; })[0]; }

function renderBuilder(){
  var f = currentForm();
  if (!f){ go('hub'); return; }
  $('#routeBuilder').hidden = false;
  var d = deadline(f);
  /* The status is a badge beside the title now, exactly as it reads on the
     library tile, which leaves the subtitle to say the one thing the badge
     cannot: when this survey closes. */
  setHeader(f.title, d.text, null, statusBadge(f));
  setBack(f.archived ? 'Archive' : 'Feedback Forms', 'hub');

  /* One menu item, two directions — the survey is either in the archive or
     it is not, and offering both at once would be offering a no-op. */
  var arch = $('[data-kb="archive"]');
  arch.innerHTML = '<i class="ph ' + (f.archived ? 'ph-arrow-counter-clockwise' : 'ph-archive') +
    '" aria-hidden="true"></i>' + (f.archived ? 'Restore from archive' : 'Archive');

  $('#qCount').textContent = f.questions.length;
  $('#rCount').textContent = formCount(f);
  $$('#builderTabs .c-tab').forEach(function(t){
    var on = t.dataset.btab === state.btab;
    t.classList.toggle('active', on); t.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  $('#tabQuestions').hidden = state.btab !== 'questions';
  $('#tabResponses').hidden = state.btab !== 'responses';
  $('#tabSettings').hidden  = state.btab !== 'settings';

  if (state.btab === 'questions')      renderQuestions(f);
  else if (state.btab === 'responses') renderResponses(f);
  else                                 renderSettings(f);
}

$$('#builderTabs .c-tab').forEach(function(t){
  t.addEventListener('click', function(){
    destroyCharts(); state.btab = t.dataset.btab; state.respIndex = 0; renderBuilder();
  });
});

/* Toolbar */
$$('.toolbar [data-tb]').forEach(function(b){
  b.addEventListener('click', function(){
    var f = currentForm(), a = b.dataset.tb;
    if (a === 'publish'){ f.status = 'active'; f.updated = new Date(NOW); renderBuilder(); toast('Form published — it is now accepting responses', 'success'); }
    else if (a === 'link'){ toast('Shareable link copied to clipboard', 'success'); }
    else if (a === 'preview'){ openPreview(f); }
    else if (a === 'users'){ openShare(f); }
    else if (a === 'undo'){ toast('Nothing to undo'); }
    else if (a === 'redo'){ toast('Nothing to redo'); }
  });
});
$('#kebabBtn').addEventListener('click', function(e){
  e.stopPropagation();
  var m = $('#kebabMenu'), open = m.hidden;
  m.hidden = !open; $('#kebabBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
});
/* One document-level handler closes every popover in the prototype. Adding a
   listener per render leaks one handler per navigation.
   Panels are found by class, not held in a registry: a registry has to be
   re-synced by every route re-render, and a stale entry in it points at a
   node that is no longer in the document. */
document.addEventListener('click', function(){
  $('#kebabMenu').hidden = true; $('#kebabBtn').setAttribute('aria-expanded','false');
  closeMenus();
  closeDropdowns();
});
/* Every form-level action, in one place. The builder's kebab and every
   library menu call this, so the same action cannot mean two slightly
   different things depending on where it was pressed. */
function formAction(f, kb){
  if (!f) return;
  /* The three that open the survey land on the tab that does the job, so
     "Analyse results" is one click rather than one click and a tab. */
  if (kb === 'edit' || kb === 'analyse'){
    state.btab = kb === 'analyse' ? 'responses' : 'questions';
    state.respIndex = 0;
    go('builder', { formId:f.id });
  } else if (kb === 'preview'){
    go('builder', { formId:f.id });
    openPreview(f);
  } else if (kb === 'share'){
    openShare(f);
  } else if (kb === 'send'){
    /* Sending a survey nobody can answer is the one mistake worth catching
       here — a draft link opens for editors and dead-ends for everyone else. */
    if (f.status !== 'active'){
      toast('Publish this survey before sending it — a draft cannot take responses');
    } else {
      toast('Responder link copied — paste it wherever you are sending it', 'success');
    }
  } else if (kb === 'copy'){
    var c = JSON.parse(JSON.stringify({ questions:f.questions, settings:f.settings }));
    FORMS.unshift({ id:'f' + (FORMS.length + 1), title:f.title + ' (copy)', status:'closed',
      archived:false, owner:f.owner, desc:f.desc, starts:new Date(NOW), ends:null,
      updated:new Date(NOW), questions:c.questions, responses:[], settings:c.settings });
    go('hub'); toast('Copy created');
  } else if (kb === 'archive'){
    f.archived = !f.archived;
    /* Land in the list the survey just moved into, so the move is visible
       rather than something that happened off-screen. */
    state.hubStatus = f.archived ? 'archived' : 'all';
    syncHubChips();
    go('hub');
    toast(f.archived ? 'Moved to the archive' : 'Restored from the archive', 'success');
  } else {
    FORMS = FORMS.filter(function(x){ return x.id !== f.id; });
    go('hub'); toast('Survey deleted');
  }
}
$$('#kebabMenu button').forEach(function(b){
  b.addEventListener('click', function(){ formAction(currentForm(), b.dataset.kb); });
});

/* ---------- Tab 1 — Questions ---------- */

/* The block types, declared once. Both the fixed bar and the floating rail
   read this list, so they can never drift apart. */
/* What the bar and the rail can add. Each one lands as a real question of
   that type rather than an empty block to retype: the type switcher on the
   block can still change it afterwards, but the point of a named Add button
   is that the thing it adds is already the thing.
   Order is Add question, then everything else alphabetically — the same
   ordering the type dropdown uses, so the icons in the strip and the rail
   sit in the order the dropdown lists them in. Add question keeps the top
   because it is the labelled primary and the one almost every visit is
   for; it is the only fixed position, and it is fixed by kind rather than
   by where it happens to be written below. */
var BLOCKS = [
  { kind:'question', label:'Add question',        icon:'ph-plus-circle' },
  { kind:'single',   label:'Add single choice',   icon:'ph-radio-button' },
  { kind:'multi',    label:'Add multiple choice', icon:'ph-check-square' },
  { kind:'matrix',   label:'Add rating table',    icon:'ph-table' },
  { kind:'stars',    label:'Add star rating',     icon:'ph-star' },
  { kind:'rank',     label:'Add ranking',         icon:'ph-list-numbers' },
  { kind:'slider',   label:'Add slider',          icon:'ph-faders-horizontal' },
  { kind:'poll',     label:'Add poll',            icon:'ph-chart-donut' },
  { kind:'image',    label:'Add image',           icon:'ph-image' },
  { kind:'video',    label:'Add video',           icon:'ph-video' }
];
function blockOrder(){
  var pinned = BLOCKS.filter(function(b){ return b.kind === 'question'; });
  return pinned.concat(BLOCKS.filter(function(b){ return b.kind !== 'question'; })
    .sort(function(a, b){ return a.label.localeCompare(b.label); }));
}
function addBarButtons(){
  return blockOrder().map(function(b, i){
    /* The first one carries its label; the rest are Button's own icon-only
       variant, which supplies the accessible name from aria-label. Six
       labelled buttons in a row came to 900px of controls for something
       that is one decision. */
    if (!i) return '<button class="c-btn c-btn-secondary c-btn-sm" type="button" data-add="' + b.kind + '">' +
      '<i class="ph ' + b.icon + '" aria-hidden="true"></i>' + b.label + '</button>' +
      '<span class="add-bar-sep" aria-hidden="true"></span>';
    return '<button class="c-btn c-btn-ghost c-btn-sm c-btn-icon" type="button" data-add="' + b.kind + '"' +
      ' title="' + b.label + '" aria-label="' + b.label + '">' +
      '<i class="ph ' + b.icon + '" aria-hidden="true"></i></button>';
  }).join('');
}
function addRailButtons(){
  /* Icon-only, because a rail wide enough for "Add question" would be a
     second column of the page rather than a control. Button's own icon-only
     variant carries the accessible name. */
  return blockOrder().map(function(b){
    return '<button class="c-btn c-btn-ghost c-btn-sm c-btn-icon" type="button" data-add="' + b.kind + '"' +
      ' title="' + b.label + '" aria-label="' + b.label + '">' +
      '<i class="ph ' + b.icon + '" aria-hidden="true"></i></button>';
  }).join('');
}

/* Questions are staged the same way Settings are. Everything on this tab —
   the title, the description, adding, deleting, reordering, retyping — is
   written to a draft of the form, and nothing reaches the survey until
   Save. Live edits on a published survey change what responders are looking
   at mid-answer, which is not something anyone should do by typing.
   The draft is keyed by form id, so switching surveys cannot carry edits
   from one into another. */
var qDraft = null;
function qDraftFor(f){
  if (!qDraft || qDraft.id !== f.id){
    qDraft = { id:f.id, title:f.title, desc:f.desc,
               questions: JSON.parse(JSON.stringify(f.questions)) };
    /* A table-edit session belongs to one question inside one draft. A new
       draft means a different survey, so any open editor is stale — left
       alone it would reopen against whichever question happened to share
       the id. */
    mxEdit = null; mxDraft = null;
  }
  return qDraft;
}
function qDirty(f){
  var d = qDraftFor(f);
  return d.title !== f.title || d.desc !== f.desc ||
         JSON.stringify(d.questions) !== JSON.stringify(f.questions);
}
/* Patched in place, never re-rendered: a repaint on every keystroke would
   take the caret out of whichever question is being typed into. Scoped to
   the tab because Settings keeps its own .set-save in the document while
   hidden, and an unscoped lookup finds whichever comes first in the DOM. */
function refreshQSave(){
  var bar = $('#tabQuestions .set-save');
  if (!bar) return;
  var dirty = qDirty(currentForm());
  bar.classList.toggle('is-dirty', dirty);
  $('.set-save-state', bar).innerHTML = saveStateHtml(dirty);
  $('#qSave').disabled = !dirty;
  $('#qDiscard').disabled = !dirty;
}
/* Anything staged anywhere in the builder. Preview reads it to say whether
   what it is showing is what responders would currently get. */
function builderDirty(f){
  return (!!settingsDraft && settingsDraft.id === f.id && settingsDirty(f)) ||
         (!!qDraft && qDraft.id === f.id && qDirty(f));
}

function renderQuestions(form){
  var host = $('#tabQuestions');
  var f = qDraftFor(form);
  var dirty = qDirty(form);
  host.innerHTML =
    '<div class="c-card stack">' +
      '<label class="c-field field-wide"><span class="eyebrow">Form title</span>' +
        '<div class="input-wrap"><input type="text" id="fTitle" value="' + esc(f.title) + '" /></div></label>' +
      '<label class="c-field field-wide"><span class="eyebrow">Description</span>' +
        '<textarea id="fDesc" rows="2" placeholder="What is this form for?">' + esc(f.desc) + '</textarea></label>' +
    '</div>' +
    /* Two copies of the same six actions, on purpose.
       The bar sits after the list, where the block it adds lands, and it is
       the only one of the two that survives a narrow screen (the rail is
       hidden below 820px, where the content column cannot spare 56px).
       The rail follows the scroll for the rest of the session. It lives in
       its own grid column rather than floating over the content, so it
       rides alongside whichever question is in view and can never cover one
       — an overlay pinned to the viewport edge would sit on top of a
       question's own type switcher and delete button. */
    '<div class="builder-cols">' +
      '<div id="qList" class="stack"></div>' +
      '<div class="add-rail" role="group" aria-label="Add a block">' +
        addRailButtons() +
      '</div>' +
    '</div>' +
    '<div class="add-bar" role="group" aria-label="Add a block">' + addBarButtons() + '</div>' +

    '<div class="set-save' + (dirty ? ' is-dirty' : '') + '">' +
      '<span class="set-save-state">' + saveStateHtml(dirty) + '</span>' +
      '<button class="c-btn c-btn-secondary c-btn-sm" type="button" id="qDiscard"' + (dirty ? '' : ' disabled') + '>Discard</button>' +
      '<button class="c-btn c-btn-primary c-btn-sm" type="button" id="qSave"' + (dirty ? '' : ' disabled') + '>Save form</button>' +
    '</div>';

  /* The page header keeps saying the survey's saved name. It used to track
     this field keystroke by keystroke, which now would have the page titled
     something that does not exist yet; Save re-renders the header. */
  $('#fTitle').addEventListener('input', function(e){ f.title = e.target.value; refreshQSave(); });
  $('#fDesc').addEventListener('input', function(e){ f.desc = e.target.value; refreshQSave(); });
  $$('[data-add]', host).forEach(function(b){
    b.addEventListener('click', function(){ addBlock(f, b.dataset.add); });
  });

  $('#qSave').addEventListener('click', function(){
    form.title = f.title;
    form.desc  = f.desc;
    form.questions = JSON.parse(JSON.stringify(f.questions));
    form.updated = new Date(NOW);
    qDraft = null; mxEdit = null; mxDraft = null;
    renderBuilder();
    toast('Form saved', 'success');
  });
  $('#qDiscard').addEventListener('click', function(){
    qDraft = null; mxEdit = null; mxDraft = null;
    renderBuilder();
    toast('Changes discarded');
  });

  paintQuestions(f);
}

function paintQuestions(f){
  var list = $('#qList');
  if (!f.questions.length){
    list.innerHTML = '<div class="c-empty is-section">' +
      '<i class="ph ph-list-plus" aria-hidden="true"></i><h4>No questions yet</h4>' +
      '<p>Add your first question below. You can reorder blocks by dragging the handle, or with the keyboard.</p></div>';
    $('#qCount').textContent = 0;
    refreshQSave();
    return;
  }
  var n = 0;
  list.innerHTML = f.questions.map(function(q, i){
    var body;
    if (q.type === 'media'){
      body = uploadZoneHtml(q);
    } else {
      n++;
      body = questionPreview(q);
    }
    var isMedia = q.type === 'media';
    return '<div class="qblock" draggable="true" data-q="' + q.id + '" data-idx="' + i + '">' +
      '<button class="qgrip" type="button" aria-label="Reorder: ' + esc(q.title || 'block') +
        '. Press up or down arrow to move." data-grip="' + i + '"><i class="ph ph-dots-six-vertical" aria-hidden="true"></i></button>' +
      '<div class="qblock-head">' +
        (isMedia ? '' : '<span class="qblock-num">' + n + '</span>') +
        '<div class="grow stack sm">' +
          '<input class="c-dropdown-input" style="border:0;padding:0;height:auto;font-size:var(--text-body1-size);line-height:var(--text-body1-lh);font-weight:700;font-family:inherit;color:var(--color-neutral-9);background:transparent;caret-color:auto;cursor:text;width:100%" value="' + esc(q.title) + '" data-title="' + q.id + '" aria-label="Question text" />' +
          (q.dependsOn ? '<span class="hint"><i class="ph ph-arrow-elbow-down-right" aria-hidden="true"></i> Shown when &ldquo;' + esc(q.dependsValue) + '&rdquo; is selected above</span>' : '') +
        '</div>' +
        '<div class="qblock-actions">' +
          (isMedia ? '' : typeSwitcher(q)) +
          '<button class="c-icon-btn" type="button" title="Duplicate" aria-label="Duplicate" data-dup="' + i + '"><i class="ph ph-copy" aria-hidden="true"></i></button>' +
          '<button class="c-icon-btn" type="button" title="Delete" aria-label="Delete" data-del="' + i + '"><i class="ph ph-trash" aria-hidden="true"></i></button>' +
        '</div>' +
      '</div>' +
      body +
      (isMedia ? '' :
      '<div class="qblock-foot">' +
        '<label class="c-choice switch"><input type="checkbox" data-req="' + i + '"' + (q.required ? ' checked' : '') + ' />' +
          '<span class="c-switch-track' + (q.required ? ' on' : '') + '"><span class="c-switch-thumb"></span></span>' +
          '<span class="text"><span class="label" style="font-size:var(--text-body2-size)">Required</span></span></label>' +
      '</div>') +
    '</div>';
  }).join('');
  $('#qCount').textContent = n;
  wireQuestionBlocks(f);
  refreshQSave();
}

function typeKeys(){
  return Object.keys(TYPES).sort(function(a, b){
    return TYPES[a].label.localeCompare(TYPES[b].label);
  });
}

/* Question type switcher — Dropdown's Single select, Borderless, wired for
   real. The type badge used to be display-only, which made four of the six
   documented question types unreachable from the builder. */
function typeSwitcher(q){
  return '<span class="c-field c-dropdown-field style-borderless qtype" style="width:auto">' +
    '<span class="input-wrap has-trailing-icon">' +
      '<input type="text" class="c-dropdown-input" readonly value="' + TYPES[q.type].label + '"' +
        ' data-typetrigger="' + q.id + '" aria-label="Question type" aria-haspopup="listbox" aria-expanded="false" />' +
      '<span class="icon-trailing" aria-hidden="true"><i class="ph ph-caret-down c-dropdown-chevron"></i></span>' +
    '</span>' +
    '<span class="c-dropdown-panel" data-typepanel="' + q.id + '" hidden><span class="c-dropdown-list">' +
      /* Alphabetical by label, sorted at render rather than by the order the
         object happens to be written in — ten types have no inherent
         sequence, and a new one added to TYPES lands in its right place on
         its own instead of at the bottom. Same habit as the system's other
         orderless lists (persona badges, the platform list on Profile
         card), which are documented as alphabetical too. */
      typeKeys().map(function(k){
        return '<span class="c-dropdown-row' + (k === q.type ? ' selected' : '') + '" role="option" data-settype="' + k + '">' +
          '<i class="ph ' + TYPES[k].icon + ' c-dropdown-row-media"></i>' +
          '<span class="c-dropdown-row-label">' + TYPES[k].label + '</span>' +
          '<i class="ph ph-check c-dropdown-row-check"></i></span>';
      }).join('') +
    '</span></span>' +
  '</span>';
}

/* Changing type rewrites only the props that type owns, so switching away
   and back doesn't silently keep a stale scale range or option list. */
function setType(q, t){
  q.type = t;
  /* Scale and Slider share the min/max/end-label props but not their
     defaults: a scale is a handful of discrete targets, a slider is a
     continuous run (the component's own guidance is not to use it under
     about ten distinct values). */
  if (t === 'scale'){
    if (q.min == null){ q.min = 1; q.max = 5; q.lo = 'Not at all'; q.hi = 'Very much'; }
    delete q.step;
  } else if (t === 'slider'){
    if (q.min == null){ q.min = 0; q.max = 100; q.lo = 'Not at all'; q.hi = 'Completely'; }
    if (q.step == null) q.step = 1;
  } else if (t === 'stars'){
    /* Stars reuse max as the count — five is the number people read as a
       star rating without being told the scale. */
    if (q.max == null || q.max > 10) q.max = 5;
    delete q.min; delete q.lo; delete q.hi; delete q.step;
  } else { delete q.min; delete q.max; delete q.lo; delete q.hi; delete q.step; }
  if (t === 'rank'){
    if (!q.items) q.items = ['First option','Second option','Third option'];
  } else { delete q.items; }
  if (t === 'single' || t === 'multi'){
    if (!q.options) q.options = ['Option 1','Option 2','Option 3'];
  } else { delete q.options; }
  if (t === 'matrix'){
    if (!q.rows) q.rows = ['First aspect','Second aspect','Third aspect'];
    if (!q.cols) q.cols = ['Very poor','Poor','Average','Good','Excellent'];
  } else { delete q.rows; delete q.cols; }
}

/* Rating table and Slider markup, written once each and rendered in three
   places: the builder's disabled preview, the preview modal and — through
   the same functions — anything else that has to show a question the way a
   responder sees it. Passing the answers in rather than reading a global is
   what lets the builder render the same grid with nothing selected. */
function starsHtml(q, o){
  o = o || {};
  var max = q.max || 5, v = +(o.value || 0), out = '';
  for (var n = 1; n <= max; n++){
    var on = n <= v;
    out += '<label class="c-star' + (on ? ' on' : '') + '">' +
      '<input type="radio" name="' + o.name + '"' + (o.disabled ? ' disabled' : '') +
        (o.attr ? ' ' + o.attr + '="' + q.id + '" data-pqval="' + n + '"' : '') +
        (n === v ? ' checked' : '') + ' />' +
      '<i class="ph' + (on ? '-fill' : '') + ' ph-star" aria-hidden="true"></i>' +
      '<span class="sr-only">' + n + (n === 1 ? ' star' : ' stars') + ' out of ' + max + '</span>' +
    '</label>';
  }
  return '<div class="c-stars">' + out +
    (v ? '<span class="c-stars-value">' + v + ' of ' + max + '</span>' : '') + '</div>';
}
function rankBtnHtml(q, o, i, dir, off, label){
  return '<button class="c-icon-btn" type="button"' + (o.disabled || off ? ' disabled' : '') +
    (o.attr ? ' ' + o.attr + '="' + q.id + '" data-rankfrom="' + i + '" data-rankdir="' + dir + '"' : '') +
    ' aria-label="Move ' + esc(label) + ' ' + (dir < 0 ? 'up' : 'down') + '">' +
    '<i class="ph ' + (dir < 0 ? 'ph-caret-up' : 'ph-caret-down') + '" aria-hidden="true"></i></button>';
}
function rankHtml(q, o){
  o = o || {};
  var items = o.order && o.order.length ? o.order : (q.items || []);
  return '<div class="c-rank">' + items.map(function(it, i){
    return '<div class="c-rank-item">' +
      '<span class="c-rank-pos">' + (i + 1) + '</span>' +
      '<span class="c-rank-label">' + esc(it) + '</span>' +
      '<span class="c-rank-btns">' +
        rankBtnHtml(q, o, i, -1, i === 0, it) +
        rankBtnHtml(q, o, i, 1, i === items.length - 1, it) +
      '</span>' +
    '</div>';
  }).join('') + '</div>';
}
function matrixHtml(q, o){
  o = o || {};
  var ans = o.answers || {}, rows = q.rows || [], cols = q.cols || [];
  return '<div class="c-matrix"><table><thead><tr>' +
      '<th scope="col"><span class="sr-only">Aspect</span></th>' +
      cols.map(function(c){ return '<th scope="col">' + esc(c) + '</th>'; }).join('') +
    '</tr></thead><tbody>' +
    rows.map(function(r, ri){
      var picked = ans[r];
      var miss = o.missingRows && o.missingRows.indexOf(r) > -1;
      return '<tr' + (miss ? ' class="is-missing"' : '') + '>' +
        '<th scope="row">' + esc(r) + '</th>' +
        cols.map(function(c){
          var on = picked === c;
          return '<td><label class="c-matrix-cell">' +
            '<input type="radio" name="' + o.name + '-' + ri + '"' +
              (o.disabled ? ' disabled' : '') +
              (o.attr ? ' ' + o.attr + '="' + q.id + '" data-pqrow="' + esc(r) + '" data-pqval="' + esc(c) + '"' : '') +
              (on ? ' checked' : '') + ' />' +
            '<span class="c-radio-circle' + (on ? ' on' : '') + '">' +
              (on ? '<span class="dot"></span>' : '') + '</span>' +
            '<span class="sr-only">' + esc(r) + ': ' + esc(c) + '</span>' +
          '</label></td>';
        }).join('') +
      '</tr>';
    }).join('') +
  '</tbody></table></div>';
}
function matrixRowsLeft(q, ans){
  ans = ans || {};
  return (q.rows || []).filter(function(r){ return !ans[r]; });
}
function sliderHtml(q, o){
  o = o || {};
  var min = q.min == null ? 0 : q.min, max = q.max == null ? 100 : q.max;
  var has = o.value != null && o.value !== '';
  /* Unanswered still has to render a thumb somewhere — a range input always
     has one — so it sits at the midpoint and the label says the question is
     open rather than answered "50". */
  var at = has ? +o.value : Math.round((min + max) / 2);
  var pct = !has || max === min ? 0 : (at - min) / (max - min) * 100;
  return '<div class="c-slider-group">' +
    '<span class="slider-value' + (has ? '' : ' is-unset') + '"' +
      (o.attr ? ' data-slval="' + q.id + '"' : '') + '>' +
      (has ? at + ' of ' + max : 'Drag to answer') + '</span>' +
    '<div class="c-slider-rail' + (has ? '' : ' is-unset') + '">' +
      '<div class="c-slider-track"><div class="c-slider-fill" style="width:' + pct + '%"' +
        (o.attr ? ' data-slfill="' + q.id + '"' : '') + '></div></div>' +
      '<input class="c-slider-input" type="range" min="' + min + '" max="' + max + '"' +
        ' step="' + (q.step || 1) + '" value="' + at + '"' +
        (o.disabled ? ' disabled' : '') +
        (o.attr ? ' ' + o.attr + '="' + q.id + '"' : '') +
        ' aria-label="' + esc(q.title) + '" aria-valuetext="' + (has ? at + ' of ' + max : 'No answer yet') + '" />' +
    '</div>' +
    ((q.lo || q.hi)
      ? '<div class="c-slider-minmax"><span>' + esc(q.lo || '') + '</span><span>' + esc(q.hi || '') + '</span></div>'
      : '') +
  '</div>';
}

/* Rating table editing is its own mode, held per question rather than
   globally: entering it on one table does not disturb another, and the
   headers being edited live in a draft of their own so Cancel is a real
   cancel. That draft is deliberately NOT the builder's qDraft — a
   half-renamed column should not light up the form's Save bar, and Save
   table is what promotes it into qDraft, where the form's own Save bar
   picks it up like any other edit. */
var mxEdit = null;    /* id of the question whose table is being edited */
var mxDraft = null;   /* { rows:[], cols:[] } — a copy, until Save table */

function mxRowInput(kind, i, value, total){
  return '<div class="mx-line">' +
    '<input class="c-dropdown-input mx-input" type="text" value="' + esc(value) + '"' +
      ' data-mx' + kind + '="' + i + '" aria-label="' +
      (kind === 'row' ? 'Row label ' : 'Column header ') + (i + 1) + '" />' +
    /* The last one cannot be removed: a table with no rows or no columns is
       not a smaller table, it is a broken one. */
    '<button class="c-icon-btn" type="button" data-mx' + kind + 'del="' + i + '"' +
      (total < 2 ? ' disabled aria-disabled="true" title="A table needs at least one"' : ' title="Remove"') +
      ' aria-label="Remove ' + (kind === 'row' ? 'row ' : 'column ') + (i + 1) + '">' +
      '<i class="ph ph-x" aria-hidden="true"></i></button>' +
  '</div>';
}
function matrixEditorHtml(q){
  var d = mxDraft || { rows:(q.rows || []).slice(), cols:(q.cols || []).slice() };
  return '<div class="mx-editor">' +
    '<div class="mx-cols">' +
      '<span class="mx-legend">Columns — the rating scale</span>' +
      d.cols.map(function(c, i){ return mxRowInput('col', i, c, d.cols.length); }).join('') +
      '<button class="c-btn c-btn-ghost c-btn-sm" type="button" data-mxaddcol>' +
        '<i class="ph ph-plus" aria-hidden="true"></i>Add column</button>' +
    '</div>' +
    '<div class="mx-rows">' +
      '<span class="mx-legend">Rows — what is being rated</span>' +
      d.rows.map(function(r, i){ return mxRowInput('row', i, r, d.rows.length); }).join('') +
      '<button class="c-btn c-btn-ghost c-btn-sm" type="button" data-mxaddrow>' +
        '<i class="ph ph-plus" aria-hidden="true"></i>Add row</button>' +
    '</div>' +
    '<div class="mx-foot">' +
      '<button class="c-btn c-btn-ghost c-btn-sm" type="button" data-mxcancel>Cancel</button>' +
      '<button class="c-btn c-btn-primary c-btn-sm" type="button" data-mxsave>Save table</button>' +
    '</div>' +
  '</div>';
}

function questionPreview(q){
  if (q.type === 'short')  return '<div class="c-field field-wide"><div class="input-wrap"><input type="text" placeholder="' + esc(q.placeholder || 'Short answer') + '" disabled /></div></div>';
  if (q.type === 'long')   return '<div class="c-field field-wide"><textarea rows="2" placeholder="' + esc(q.placeholder || 'Long answer') + '" disabled></textarea></div>';
  /* No .dot inside these circles: the dot is the picked state, and nothing
     is picked in a preview of an unanswered question. */
  if (q.type === 'yesno')  return '<div class="row tight">' +
      ['Yes','No'].map(function(o){ return '<label class="c-choice"><input type="radio" name="p-' + q.id + '" disabled />' +
        '<span class="c-radio-circle"></span><span class="text"><span class="label" style="font-size:var(--text-body2-size)">' + o + '</span></span></label>'; }).join('') + '</div>';
  if (q.type === 'scale'){
    var opts = '';
    for (var v = q.min; v <= q.max; v++)
      opts += '<label class="c-scale-opt"><input type="radio" name="p-' + q.id + '" disabled /><span>' + v + '</span></label>';
    return '<div class="c-scale"><div class="c-scale-track">' + opts + '</div>' +
      '<div class="c-scale-ends"><span>' + esc(q.lo || '') + '</span><span>' + esc(q.hi || '') + '</span></div></div>';
  }
  if (q.type === 'slider') return sliderHtml(q, { disabled:true });
  if (q.type === 'stars')   return starsHtml(q, { name:'p-' + q.id, disabled:true });
  if (q.type === 'rank')    return rankHtml(q, { disabled:true });
  if (q.type === 'matrix')
    return mxEdit === q.id
      ? matrixEditorHtml(q)
      : matrixHtml(q, { name:'p-' + q.id, disabled:true }) +
        '<div class="mx-editbar">' +
          '<button class="c-btn c-btn-secondary c-btn-sm" type="button" data-mxopen="' + q.id + '">' +
            '<i class="ph ph-pencil-simple" aria-hidden="true"></i>Edit table</button>' +
          '<span class="hint">' + (q.rows || []).length + ' rows · ' +
            (q.cols || []).length + ' columns</span>' +
        '</div>';
  if (q.type === 'single' || q.type === 'multi'){
    return '<div class="stack sm">' + (q.options || ['Option 1','Option 2','Option 3']).map(function(o){
      return q.type === 'single'
        ? '<label class="c-choice"><input type="radio" name="p-' + q.id + '" disabled /><span class="c-radio-circle"></span><span class="text"><span class="label" style="font-size:var(--text-body2-size)">' + esc(o) + '</span></span></label>'
        : '<label class="c-choice"><input type="checkbox" disabled /><span class="c-checkbox-box"></span><span class="text"><span class="label" style="font-size:var(--text-body2-size)">' + esc(o) + '</span></span></label>';
    }).join('') + '</div>';
  }
  return '';
}

/* Reorder — real drag-and-drop, with arrow keys on the grip as the
   accessible equivalent. A drag-only reorder is unusable by keyboard and
   unreliable on touch, so both paths write through the same move(). */
var dragFrom = null;
function move(f, from, to){
  if (to < 0 || to >= f.questions.length || from === to) return;
  var it = f.questions.splice(from, 1)[0];
  f.questions.splice(to, 0, it);
  f.updated = new Date(NOW);
  paintQuestions(f);
  var grip = $('[data-grip="' + to + '"]');
  if (grip) grip.focus();
}

function wireQuestionBlocks(f){
  $$('#qList .qblock').forEach(function(block){
    var i = +block.dataset.idx;
    block.addEventListener('dragstart', function(e){
      dragFrom = i; block.classList.add('is-dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(i)); } catch (err) {}
    });
    block.addEventListener('dragend', function(){
      dragFrom = null;
      $$('#qList .qblock').forEach(function(b){
        b.classList.remove('is-dragging','is-drop-target','is-drop-target-after');
      });
    });
    block.addEventListener('dragover', function(e){
      if (dragFrom === null || dragFrom === i) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      block.classList.toggle('is-drop-target', i < dragFrom);
      block.classList.toggle('is-drop-target-after', i > dragFrom);
    });
    block.addEventListener('dragleave', function(){
      block.classList.remove('is-drop-target','is-drop-target-after');
    });
    block.addEventListener('drop', function(e){
      e.preventDefault();
      if (dragFrom !== null && dragFrom !== i) move(f, dragFrom, i);
      dragFrom = null;
    });
  });
  $$('#qList .qgrip').forEach(function(g){
    g.addEventListener('keydown', function(e){
      var i = +g.dataset.grip;
      if (e.key === 'ArrowUp'){ e.preventDefault(); move(f, i, i - 1); }
      if (e.key === 'ArrowDown'){ e.preventDefault(); move(f, i, i + 1); }
    });
  });
  $$('#qList [data-dup]').forEach(function(b){
    b.addEventListener('click', function(){
      var i = +b.dataset.dup;
      var copy = JSON.parse(JSON.stringify(f.questions[i]));
      copy.id = 'q' + Date.now() + Math.floor(Math.random() * 1000);
      delete copy.dependsOn; delete copy.dependsValue;
      f.questions.splice(i + 1, 0, copy);
      paintQuestions(f); toast('Question duplicated');
    });
  });
  $$('#qList [data-del]').forEach(function(b){
    b.addEventListener('click', function(){
      var i = +b.dataset.del, q = f.questions[i];
      /* A dependent follow-up cannot outlive its parent. */
      f.questions = f.questions.filter(function(x, j){
        return j !== i && x.dependsOn !== q.id;
      });
      paintQuestions(f); toast('Question deleted');
    });
  });
  $$('#qList [data-req]').forEach(function(c){
    c.addEventListener('change', function(){
      f.questions[+c.dataset.req].required = c.checked;
      c.nextElementSibling.classList.toggle('on', c.checked);
      refreshQSave();
    });
  });
  $$('#qList [data-typetrigger]').forEach(function(trig){
    var id = trig.dataset.typetrigger;
    var panel = $('[data-typepanel="' + id + '"]');
    var field = trig.closest('.c-dropdown-field');
    trig.addEventListener('click', function(e){
      e.stopPropagation();
      var open = panel.hidden;
      closeDropdowns($('#qList'));
      panel.hidden = !open;
      field.classList.toggle('open', open);
      trig.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    $$('[data-settype]', panel).forEach(function(row){
      row.addEventListener('click', function(){
        var q = f.questions.filter(function(x){ return x.id === id; })[0];
        if (!q) return;
        setType(q, row.dataset.settype);
        f.updated = new Date(NOW);
        paintQuestions(f);
        toast('Changed to ' + TYPES[q.type].label);
      });
    });
  });
  $$('#qList [data-title]').forEach(function(inp){
    inp.addEventListener('input', function(){
      var q = f.questions.filter(function(x){ return x.id === inp.dataset.title; })[0];
      if (q) q.title = inp.value;
      refreshQSave();
    });
  });

  /* ---- Media blocks: attach, drop, remove ---- */
  var qById = function(id){ return f.questions.filter(function(x){ return x.id === id; })[0]; };
  var attach = function(q, file){
    if (!q || !file) return;
    /* accept="" filters the browse dialog but not a drop, so the type is
       checked here too — dropping an MP4 on an image block would otherwise
       render a broken <img> with no explanation. */
    var wantVideo = q.media === 'video';
    if (file.type && wantVideo !== /^video\//.test(file.type)){
      toast('That block takes ' + (wantVideo ? 'a video' : 'an image') + ' — ' +
            (file.name || 'the file') + ' is not one', 'error');
      return;
    }
    q.src = URL.createObjectURL(file);
    q.fileName = file.name;
    q.fileSize = file.size;
    paintQuestions(f);
    refreshQSave();
  };
  $$('#qList [data-file]').forEach(function(inp){
    inp.addEventListener('change', function(){
      attach(qById(inp.dataset.file), inp.files && inp.files[0]);
    });
  });
  $$('#qList [data-unfile]').forEach(function(b){
    b.addEventListener('click', function(){
      var q = qById(b.dataset.unfile);
      if (!q) return;
      /* The block keeps its type and title — only the file goes, which puts
         the drop zone back rather than deleting the author's block. */
      delete q.src; delete q.fileName; delete q.fileSize;
      paintQuestions(f);
      refreshQSave();
    });
  });
  /* ---- Rating table: edit, add/remove, save, cancel ---- */
  var mxOpen = function(id){
    var q = qById(id);
    if (!q) return;
    mxEdit = id;
    mxDraft = { rows:(q.rows || []).slice(), cols:(q.cols || []).slice() };
    paintQuestions(f);
    var first = $('#qList [data-mxcol="0"]');
    if (first){ first.focus(); first.select(); }
  };
  var mxClose = function(){ mxEdit = null; mxDraft = null; paintQuestions(f); };
  $$('#qList [data-mxopen]').forEach(function(b){
    b.addEventListener('click', function(){ mxOpen(b.dataset.mxopen); });
  });
  /* Typing writes to the draft and repaints nothing — the same reason the
     question title input patches rather than re-renders. */
  $$('#qList [data-mxcol]').forEach(function(inp){
    inp.addEventListener('input', function(){ if (mxDraft) mxDraft.cols[+inp.dataset.mxcol] = inp.value; });
  });
  $$('#qList [data-mxrow]').forEach(function(inp){
    inp.addEventListener('input', function(){ if (mxDraft) mxDraft.rows[+inp.dataset.mxrow] = inp.value; });
  });
  /* Structural changes do repaint, so focus is placed deliberately
     afterwards: on the field that was just added, or on the one that took
     the removed field's place. */
  var mxRepaint = function(sel){
    paintQuestions(f);
    var el = $('#qList ' + sel);
    if (el){ el.focus(); if (el.select) el.select(); }
  };
  $$('#qList [data-mxaddcol]').forEach(function(b){
    b.addEventListener('click', function(){
      if (!mxDraft) return;
      mxDraft.cols.push('New column');
      mxRepaint('[data-mxcol="' + (mxDraft.cols.length - 1) + '"]');
    });
  });
  $$('#qList [data-mxaddrow]').forEach(function(b){
    b.addEventListener('click', function(){
      if (!mxDraft) return;
      mxDraft.rows.push('New row');
      mxRepaint('[data-mxrow="' + (mxDraft.rows.length - 1) + '"]');
    });
  });
  $$('#qList [data-mxcoldel]').forEach(function(b){
    b.addEventListener('click', function(){
      if (!mxDraft || mxDraft.cols.length < 2) return;
      var i = +b.dataset.mxcoldel;
      mxDraft.cols.splice(i, 1);
      mxRepaint('[data-mxcol="' + Math.min(i, mxDraft.cols.length - 1) + '"]');
    });
  });
  $$('#qList [data-mxrowdel]').forEach(function(b){
    b.addEventListener('click', function(){
      if (!mxDraft || mxDraft.rows.length < 2) return;
      var i = +b.dataset.mxrowdel;
      mxDraft.rows.splice(i, 1);
      mxRepaint('[data-mxrow="' + Math.min(i, mxDraft.rows.length - 1) + '"]');
    });
  });
  $$('#qList [data-mxsave]').forEach(function(b){
    b.addEventListener('click', function(){
      var q = qById(mxEdit);
      if (!q || !mxDraft) return mxClose();
      /* A header trimmed to nothing would render an unlabelled row that
         still collects answers, so blanks fall back to their position. */
      q.cols = mxDraft.cols.map(function(c, i){ return c.trim() || 'Column ' + (i + 1); });
      q.rows = mxDraft.rows.map(function(r, i){ return r.trim() || 'Row ' + (i + 1); });
      mxClose();
      refreshQSave();
      toast('Rating table updated — save the form to keep it', 'success');
    });
  });
  $$('#qList [data-mxcancel]').forEach(function(b){
    b.addEventListener('click', mxClose);
  });

  $$('#qList [data-drop]').forEach(function(zone){
    /* dragenter and dragover both have to preventDefault or the browser
       navigates to the dropped file instead of handing it over. A counter
       rather than a boolean: dragging across a child fires leave on the
       parent, and a boolean would flicker the state off mid-drag. */
    var depth = 0;
    var over = function(on){ zone.classList.toggle('dragover', on); };
    zone.addEventListener('dragenter', function(e){ e.preventDefault(); depth++; over(true); });
    zone.addEventListener('dragover', function(e){ e.preventDefault(); });
    zone.addEventListener('dragleave', function(){ depth = Math.max(0, depth - 1); if (!depth) over(false); });
    zone.addEventListener('drop', function(e){
      e.preventDefault(); depth = 0; over(false);
      var dt = e.dataTransfer;
      attach(qById(zone.dataset.drop), dt && dt.files && dt.files[0]);
    });
  });
}

/* Object URLs, not data URLs. The draft is dirty-checked by
   JSON.stringify-ing every question on each keystroke, and a base64 video
   inlined into that string would make the comparison the slowest thing on
   the page. An object URL is a short string and stays valid for the life of
   the document, which is exactly as long as this prototype needs it. */
function fileSizeLabel(bytes){
  if (bytes == null) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}
function fileKind(name, media){
  var m = /\.([a-z0-9]+)$/i.exec(name || '');
  return m ? m[1] : (media === 'video' ? 'video' : 'image');
}
/* The zone and the attached file are the two states of one block, so they
   are built together — nothing else needs to know which is showing. */
function uploadZoneHtml(q){
  var isVid = q.media === 'video';
  if (!q.src)
    /* The zone is a <label> wrapping a real file input, so click and
       keyboard both reach the picker without a handler. The input is
       sr-only rather than display:none — a hidden input is not focusable
       and the label would then be mouse-only. */
    return '<div class="c-uploader">' +
      '<label class="c-uploader-zone" data-drop="' + q.id + '">' +
        '<i class="ph ph-upload-simple" aria-hidden="true"></i>' +
        '<span class="c-uploader-label">Drop ' + (isVid ? 'a video' : 'an image') +
          ' here, or click to browse</span>' +
        '<span class="c-uploader-hint">' +
          (isVid ? 'MP4 or WebM' : 'PNG, JPG, GIF or SVG') + ' · nothing leaves this prototype' +
        '</span>' +
        '<input class="sr-only" type="file" accept="' + (isVid ? 'video/*' : 'image/*') +
          '" data-file="' + q.id + '" />' +
      '</label>' +
    '</div>';
  return '<div class="c-uploader">' +
    (isVid
      ? '<video class="qblock-media-el" src="' + esc(q.src) + '" controls preload="metadata"></video>'
      : '<img class="qblock-media-el" src="' + esc(q.src) + '" alt="' + esc(q.alt || q.fileName || 'Uploaded image') + '" />') +
    '<div class="c-uploader-files">' +
      '<div class="c-uploader-row">' +
        '<span class="c-uploader-kind">' + esc(fileKind(q.fileName, q.media)) + '</span>' +
        '<span class="c-uploader-name">' + esc(q.fileName || 'Attached file') + '</span>' +
        '<span class="c-uploader-size">' + esc(fileSizeLabel(q.fileSize)) + '</span>' +
        '<button class="c-uploader-remove" type="button" data-unfile="' + q.id + '"' +
          ' title="Remove" aria-label="Remove ' + esc(q.fileName || 'file') + '">' +
          '<i class="ph ph-x" aria-hidden="true"></i></button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function addBlock(f, kind){
  var id = 'q' + Date.now() + Math.floor(Math.random() * 1000);
  if (kind === 'image' || kind === 'video'){
    f.questions.push({ id:id, type:'media', media:kind, title:kind === 'video' ? 'Video' : 'Image' });
  } else if (kind === 'poll'){
    f.questions.push({ id:id, type:'single', title:'Quick poll — which would you rather have first?',
      required:false, options:['Saved filters','Bulk export','Dark mode'] });
  } else if (kind === 'matrix' || kind === 'slider' || kind === 'stars' ||
             kind === 'rank' || kind === 'single' || kind === 'multi'){
    /* Built through setType so the starting rows, ratings and range are
       defined in exactly one place — the same defaults the type switcher
       hands out when an existing question is changed to one of these. */
    var q = { id:id, required:false,
              title: kind === 'matrix' ? 'Please rate the following' : 'Untitled question' };
    setType(q, kind);
    f.questions.push(q);
  } else {
    f.questions.push({ id:id, type:'short', title:'Untitled question', required:false });
  }
  f.updated = new Date(NOW);
  paintQuestions(f);
  var blocks = $$('#qList .qblock');
  if (blocks.length){
    blocks[blocks.length - 1].scrollIntoView({ block:'nearest' });
    var t = $('[data-title]', blocks[blocks.length - 1]);
    if (t) { t.focus(); t.select(); }
  }
}

/* ---------- Tab 2 — Responses ---------- */
function answered(f, q){ return f.responses.filter(function(r){ return r.answers[q.id] != null; }); }

function renderResponses(f){
  var host = $('#tabResponses');
  destroyCharts();

  if (!f.responses.length){
    host.innerHTML = '<div class="c-empty is-section">' +
      '<i class="ph ph-tray" aria-hidden="true"></i><h4>No responses yet</h4>' +
      '<p>' + (f.status === 'active'
        ? 'This form is live. Responses will appear here as they come in.'
        : 'Publish the form to start collecting responses.') + '</p></div>';
    return;
  }

  var total = f.responses.length;
  var complete = f.responses.filter(function(r){ return r.complete; }).length;
  var avgSec = Math.round(f.responses.reduce(function(s, r){ return s + r.seconds; }, 0) / total);

  host.innerHTML =
    '<div class="sum-grid">' +
      statCard('Total responses', total.toLocaleString(), 'ph-users-three') +
      statCard('Completion rate', Math.round(complete / total * 100) + '%', 'ph-check-circle',
               complete + ' of ' + total + ' finished every question') +
      statCard('Average time', Math.floor(avgSec / 60) + 'm ' + (avgSec % 60) + 's', 'ph-timer') +
    '</div>' +
    '<div class="row between">' +
      '<div class="c-segctl c-segctl-default" role="tablist" aria-label="Response view" id="respSeg">' +
        '<span class="c-seg-pill" aria-hidden="true"></span>' +
        '<button class="c-seg" type="button" role="tab" data-rv="summary">Summary</button>' +
        '<button class="c-seg" type="button" role="tab" data-rv="individual">Individual</button>' +
      '</div>' +
      '<div class="row tight">' +
        '<span class="hint" id="respMeta"></span>' +
        /* Survey-wide, as opposed to the per-question button on each
           free-text card below. Gated the same way and for the same reason:
           under five responses there is nothing to summarise that reading
           the responses would not tell you faster. */
        (f.responses.length >= 5
          ? '<button class="c-btn c-btn-secondary c-btn-md" type="button" id="surveyAiBtn"' +
            ' aria-label="Summarise all responses with AI">' +
            '<i class="ph-fill ph-sparkle" aria-hidden="true"></i>Summarise with AI</button>'
          : '') +
        '<span class="menu-wrap">' +
          '<button class="c-btn c-btn-secondary c-btn-md" type="button" id="expBtn" aria-haspopup="menu" aria-expanded="false">' +
            '<i class="ph ph-download-simple" aria-hidden="true"></i>Export' +
            '<i class="ph ph-caret-down" aria-hidden="true" style="font-size:var(--icon-micro)"></i></button>' +
          '<div class="menu-pop" id="expMenu" role="menu" aria-label="Export responses" hidden>' +
            '<button type="button" role="menuitem" data-exp="xls"><i class="ph ph-file-xls" aria-hidden="true"></i>' +
              '<span class="t"><b>Excel spreadsheet</b><span>One row per response, one column per question</span></span></button>' +
            '<button type="button" role="menuitem" data-exp="pdf"><i class="ph ph-file-pdf" aria-hidden="true"></i>' +
              '<span class="t"><b>PDF report</b><span>This summary, print-ready — charts as tables</span></span></button>' +
          '</div>' +
        '</span>' +
      '</div>' +
    '</div>' +
    /* Above the per-question cards and outside #respBody, so switching
       between Summary and Individual leaves the survey-wide summary standing
       — it describes the whole set either way. */
    '<div id="surveyAiSlot"></div>' +
    '<div id="respBody" class="stack lg"></div>';

  wireSeg($('#respSeg'), state.respView === 'summary' ? 0 : 1, function(i){
    destroyCharts(); state.respView = i ? 'individual' : 'summary'; paintRespBody(f);
  });

  if ($('#surveyAiBtn')){
    $('#surveyAiBtn').addEventListener('click', function(){ summariseSurvey(f, $('#surveyAiBtn')); });
  }

  var expBtn = $('#expBtn'), expMenu = $('#expMenu');
  expBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var open = expMenu.hidden;
    closeMenus();
    expMenu.hidden = !open;
    expBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  expMenu.addEventListener('click', function(e){ e.stopPropagation(); });
  $$('[data-exp]', expMenu).forEach(function(b){
    b.addEventListener('click', function(){
      closeMenus();
      if (b.dataset.exp === 'xls') exportSheet(f); else exportPdf();
    });
  });

  paintRespBody(f);
}

/* Every .menu-pop in the prototype closes through here, so the document
   handler and each trigger share one path rather than each knowing about
   the others. */
function closeMenus(){
  $$('.menu-pop').forEach(function(m){
    m.hidden = true;
    var trig = m.parentNode.querySelector('[aria-haspopup="menu"]');
    if (trig) trig.setAttribute('aria-expanded', 'false');
  });
}

function statCard(label, value, icon, sub){
  return '<div class="c-card stack sm">' +
    '<span class="eyebrow"><i class="ph ' + icon + '" aria-hidden="true"></i> ' + esc(label) + '</span>' +
