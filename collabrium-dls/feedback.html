<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Collabrium — Feedback &amp; Bug Reports</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="components.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<style>
/* ==========================================================================
   CANDIDATE COMPONENTS — not in components.css yet.
   Four patterns this feature needs that the DLS does not have. Written to
   house conventions (tokens only, .c- prefix, same commenting style) so that
   promoting any of them is a copy-paste rather than a rewrite. Everything
   below the second banner is prototype-only scaffolding and would NOT be
   promoted.
   ========================================================================== */

/* --------------------------------------------------------------------------
   CANDIDATE 1 — Floating action button (.c-fab)
   Nothing in the system is a persistent, viewport-anchored action. Button's
   own Primary recipe is reused for fill, text colour and hover; what's new
   is only the fixed anchoring, the circular 56px box and the attention ring.
   Sits at z-index 900 — below Toast (1000) so a toast never lands behind it,
   below Tutorial Modal (1100), above Chat (95) and Command brief (400).
   -------------------------------------------------------------------------- */
.c-fab{position:fixed; right:var(--spacing-24); bottom:var(--spacing-24); z-index:900; display:inline-flex; align-items:center; justify-content:center; width:56px; height:56px; padding:0; border:0; border-radius:var(--radius-pill); background:var(--color-obsidian); color:var(--color-neutral-1); font-family:var(--font-primary); font-size:var(--icon-md); cursor:pointer; box-shadow:var(--shadow-4); transition:background-color var(--duration-fast) var(--ease-standard), transform var(--duration-fast) var(--ease-standard);}
.c-fab:hover{background:var(--color-neutral-8); transform:translateY(-1px);}
.c-fab:active{transform:translateY(0);}
.c-fab:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:3px;}
/* Attention ring — one-shot, three pulses then stop, so it nudges on first
   appearance without becoming ambient motion the user has to tune out. A
   pseudo-element rather than a box-shadow on the button itself, so the
   button's own resting elevation is untouched while it runs. */
.c-fab::after{content:""; position:absolute; inset:0; border-radius:inherit; border:2px solid var(--color-obsidian); opacity:0; pointer-events:none;}
.c-fab.is-nudging::after{animation:c-fab-pulse var(--duration-ambient) var(--ease-standard) 3;}
@keyframes c-fab-pulse{
  0%{transform:scale(1); opacity:.55;}
  100%{transform:scale(1.45); opacity:0;}
}
/* The FAB is decoration the moment motion is off — the ring is the only
   part that carries no information, so it's the only part suppressed. */
@media (prefers-reduced-motion: reduce){
  .c-fab.is-nudging::after{animation:none;}
  .c-fab:hover{transform:none;}
}
/* Menu — a small popover above the button. Reuses the Filters/Dropdown
   popover convention (radius-md, 1px Neutral-3, shadow-3) rather than a
   third popover recipe, and opens upward for the same reason SidebarNav's
   user menu does: the trigger is pinned to the viewport bottom. */
.c-fab-menu{position:fixed; right:var(--spacing-24); bottom:calc(var(--spacing-24) + 56px + var(--spacing-8)); z-index:900; width:268px; background:var(--color-neutral-1); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); box-shadow:var(--shadow-3); padding:var(--spacing-8); display:flex; flex-direction:column; gap:var(--spacing-4);}
.c-fab-menu[hidden]{display:none;}
/* margin:0 because this is a <p>, and every component in this system zeroes
   its own paragraph margins for the same reason (Card, Empty state and the
   rest all declare it): the UA's 1em top and bottom was adding 11px above
   the title and 11px under it, so the card's top inset read 20px against a
   9px bottom one and the gap to the first item was 15px against a 4px gap
   between the items.
   padding-left matches the menu item's own 12px rather than the card's 8px,
   so the label starts on the same vertical as the icons below it — a
   section header that sits 4px inside its own rows reads as misaligned. */
.c-fab-menu-title{margin:0; padding:var(--spacing-8) var(--spacing-12) var(--spacing-4); font-family:var(--font-primary); font-size:var(--text-label3-size); line-height:var(--text-label3-lh); font-weight:var(--text-label3-weight); letter-spacing:var(--tracking-eyebrow); text-transform:uppercase; color:var(--color-neutral-5);}
.c-fab-menu-item{display:flex; align-items:flex-start; gap:var(--spacing-12); width:100%; padding:var(--spacing-8) var(--spacing-12); border:0; border-radius:var(--radius-sm); background:transparent; text-align:left; cursor:pointer; font-family:var(--font-primary);}
.c-fab-menu-item:hover{background:var(--color-neutral-2);}
.c-fab-menu-item:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:-2px;}
.c-fab-menu-item > i{flex:none; margin-top:2px; font-size:var(--icon-base); color:var(--color-neutral-5);}
.c-fab-menu-item .t{display:flex; flex-direction:column; gap:2px; min-width:0;}
.c-fab-menu-item .t b{font-size:var(--text-body2-size); line-height:var(--text-body2-lh); font-weight:700; color:var(--color-neutral-9);}
.c-fab-menu-item .t span{font-size:var(--text-caption-size); line-height:var(--text-caption-lh); color:var(--color-neutral-5);}

/* --------------------------------------------------------------------------
   CANDIDATE 2 — Record modal (.c-modal-layer + .c-modal.is-record)
   A centred dialog holding one record out of a list, with prev/next built
   into its own header so the reader can walk the list without going back
   to it. Modal is the right component and its head/body/foot classes are
   reused verbatim — what's new is only (a) a layer to mount and scrim it,
   which components.css does not ship at all (.c-modal is a bare box), and
   (b) a size variant, because Modal's own 400px cap is a confirm-dialog
   width and a record needs a reading width.
   z-index 950/951: a record view is a modal surface, so it has to clear
   the FAB (900), which otherwise paints over the dialog's own footer.
   Still below Toast (1000) and the screenshot lightbox (1050), which both
   outrank any record view.
   -------------------------------------------------------------------------- */
.c-modal-layer{position:fixed; inset:0; z-index:950; display:flex; align-items:center; justify-content:center; padding:var(--spacing-24); background:var(--shadow-overlay); opacity:0; transition:opacity var(--duration-base) var(--ease-standard);}
.c-modal-layer.is-open{opacity:1;}
.c-modal-layer[hidden]{display:none;}
/* Modal's own radius, fill and shadow are inherited from .c-modal; only the
   box and the internal scroll are new. max-height + a scrolling body rather
   than a scrolling page, so the head (which carries the pager) and the foot
   (which carries the actions) stay put while the record scrolls. */
.c-modal.is-record{position:relative; z-index:951; display:flex; flex-direction:column; width:min(760px, 100%); max-width:none; max-height:100%; transform:translateY(8px) scale(.99); opacity:0; transition:transform var(--duration-base) var(--ease-settle), opacity var(--duration-base) var(--ease-settle);}
.c-modal-layer.is-open .c-modal.is-record{transform:none; opacity:1;}
.c-modal.is-record .c-modal-head{flex:none; align-items:flex-start; gap:var(--spacing-12); padding:var(--spacing-20) var(--spacing-24); border-bottom:1px solid var(--color-neutral-3);}
.c-modal.is-record .c-modal-head h4{overflow-wrap:anywhere;}
.c-modal.is-record .c-modal-body{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:var(--spacing-24); padding:var(--spacing-24);}
.c-modal.is-record .c-modal-foot{flex:none; padding:var(--spacing-16) var(--spacing-24);}
/* Pager — the prev/next pair plus its position readout. Lives in the head
   rather than flanking the dialog: arrows outside the box fall off-screen
   the moment the viewport is narrower than the modal plus two hit targets. */
.c-modal-pager{flex:none; display:flex; align-items:center; gap:var(--spacing-4);}
.c-modal-pager .pos{font-family:var(--font-primary); font-size:var(--text-caption-size); color:var(--color-neutral-5); font-variant-numeric:tabular-nums; white-space:nowrap; padding:0 var(--spacing-4);}
.c-modal-pager .c-icon-btn:disabled{color:var(--color-neutral-4); cursor:not-allowed;}
.c-modal-pager .c-icon-btn:disabled:hover{background:transparent;}
@media (prefers-reduced-motion: reduce){
  .c-modal-layer, .c-modal.is-record{transition:none;}
}

/* --------------------------------------------------------------------------
   CANDIDATE 3 — Comment thread (.c-comments)
   A chronological thread on one record, written to by two sides — the
   team that owns the record and the person who filed it. Chat window is
   the closest existing surface but it is a full-screen AI conversation
   with one human in it; this is a small, embedded, two-party log with no
   streaming and no assistant.
   The two sides differ by fill, not by alignment: both columns stay left,
   because a chronological record read as a transcript is easier to follow
   in one column than zig-zagged. The team side takes the Water (Data)
   8% tint — the platform/engineering side is the Water cluster in the
   5-element mapping, so it owns that content and the tint is a permitted
   colored background rather than decoration. The colour is never the only
   thing saying who spoke: every bubble is signed with the person's name,
   which is the answer anyone reading a two-party thread actually wants —
   a role pill on every line only repeated what the tint already said.
   -------------------------------------------------------------------------- */
.c-comments{display:flex; flex-direction:column; gap:var(--spacing-16);}
.c-comment-list{display:flex; flex-direction:column; gap:var(--spacing-12);}
.c-comment{display:flex; gap:var(--spacing-12);}
.c-comment-body{flex:1 1 auto; min-width:0; padding:var(--spacing-12) var(--spacing-16); border-radius:var(--radius-md); border:1px solid var(--color-neutral-3); background:var(--color-neutral-1);}
/* The team's side is a tint block, not an outlined card: the fill already
   draws the shape, and an outline in the same hue over the top of it only
   makes the edge muddier. The reporter's side keeps its neutral border,
   which is what tells the two apart at a glance. */
.c-comment.is-team .c-comment-body{background:var(--color-water-bg); border-color:transparent;}
.c-comment-meta{display:flex; align-items:center; flex-wrap:wrap; gap:var(--spacing-8); margin-bottom:var(--spacing-4);}
.c-comment-meta b{font-size:var(--text-body2-size); font-weight:700; color:var(--color-neutral-9);}
.c-comment-meta time{font-size:var(--text-caption-size); color:var(--color-neutral-5); font-variant-numeric:tabular-nums;}
.c-comment-text{margin:0; font-size:var(--text-body2-size); line-height:1.6; color:var(--color-neutral-9); overflow-wrap:anywhere;}
.c-comment-shots{display:flex; flex-wrap:wrap; gap:var(--spacing-8); margin-top:var(--spacing-8);}
.c-comment-avatar{flex:none; width:32px; height:32px; border-radius:var(--radius-pill); display:flex; align-items:center; justify-content:center; font-family:var(--font-primary); font-size:var(--text-caption-size); font-weight:700; background:var(--color-neutral-2); color:var(--color-neutral-9);}
.c-comment.is-team .c-comment-avatar{background:var(--color-navy); color:var(--color-neutral-1);}
/* Composer — label, textarea, a compact drop zone and the send action.
   The zone is Uploader's own recipe at a smaller padding, not a new one. */
.c-comment-form{display:flex; flex-direction:column; gap:var(--spacing-8); padding-top:var(--spacing-16); border-top:1px solid var(--color-neutral-3);}
.c-comment-form .c-uploader-zone{padding:var(--spacing-12);}
.c-comment-form-foot{display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-12); flex-wrap:wrap;}

/* --------------------------------------------------------------------------
   CANDIDATE 4 — Scale input (.c-scale)
   A 1-5 / 0-10 linear-scale answer. Radio is the right semantics but its
   own circle+label stack reads as a vertical list, and Segmented Control is
   a view switcher, not a form answer. This is a radiogroup rendered as a row
   of numbered targets: real <input type="radio">, so keyboard
   arrow-key navigation and form semantics come free.
   The target is a circle rather than a rectangle: at 0-10 a row of eleven
   rectangles reads as a segmented control — something you switch a view
   with — and the circle is already this system's shape for one choice out
   of several (Radio's own circle, at a size that can hold a number). Each
   option keeps an equal share of the row and centres its circle in it, so
   the numbers stay evenly spaced at any width and wrap in even rows.
   -------------------------------------------------------------------------- */
.c-scale{display:flex; flex-direction:column; gap:var(--spacing-8);}
.c-scale-track{display:flex; gap:var(--spacing-8); flex-wrap:wrap;}
.c-scale-opt{position:relative; flex:1 1 0; min-width:44px; display:flex; justify-content:center;}
.c-scale-opt input{position:absolute; opacity:0; width:0; height:0;}
/* 44px, not 40: this document's own hit-target floor, cited for the
   accordion head, the chat action button, the slider thumb and every
   coarse-pointer control. The responder page renders the identical scale,
   so the two surfaces agree and both clear the floor. */
.c-scale-opt span{display:flex; align-items:center; justify-content:center; width:44px; height:44px; border:1px solid var(--color-neutral-3); border-radius:var(--radius-pill); background:var(--color-neutral-1); font-family:var(--font-primary); font-size:var(--text-body2-size); font-weight:700; color:var(--color-neutral-9); cursor:pointer; font-variant-numeric:tabular-nums; transition:background-color var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);}
.c-scale-opt:hover span{background:var(--color-neutral-2);}
.c-scale-opt input:checked + span{background:var(--color-obsidian); border-color:var(--color-obsidian); color:var(--color-neutral-1);}
.c-scale-opt input:focus-visible + span{outline:2px solid var(--color-obsidian); outline-offset:2px;}
.c-scale-opt input:disabled + span{background:var(--color-neutral-2); color:var(--color-neutral-4); cursor:not-allowed;}
/* End labels — the numbers alone never say which end is good. */
.c-scale-ends{display:flex; justify-content:space-between; gap:var(--spacing-12); font-family:var(--font-primary); font-size:var(--text-caption-size); line-height:var(--text-caption-lh); color:var(--color-neutral-5);}

/* --------------------------------------------------------------------------
   CANDIDATE 5 — Star rating (.c-stars)
   A one-tap satisfaction answer. It is a radiogroup like .c-scale — real
   <input type="radio">, so arrow keys and form semantics come free — but it
   fills cumulatively: picking 4 marks four stars, where a scale marks one
   number. That cumulative read is the whole reason people use stars, and it
   is why this is not a .c-scale variant with a different glyph.
   The filled star is Obsidian, not gold: this system's elemental colours
   carry meaning (the 5-element mapping) and a rating is not one of them,
   while Obsidian is already what "the value is here" looks like on the
   scale's own selected circle and the slider's track fill.
   -------------------------------------------------------------------------- */
.c-stars{display:flex; align-items:center; gap:var(--spacing-4);}
.c-star{position:relative; display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; cursor:pointer; color:var(--color-neutral-4); transition:color var(--duration-fast) var(--ease-standard), transform var(--duration-fast) var(--ease-standard);}
.c-star input{position:absolute; opacity:0; width:0; height:0;}
.c-star i{font-size:var(--icon-md);}
.c-star:hover{color:var(--color-neutral-5);}
.c-star.on{color:var(--color-obsidian);}
.c-star.on:hover{color:var(--color-obsidian);}
.c-star input:focus-visible + i{outline:2px solid var(--color-obsidian); outline-offset:3px; border-radius:var(--radius-sm);}
.c-star input:disabled + i{color:var(--color-neutral-4);}
.c-star.on input:disabled + i{color:var(--color-neutral-5);}
/* The number beside the stars, for anyone who would rather read it than
   count filled shapes — and the only part a screen reader needs. */
.c-stars-value{margin-left:var(--spacing-8); font-family:var(--font-primary); font-size:var(--text-caption-size); font-weight:700; color:var(--color-neutral-9); font-variant-numeric:tabular-nums;}

/* --------------------------------------------------------------------------
   CANDIDATE 6 — Ranking (.c-rank)
   Put these in order, highest first. Drag is the obvious gesture and the
   wrong only-gesture: it is unusable by keyboard and unreliable on touch,
   which is the same conclusion this file's own question reorder came to, so
   the buttons are the mechanism rather than the fallback. Each row carries
   its current position, because the answer being given is the order and a
   list with no numbers on it makes the reader count.
   -------------------------------------------------------------------------- */
.c-rank{display:flex; flex-direction:column; gap:var(--spacing-8);}
.c-rank-item{display:flex; align-items:center; gap:var(--spacing-12); padding:var(--spacing-8) var(--spacing-12); border:1px solid var(--color-neutral-3); border-radius:var(--radius-sm); background:var(--color-neutral-1);}
.c-rank-pos{flex:none; display:flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:var(--radius-pill); background:var(--color-neutral-2); font-family:var(--font-primary); font-size:var(--text-caption-size); font-weight:700; color:var(--color-neutral-9); font-variant-numeric:tabular-nums;}
.c-rank-label{flex:1 1 auto; min-width:0; font-family:var(--font-primary); font-size:var(--text-body2-size); color:var(--color-neutral-9);}
.c-rank-btns{flex:none; display:flex; align-items:center; gap:var(--spacing-4);}
.c-rank-btns .c-icon-btn:disabled{color:var(--color-neutral-4); cursor:not-allowed;}
.c-rank-btns .c-icon-btn:disabled:hover{background:transparent;}

/* --------------------------------------------------------------------------
   CANDIDATE 7 — Rating table (.c-matrix)
   One rating scale asked of several things at once: a row per subject, a
   column per rating, one radio group per row. Asking it as four separate
   Single choice questions repeats the same five labels four times and
   loses the comparison the grid exists to make.
   Composed rather than invented: the frame is Table's own anatomy verbatim
   (header row in label3/uppercase/Neutral-5 — the Embedded variant, since
   this lives inside a question card that owns the surface; body rows in
   body2/500 with a 1px Neutral-3 border-bottom and none on the last row;
   Neutral-2 row hover), and the control is Radio verbatim
   (.c-radio-circle + .dot, class-driven .on like every other choice row in
   this file). Nothing new is styled here except the layout.
   One deliberate departure from Table: the rating cells and their headers
   are centre-aligned, where Table's own rule is that every column is
   left-aligned. A rating cell's meaning is the intersection of its row and
   its column, and an 18px radio parked at the left edge of a column headed
   "Very poor" sits nearer the previous column's label than its own.
   -------------------------------------------------------------------------- */
.c-matrix{width:100%; overflow-x:auto;}
.c-matrix table{width:100%; min-width:480px; border-collapse:collapse;}
.c-matrix th,.c-matrix td{padding:var(--spacing-12) var(--spacing-8); border-bottom:1px solid var(--color-neutral-3);}
.c-matrix thead th{font-family:var(--font-primary); font-size:var(--text-label3-size); font-weight:700; letter-spacing:var(--text-label3-tracking); text-transform:uppercase; color:var(--color-neutral-5); text-align:center; white-space:nowrap; vertical-align:bottom;}
.c-matrix thead th:first-child{text-align:left;}
.c-matrix tbody th{text-align:left; font-family:var(--font-primary); font-size:var(--text-body2-size); font-weight:500; color:var(--color-neutral-9);}
.c-matrix tbody td{text-align:center;}
.c-matrix tbody tr:last-child th,.c-matrix tbody tr:last-child td{border-bottom:0;}
.c-matrix tbody tr{transition:background-color var(--duration-fast) var(--ease-standard);}
.c-matrix tbody tr:hover{background:var(--color-neutral-2);}
/* The radio's own hit target: the cell is wider than the 18px circle, so
   the whole cell is the label rather than the circle alone. 44px tall for
   the same reason the scale circle is — the 18px painted radio keeps its
   size, the row it sits in is what reaches the hit-target floor. */
.c-matrix-cell{display:flex; align-items:center; justify-content:center; min-height:44px; cursor:pointer;}
.c-matrix-cell input{position:absolute; opacity:0; width:0; height:0;}
.c-matrix-cell .c-radio-circle{margin-top:0;}
.c-matrix-cell input:focus-visible + .c-radio-circle{outline:2px solid var(--color-obsidian); outline-offset:2px;}
.c-matrix-cell input:disabled + .c-radio-circle{background:var(--color-neutral-2); border-color:var(--color-neutral-3);}
/* A missing row in a required grid is marked on the row, not on five
   radios — same reasoning as the question card's own is-missing state. */
.c-matrix tbody tr.is-missing th{color:var(--color-red);}

/* --------------------------------------------------------------------------
   CANDIDATE 8 — Element modifiers for the shared icon chip
                 (.icon-chip-fire / -wood / -earth / -water / -gold)
   components.css already ships .icon-chip (36x36, radius-sm, icon-md glyph)
   but hardcodes Navy, while DESIGN-SYSTEM.md's Card > "Icon-chip header"
   calls that chip "the standard way a card declares which department owns
   it" — which only works if the chip can take the owning element's colour.
   Each value is the element colour at 12% via color-mix, i.e. exactly what
   .icon-chip already does for Navy. That 12% is deliberately NOT the 8%
   -bg token used to tint a whole card: the same section warns these are
   "two different tint strengths for two different purposes, don't conflate
   them". Suffixes follow Tag's own element modifiers (.c-tag-fire etc.) so
   the system has one element vocabulary rather than two.
   -------------------------------------------------------------------------- */
.icon-chip-fire {background:color-mix(in srgb, var(--color-orange) 12%, transparent);      color:var(--color-orange);}
.icon-chip-wood {background:color-mix(in srgb, var(--color-salmon-pink) 12%, transparent); color:var(--color-salmon-pink);}
.icon-chip-earth{background:color-mix(in srgb, var(--color-green) 12%, transparent);       color:var(--color-green);}
.icon-chip-water{background:color-mix(in srgb, var(--color-navy) 12%, transparent);        color:var(--color-navy);}
.icon-chip-gold {background:color-mix(in srgb, var(--color-amber) 12%, transparent);       color:var(--color-amber);}
/* The glyph is Tier 2 Fill at icon-md — Iconography puts "Card / section
   header" in its Fill column and the size scale puts card headers at 24px.
   Set on the chip so no caller has to remember either. */
.icon-chip i{font-size:var(--icon-md);}

/* ==========================================================================
   PROTOTYPE SCAFFOLDING — layout glue for this demo only. Nothing here is a
   component and nothing here would be promoted. Every value is a token.
   ========================================================================== */
*{box-sizing:border-box;}
html,body{margin:0; height:100%;}
/* The UA's own [hidden]{display:none} is a type-selector-strength rule, so
   any class that sets display — .stack{display:flex} here — silently beats
   it and a "hidden" panel stays on screen. Toggling .hidden is the whole
   routing mechanism in this file, so it has to win everywhere. */
[hidden]{display:none !important;}
body{background:var(--color-canvas-warm); color:var(--color-neutral-9); font-family:var(--font-primary);}

/* App Shell, as documented — .c-shell / .c-sidebar-shell / .c-shell-main /
   .c-shell-content out of components.css, with SidebarNav unmodified inside
   it. The only thing set here is the height: components.css ships
   .c-shell{height:480px} because its own home is a bounded gallery mockup,
   and a real page is the viewport. Everything else — the 16px inset, the
   rail stretching to calc(100dvh - 32px), page-gutter, the section gap
   under Page header — comes from the component.
   The content region owns the scroll, which is what makes the rail stay put
   without a second position:sticky of this prototype's own. */
.c-shell{height:100dvh;}
/* One piece of SidebarNav's own documented collapsed behaviour that
   components.css does not ship yet. Implemented here rather than left
   broken, scoped to this prototype, and it belongs in the component:
   a trailing Badge goes the way the label and the trailing count already
   do. Left visible, "Soon" hangs out past the 72px rail. */
.c-sidebar.is-collapsed .c-sidebar-item .c-badge{display:none;}
/* Landing — two entry cards. Card's own Interactive variant does the
   surface, hover and focus; the only new thing is the two-up grid and the
   icon disc, which is Elemental badge's chip at a larger size. */
.entry-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:var(--spacing-24);}
.entry-card{align-items:flex-start; text-align:left; font-family:inherit; cursor:pointer; padding:var(--spacing-24); gap:var(--spacing-16);}
.entry-icon{display:flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:var(--radius-md); font-size:var(--icon-lg); flex:none; background:var(--color-neutral-2); color:var(--color-neutral-9);}
/* Bug Reports takes the Water (Data) tint, which is the same tint this file
   already gives the tech team's own side of a comment thread — the
   platform/engineering cluster in the 5-element mapping owns that content,
   here as there. Feedback Forms stays neutral: it is the section's own
   subject, not a department, and inventing a second element for it would be
   using the mapping as decoration. */
.entry-icon.is-water{background:var(--color-water-bg); color:var(--color-navy);}
.entry-title{font-size:var(--text-h4-size); line-height:var(--text-h4-lh); font-weight:var(--text-h4-weight); color:var(--color-neutral-9);}
.entry-desc{font-size:var(--text-body2-size); line-height:var(--text-body2-lh); color:var(--color-neutral-5);}
/* The numbers under each card are the reason to pick one over the other, so
   they get the whole width and a rule above them rather than being a third
   line of body copy. */
.entry-facts{display:flex; flex-wrap:wrap; gap:var(--spacing-24); width:100%; padding-top:var(--spacing-16); border-top:1px solid var(--color-neutral-3);}
.entry-fact{display:flex; flex-direction:column; gap:2px;}
.entry-fact b{font-size:var(--text-h4-size); line-height:var(--text-h4-lh); font-weight:var(--text-h4-weight); font-variant-numeric:tabular-nums; color:var(--color-neutral-9);}
.entry-fact span{font-size:var(--text-caption-size); line-height:var(--text-caption-lh); color:var(--color-neutral-5);}
.entry-go{display:inline-flex; align-items:center; gap:var(--spacing-4); font-size:var(--text-body2-size); font-weight:700; color:var(--color-neutral-9);}
.entry-card:hover .entry-go i{transform:translateX(2px);}
.entry-go i{transition:transform var(--duration-fast) var(--ease-standard);}

/* The routes are the content region's own single child, stacked. */
.c-shell-content > .route{display:flex; flex-direction:column;}

.route[hidden]{display:none;}
/* Page-layout rule under the page header. PageHeader's own Don't list
   forbids giving the component a bottom border — "if a page needs a
   divider under its header, that belongs to the page layout" — so it
   is a route child here, not a component change. The negative top
   margin borrows half of App Shell's 48px header gap so the rule sits
   24px under the description and 24px over the filter chips, and the
   content below it does not move. */
.route > .route-rule{flex:none; height:1px; margin:calc(var(--spacing-24) * -1) 0 0; border:none; background:var(--color-neutral-3);}
.row{display:flex; align-items:center; gap:var(--spacing-12); flex-wrap:wrap;}
.row.between{justify-content:space-between;}
.row.tight{gap:var(--spacing-8);}
.grow{flex:1 1 auto; min-width:0;}
.stack{display:flex; flex-direction:column; gap:var(--spacing-16);}
.stack.sm{gap:var(--spacing-8);}
.stack.lg{gap:var(--spacing-24);}
.muted{color:var(--color-neutral-5);}
.eyebrow{font-size:var(--text-label3-size); line-height:var(--text-label3-lh); font-weight:var(--text-label3-weight); letter-spacing:var(--tracking-eyebrow); text-transform:uppercase; color:var(--color-neutral-5);}
.hint{font-size:var(--text-caption-size); line-height:var(--text-caption-lh); color:var(--color-neutral-5);}
/* Same UA-margin trap as the FAB card's title: a bare <p class="hint"> picks
   up 1em top and bottom and adds a phantom 12px to whatever stack it is in.
   Several .hint paragraphs already carry an inline margin:0 to work around
   it one at a time; this makes that the rule and leaves those redundant. */
p.hint{margin:0;}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;}
h2.sect{margin:0; font-size:var(--text-h5-size); line-height:var(--text-h5-lh); font-weight:var(--text-h5-weight);}

/* Avatar — Search input's own 32px recipe, reused verbatim rather than a
   fourth copy (Card profile, SidebarNav user and Search input each already
   carry one; this is the reason a shared .c-avatar is worth proposing). */
.avatar{flex:none; width:32px; height:32px; border-radius:var(--radius-pill); background:var(--color-neutral-2); color:var(--color-neutral-9); display:flex; align-items:center; justify-content:center; font-family:var(--font-primary); font-size:var(--text-caption-size); font-weight:700; font-style:normal;}
.avatar.sm{width:24px; height:24px; font-size:var(--text-label3-size);}
.avatar.lg{width:40px; height:40px; font-size:var(--text-label2-size);}

/* Form library — list view */
/* The hand-rolled .lib / .lib-row stack is gone: it was a table drawn out of
   divs, and Table's Standalone variant is the component for it. What is left
   here is only what the component leaves to the caller — the two-line first
   cell, and the action column's width. */
.lib-row-meta{font-size:var(--text-caption-size); color:var(--color-neutral-5);}
/* The sort field carries one of six short labels — 176px fits the
   longest of them ("Last updated") without the row of controls growing to
   the search input's own 240px twice over. */
.hub-sort{width:176px;}
/* Down from 420px when the Owner column arrived. At 420 the six data columns
   summed to 1127px inside a 1118px content area, so the table offered a 9px
   horizontal scroll — a scroll shadow with nothing behind it. The identity
   column is the only flexible one (every other cell is nowrap), so it is the
   one that gives way; titles wrap to a second line here exactly as they
   already do on the grid tile. */
.lib-table td:first-child{max-width:320px;}
.lib-cell-title{display:block; font-weight:700; color:var(--color-neutral-9);}
/* Second line inside the identity cell — the survey's own description, so a
   row still says what it is now that the title has a column to itself. */
.lib-cell-sub{display:block; margin-top:2px; font-size:var(--text-caption-size); line-height:var(--text-caption-lh); font-weight:400; color:var(--color-neutral-5); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lib-table td.nowrap,.lib-table th.nowrap{white-space:nowrap;}
/* Action column: the spec's width is per action count — 40px for one, and
   the kebab is the one. .c-table-action-col's own 72px is the two-action
   size. */
.lib-table .c-table-action-col{width:40px; padding-left:var(--spacing-4); padding-right:var(--spacing-4);}
/* Below this the table is wider than the screen and scrolls, per Table's own
   responsive rule. The identity column gives up most of its measure so a
   second column is visible at rest — a table with one column showing has no
   way of telling you the others are there. */
@media (max-width:820px){
  .lib-table td:first-child{max-width:210px;}
}
.lib-table tbody tr:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:-2px;}
/* Table's Standalone wrap clips to its own radius, and scrolls sideways on
   top of that, so an absolutely-positioned row menu would be cut off by the
   container the component itself requires. Inside the table the menu is
   placed as position:fixed against its trigger instead (see placeRowMenu),
   and anything that scrolls closes it. */
.lib-table .menu-pop{position:fixed; top:auto; right:auto;}

/* Builder toolbar */
/* Sits below the survey's title and stays there: it belongs to the header
   block above it, and a bar that detaches and rides the scroll over the
   questions is a second thing to look at while editing one. Publish and the
   share actions are not per-scroll-position decisions — the per-question
   controls are on the questions, and Save has its own pinned bar. */
.toolbar{display:flex; align-items:center; gap:var(--spacing-4); padding:var(--spacing-8); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); background:var(--color-neutral-1);}
.toolbar .sep{width:1px; align-self:stretch; margin:0 var(--spacing-4); background:var(--color-neutral-3);}
.kebab-wrap{position:relative;}
.kebab-menu{position:absolute; right:0; top:calc(100% + var(--spacing-8)); z-index:40; width:200px; padding:var(--spacing-8); background:var(--color-neutral-1); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); box-shadow:var(--shadow-3); display:flex; flex-direction:column; gap:2px;}
.kebab-menu[hidden]{display:none;}
.kebab-menu button{display:flex; align-items:center; gap:var(--spacing-8); padding:var(--spacing-8) var(--spacing-12); border:0; border-radius:var(--radius-sm); background:transparent; font-family:inherit; font-size:var(--text-body2-size); color:var(--color-neutral-9); cursor:pointer; text-align:left;}
.kebab-menu button:hover{background:var(--color-neutral-2);}
.kebab-menu button.danger{color:var(--color-red);}

/* Question blocks */
.qblock{position:relative; display:flex; flex-direction:column; gap:var(--spacing-12); padding:var(--spacing-20); padding-left:var(--spacing-32); border:1px solid var(--color-neutral-3); border-radius:var(--radius-lg); background:var(--color-neutral-1);}
.qblock.is-dragging{opacity:.4;}
.qblock.is-drop-target{box-shadow:inset 0 3px 0 var(--color-obsidian);}
.qblock.is-drop-target-after{box-shadow:inset 0 -3px 0 var(--color-obsidian);}
.qgrip{position:absolute; left:var(--spacing-8); top:var(--spacing-20); display:flex; align-items:center; justify-content:center; width:20px; height:24px; border:0; background:transparent; color:var(--color-neutral-4); cursor:grab; padding:0; border-radius:var(--radius-sm);}
.qgrip:hover{color:var(--color-neutral-9); background:var(--color-neutral-2);}
.qgrip:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:1px;}
.qgrip:active{cursor:grabbing;}
.qblock-head{display:flex; align-items:flex-start; gap:var(--spacing-12);}
/* The number and the question text sit on the same line box rather than
   being nudged into place: both are given body1's line-height, so their
   glyphs centre on the same axis whatever either one's own font size is.
   The old padding-top:10px was measured against one rendering of the input
   and left the number 7.5px low. */
.qblock-num{flex:none; font-size:var(--text-caption-size); line-height:var(--text-body1-lh); font-weight:700; color:var(--color-neutral-5); font-variant-numeric:tabular-nums;}
.qblock-actions{flex:none; display:flex; align-items:center; gap:var(--spacing-4);}
.qblock-actions .qtype{position:relative; flex:none;}
.qblock-actions .qtype input{height:32px; width:150px; padding:0 var(--spacing-8); padding-right:28px; font-size:var(--text-caption-size); font-weight:700; cursor:pointer;}
.qblock-actions .qtype .icon-trailing{right:var(--spacing-8); font-size:var(--icon-micro);}
.qblock-actions .qtype .c-dropdown-panel{position:absolute; top:calc(100% + var(--spacing-4)); right:0; width:200px; z-index:20; margin-top:0;}
/* The footer's rule runs the full width of the card, edge to edge through
   the block's own padding — Modal's footer convention. Inset, at the same
   1px Neutral-3 as a table row's border-bottom and the same 12px rhythm, it
   read as one more row of the rating table with its radios missing: five
   rules down the card, the last one labelled "Required". A rule that
   touches both edges cannot be a row. */
.qblock-foot{display:flex; align-items:center; justify-content:flex-end; gap:var(--spacing-16);
  margin:var(--spacing-4) calc(var(--spacing-20) * -1) 0 calc(var(--spacing-32) * -1);
  padding:var(--spacing-12) var(--spacing-20) 0 var(--spacing-32);
  border-top:1px solid var(--color-neutral-3);}
.qblock-media{border-radius:var(--radius-md); overflow:hidden; background:var(--color-neutral-2); display:flex; align-items:center; justify-content:center; min-height:160px; color:var(--color-neutral-5); gap:var(--spacing-8); flex-direction:column;}
.qblock-media i{font-size:var(--icon-lg);}
/* Rating table editor. Two columns on a wide block so the scale and the
   things being rated are visible at once — they are edited against each
   other, not in sequence. */
.mx-editor{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:var(--spacing-16) var(--spacing-24); padding:var(--spacing-16); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); background:var(--color-neutral-1);}
.mx-cols, .mx-rows{display:flex; flex-direction:column; gap:var(--spacing-8); min-width:0;}
.mx-legend{font-size:var(--text-label3-size); line-height:var(--text-label3-lh); font-weight:var(--text-label3-weight); letter-spacing:var(--text-label3-tracking); text-transform:uppercase; color:var(--color-neutral-5);}
.mx-line{display:flex; align-items:center; gap:var(--spacing-8);}
.mx-input{flex:1 1 auto; min-width:0; height:40px; padding:0 var(--spacing-12); border:1px solid var(--color-neutral-3); border-radius:var(--radius-sm); background:var(--color-neutral-1); font-family:inherit; font-size:var(--text-body2-size); color:var(--color-neutral-9); caret-color:auto; cursor:text;}
.mx-input:focus{outline:none; border:2px solid var(--color-obsidian); padding:0 11px;}
.mx-cols .c-btn, .mx-rows .c-btn{align-self:flex-start;}
/* The action row spans both columns and sits behind a rule, so Save table
   reads as belonging to the table rather than to the last column edited.
   Same footer convention the Modal uses. */
.mx-foot{grid-column:1 / -1; display:flex; justify-content:flex-end; gap:var(--spacing-8); padding-top:var(--spacing-12); border-top:1px solid var(--color-neutral-3);}
/* Edit affordance under the read-only table. */
.mx-editbar{display:flex; align-items:center; gap:var(--spacing-12); margin-top:var(--spacing-4);}
/* FileUploader ships a 360px max-width, sized for a standalone uploader in
   a form column. A question block's media zone is the width of the block —
   the author is looking at the image as respondents will — so the cap is
   lifted here rather than in the component. */
.qblock .c-uploader{max-width:none;}
/* An attached file sits in the same 160px-tall slot the placeholder used, so
   swapping one for the other does not move the rest of the block. Height is
   capped rather than fixed: a tall portrait image letterboxes inside the
   box instead of pushing the question list open. */
.qblock-media-el{display:block; width:100%; max-height:280px; min-height:160px; object-fit:contain; border-radius:var(--radius-md); background:var(--color-neutral-2);}
/* The editor's own header gap. Every other route wants App Shell's 48px
   between the page header and the content, but here the next thing down is
   the survey's toolbar — the Publish button belongs to the title above it,
   and a section-sized gap read as two separate screens. Selected through
   :has() because the header is App Shell's, a sibling of the routes, so
   nothing inside the route can reach it. */
.c-shell-content:has(#routeBuilder:not([hidden])) .c-pageheader{margin-bottom:var(--spacing-16);}
/* Status badge beside the page title. PageHeader's own spec lists exactly two
   parts, Title and Subtitle, so this is a local addition rather than a
   component variant — the row wraps the h1 so .c-pageheader-text still sees
   two column children and the documented spacing-8 title-to-subtitle gap is
   untouched. Badge is Badge/Tag verbatim, the same statusBadge() the library
   tile renders, so a survey reads the same in both places.
   align-items:center centres the badge on the title; the row wraps so a
   title long enough to break takes the badge onto its own line instead of
   parking it halfway down two lines of 32px type. */
.ph-title-row{display:flex; align-items:center; flex-wrap:wrap; gap:var(--spacing-12); min-width:0;}
.ph-title-row h1{min-width:0;}
/* An empty slot is still a flex child, so its parent's gap would open a
   12px hole on every page that sets no badge. */
.ph-badge:empty{display:none;}

/* Add block — one control strip that hugs its own content, rather than a
   full-width dashed panel wedged between the survey's title and its first
   question. It sits after the list because that is where a new block lands,
   and it keeps "Add question" labelled: it is the one almost every visit
   here is for, and the other five read fine as icons with their names on
   hover and to a screen reader. */
/* max-content rather than shrink-to-fit: a wrapping flex container left to
   size itself can balance its rows instead of taking its one-line width, so
   the width is stated and max-width:100% is what makes it wrap — on a
   narrow screen only. The buttons don't shrink, for the same reason. */
.add-bar{display:inline-flex; align-items:center; flex-wrap:wrap; gap:var(--spacing-4); align-self:flex-start; width:max-content; max-width:100%; padding:var(--spacing-8); border:1px dashed var(--color-neutral-3); border-radius:var(--radius-pill); background:var(--color-neutral-1);}
.add-bar > *{flex:none;}
.add-bar-sep{flex:none; width:1px; align-self:stretch; margin:0 var(--spacing-4); background:var(--color-neutral-3);}
.add-bar .c-btn-icon{width:32px;}
/* The question column and the floating rail. A grid column rather than an
   overlay: `position:fixed` beside the content would have to be measured
   against the content region on every resize, and would still sit on top of
   a question's own controls the moment the viewport narrowed. Giving the
   rail its own track makes "never obstructs a question" a property of the
   layout instead of a calculation. */
.builder-cols{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--spacing-16); align-items:start;}
/* Sticky at the content region's own top inset. It used to be offset a
   further 56px to clear the toolbar, which was sticky above it — the
   toolbar scrolls away now, so the rail takes the top on its own. */
.add-rail{position:sticky; top:var(--spacing-16); display:flex; flex-direction:column; align-items:center; gap:var(--spacing-4); padding:var(--spacing-8); background:var(--color-neutral-2); border:1px solid var(--color-neutral-3); border-radius:var(--radius-pill); box-shadow:var(--shadow-3);}
.add-rail .c-btn-icon{width:36px; height:36px;}
.add-rail .c-btn-icon i{font-size:var(--icon-base);}
.add-rail .c-btn-icon:hover{background:var(--color-neutral-3);}
/* Add question is the one people came for. On a grey bar the emphasis runs
   the other way round — the raised chip is the white one. */
.add-rail .c-btn-icon:first-of-type{background:var(--color-neutral-1); box-shadow:var(--shadow-1);}
.add-rail .c-btn-icon:first-of-type:hover{background:var(--color-neutral-1); box-shadow:var(--shadow-2);}
/* Chip group separator — marks the archive off from the status filters
   beside it, so "All" is visibly not counting what follows. */
.chip-sep{flex:none; width:1px; height:20px; margin:0 var(--spacing-4); background:var(--color-neutral-3);}

/* Responses */
.sum-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:var(--spacing-16);}
.resp-list{display:flex; flex-direction:column; gap:var(--spacing-8); max-height:360px; overflow-y:auto; padding-right:var(--spacing-4);}
.resp-item{padding:var(--spacing-12) var(--spacing-16); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); background:var(--color-neutral-1); font-size:var(--text-body2-size); line-height:1.55;}
.resp-item .who{display:block; margin-top:var(--spacing-4); font-size:var(--text-caption-size); color:var(--color-neutral-5);}
.indiv-nav{display:flex; align-items:center; gap:var(--spacing-8);}
.indiv-qa{display:flex; flex-direction:column; gap:var(--spacing-4); padding-bottom:var(--spacing-16); border-bottom:1px solid var(--color-neutral-3);}
.indiv-qa:last-child{border-bottom:0; padding-bottom:0;}
.indiv-qa .q{font-size:var(--text-caption-size); color:var(--color-neutral-5);}
.indiv-qa .a{font-size:var(--text-body2-size); font-weight:500; color:var(--color-neutral-9); overflow-wrap:anywhere;}

/* Settings */
.set-row{display:flex; align-items:flex-start; justify-content:space-between; gap:var(--spacing-24); padding:var(--spacing-16) 0; border-bottom:1px solid var(--color-neutral-3);}
.set-row:last-child{border-bottom:0;}
.set-row .t b{display:block; font-size:var(--text-body2-size); font-weight:700;}
.set-row .t span{display:block; margin-top:2px; font-size:var(--text-caption-size); color:var(--color-neutral-5);}

/* Bug report */
.thumbs{display:flex; flex-wrap:wrap; gap:var(--spacing-8);}
.thumb{position:relative; width:88px; height:64px; border-radius:var(--radius-sm); border:1px solid var(--color-neutral-3); overflow:hidden; background:var(--color-neutral-2); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;}
.thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.thumb .x{position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:var(--radius-pill); border:0; background:var(--color-obsidian); color:var(--color-neutral-1); font-size:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;}
.thumb-sm{width:52px; height:36px;}
.lightbox{position:fixed; inset:0; z-index:1050; display:flex; align-items:center; justify-content:center; padding:var(--spacing-32); background:var(--shadow-overlay);}
.lightbox[hidden]{display:none;}
.lightbox img{max-width:100%; max-height:100%; border-radius:var(--radius-md); box-shadow:var(--shadow-4);}

.field-wide{width:100%; max-width:none;}
.c-field.field-wide input, .c-field.field-wide textarea{width:100%;}
.c-uploader.field-wide{max-width:none;}


/* Form library — grid view. Card's own Functional grid and Interactive
   variant, rendered as a <button> so the whole tile is one target (the
   list view's rows already are). */
.lib-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:var(--spacing-16);}
/* The tile is a button, and a button cannot contain a button, so the menu
   is a sibling laid over the card's top-right corner rather than a child of
   it. The badge row reserves that corner so a long countdown pill can never
   slide underneath the trigger. */
.lib-card-wrap{position:relative; display:flex;}
.lib-card-wrap > .lib-card{flex:1 1 auto; min-width:0;}
.lib-card-wrap > .menu-wrap{position:absolute; top:var(--spacing-16); right:var(--spacing-12); z-index:2;}

.lib-card{align-items:stretch; text-align:left; font-family:inherit; cursor:pointer; padding:var(--spacing-20); gap:var(--spacing-12);}
.lib-card:focus-visible{box-shadow:var(--shadow-focus); outline:none;}
/* The chip is the tile's first row on its own. align-self keeps it 36px
   wide inside .lib-card's own align-items:stretch, and the overlaid kebab
   sits on the opposite side of the same row, so neither needs to reserve
   space from the other. */
.lib-card > .icon-chip{align-self:flex-start;}
/* 16px between the heading and its badge row. .lib-card's own flex gap
   already contributes 12px, so the margin adds the remaining 4 — written as
   the subtraction rather than as a bare 4px so the number that matters
   stays legible and stays right if the card's gap ever changes. */
.lib-card > .lib-card-title + .tag-row{margin-top:calc(var(--spacing-16) - var(--spacing-12));}
.lib-card-title{font-size:var(--text-body1-size); line-height:var(--text-body1-lh); font-weight:700; color:var(--color-neutral-9); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
/* The description used to be the tile's flex:1 1 auto child, i.e. the thing
   that absorbed the leftover height and so held the footer against the
   bottom edge. With it gone the footer has to claim that space itself, or
   every tile in a row stretches to the tallest one and leaves its own
   response count floating in the middle. */
.lib-card > .lib-card-foot{margin-top:auto;}
.lib-card-foot{display:flex; align-items:baseline; justify-content:space-between; gap:var(--spacing-8); padding-top:var(--spacing-12); border-top:1px solid var(--color-neutral-3);}
.lib-card-foot b{font-size:var(--text-h5-size); font-weight:800; font-variant-numeric:tabular-nums;}
/* Search hit — a plain background mark, not a brand tint: it marks the
   matched substring, it doesn't classify the row. */
.hit{background:var(--color-gold-bg-strong); border-radius:3px; padding:0 1px;}

/* Floating dropdown panel. components.css ships .c-dropdown-panel as
   position:static, so an open panel reflows whatever sits under it — a
   filter above a table pushes the table down by the panel's full height.
   Wherever the trigger sits above content that must not move, the field
   gets .dd-float and the panel overlays instead. (The question-type
   switcher solves the same problem with its own scoped rule above, which
   also fixes the panel's width and right-edge.) */
.dd-float{position:relative;}
.dd-float > .c-dropdown-panel{position:absolute; top:calc(100% + var(--spacing-4)); left:0; right:0; z-index:60; margin-top:0;}
.dd-float.align-right > .c-dropdown-panel{left:auto; right:0; width:220px;}

/* Popover menu on a button — the kebab menu's own recipe, reused for the
   Responses export menu rather than a second popover. */
.menu-wrap{position:relative;}
.menu-pop{position:absolute; right:0; top:calc(100% + var(--spacing-8)); z-index:60; width:248px; padding:var(--spacing-8); background:var(--color-neutral-1); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); box-shadow:var(--shadow-3); display:flex; flex-direction:column; gap:2px;}
.menu-pop[hidden]{display:none;}
/* Flat variant — the three form-level actions, in the same compact list the
   builder's own kebab uses. It keeps the .menu-pop class so the one document
   handler that closes every popover in this file still owns it. */
.menu-pop.is-flat{width:216px;}
/* Eight actions need grouping or they read as one undifferentiated list:
   open it, send it, manage it, destroy it. */
.menu-pop-sep{height:1px; margin:var(--spacing-4) 0; background:var(--color-neutral-3);}
.menu-pop.is-flat button{align-items:center; font-size:var(--text-body2-size); color:var(--color-neutral-9);}
.menu-pop.is-flat button > i{margin-top:0;}
.menu-pop.is-flat button.danger{color:var(--color-red);}
.menu-pop button{display:flex; align-items:flex-start; gap:var(--spacing-8); width:100%; padding:var(--spacing-8) var(--spacing-12); border:0; border-radius:var(--radius-sm); background:transparent; font-family:inherit; text-align:left; cursor:pointer;}
.menu-pop button:hover{background:var(--color-neutral-2);}
.menu-pop button:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:-2px;}
.menu-pop button > i{flex:none; margin-top:2px; font-size:var(--icon-base); color:var(--color-neutral-5);}
.menu-pop .t{display:flex; flex-direction:column; gap:1px; min-width:0;}
.menu-pop .t b{font-size:var(--text-body2-size); font-weight:700; color:var(--color-neutral-9);}
.menu-pop .t span{font-size:var(--text-caption-size); color:var(--color-neutral-5);}

/* Priority — a severity ramp, so it reads as one measure with a dot per
   step rather than four unrelated badge colours. Red is the functional
   token; amber is the same amber Badge's own Warning variant already
   uses; the bottom two steps are neutrals. The P-number is always in the
   label, so the dot is reinforcement and never the only signal. */
.prio{display:inline-flex; align-items:center; gap:var(--spacing-8); white-space:nowrap; font-size:var(--text-body2-size); font-weight:700; color:var(--color-neutral-9);}
.prio .dot{flex:none; width:8px; height:8px; border-radius:var(--radius-pill); background:var(--color-neutral-4);}
.prio.p1 .dot{background:var(--color-red);}
.prio.p2 .dot{background:var(--color-amber);}
.prio.p3 .dot{background:var(--color-neutral-5);}
.prio.p4 .dot{background:var(--color-neutral-4);}
.prio.sm{font-size:var(--text-caption-size);}

/* Affected services — a checkbox set, laid out in columns because ten
   one-line options in a single stack is a scroll, not a choice. */
.svc-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:var(--spacing-8) var(--spacing-16); padding:var(--spacing-12) var(--spacing-16); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); background:var(--color-neutral-1);}
.c-field-error .svc-grid{border:2px solid var(--color-red); padding:11px 15px;}
/* Other spans the grid and sits behind a rule — it is an escape hatch from
   the list above, not an eleventh item in it. */
.svc-grid .svc-other{grid-column:1 / -1; margin-top:var(--spacing-4); padding-top:var(--spacing-12); border-top:1px solid var(--color-neutral-3);}
.tag-row{display:flex; flex-wrap:wrap; gap:var(--spacing-4);}
/* An "Other" service is a sentence the reporter wrote rather than a label
   off a list, so tags in this row are allowed to wrap. Badge keeps its own
   nowrap everywhere else. */
.tag-row .c-badge{white-space:normal; text-align:left;}

/* AI summary panel. Sits where the result will be (Loading State Rule 10)
   and replaces the wait state in place. Not a brand tint — an AI answer
   is prose about the content, it doesn't belong to an element. */
.ai-panel{display:flex; flex-direction:column; gap:var(--spacing-8); padding:var(--spacing-16); border:1px solid var(--color-neutral-3); border-radius:var(--radius-md); background:var(--color-canvas-warm-card);}
.ai-panel-head{display:flex; align-items:center; gap:var(--spacing-8);}
.ai-panel-head .eyebrow{display:flex; align-items:center; gap:var(--spacing-4);}
.ai-panel-head .grow{flex:1 1 auto;}
.ai-take{margin:0; font-size:var(--text-body1-size); line-height:1.6; font-weight:500; color:var(--color-neutral-9);}
.ai-themes{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:var(--spacing-8);}
.ai-themes li{display:flex; gap:var(--spacing-8); font-size:var(--text-body2-size); line-height:1.55; color:var(--color-neutral-9);}
.ai-themes li .n{flex:none; min-width:34px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--color-neutral-5);}
.ai-themes li q{color:var(--color-neutral-5); font-style:italic;}
.ai-foot{display:flex; align-items:center; gap:var(--spacing-8); flex-wrap:wrap;}
/* The survey panel's leading column holds averages and signed scores, not
   just counts, so it needs more room than the per-question "12×". */
.ai-panel.is-survey .ai-themes li .n{min-width:50px;}
/* An empty slot is still a flex child, so its parent's gap lands on both
   sides of nothing — 24px of dead space above the results until someone
   presses the button. */
#surveyAiSlot:empty, [data-aislot]:empty{display:none;}
.ai-disc{font-size:var(--text-caption-size); color:var(--color-neutral-5);}

/* My tickets — the reporter's own list. Same row recipe as the form
   library, plus a status column and an attention flag. */
.mine-title{font-size:var(--text-body1-size); font-weight:700; color:var(--color-neutral-9);}
.mine-meta{display:flex; align-items:center; flex-wrap:wrap; gap:var(--spacing-8); font-size:var(--text-caption-size); color:var(--color-neutral-5);}
/* A ticket waiting on the reporter keeps its tint as a table row. Written
   with a higher-specificity selector than Table's own row hover so the tint
   survives the pointer being over it. */
#routeBugMine .c-table tbody tr.needs-reply{background:var(--color-gold-bg);}
#routeBugMine .c-table tbody tr.needs-reply:hover{background:var(--color-gold-bg-strong);}
/* The three trailing columns are read as one set — what the ticket needs,
   how bad it is, where it stands — so they sit 16px apart and 16px in from
   the table's right edge, rather than taking Table's own 32px column
   gutter. Widths are fixed so the header labels stay over their own values
   and the Ticket column absorbs the rest. */
#routeBugMine .c-table th:nth-child(n+2),
#routeBugMine .c-table td:nth-child(n+2){padding-left:var(--spacing-8); padding-right:var(--spacing-8);}
#routeBugMine .c-table th:last-child,
#routeBugMine .c-table td:last-child{padding-right:var(--spacing-16);}
#routeBugMine .c-table th:nth-child(2),
#routeBugMine .c-table td:nth-child(2){width:170px;}
#routeBugMine .c-table th:nth-child(3),
#routeBugMine .c-table td:nth-child(3){width:110px;}
#routeBugMine .c-table th:nth-child(4),
#routeBugMine .c-table td:nth-child(4){width:130px;}
#routeBugMine .c-table{min-width:720px;}

/* Segmented Control's own .c-seg is flex:1 with basis 0, so every segment
   gets the same width regardless of its label — and its uppercase transform
   makes a two-word label ("ALL REPORTS") wrap onto a second line, which
   changes the control's height. Scoped here rather than patched into
   components.css, which would need a matching DESIGN-SYSTEM.md + preview.html
   pass; it is a candidate fix for the component itself. */
[data-bugseg] .c-seg, #respSeg .c-seg, #hubViewSeg .c-seg{white-space:nowrap;}

/* Bug table — eight columns need more than the content region's own width,
   so the wrap takes the system's .c-table-scroll-x variant and the table
   declares a real min-width rather than letting every column squash to the
   point where a title wraps four times. */
#routeBugAdmin .c-table{min-width:1040px;}
#routeBugAdmin .c-table td:nth-child(5),
#routeBugAdmin .c-table th:nth-child(5){min-width:190px;}
/* Eight columns at 16px gutters overflow a 1098px content area by ~113px,
   which puts Comments — a column this table is specifically read for —
   off the right edge. 12px gutters and the shorter priority code buy the
   Pod column its width back without a scrollbar. */
#routeBugAdmin .c-table th,
#routeBugAdmin .c-table td{padding-left:var(--spacing-12); padding-right:var(--spacing-12);}
/* Sortable headers are focusable (the component specifies Enter/Space to
   cycle) but components.css ships no focus ring for them. */
.c-table-sort-th:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:-2px;}

/* Record modal — read-only field rows, for the sides of a record the
   viewer cannot edit. */
.rec-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:var(--spacing-16);}
.rec-cell{display:flex; flex-direction:column; gap:var(--spacing-4); min-width:0;}
.rec-cell .v{font-size:var(--text-body2-size); font-weight:700; color:var(--color-neutral-9); overflow-wrap:anywhere;}

/* Share modal. Reuses the record modal's box and internal scroll; only the
   width differs, because a share dialog is a form, not a record. */
.c-modal.is-share{width:min(560px, 100%);}
.c-modal.is-share .c-modal-head{align-items:center;}
.share-add{display:flex; align-items:flex-end; gap:var(--spacing-8);}
.share-add .grow{flex:1 1 auto; min-width:0;}
.share-people{display:flex; flex-direction:column; gap:var(--spacing-4);}
.share-person{display:flex; align-items:center; gap:var(--spacing-12); padding:var(--spacing-8) 0;}
.share-person b{font-size:var(--text-body2-size); font-weight:700; color:var(--color-neutral-9);}
.share-access{display:flex; flex-direction:column; gap:var(--spacing-4);}
.share-access-row{display:flex; align-items:center; gap:var(--spacing-12); padding:var(--spacing-8) 0;}
/* The two access rows get a mark each so they are scannable as a pair. Both
   are neutral: general access is a permission, not a department. */
.share-access-icon{flex:none; width:32px; height:32px; border-radius:var(--radius-pill); background:var(--color-neutral-2); color:var(--color-neutral-9); display:flex; align-items:center; justify-content:center; font-size:var(--icon-sm);}
/* Preview modal — the responder's own view of the form. Wider than Share
   because what it holds is a page, not a dialog, and its body swaps the
   modal's white for the app canvas so the questions read as cards on a
   page instead of a list inside a box. */
.c-modal.is-preview{width:min(720px, 100%);}
.c-modal.is-preview .c-modal-body{gap:var(--spacing-16); background:var(--color-canvas-warm);}
.c-modal.is-preview .c-modal-foot{gap:var(--spacing-8);}
/* The tab strip carries the only rule between head and body. The head's own
   border-bottom comes off, or the strip sits boxed between two hairlines
   40px apart — the builder's own header/tabs/panel stack has one rule too,
   and it is the tabs' one. */
.c-modal.is-preview .c-modal-head{border-bottom:none;}
/* Inset to 24px so the tabs line up with the cards in the body below, while
   the strip's own bottom rule still runs the full width of the modal —
   padding moves the tabs, not the border. */
.prev-pages{flex:none; padding:0 var(--spacing-24);}
/* Two words in an uppercase caption inside a track that sizes to content:
   "Thank you" wraps and takes the whole switch to two lines with it. */

/* Sits at the top of the form and stays there. It reports on the whole
   form, so it belongs with the form's own heading rather than riding the
   scroll over the questions — and inside a modal the reader can see how far
   down the body they are from the scrollbar anyway. Full-bleed across the
   body's padding so it reads as the page's own progress, not a card's. */
.prev-progress{display:flex; flex-direction:column; gap:var(--spacing-8);
  margin:0 calc(var(--spacing-24) * -1); padding:var(--spacing-8) var(--spacing-24) var(--spacing-12);
  background:var(--color-canvas-warm);}
.prev-head{border-top:4px solid var(--color-obsidian);}
/* Submit sits where the reader's eye lands at the end of a form: the same
   end of the row as the modal's own footer actions, directly under the last
   question's own controls. */
.prev-submit{justify-content:flex-end;}
.prev-title{margin:0; font-size:var(--text-h4-size); line-height:var(--text-h4-lh); font-weight:var(--text-h4-weight); color:var(--color-neutral-9); overflow-wrap:anywhere;}
.prev-desc{margin:0; font-size:var(--text-body2-size); line-height:var(--text-body2-lh); color:var(--color-neutral-5); white-space:pre-wrap;}
.prev-q-title{display:block; font-size:var(--text-body1-size); line-height:var(--text-body1-lh); font-weight:700; color:var(--color-neutral-9);}
.prev-req{color:var(--color-red); margin-left:var(--spacing-4);}
/* Leading the legend rather than trailing a title: the marker comes first
   there, so the space goes on the other side. */
.prev-req.lead{margin-left:0; margin-right:var(--spacing-4);}
/* The legend is a key to the asterisks above it, not a third line of the
   description — Card's own Footer sub-part (hairline above, caption,
   Neutral-5) gives it that job. Restated at this specificity because
   .c-card p (0,1,1) sets body2 and beats .c-card-footer (0,1,0) — the trap
   components.css documents twice for exactly this reason. */
.prev-head > .c-card-footer{margin:var(--spacing-8) 0 0; padding-top:var(--spacing-12);
  font-size:var(--text-caption-size); line-height:var(--text-caption-lh); color:var(--color-neutral-5);}
/* Slider's own optional static value label — caption/Neutral-9, right
   aligned above the rail's end. It is used instead of the drag tooltip
   (the component documents the two as mutually exclusive) because a survey
   answer has to be readable at rest, not only while a thumb is held. */
.slider-value{display:block; text-align:right; font-family:var(--font-primary); font-size:var(--text-caption-size); line-height:var(--text-caption-lh); font-weight:700; color:var(--color-neutral-9); margin-bottom:var(--spacing-4); font-variant-numeric:tabular-nums;}
.slider-value.is-unset{font-weight:400; color:var(--color-neutral-5);}
/* Unanswered. A range input always draws a thumb somewhere, so it sits at
   the midpoint — but nothing has been committed yet, so the track stays
   unfilled and the thumb takes a Neutral-4 outline instead of Obsidian's
   "the value is here". Otherwise an untouched required question reads as
   though it has already been answered 50. */
.c-slider-rail.is-unset .c-slider-input::-webkit-slider-thumb{border-color:var(--color-neutral-4);}
.c-slider-rail.is-unset .c-slider-input::-moz-range-thumb{border-color:var(--color-neutral-4);}
/* A missed required answer marks the whole card. The controls underneath are
   radio rows and scale tracks — there is no single field border to redden,
   and reddening every radio in a group would read as ten errors, not one. */
.prev-q.is-missing{border-color:var(--color-red);}
.prev-miss{display:flex; align-items:center; gap:var(--spacing-4); font-size:var(--text-caption-size); line-height:var(--text-caption-lh); font-weight:700; color:var(--color-red);}
.prev-miss i{font-size:var(--icon-sm);}
.prev-done{align-items:flex-start;}
.prev-done-icon{font-size:32px; color:var(--color-green);}
.prev-note{display:flex; align-items:center; gap:var(--spacing-4);}

/* Multiple select ships its panel position:static like the single one, so
   it needs the same float when it sits above other content. */
.dd-float > .c-dropdown-multi-panel{position:absolute; top:calc(100% + var(--spacing-4)); left:0; right:0; z-index:60; margin-top:0;}
.c-dropdown-multi-panel[hidden]{display:none;}
/* Select All's count belongs at the right end of the row, not beside the
   label: the label is the action and the count is a fact about it. Left
   inline, the desc slot's flex:1 squeezes "Select All" onto two lines. */
.c-dropdown-option.select-all .c-dropdown-option-label{white-space:nowrap;}
.c-dropdown-option.select-all .c-dropdown-option-desc{flex:none; margin-left:auto;}

/* Date picker — the component ships no positioning (its panel is in normal
   flow), so the float and the full-width trigger live here. Everything else
   is .c-dp-* from components.css. */
.c-dp{position:relative; width:100%;}
.c-dp-trigger{width:100%; justify-content:flex-start; cursor:pointer;}
.c-dp-trigger:hover:not(:disabled){background:var(--color-neutral-2);}
.c-dp-trigger:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:2px;}
.c-dp-trigger:disabled{background:var(--color-neutral-2); color:var(--color-neutral-4); cursor:not-allowed;}
.c-dp-trigger:disabled i{color:var(--color-neutral-4);}
.c-dp-value.is-empty{color:var(--color-neutral-5);}
.c-dp > .c-dp-panel{position:absolute; top:calc(100% + var(--spacing-8)); left:0; z-index:60;}
.c-dp > .c-dp-panel.is-above{top:auto; bottom:calc(100% + var(--spacing-8));}
.c-dp-panel[hidden]{display:none;}
/* Footer, borrowed from the documented range-mode one, for the single field
   that is allowed to be empty. */
.c-dp-foot{display:flex; justify-content:flex-end; margin-top:var(--spacing-12); padding-top:var(--spacing-12); border-top:1px solid var(--color-neutral-3);}

/* Settings save bar. Sticky at the foot of the viewport rather than parked
   at the end of the page: Settings is three cards tall, and a Save the
   reader has to scroll back down to find is a Save that gets missed. */
.set-save{position:sticky; bottom:var(--spacing-16); z-index:40; display:flex; align-items:center; gap:var(--spacing-8); width:max-content; max-width:100%; margin:0 auto; padding:var(--spacing-4); padding-left:var(--spacing-12); border:1px solid var(--color-neutral-3); border-radius:var(--radius-pill); background:var(--color-neutral-1); box-shadow:var(--shadow-2);}
.set-save.is-dirty{border-color:var(--color-obsidian); box-shadow:var(--shadow-3);}
/* Nothing staged: the bar is only reporting a state, so it drops to the
   label and keeps a Save that says so — a full-width bar carrying two dead
   buttons was the page's loudest element for saying there was nothing to
   do. Discard appears with the changes there is something to discard. */
.set-save:not(.is-dirty){padding-right:var(--spacing-12);}
.set-save:not(.is-dirty) .c-btn{display:none;}
.set-save-state{display:inline-flex; align-items:center; gap:var(--spacing-8); font-family:var(--font-primary); font-size:var(--text-label2-size); font-weight:700; color:var(--color-neutral-5); white-space:nowrap;}
.set-save-state i{font-size:var(--icon-sm);}
.set-save.is-dirty .set-save-state{color:var(--color-neutral-9);}
.set-save.is-dirty .set-save-state i{font-size:8px; color:var(--color-amber);}

/* Comment count in the table. A bordered pill rather than a caption, so it
   reads as a countable thing at a glance, and tinted by whose turn the
   thread is on so a row that needs someone is visible without reading it. */
.cmt-pill{display:inline-flex; align-items:center; gap:var(--spacing-4); height:24px; padding:0 var(--spacing-8); border-radius:var(--radius-pill); border:1px solid var(--color-neutral-3); background:var(--color-neutral-2); color:var(--color-neutral-9); font-family:var(--font-primary); font-size:var(--text-label2-size); font-weight:700; font-variant-numeric:tabular-nums;}
.cmt-pill i{font-size:var(--icon-micro); color:var(--color-neutral-5);}
/* "Reply received" — the ball is back with the tech team. It takes the same
   Water (Data) tint the team's own comments do rather than a second amber,
   which would read as the same alert as "Awaiting response". */
.c-badge.badge-water{background:var(--color-water-bg); color:var(--color-navy); border-color:var(--color-water-bg-strong);}
/* Two lines inside one table cell — a name over its pod. align-items keeps
   an inline-flex child from stretching to the column's full width, which is
   what a flex column does to one by default. */
.td-stack{display:flex; flex-direction:column; align-items:flex-start; gap:var(--spacing-4);}

/* Screenshot tiles in the record modal — a grid of real thumbnails, so a
   report with three attachments stays one screen rather than three. */
.shot-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:var(--spacing-8);}
.shot-tile{width:100%; height:auto; aspect-ratio:16/10;}

/* Print — the PDF export route. Chrome's own "Save as PDF" is the only
   way to a real PDF without shipping a rendering library, so the export
   prints a purpose-built sheet instead of the app. */
@media print{
  /* Everything that is a control rather than content comes out: the reader
     of a PDF cannot use a filter, a view switcher or a search box. */
  .c-sidebar-shell, .c-fab, .c-fab-menu, .c-toast-host, .c-tabs, .toolbar,
  .c-pageheader-actions, .c-back-button-row, .c-modal-layer, .lightbox, .c-chart-table-btn,
  .c-segctl, .menu-wrap, .c-search-input, .c-chip-group, .add-bar, .add-rail, .set-save,
  #hubSearchCount, .ai-panel-head .c-btn, .ai-panel-head .c-icon-btn{display:none !important;}
  /* With the switcher and the Export button gone, the row they shared has
     nothing left to space apart. */
  .row.between:has(> .c-segctl){display:block;}
  body{background:#fff;}
  /* The scrolling content region has to become plain flow, or print takes
     one viewport's worth of it and stops. */
  .c-shell, .c-shell-main, .c-shell-content{height:auto; overflow:visible; padding:0;}
  .c-card, .c-table-standalone-wrap{box-shadow:none; break-inside:avoid;}
  .resp-list{max-height:none; overflow:visible;}
  .c-chart-card .c-chart-canvas-wrap{display:none;}
  .c-chart-card .c-chart-table-wrap{display:flex !important; min-height:0;}
}



/* Below this the content column is too narrow to give up 56px, and the
   fixed bar at the top of the page is doing the job on its own. */
@media (max-width:820px){
  .builder-cols{grid-template-columns:minmax(0,1fr);}
  .add-rail{display:none;}
}

@media (max-width:700px){
  .svc-grid{grid-template-columns:1fr;}
  /* Preview's footer carries a sentence and two buttons. Side by side at
     this width all three wrap; the sentence takes its own line instead and
     the buttons split what is left. */
  .c-modal.is-preview .c-modal-foot{flex-wrap:wrap;}

<script>
(function(){
'use strict';

/* ==========================================================================
   Utilities
   ========================================================================== */
var $  = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return [].slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function initials(name){ return name.split(/\s+/).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase(); }

/* Deterministic PRNG — the mock response set must be identical on every
   load, otherwise the Summary charts and the Individual view disagree
   between reloads and the numbers stop being checkable. */
function rng(seed){ var s = seed >>> 0; return function(){
  s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function pick(rand, arr){ return arr[Math.floor(rand() * arr.length)]; }
/* Weighted integer in [lo,hi], skewed toward `centre` — real satisfaction
   data clusters, it isn't uniform, and a uniform mock makes every chart
   look flat and identical. */
function skewed(rand, lo, hi, centre){
  var a = rand(), b = rand(), t = (a + b) / 2;
  var span = hi - lo;
  var v = Math.round(lo + t * span + (centre - (lo + hi) / 2) * 0.6);
  return Math.max(lo, Math.min(hi, v));
}

var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d){ return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtDateTime(d){
  var h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  var ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ', ' + h + ':' + m + ap;
}
/* Sortable, unambiguous timestamp for exported data. fmtDateTime is tuned
   for reading on screen and drops the year, which is wrong in a spreadsheet
   column Excel is going to parse and sort. */
function fmtStamp(d){
  function p(n){ return String(n).padStart(2, '0'); }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
    ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function relDays(n){ var d = new Date(NOW.getTime() - n * 86400000); return d; }
function ymd(y, m, d){ return new Date(y, m - 1, d); }
/* Whole-day arithmetic. Subtracting two timestamps and dividing gives the
   wrong answer across a DST boundary and whenever the two times of day
   differ — "closes in 4 days" has to count dates, not elapsed hours. */
function dayStart(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function daysBetween(a, b){ return Math.round((dayStart(b) - dayStart(a)) / 86400000); }
function fmtDayMon(d){ return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
/* <input type="date"> only speaks YYYY-MM-DD, and only in local terms —
   toISOString() would shift the date by the timezone offset. */
function isoDate(d){
  if (!d) return '';
  function p(n){ return String(n).padStart(2, '0'); }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function parseISODate(v){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || '');
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
