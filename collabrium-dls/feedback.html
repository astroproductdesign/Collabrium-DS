    '<span style="font-size:var(--text-h3-size);line-height:var(--text-h3-lh);font-weight:var(--text-h3-weight);font-variant-numeric:tabular-nums">' + esc(value) + '</span>' +
    (sub ? '<span class="hint">' + esc(sub) + '</span>' : '') +
  '</div>';
}

/* Segmented Control's pill is positioned in JS from the track — same
   mechanic preview.html uses, not a second implementation. */
function wireSeg(track, activeIdx, onChange){
  var segs = $$('.c-seg', track), pill = $('.c-seg-pill', track);
  function place(i){
    var s = segs[i];
    pill.style.width = s.offsetWidth + 'px';
    pill.style.height = s.offsetHeight + 'px';
    pill.style.transform = 'translate(' + (s.offsetLeft - track.clientLeft) + 'px,' + (s.offsetTop - track.clientTop) + 'px)';
    segs.forEach(function(x, j){
      x.setAttribute('aria-selected', j === i ? 'true' : 'false');
      x.style.color = j === i ? 'var(--color-neutral-9)' : '';
      x.style.fontWeight = j === i ? '700' : '';
    });
  }
  segs.forEach(function(s, i){
    s.addEventListener('click', function(){ track.dataset.active = i; place(i); onChange(i); });
  });
  place(activeIdx);
  var onResize = function(){ if (document.contains(track)) place(+track.dataset.active || activeIdx); else window.removeEventListener('resize', onResize); };
  window.addEventListener('resize', onResize);
}

function paintRespBody(f){
  var host = $('#respBody');
  if (state.respView === 'individual'){ paintIndividual(f, host); return; }
  $('#respMeta').textContent = 'Aggregated across ' + f.responses.length + ' responses';

  var html = '', charts = [];
  f.questions.forEach(function(q){
    if (q.type === 'media') return;
    var rows = answered(f, q);
    var id = 'ch-' + q.id;

    if (q.type === 'scale'){
      var buckets = [], labels = [];
      for (var v = q.min; v <= q.max; v++){ labels.push(String(v)); buckets.push(0); }
      rows.forEach(function(r){ buckets[r.answers[q.id] - q.min]++; });
      var avg = rows.reduce(function(s, r){ return s + r.answers[q.id]; }, 0) / (rows.length || 1);
      html += chartCard(id, q.title,
        'Average ' + avg.toFixed(2) + ' out of ' + q.max + ' · ' + rows.length + ' answers',
        labels.map(function(l, i){ return [l, buckets[i], pct(buckets[i], rows.length)]; }),
        ['Score','Responses','Share']);
      charts.push({ id:id, kind:'scale', labels:labels, data:buckets, q:q });

    } else if (q.type === 'yesno'){
      var yes = rows.filter(function(r){ return r.answers[q.id] === 'Yes'; }).length;
      var no = rows.length - yes;
      html += chartCard(id, q.title, pct(yes, rows.length) + ' answered Yes · ' + rows.length + ' answers',
        [['Yes', yes, pct(yes, rows.length)], ['No', no, pct(no, rows.length)]],
        ['Answer','Responses','Share']);
      charts.push({ id:id, kind:'yesno', data:[yes, no], q:q });

    } else if (q.type === 'single' || q.type === 'multi'){
      var opts = q.options || [], counts = opts.map(function(){ return 0; });
      rows.forEach(function(r){
        var a = r.answers[q.id];
        (Array.isArray(a) ? a : [a]).forEach(function(v){
          var i = opts.indexOf(v); if (i > -1) counts[i]++;
        });
      });
      html += chartCard(id, q.title, rows.length + ' answers',
        opts.map(function(o, i){ return [o, counts[i], pct(counts[i], rows.length)]; }),
        ['Option','Responses','Share']);
      charts.push({ id:id, kind:q.type, labels:opts, data:counts, q:q });

    } else {
      /* Open text — a list, not a chart, with its own search and its own
         Summarise with AI action. The action is offered only where there is
         something to summarise; under three answers the list *is* the
         summary. */
      html += '<div class="c-card stack">' +
        '<div class="row between"><h5 style="margin:0">' + esc(q.title) + '</h5>' +
        '<span class="row tight">' +
          '<span class="hint">' + rows.length + ' answers</span>' +
          (rows.length >= 3
            ? '<button class="c-btn c-btn-secondary c-btn-sm" type="button" data-ai="' + q.id + '">' +
                '<i class="ph-fill ph-sparkle" aria-hidden="true"></i>Summarise with AI</button>'
            : '') +
        '</span></div>' +
        '<div data-aislot="' + q.id + '"></div>' +
        '<div class="c-search-input" style="max-width:none"><div class="c-search-input-box">' +
          '<i class="ph ph-magnifying-glass c-search-input-icon" aria-hidden="true"></i>' +
          '<input type="search" placeholder="Search answers" aria-label="Search answers to: ' + esc(q.title) + '" data-tsearch="' + q.id + '" />' +
        '</div></div>' +
        '<div class="resp-list" data-tlist="' + q.id + '">' +
          rows.map(function(r){
            return '<div class="resp-item" data-text="' + esc(String(r.answers[q.id]).toLowerCase()) + '">' +
              esc(r.answers[q.id]) + '<span class="who">' + esc(r.who) + ' · ' + esc(r.pod) + ' · ' + fmtDate(r.at) + '</span></div>';
          }).join('') +
        '</div>' +
        '<p class="hint" data-tempty="' + q.id + '" hidden>No answers match that search.</p>' +
      '</div>';
    }
  });

  host.innerHTML = html;
  wireTableToggles(host);
  charts.forEach(drawChart);

  $$('[data-ai]', host).forEach(function(btn){
    btn.addEventListener('click', function(){ summarise(f, btn.dataset.ai, btn); });
  });

  $$('[data-tsearch]', host).forEach(function(inp){
    inp.addEventListener('input', function(){
      var v = inp.value.trim().toLowerCase();
      var list = $('[data-tlist="' + inp.dataset.tsearch + '"]', host);
      var shown = 0;
      $$('.resp-item', list).forEach(function(it){
        var hit = !v || it.dataset.text.indexOf(v) !== -1;
        it.hidden = !hit; if (hit) shown++;
      });
      $('[data-tempty="' + inp.dataset.tsearch + '"]', host).hidden = shown > 0;
    });
  });
}
function pct(n, d){ return d ? Math.round(n / d * 100) + '%' : '0%'; }

/* Marks follow Chart chrome & marks: bars round 4px on the outer end only,
   24px max thickness, one Neutral-3 gridline on the value axis. Colour is
   sequential (one hue off the owning element) wherever the categories are
   points on one measure, and categorical only where they are genuinely
   different things. */
function drawChart(c){
  var ctx = document.getElementById(c.id);
  if (!ctx) return;
  var cfg;

  if (c.kind === 'scale'){
    /* A 1-5 or 0-10 scale is one measure, so the bars are one colour, not a
       rainbow — the number under each bar already distinguishes them. */
    cfg = { type:'bar',
      data:{ labels:c.labels, datasets:[{ data:c.data, backgroundColor:NAVY,
        hoverBackgroundColor:mix(NAVY, neutral9, 0.15), borderRadius:{topLeft:4,topRight:4},
        borderSkipped:'bottom', maxBarThickness:24 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:tooltip },
        scales:{ x:baseAxes().x, y:Object.assign(baseAxes().y, { beginAtZero:true, ticks:Object.assign({}, baseAxes().y.ticks, { precision:0 }) }) } } };

  } else if (c.kind === 'yesno'){
    /* Two mutually exclusive outcomes — categorical, and only two, so a
       donut reads faster than a pair of bars. */
    cfg = { type:'doughnut',
      data:{ labels:['Yes','No'], datasets:[{ data:c.data, backgroundColor:[GREEN, neutral3],
        borderColor:neutral1, borderWidth:2 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',
        plugins:{ legend:legend(), tooltip:tooltip } } };

  } else if (c.kind === 'multi'){
    /* Multi-select: horizontal bars ranked by frequency, per the brief. */
    var order = c.data.map(function(v, i){ return i; })
                      .sort(function(a, b){ return c.data[b] - c.data[a]; });
    cfg = { type:'bar',
      data:{ labels:order.map(function(i){ return c.labels[i]; }),
        datasets:[{ data:order.map(function(i){ return c.data[i]; }), backgroundColor:NAVY,
          hoverBackgroundColor:mix(NAVY, neutral9, 0.15),
          borderRadius:{topRight:4,bottomRight:4}, borderSkipped:'left', maxBarThickness:24 }] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:tooltip },
        scales:{ x:Object.assign(baseAxes().y, { beginAtZero:true }), y:baseAxes().x } } };

  } else {
    /* Single-select: genuinely different options, so the categorical ramp —
       the department table order from Chart color mapping. */
    var palette = [ORANGE, SALMON, GREEN, NAVY, AMBER];
    cfg = { type:'doughnut',
      data:{ labels:c.labels, datasets:[{ data:c.data,
        backgroundColor:c.labels.map(function(_, i){ return palette[i % palette.length]; }),
        borderColor:neutral1, borderWidth:2 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',
        plugins:{ legend:legend(), tooltip:tooltip } } };
  }
  CHARTS.push(new Chart(ctx, cfg));
}
function mix(a, b, amt){
  function rgb(h){ h = h.replace('#',''); if (h.length === 3) h = h.split('').map(function(c){return c+c;}).join('');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
  var A = rgb(a), B = rgb(b);
  return 'rgb(' + A.map(function(v, i){ return Math.round(v + (B[i] - v) * amt); }).join(',') + ')';
}

/* ==========================================================================
   Response export — Excel and PDF
   Both produce a real file rather than a toast: a spreadsheet the browser
   downloads, and the browser's own print-to-PDF driven by the @media print
   sheet at the top of this file. Neither needs a library.
   ========================================================================== */
function csvCell(v){
  if (v == null) return '';
  var s = String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function download(name, mime, text){
  var blob = new Blob([text], { type:mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function slug(s){
  return fold(s).s.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'export';
}
/* CSV with a UTF-8 BOM and CRLF endings — that pair is what makes Excel
   open the file directly, in the right encoding, with accented names
   intact. A genuine .xlsx would mean shipping a zip writer and a
   spreadsheet-XML builder for one button. */
function exportSheet(f){
  var qs = f.questions.filter(function(q){ return q.type !== 'media'; });
  var head = ['Response ID','Submitted','Respondent','Pod','Complete','Seconds on form']
    .concat(qs.map(function(q){ return q.title; }));
  var lines = [head.map(csvCell).join(',')];
  f.responses.forEach(function(r){
    var row = [r.id, fmtStamp(r.at), r.who, r.pod, r.complete ? 'Yes' : 'No', r.seconds];
    qs.forEach(function(q){
      var a = r.answers[q.id];
      row.push(a == null ? '' : (Array.isArray(a) ? a.join('; ') : a));
    });
    lines.push(row.map(csvCell).join(','));
  });
  download(slug(f.title) + '-responses.csv', 'text/csv;charset=utf-8', '\ufeff' + lines.join('\r\n'));
  toast(f.responses.length.toLocaleString() + ' responses exported', 'success');
}
function exportPdf(){
  toast('Opening the print dialog — choose “Save as PDF”');
  /* Let the toast paint before the dialog blocks the main thread. */
  setTimeout(function(){ window.print(); }, 450);
}

/* ==========================================================================
   Summarise with AI — free-text answers only
   The wait state is AI Native's Loading State, by its own rules: held back
   400ms before it renders at all (Rule 2), a live label driven by real
   phase changes rather than one fixed string (Rule 4), a timer computed
   from a start timestamp on every tick rather than an accumulated counter
   (Rule 5), a Stop in the hosting surface (Rule 9), one run per operation
   (Rule 7), and mounted in the slot the answer will fill so the swap reads
   as one thing resolving (Rule 10).
   The answer then renders whole, which is also a rule rather than a
   shortcut: Streaming Text's Rule 2 forbids animating a reveal over content
   already in hand, and here the summary is computed locally from the
   answers listed below it. Against a real model, this is the point where
   the first token would arrive and Streaming Text would take over.
   ========================================================================== */

/* Theme buckets. Deterministic and local — it groups answers by keyword
   set, counts each group and quotes the longest answer in it. This is the
   stand-in for the model call, and it is what makes the panel's content
   real rather than placeholder prose. */
/* Ordered most-specific first, because the first bucket a keyword hits wins.
   "I can never remember which pod owns which report" is about ownership, not
   about filters, and it only lands in the right bucket if the ownership keys
   are tested before the generic "filter"/"remember" ones. */
var THEMES = [
  { name:'Hard to tell who owns what',                keys:['owns which','who else','same campaign'] },
  { name:'Search does not find things',               keys:['search','fuzzy','typo','exact name'] },
  { name:'Exports and scheduled reporting',           keys:['export','screenshot the table','bulk','one file'] },
  { name:'Work is lost, or the numbers look stale',   keys:['logged me out','lost everything','autosave','draft','still refreshing','stale','last updated'] },
  { name:'Too many steps for routine work',           keys:['clicks','shortcut','twenty times','rebuilding','duplicate a report'] },
  { name:'Filters and view state are not remembered', keys:['filter','column widths','defaults to','pin the'] },
  { name:'Cramped on smaller screens',                keys:['laptop','mobile','phone','scrolls sideways','first column'] }
];
function longest(arr){
  return arr.slice().sort(function(a, b){ return b.length - a.length; })[0];
}
function themeAnswers(rows, qid){
  return themeTexts(rows.map(function(r){ return String(r.answers[qid]); }));
}
/* The bucketing itself takes a pool of strings, so it can be run over one
   question's answers or over every open-text answer in the survey at once. */
function themeTexts(texts){
  var buckets = THEMES.map(function(t){ return { name:t.name, hits:[] }; });
  var other = [];
  texts.forEach(function(txt){
    var h = fold(txt).s, placed = false;
    THEMES.forEach(function(t, i){
      if (placed) return;
      var hit = t.keys.some(function(k){ return h.indexOf(k) !== -1; });
      if (hit){ buckets[i].hits.push(txt); placed = true; }
    });
    if (!placed) other.push(txt);
  });
  var out = buckets.filter(function(b){ return b.hits.length; })
                   .sort(function(a, b){ return b.hits.length - a.hits.length; });
  var top = out.slice(0, 5);
  var spare = out.slice(5).reduce(function(n, b){ return n + b.hits.length; }, 0) + other.length;
  return { total:texts.length, themes:top, spare:spare, other:other };
}

var aiRuns = {};

function aiSummaryHtml(qid, res, secs){
  var covered = res.total - res.spare;
  var top = res.themes[0];
  var take = top
    ? covered + ' of ' + res.total + ' answers fall into ' + res.themes.length +
      ' recurring ' + (res.themes.length === 1 ? 'theme' : 'themes') + '. The largest — ' +
      top.name.charAt(0).toLowerCase() + top.name.slice(1) + ' — accounts for ' +
      top.hits.length + ' of them.'
    : 'No theme repeats across these ' + res.total + ' answers; each one raises something different.';
  return '<div class="ai-panel">' +
    '<div class="ai-panel-head">' +
      '<span class="eyebrow"><i class="ph-fill ph-sparkle" aria-hidden="true"></i> AI summary</span>' +
      '<span class="grow"></span>' +
      '<button class="c-btn c-btn-ghost c-btn-sm" type="button" data-airedo="' + qid + '"><i class="ph ph-arrow-clockwise" aria-hidden="true"></i>Redo</button>' +
      '<button class="c-icon-btn" type="button" data-aiclose="' + qid + '" aria-label="Dismiss summary"><i class="ph ph-x" aria-hidden="true"></i></button>' +
    '</div>' +
    '<p class="ai-take">' + esc(take) + '</p>' +
    (res.themes.length
      ? '<ul class="ai-themes">' + res.themes.map(function(t){
          return '<li><span class="n">' + t.hits.length + '&times;</span>' +
            '<span><b>' + esc(t.name) + '</b> &mdash; <q>' + esc(longest(t.hits)) + '</q></span></li>';
        }).join('') +
        (res.spare ? '<li><span class="n">' + res.spare + '&times;</span>' +
          '<span class="muted">Smaller and one-off themes, nothing repeating.</span></li>' : '') +
      '</ul>'
      : '') +
    '<p class="ai-disc">Generated from ' + res.total + ' free-text answers in ' + secs +
      's. Read it against the answers below before quoting it.</p>' +
  '</div>';
}

/* One runner behind both scopes of summary — a single free-text question,
   and the survey as a whole. Everything the two share is the part the rules
   govern (the 400ms hold, the live label, the timestamp-driven timer, the
   Stop, one run per key); all that differs is the phase copy and what gets
   rendered at the end. */
function aiLoadingHtml(label){
  return '<div class="ai-panel">' +
    '<div class="c-loading" role="status" aria-live="polite">' +
      '<span class="c-loading-grid orbit" aria-hidden="true">' +
        '<span class="c-loading-cell"></span><span class="c-loading-cell"></span><span class="c-loading-cell"></span>' +
        '<span class="c-loading-cell"></span><span class="c-loading-cell is-off"></span><span class="c-loading-cell"></span>' +
        '<span class="c-loading-cell"></span><span class="c-loading-cell"></span><span class="c-loading-cell"></span>' +
      '</span>' +
      '<span class="c-loading-label" data-ailabel>' + esc(label) + '</span>' +
      '<span class="c-loading-elapsed" aria-hidden="true" data-aitime>0.0s</span>' +
    '</div>' +
    '<div class="ai-foot"><button class="c-btn c-btn-ghost c-btn-sm" type="button" data-aistop><i class="ph ph-stop-circle" aria-hidden="true"></i>Stop</button></div>' +
  '</div>';
}
function runAi(key, slot, btn, spec){
  if (!slot || aiRuns[key]) return;                 /* Rule 7 — one per operation */
  var t0 = Date.now();
  var run = { stopped:false, timers:[], tick:null };
  aiRuns[key] = run;
  if (btn) btn.disabled = true;

  function clear(){
    run.timers.forEach(clearTimeout);
    if (run.tick) clearInterval(run.tick);
    delete aiRuns[key];
  }
  function stop(){
    run.stopped = true; clear();
    slot.innerHTML = '';
    if (btn) btn.disabled = false;
    toast('Summary stopped');
  }

  /* Rule 2 — nothing renders for the first 400ms. If the work finished
     inside that window the loader would never have appeared at all. */
  run.timers.push(setTimeout(function(){
    if (run.stopped) return;
    slot.innerHTML = aiLoadingHtml(spec.phases[0][1]);
    $('[data-aistop]', slot).addEventListener('click', stop);
    /* Rule 5 — read off the start timestamp every tick, never accumulate;
       a throttled tab makes an accumulated count wrong by an order of
       magnitude. */
    run.tick = setInterval(function(){
      var el = $('[data-aitime]', slot);
      if (el) el.textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's';
    }, 100);
    /* Rule 4 — the label is a live status, not a fixed string. */
    spec.phases.slice(1).forEach(function(p){
      run.timers.push(setTimeout(function(){
        var el = $('[data-ailabel]', slot);
        if (el) el.textContent = p[1];
      }, p[0] - 400));
    });
  }, 400));

  run.timers.push(setTimeout(function(){
    if (run.stopped) return;
    var secs = ((Date.now() - t0) / 1000).toFixed(1);
    clear();
    slot.innerHTML = spec.render(secs);
    if (btn) btn.disabled = false;
    $('[data-aiclose]', slot).addEventListener('click', function(){ slot.innerHTML = ''; });
    $('[data-airedo]', slot).addEventListener('click', function(){
      slot.innerHTML = ''; spec.rerun();
    });
  }, spec.done));
}

/* --------------------------------------------------------------------------
   Whole-survey analysis
   Reads the same answers the charts below are drawn from, so the panel can
   never disagree with them. Scales are compared on a normalised 0-1 position
   in their own range, because a 3.4 on a 1-5 and a 3.4 on a 0-10 are not the
   same answer and ranking them raw would put every 0-10 question last.
   -------------------------------------------------------------------------- */
function analyseSurvey(f){
  var qs = f.questions.filter(function(q){ return q.type !== 'media'; });
  var scales = [], yesno = [], choice = [], texts = [], nps = null;

  qs.forEach(function(q){
    var rows = answered(f, q);
    if (!rows.length) return;

    if (q.type === 'scale'){
      var avg = rows.reduce(function(a, r){ return a + r.answers[q.id]; }, 0) / rows.length;
      /* A 0-10 question is the recommendation question by convention, so it
         is read the way one is — promoters minus detractors — and it is kept
         out of the strongest/weakest ranking entirely. It measures a
         different thing from the rated questions, and leaving it in produced
         a panel that called it the strongest question two lines above
         reporting its score as negative. */
      if (q.min === 0 && q.max === 10){
        var pro = rows.filter(function(r){ return r.answers[q.id] >= 9; }).length;
        var det = rows.filter(function(r){ return r.answers[q.id] <= 6; }).length;
        var proPct = Math.round(pro / rows.length * 100), detPct = Math.round(det / rows.length * 100);
        nps = { q:q, score:proPct - detPct, proPct:proPct, detPct:detPct, n:rows.length };
      } else {
        scales.push({ q:q, avg:avg, norm:(avg - q.min) / (q.max - q.min), n:rows.length });
      }

    } else if (q.type === 'yesno'){
      var yes = rows.filter(function(r){ return r.answers[q.id] === 'Yes'; }).length;
      yesno.push({ q:q, pct:Math.round(yes / rows.length * 100), n:rows.length });

    } else if (q.type === 'single' || q.type === 'multi'){
      var opts = q.options || [], counts = opts.map(function(){ return 0; });
      rows.forEach(function(r){
        var a = r.answers[q.id];
        (Array.isArray(a) ? a : [a]).forEach(function(v){
          var i = opts.indexOf(v); if (i > -1) counts[i]++;
        });
      });
      if (opts.length){
        var top = 0;
        counts.forEach(function(c, i){ if (c > counts[top]) top = i; });
        choice.push({ q:q, top:opts[top], pct:Math.round(counts[top] / rows.length * 100), n:rows.length });
      }

    } else {
      rows.forEach(function(r){ texts.push(String(r.answers[q.id])); });
    }
  });

  scales.sort(function(a, b){ return b.norm - a.norm; });
  yesno.sort(function(a, b){ return a.pct - b.pct; });
  choice.sort(function(a, b){ return b.pct - a.pct; });

  /* Every open-text answer pooled rather than summarised question by
     question: a theme that turns up under two different questions is a
     stronger signal than one that turns up under one, and the per-question
     panels already cover them separately. */
  return {
    total:f.responses.length,
    complete:f.responses.filter(function(r){ return r.complete; }).length,
    questions:qs.length,
    scales:scales, yesno:yesno, choice:choice, nps:nps,
    themes:themeTexts(texts), textCount:texts.length
  };
}

function aiSurveyHtml(res, secs){
  var pct = Math.round(res.complete / res.total * 100);
  var meanNorm = res.scales.length
    ? res.scales.reduce(function(a, x){ return a + x.norm; }, 0) / res.scales.length : null;
  var mood = meanNorm === null ? '' : meanNorm >= 0.7 ? 'positive' : meanNorm >= 0.5 ? 'lukewarm' : 'poor';

  var take = res.total.toLocaleString() + ' responses across ' + res.questions +
    ' questions, ' + pct + '% of them complete.' +
    (meanNorm === null ? ''
      : ' The ' + res.scales.length + ' rated questions sit ' + Math.round(meanNorm * 100) +
        '% of the way up their scales — a ' + mood + ' read overall.');

  var lines = [];
  if (res.scales.length > 1){
    var best = res.scales[0], worst = res.scales[res.scales.length - 1];
    lines.push([worst.avg.toFixed(2), 'Weakest rated question',
      '&ldquo;' + esc(worst.q.title) + '&rdquo;, out of ' + worst.q.max + ', on ' + worst.n + ' answers.']);
    lines.push([best.avg.toFixed(2), 'Strongest rated question',
      '&ldquo;' + esc(best.q.title) + '&rdquo;, out of ' + best.q.max + '.']);
  }
  if (res.nps){
    lines.push([(res.nps.score > 0 ? '+' : '') + res.nps.score, 'Recommendation',
      res.nps.proPct + '% scored 9 or 10 against ' + res.nps.detPct + '% at 6 or below.']);
  }
  if (res.yesno.length){
    lines.push([res.yesno[0].pct + '%', 'Lowest agreement',
      'answered Yes to &ldquo;' + esc(res.yesno[0].q.title) + '&rdquo;.']);
  }
  if (res.choice.length){
    lines.push([res.choice[0].pct + '%', 'Most-picked option',
      '&ldquo;' + esc(res.choice[0].top) + '&rdquo; on &ldquo;' + esc(res.choice[0].q.title) + '&rdquo;.']);
  }
  if (res.themes.themes.length){
    var t = res.themes.themes[0];
    lines.push([t.hits.length + '&times;', 'Top theme in the free text',
      esc(t.name.charAt(0).toLowerCase() + t.name.slice(1)) + ' — the most repeated of ' +
      res.themes.themes.length + ' themes across ' + res.textCount + ' written answers.']);
  }

  return '<div class="ai-panel is-survey">' +
    '<div class="ai-panel-head">' +
      '<span class="eyebrow"><i class="ph-fill ph-sparkle" aria-hidden="true"></i> AI summary &middot; whole survey</span>' +
      '<span class="grow"></span>' +
      '<button class="c-btn c-btn-ghost c-btn-sm" type="button" data-airedo><i class="ph ph-arrow-clockwise" aria-hidden="true"></i>Redo</button>' +
      '<button class="c-icon-btn" type="button" data-aiclose aria-label="Dismiss summary"><i class="ph ph-x" aria-hidden="true"></i></button>' +
    '</div>' +
    '<p class="ai-take">' + esc(take) + '</p>' +
    (lines.length
      ? '<ul class="ai-themes">' + lines.map(function(l){
          return '<li><span class="n">' + l[0] + '</span><span><b>' + l[1] + '</b> &mdash; ' + l[2] + '</span></li>';
        }).join('') + '</ul>'
      : '') +
    '<p class="ai-disc">Generated from ' + res.total.toLocaleString() + ' responses in ' + secs +
      's. Read it against the charts below before quoting it.</p>' +
  '</div>';
}

function summariseSurvey(f, btn){
  var slot = $('#surveyAiSlot');
  if (!slot) return;
  runAi('survey', slot, btn, {
    phases: [[0, 'Reading ' + f.responses.length.toLocaleString() + ' responses'],
             [900, 'Comparing questions'],
             [1900, 'Grouping the written answers'],
             [2900, 'Drafting the summary']],
    done: 3600,
    render: function(secs){ return aiSurveyHtml(analyseSurvey(f), secs); },
    rerun: function(){ summariseSurvey(f, btn); }
  });
}

function summarise(f, qid, btn){
  var slot = $('[data-aislot="' + qid + '"]');
  var q = f.questions.filter(function(x){ return x.id === qid; })[0];
  if (!slot || !q) return;
  var rows = answered(f, q);
  runAi(qid, slot, btn, {
    phases: [[0, 'Reading ' + rows.length + ' answers'],
             [900, 'Grouping recurring themes'],
             [1750, 'Drafting the summary']],
    done: 2500,
    render: function(secs){ return aiSummaryHtml(qid, themeAnswers(rows, qid), secs); },
    rerun: function(){ summarise(f, qid, btn); }
  });
}

/* Individual view — one respondent at a time. */
function paintIndividual(f, host){
  var i = Math.max(0, Math.min(state.respIndex, f.responses.length - 1));
  state.respIndex = i;
  var r = f.responses[i];
  $('#respMeta').textContent = 'Response ' + (i + 1) + ' of ' + f.responses.length;

  host.innerHTML =
    '<div class="c-card stack">' +
      '<div class="row between">' +
        '<div class="row tight">' +
          '<span class="avatar">' + esc(initials(r.who)) + '</span>' +
          '<span class="stack" style="gap:2px">' +
            '<b style="font-size:var(--text-body2-size)">' + esc(r.who) + '</b>' +
            '<span class="hint">' + esc(r.pod) + ' · ' + fmtDateTime(r.at) + ' · ' +
              Math.floor(r.seconds / 60) + 'm ' + (r.seconds % 60) + 's</span>' +
          '</span>' +
        '</div>' +
        '<div class="indiv-nav">' +
          '<span class="c-badge ' + (r.complete ? 'c-badge-success' : 'c-badge-warning') + '">' +
            (r.complete ? 'Complete' : 'Partial') + '</span>' +
          '<button class="c-icon-btn" type="button" id="prevResp" aria-label="Previous response"' +
            (i === 0 ? ' disabled' : '') + '><i class="ph ph-caret-left" aria-hidden="true"></i></button>' +
          '<button class="c-icon-btn" type="button" id="nextResp" aria-label="Next response"' +
            (i === f.responses.length - 1 ? ' disabled' : '') + '><i class="ph ph-caret-right" aria-hidden="true"></i></button>' +
        '</div>' +
      '</div>' +
      '<div class="stack">' +
        f.questions.filter(function(q){ return q.type !== 'media'; }).map(function(q){
          var a = r.answers[q.id];
          var shown = a == null
            ? '<span class="muted" style="font-style:italic">No answer</span>'
            : esc(Array.isArray(a) ? a.join(', ') : String(a)) +
              (q.type === 'scale' ? ' <span class="muted">/ ' + q.max + '</span>' : '');
          return '<div class="indiv-qa"><span class="q">' + esc(q.title) + '</span>' +
                 '<span class="a">' + shown + '</span></div>';
        }).join('') +
      '</div>' +
    '</div>';

  var p = $('#prevResp'), n = $('#nextResp');
  if (p) p.addEventListener('click', function(){ state.respIndex--; paintIndividual(f, host); });
  if (n) n.addEventListener('click', function(){ state.respIndex++; paintIndividual(f, host); });
}

/* --------------------------------------------------------------------------
   Date picker — the DLS component, wired for real
   components.css ships the trigger, the panel and every day state, but no
   behaviour and no positioning: like Dropdown's own panel, .c-dp-panel sits
   in normal flow, so left alone it pushes the rest of Settings down the page
   when it opens. This adds the month arithmetic, the open/close, and floats
   the panel. Everything visual comes from the component.
   -------------------------------------------------------------------------- */
var dpView = {};                       /* which month each picker is showing */

function sameDay(a, b){
  return !!a && !!b && a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function dpGridHtml(id, value, min){
  var view = dpView[id];
  var y = view.getFullYear(), m = view.getMonth();
  var lead = new Date(y, m, 1).getDay();
  var days = new Date(y, m + 1, 0).getDate();
  var prevDays = new Date(y, m, 0).getDate();
  var cells = '';
  /* Days either side of the month are shown and unusable rather than left
     blank — the spec's "disabled / outside month" state — so the grid keeps
     its shape and the weekday columns stay honest. */
  for (var i = lead - 1; i >= 0; i--){
    cells += '<button class="c-dp-day disabled" type="button" disabled tabindex="-1">' + (prevDays - i) + '</button>';
  }
  for (var d = 1; d <= days; d++){
    var dt = new Date(y, m, d);
    var off = min && dt < dayStart(min);
    cells += '<button class="c-dp-day' + (off ? ' disabled' : '') +
      (sameDay(dt, NOW) ? ' today' : '') + (sameDay(dt, value) ? ' selected' : '') +
      '" type="button"' + (off ? ' disabled' : '') + ' data-dpday="' + isoDate(dt) + '"' +
      ' aria-label="' + esc(fmtDate(dt)) + '">' + d + '</button>';
  }
  var trail = (7 - ((lead + days) % 7)) % 7;
  for (var k = 1; k <= trail; k++){
    cells += '<button class="c-dp-day disabled" type="button" disabled tabindex="-1">' + k + '</button>';
  }
  return '<div class="c-dp-header">' +
      '<button class="c-icon-btn" type="button" data-dpnav="-1" aria-label="Previous month"><i class="ph ph-caret-left" aria-hidden="true"></i></button>' +
      '<h5>' + MONTHS[m] + ' ' + y + '</h5>' +
      '<button class="c-icon-btn" type="button" data-dpnav="1" aria-label="Next month"><i class="ph ph-caret-right" aria-hidden="true"></i></button>' +
    '</div>' +
    '<div class="c-dp-grid">' +
      ['S','M','T','W','T','F','S'].map(function(w){ return '<span class="c-dp-weekday">' + w + '</span>'; }).join('') +
      cells +
    '</div>';
}
function dpHtml(id, value, opts){
  opts = opts || {};
  if (!dpView[id]){
    dpView[id] = value ? new Date(value.getFullYear(), value.getMonth(), 1)
                       : new Date(NOW.getFullYear(), NOW.getMonth(), 1);
  }
  return '<div class="c-dp" data-dp="' + id + '"' + (opts.disabled ? ' data-dpdisabled' : '') + '>' +
    '<button class="c-dp-trigger" type="button" data-dptrigger' + (opts.disabled ? ' disabled' : '') +
      ' aria-haspopup="dialog" aria-expanded="false">' +
      '<i class="ph-fill ph-calendar" aria-hidden="true"></i>' +
      '<span class="c-dp-value' + (value ? '' : ' is-empty') + '">' +
        (value ? esc(fmtDate(value)) : esc(opts.placeholder || 'Pick a date')) + '</span>' +
    '</button>' +
    '<div class="c-dp-panel" data-dppanel hidden>' + dpGridHtml(id, value, opts.min) +
      (opts.clearable
        /* The documented footer is range-mode only. It is extended to single
           mode for the one field that is legitimately allowed to be empty —
           without it there is no way back to "opens immediately" once a date
           has been picked. */
        ? '<div class="c-dp-foot"><button class="c-btn c-btn-ghost c-btn-sm" type="button" data-dpclear>Clear date</button></div>'
        : '') +
    '</div>' +
  '</div>';
}
/* One wiring for every picker on the page. `onPick` receives a Date or null. */
function wireDp(id, getValue, opts, onPick){
  var root = $('[data-dp="' + id + '"]');
  if (!root) return;
  var trig = $('[data-dptrigger]', root), panel = $('[data-dppanel]', root);
  if (trig.disabled) return;

  function repaint(){
    panel.innerHTML = dpGridHtml(id, getValue(), opts.min) + (opts.clearable
      ? '<div class="c-dp-foot"><button class="c-btn c-btn-ghost c-btn-sm" type="button" data-dpclear>Clear date</button></div>'
      : '');
    bindPanel();
  }
  function bindPanel(){
    $$('[data-dpnav]', panel).forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        dpView[id] = new Date(dpView[id].getFullYear(), dpView[id].getMonth() + (+b.dataset.dpnav), 1);
        repaint();
      });
    });
    $$('[data-dpday]', panel).forEach(function(b){
      b.addEventListener('click', function(){ onPick(parseISODate(b.dataset.dpday)); });
    });
    var clr = $('[data-dpclear]', panel);
    if (clr) clr.addEventListener('click', function(){ onPick(null); });
  }
  bindPanel();

  trig.addEventListener('click', function(e){
    e.stopPropagation();
    var open = panel.hidden;
    closeDropdowns();
    if (open){
      /* Always open on the month the current value is in, not wherever the
         reader last browsed to and abandoned. */
      var v = getValue();
      dpView[id] = v ? new Date(v.getFullYear(), v.getMonth(), 1)
                     : new Date(NOW.getFullYear(), NOW.getMonth(), 1);
      repaint();
    }
    panel.hidden = !open;
    trig.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open){
      /* Flip above the trigger when a full calendar will not fit below it —
         the same `is-above` convention Dropdown's own panel uses. Measured
         after the panel is visible, because a hidden element has no height. */
      panel.classList.remove('is-above');
      var box = panel.getBoundingClientRect();
      if (box.bottom > window.innerHeight - 8 &&
          trig.getBoundingClientRect().top > box.height + 16){
        panel.classList.add('is-above');
      }
    }
  });
  panel.addEventListener('click', function(e){ e.stopPropagation(); });
}

/* ---------- Tab 3 — Settings ----------
   Settings are staged, not written straight through. Every control below
   writes to a draft, and nothing reaches the survey until Save settings is
   pressed — which is what makes a Save button mean anything. The draft is
   keyed by form id so switching surveys never carries edits across, and
   unsaved edits survive a trip to another tab and back rather than being
   silently dropped. */
var settingsDraft = null;

function draftFor(f){
  if (!settingsDraft || settingsDraft.id !== f.id){
    settingsDraft = {
      id: f.id,
      settings: JSON.parse(JSON.stringify(f.settings)),
      starts: f.starts ? new Date(f.starts) : null,
      ends: f.ends ? new Date(f.ends) : null,
      confirmLocked: true
    };
  }
  return settingsDraft;
}
function settingsDirty(f){
  var d = draftFor(f);
  if (JSON.stringify(d.settings) !== JSON.stringify(f.settings)) return true;
  return isoDate(d.starts) !== isoDate(f.starts) || isoDate(d.ends) !== isoDate(f.ends);
}

function saveStateHtml(dirty){
  return dirty ? '<i class="ph-fill ph-circle" aria-hidden="true"></i>Unsaved changes'
               : '<i class="ph ph-check-circle" aria-hidden="true"></i>All changes saved';
}
/* Update the save bar in place. Typing in the confirmation message cannot
   re-render the tab — that would take focus out of the textarea on every
   keystroke — so the one thing on screen that has to react to it is patched
   directly instead. */
function refreshSaveBar(f){
  var bar = $('#tabSettings .set-save');
  if (!bar) return;
  var dirty = settingsDirty(f);
  bar.classList.toggle('is-dirty', dirty);
  $('.set-save-state', bar).innerHTML = saveStateHtml(dirty);
  $('#setSave').disabled = !dirty;
  $('#setDiscard').disabled = !dirty;
}

function renderSettings(f){
  var d = draftFor(f), s = d.settings;
  var dirty = settingsDirty(f);

  function toggle(key, title, desc){
    return '<div class="set-row"><span class="t"><b>' + esc(title) + '</b><span>' + esc(desc) + '</span></span>' +
      '<label class="c-choice switch"><input type="checkbox" data-set="' + key + '"' + (s[key] ? ' checked' : '') + ' />' +
      '<span class="c-switch-track' + (s[key] ? ' on' : '') + '"><span class="c-switch-thumb"></span></span>' +
      '<span class="sr-only">' + esc(title) + '</span></label></div>';
  }

  $('#tabSettings').innerHTML =
    '<div class="c-card stack"><h2 class="sect">General</h2><div>' +
      toggle('sendCopy',    'Send responders a copy of their response', 'Emails each person a receipt of what they submitted.') +
      toggle('allowEdit',   'Allow response editing',                   'Responders can come back and change their answers after submitting.') +
      toggle('oneResponse', 'Limit to 1 response per user',             'Requires sign-in. A second attempt reopens their first response.') +
    '</div></div>' +

    /* Time frame. "No deadline" is a switch rather than an empty date field
       because leaving a date blank is ambiguous — it reads as unfinished, and
       an open-ended survey is a decision, not an omission. */
    '<div class="c-card stack"><h2 class="sect">Time frame</h2>' +
      '<p class="hint">When the survey opens and closes. The library counts down to the closing date.</p>' +
      '<div>' +
        '<div class="set-row"><span class="t"><b>No deadline</b>' +
          '<span>Leave the survey open until someone closes it by hand.</span></span>' +
          '<label class="c-choice switch"><input type="checkbox" id="setNoEnd"' + (d.ends ? '' : ' checked') + ' />' +
          '<span class="c-switch-track' + (d.ends ? '' : ' on') + '"><span class="c-switch-thumb"></span></span>' +
          '<span class="sr-only">No deadline</span></label></div>' +
        '<div class="set-row" style="justify-content:flex-start;gap:var(--spacing-16);flex-wrap:wrap;align-items:flex-start">' +
          '<div class="c-field" style="width:200px"><label id="lblStart">Opens</label>' +
            dpHtml('dpStart', d.starts, { placeholder:'Opens immediately', clearable:true }) +
            '<span class="c-helper">Clear it to open immediately.</span></div>' +
          '<div class="c-field" style="width:200px" id="wrapEnd"><label id="lblEnd">Closes</label>' +
            dpHtml('dpEnd', d.ends, { placeholder:'No deadline', min:d.starts, disabled:!d.ends }) +
            '<span class="c-helper">' + (d.ends ? 'Responses stop at the end of this day.' : 'Off — this survey has no deadline.') + '</span></div>' +
          '<div class="c-field" style="width:auto"><label>Library will show</label>' +
            '<span class="tag-row" style="min-height:40px;align-items:center">' +
              deadlinePill({ ends:d.ends }) + '</span></div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="c-card stack"><h2 class="sect">Presentation</h2><div>' +
      toggle('progressBar', 'Show progress bar', 'Displays how far through the form the responder is.') +
      '<div class="set-row" style="flex-direction:column;align-items:stretch;gap:var(--spacing-8)">' +
        '<div class="row between" style="align-items:flex-start">' +
          '<span class="t"><b>After submission</b><span>The confirmation message shown once the form is submitted.</span></span>' +
          /* Locked behind Edit: this is the one free-text setting, it is the
             last thing a responder sees, and a stray keystroke in an always-
             open textarea changes it without anyone noticing. */
          (d.confirmLocked
            ? '<button class="c-btn c-btn-secondary c-btn-sm" type="button" id="setConfirmEdit"><i class="ph ph-pencil-simple" aria-hidden="true"></i>Edit</button>'
            : '<button class="c-btn c-btn-primary c-btn-sm" type="button" id="setConfirmSave"><i class="ph ph-check" aria-hidden="true"></i>Save</button>') +
        '</div>' +
        '<div class="c-field field-wide"><textarea id="setConfirm" rows="2" placeholder="Thanks for your feedback!"' +
          (d.confirmLocked ? ' readonly' : '') + '>' + esc(s.confirm) + '</textarea>' +
        '<span class="c-helper">' + (d.confirmLocked
          ? 'Locked. Press Edit to change it.'
          : 'Editing. Press Save to lock it again — it is kept either way until you save the page.') + '</span></div>' +
      '</div>' +
    '</div></div>' +

    (s.progressBar ? '<div class="c-card stack sm"><span class="eyebrow">Preview</span>' +
      '<div class="c-progress-track size-default"><div class="c-progress-fill" style="width:40%"></div></div>' +
      '<span class="hint">Question 4 of 10</span></div>' : '') +

    /* One save for the page, pinned to the bottom of the viewport while the
       page scrolls: a Save that scrolls out of sight is a Save nobody
       presses. It states whether there is anything to save rather than
       offering an action that would do nothing. */
    '<div class="set-save' + (dirty ? ' is-dirty' : '') + '">' +
      '<span class="set-save-state">' + saveStateHtml(dirty) + '</span>' +
      '<button class="c-btn c-btn-secondary c-btn-sm" type="button" id="setDiscard"' + (dirty ? '' : ' disabled') + '>Discard</button>' +
      '<button class="c-btn c-btn-primary c-btn-sm" type="button" id="setSave"' + (dirty ? '' : ' disabled') + '>Save settings</button>' +
    '</div>';

  /* ---- toggles ---- */
  $$('[data-set]').forEach(function(c){
    c.addEventListener('change', function(){
      s[c.dataset.set] = c.checked;
      renderSettings(f);
    });
  });

  /* ---- confirmation message ---- */
  $('#setConfirm').addEventListener('input', function(e){
    s.confirm = e.target.value;
    refreshSaveBar(f);
  });
  if ($('#setConfirmEdit')){
    $('#setConfirmEdit').addEventListener('click', function(){
      d.confirmLocked = false;
      renderSettings(f);
      var ta = $('#setConfirm');
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    });
  }
  if ($('#setConfirmSave')){
    $('#setConfirmSave').addEventListener('click', function(){
      d.confirmLocked = true;
      renderSettings(f);
      toast('Message updated — save the page to publish it');
    });
  }

  /* ---- time frame ---- */
  $('#setNoEnd').addEventListener('change', function(e){
    /* Turning the deadline back on needs a date to land on. A filled field
       the person can correct beats an empty one they have to discover — but
       it has to be a future date: counting from an opening date months back
       would set a deadline that has already passed, which reads as the
       switch having closed the survey. */
    d.ends = e.target.checked ? null
      : new Date(Math.max((d.starts || NOW).getTime(), NOW.getTime()) + 30 * 86400000);
    renderSettings(f);
  });
  wireDp('dpStart', function(){ return d.starts; },
    { placeholder:'Opens immediately', clearable:true }, function(v){
      d.starts = v;
      /* An opening date after the closing one is not a time frame either. */
      if (d.ends && v && d.ends < v) d.ends = new Date(v);
      renderSettings(f);
    });
  wireDp('dpEnd', function(){ return d.ends; },
    { placeholder:'No deadline', min:d.starts }, function(v){
      d.ends = v;
      renderSettings(f);
    });

  /* ---- page save ---- */
  $('#setSave').addEventListener('click', function(){
    f.settings = JSON.parse(JSON.stringify(d.settings));
    f.starts = d.starts ? new Date(d.starts) : null;
    f.ends = d.ends ? new Date(d.ends) : null;
    f.updated = new Date(NOW);
    d.confirmLocked = true;
    renderBuilder();
    toast('Settings saved', 'success');
  });
  $('#setDiscard').addEventListener('click', function(){
    settingsDraft = null;
    renderSettings(f);
    toast('Changes discarded');
  });
}

/* ==========================================================================
   Bug report — user view
   ========================================================================== */
var draftShots = [];
/* Draft state for the fields that survive a re-render of the form (the
   priority and services blocks repaint on every change, so their values
   cannot live in the DOM). */
var draftBug = { priority:'p3', services:[], otherOn:false, other:'' };

/* Shared view switcher for the two bug list surfaces. Both are the same
   records read by different people, so this is a view switch, not
   navigation — Segmented Control, not tabs. */
function bugSegHtml(metaHtml){
  /* Addressed by attribute, not id: this markup is rendered into two
     different route sections and both stay in the document, so an id here
     would be a duplicate and every lookup would resolve to whichever copy
     came first — which is the hidden one, half the time. */
  /* The rule under the page header comes first, the same one the other two
     landing screens carry — it is here rather than in each route because
     both of them open on this row. */
  return '<hr class="route-rule" />' +
    '<div class="row between">' +
    '<div class="c-segctl c-segctl-default" role="tablist" aria-label="Bug report view" data-bugseg>' +
      '<span class="c-seg-pill" aria-hidden="true"></span>' +
      '<button class="c-seg" type="button" role="tab" data-bv="mine">My tickets</button>' +
      '<button class="c-seg" type="button" role="tab" data-bv="admin">All reports</button>' +
    '</div>' +
    (metaHtml || '') +
  '</div>';
}
function wireBugSeg(root, active){
  wireSeg($('[data-bugseg]', root), active === 'mine' ? 0 : 1, function(i){
    go(i ? 'bugAdmin' : 'bugMine');
  });
}

/* Incident priority — Dropdown Single select with a description line, so
   each step says what it means rather than leaving "High" to be read four
   different ways by four people. The severity dot rides inside the .prio
   pill in the label, not in the row's own media slot: Dropdown's media slot
   is documented as deliberately having no colour-dot modifier. */
function prioFieldHtml(){
  return '<div class="c-field field-wide c-dropdown-field dd-float" id="wrapPrio">' +
    '<label for="bugPrio">Incident priority <span class="required-mark" aria-hidden="true">*</span></label>' +
    '<div class="input-wrap has-trailing-icon">' +
      '<input type="text" id="bugPrio" class="c-dropdown-input" readonly value="' + esc(prioLabel(draftBug.priority)) + '"' +
        ' aria-haspopup="listbox" aria-expanded="false" />' +
      '<span class="icon-trailing" aria-hidden="true"><i class="ph ph-caret-down c-dropdown-chevron"></i></span>' +
    '</div>' +
    '<div class="c-dropdown-panel" id="prioPanel" hidden><div class="c-dropdown-list">' +
      PRIO_ORDER.map(function(k){
        return '<div class="c-dropdown-row has-desc' + (draftBug.priority === k ? ' selected' : '') +
          '" role="option" data-prio="' + k + '">' +
          '<span class="c-dropdown-row-text">' +
            '<span class="c-dropdown-row-label">' + prioPill(k) + '</span>' +
            '<span class="c-dropdown-row-desc">' + esc(PRIORITIES[k].desc) + '</span>' +
          '</span>' +
          '<i class="ph ph-check c-dropdown-row-check" aria-hidden="true"></i></div>';
      }).join('') +
    '</div></div>' +
    '<span class="c-helper">' + esc(PRIORITIES[draftBug.priority].desc) + '</span>' +
  '</div>';
}

/* Affected services — a fixed checkbox set, not free text, because this is
   the field that routes the ticket and a typo in it is a ticket nobody
   owns. Laid out in columns: ten one-line options in a single stack is a
   scroll, not a choice. */
function svcBox(on){
  return '<span class="c-checkbox-box' + (on ? ' on' : '') + '">' +
    (on ? '<i class="ph ph-check" aria-hidden="true"></i>' : '') + '</span>';
}
function svcFieldHtml(){
  var oth = draftBug.otherOn;
  return '<div class="c-field field-wide" id="wrapSvc">' +
    '<label id="svcLabel">Affected services <span class="required-mark" aria-hidden="true">*</span></label>' +
    '<div class="svc-grid" role="group" aria-labelledby="svcLabel">' +
      SERVICES.map(function(sv, i){
        var on = draftBug.services.indexOf(sv) > -1;
        return '<label class="c-choice"><input type="checkbox" data-svc="' + i + '"' + (on ? ' checked' : '') + ' />' +
          svcBox(on) +
          '<span class="text"><span class="label" style="font-size:var(--text-body2-size)">' + esc(sv) + '</span></span></label>';
      }).join('') +
      /* Other sits last, on its own line, behind a rule: a fixed list that
         routes tickets still has to have somewhere for the thing it does not
         cover to go, and this is the only option here that asks a question
         back rather than just being ticked. */
      '<label class="c-choice svc-other"><input type="checkbox" id="svcOther"' + (oth ? ' checked' : '') + ' />' +
        svcBox(oth) +
        '<span class="text"><span class="label" style="font-size:var(--text-body2-size)">Other — not in this list</span></span></label>' +
    '</div>' +
    '<span class="c-helper">Pick every part of Collabrium this affects. Choose at least one.</span>' +
  '</div>' +
  '<div class="c-field field-wide" id="wrapOther"' + (oth ? '' : ' hidden') + '>' +
    '<label for="svcOtherText">Which service is affected? <span class="required-mark" aria-hidden="true">*</span></label>' +
    '<textarea id="svcOtherText" rows="2" placeholder="Name the part of Collabrium this affects, and where you were when it broke.">' +
      esc(draftBug.other) + '</textarea>' +
    '<span class="c-helper">It is not in the list above, so describe it — this is what the report gets routed on.</span>' +
  '</div>';
}

function renderBugNew(){

        '<span class="icon-trailing" aria-hidden="true"><i class="ph ph-caret-down c-dropdown-chevron"></i></span>' +

      '<span class="c-helper">From your profile.</span></div>';

  /* The form is a single reading column, centred in the content region —

  $('#routeBugNew').innerHTML =

      '<div class="stack sm"><h2 class="sect">Report a bug</h2>' +
        '<p class="hint">Fixed template — every field here is something the tech team needs to reproduce it.</p></div>' +

      '<div class="stack sm">' +
        '<span class="eyebrow">Reported by</span>' +
        '<div class="row tight">' +
          '<span class="avatar lg">' + esc(initials(ME.name)) + '</span>' +
          '<span class="stack" style="gap:2px">' +
            '<b style="font-size:var(--text-body2-size)">' + esc(ME.name) + '</b>' +
            '<span class="hint">From your session · not editable</span>' +
          '</span>' +
        '</div>' +
      '</div>' +

      podField +

      '<div class="c-field field-wide" id="wrapTitle"><label for="bugTitle">Title <span class="required-mark" aria-hidden="true">*</span></label>' +
        '<div class="input-wrap"><input type="text" id="bugTitle" placeholder="e.g. Export button unresponsive on Safari" required /></div>' +
        '<span class="c-helper">One line. What is broken, and where.</span></div>' +

      '<div class="c-field field-wide" id="wrapDesc"><label for="bugDesc">Description <span class="required-mark" aria-hidden="true">*</span></label>' +
        '<textarea id="bugDesc" rows="4" placeholder="What happened, and what you expected to happen instead." required></textarea></div>' +

      '<div id="prioSlot">' + prioFieldHtml() + '</div>' +
      '<div id="svcSlot" class="stack lg">' + svcFieldHtml() + '</div>' +

      '<div class="stack sm">' +
        '<span class="eyebrow">Screenshot</span>' +
        '<div class="c-uploader field-wide">' +
          '<div class="c-uploader-zone" id="dropZone" tabindex="0" role="button" aria-label="Add screenshots — drag and drop, or press Enter to browse">' +
            '<i class="ph ph-image" aria-hidden="true"></i>' +
            '<span class="c-uploader-label">Drag screenshots here, or click to browse</span>' +
            '<span class="c-uploader-hint">PNG, JPG or GIF · multiple files welcome</span>' +
          '</div>' +
          '<div class="thumbs" id="shotThumbs"></div>' +
        '</div>' +
      '</div>' +

      '<div class="c-field field-wide"><label for="bugExtra">Additional information</label>' +
        '<textarea id="bugExtra" rows="3" placeholder="Steps to reproduce, browser and device, how often it happens."></textarea>' +
        '<span class="c-helper">Optional, but it is usually what makes a bug reproducible.</span></div>' +

      '<div class="row" style="justify-content:flex-end">' +
        '<button class="c-btn c-btn-primary c-btn-md" type="button" id="bugSubmit"><i class="ph ph-paper-plane-tilt"></i>Submit</button>' +
      '</div>' +
    '</div>';

function wirePrio(){
  var trig = $('#bugPrio'), panel = $('#prioPanel');
  if (!trig) return;
  var field = trig.closest('.c-dropdown-field');
  trig.addEventListener('click', function(e){
    e.stopPropagation();
    var open = panel.hidden;
    panel.hidden = !open;
    field.classList.toggle('open', open);
    trig.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  $$('[data-prio]', panel).forEach(function(r){
    r.addEventListener('click', function(){
      draftBug.priority = r.dataset.prio;
      $('#prioSlot').innerHTML = prioFieldHtml();
      wirePrio();
    });
  });
}

/* Repaint only the box that changed, never the grid — repainting the grid on
   every tick would move focus off the checkbox the person just used, and
   would tear down the Other textarea while they were typing in it. */
function paintSvcBox(input){
  var box = input.nextElementSibling;
  box.classList.toggle('on', input.checked);
  box.innerHTML = input.checked ? '<i class="ph ph-check" aria-hidden="true"></i>' : '';
}
function svcChosen(){
  return draftBug.services.length + (draftBug.otherOn && draftBug.other.trim() ? 1 : 0);
}
function wireSvc(){
  $$('[data-svc]').forEach(function(c){
    c.addEventListener('change', function(){
      var sv = SERVICES[+c.dataset.svc];
      var at = draftBug.services.indexOf(sv);
      if (c.checked && at === -1) draftBug.services.push(sv);
      else if (!c.checked && at > -1) draftBug.services.splice(at, 1);
      paintSvcBox(c);
      if (svcChosen()) $('#wrapSvc').classList.remove('c-field-error');
    });
  });

  var other = $('#svcOther');
  other.addEventListener('change', function(){
    draftBug.otherOn = other.checked;
    paintSvcBox(other);
    /* Show or hide the description rather than re-rendering the field, so
       the box the person is about to type into can take focus straight
       away. Unticking clears what was typed: a hidden required field
       holding text nobody can see is how a form blocks on nothing. */
    $('#wrapOther').hidden = !other.checked;
    if (other.checked){
      $('#svcOtherText').focus();
    } else {
      draftBug.other = '';
      $('#svcOtherText').value = '';
      $('#wrapOther').classList.remove('c-field-error');
    }
    if (svcChosen()) $('#wrapSvc').classList.remove('c-field-error');
  });
  $('#svcOtherText').addEventListener('input', function(e){
    draftBug.other = e.target.value;
    if (e.target.value.trim()){
      $('#wrapOther').classList.remove('c-field-error');
      $('#wrapSvc').classList.remove('c-field-error');
    }
  });
}

function paintThumbs(){
  var host = $('#shotThumbs');
  if (!host) return;
  host.innerHTML = draftShots.map(function(s, i){
    return '<span class="thumb"><img src="' + s.url + '" alt="' + esc(s.name) + '" />' +
      '<button class="x" type="button" data-rm="' + i + '" aria-label="Remove ' + esc(s.name) + '">' +
      '<i class="ph ph-x" aria-hidden="true"></i></button></span>';
  }).join('');
  $$('[data-rm]', host).forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation(); draftShots.splice(+b.dataset.rm, 1); paintThumbs();
    });
  });
}

/* One drop-zone wiring, used by both the bug form's Screenshot zone and the
   comment composer's attachment zone: click, keyboard and drag-and-drop all
   funnel into the same accept(). The file input lives inside the zone rather
   than on <body>, so a re-rendered zone takes its input with it instead of
   leaving one orphan per render. */
function wireZone(zone, onImage){
  if (!zone) return;
  var input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.multiple = true; input.style.display = 'none';
  zone.appendChild(input);

  function accept(files){
    [].slice.call(files).filter(function(f){ return /^image\//.test(f.type); }).forEach(function(f){
      var rd = new FileReader();
      rd.onload = function(){ onImage({ name:f.name, url:rd.result }); };
      rd.readAsDataURL(f);
    });
  }
  zone.addEventListener('click', function(e){ if (e.target !== input) input.click(); });
  zone.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); input.click(); }
  });
  input.addEventListener('change', function(){ accept(input.files); input.value = ''; });
  ['dragenter','dragover'].forEach(function(ev){
    zone.addEventListener(ev, function(e){ e.preventDefault(); zone.classList.add('dragover'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    zone.addEventListener(ev, function(e){ e.preventDefault(); zone.classList.remove('dragover'); });
  });
  zone.addEventListener('drop', function(e){ accept(e.dataTransfer.files); });
}
function wireDropZone(){
  wireZone($('#dropZone'), function(img){ draftShots.push(img); paintThumbs(); });
}


function submitBug(){
  var t = $('#bugTitle'), d = $('#bugDesc'), ok = true, firstBad = null;

  function fail(wrapSel, msg){
    ok = false;
    var wrap = $(wrapSel);
    wrap.classList.add('c-field-error');
    var h = $('.c-helper', wrap);
    if (h) h.textContent = msg;
    else wrap.insertAdjacentHTML('beforeend', '<span class="c-helper">' + esc(msg) + '</span>');
    if (!firstBad) firstBad = wrap;
  }

  [[t, '#wrapTitle'], [d, '#wrapDesc']].forEach(function(pair){
    var bad = !pair[0].value.trim();
    $(pair[1]).classList.toggle('c-field-error', bad);
    if (bad) fail(pair[1], 'This field is required.');
  });
  /* Affected services is required for the same reason it is a fixed list
     rather than free text: it is what routes the report. A ticket with no
     service on it is a ticket with no owner. */
  if (!svcChosen()) fail('#wrapSvc', 'Choose at least one affected service.');
  /* Other ticked and nothing written is worse than Other not ticked: it
     claims a service the report never names. */
  if (draftBug.otherOn && !draftBug.other.trim()){
    fail('#wrapOther', 'Describe the service, or untick Other.');
  }

  if (!ok){
    var focusTarget = firstBad === $('#wrapSvc') ? $('[data-svc]') : $('input, textarea', firstBad);
    if (focusTarget) focusTarget.focus();
    toast('Fill in the required fields before submitting');
    return;
  }

  BUGS.unshift({ id:'b' + (BUGS.length + 1), at:new Date(NOW), who:ME.name,
    pod:($('#bugPod') ? $('#bugPod').value : ME.pods[0]), status:'new',
    priority:draftBug.priority,
    /* The described service joins the list as a service, prefixed so the
       team can see it came from Other rather than the fixed set. */
    services:draftBug.services.concat(
      draftBug.otherOn && draftBug.other.trim() ? ['Other — ' + draftBug.other.trim()] : []),
    assignee:null, resolution:'',
    title:t.value.trim(), desc:d.value.trim(), extra:$('#bugExtra').value.trim(),
    shots:draftShots.map(function(s){ return s.url; }),
    comments:[] });
  draftShots = [];
  draftBug = { priority:'p3', services:[], otherOn:false, other:'' };
  /* Land on the reporter's own list, where the ticket they just filed is
     the top row — not on the admin table, which is not their view. */
  go('bugMine');
  toast('Bug report submitted', 'success');
}

/* ==========================================================================
   Bug report — the reporter's own tickets
   Same records as the admin table, read by the person who filed them: no
   triage controls, but every field the team has set on the ticket, the full
   comment thread, and a reply box. A ticket whose thread ends on an
   unanswered question from the team is flagged here, because answering it
   is the one thing only the reporter can do.
   ========================================================================== */
function myBugs(){
  return BUGS.filter(function(b){ return b.who === ME.name; })
             .sort(function(a, b){ return lastActivity(b) - lastActivity(a); });
}

function renderBugMine(){
  $('#routeBugMine').hidden = false;
  var mine = myBugs();
  var waiting = mine.filter(function(b){ return threadState(b) === 'awaiting'; }).length;
  setHeader('Bug Reports', 'Track what you have reported and answer questions from the tech team.',
    '<button class="c-btn c-btn-primary c-btn-md" type="button" id="reportBug"><i class="ph ph-plus"></i>Report a bug</button>');
  setBack('Feedback', 'landing');
  $('#reportBug').addEventListener('click', function(){ go('bugNew'); });

  $('#routeBugMine').innerHTML =
    bugSegHtml('<span class="hint">' + mine.length + (mine.length === 1 ? ' ticket' : ' tickets') +
      (waiting ? ' · ' + waiting + ' waiting on you' : '') + '</span>') +
    /* A real Table rather than a list of rows: the three trailing values are
       columns of the same kind read down the page, and columns of the same
       kind need headers saying what they are. Same component and the same
       clickable-row behaviour as All reports, so the two views of one record
       set read the same way. */
    (mine.length
      ? '<div class="c-table-standalone-wrap c-table-scroll-x">' +
        '<table class="c-table c-table-standalone"><thead><tr>' +
          '<th>Ticket</th><th>Response</th><th>Priority</th><th>Status</th>' +
        '</tr></thead><tbody>' +
        mine.map(function(b){
          var t = threadState(b);
          var n = (b.comments || []).length;
          return '<tr class="is-interactive is-clickable' + (t === 'awaiting' ? ' needs-reply' : '') +
              '" data-mine="' + b.id + '" tabindex="0">' +
            '<td><span class="td-stack" style="gap:2px">' +
              '<span class="mine-title">' + esc(b.title) + '</span>' +
              '<span class="mine-meta">' +
                '<span>' + esc(b.pod) + '</span><span aria-hidden="true">·</span>' +
                '<span>Reported ' + fmtDate(b.at) + '</span>' +
                '<span aria-hidden="true">·</span>' +
                '<span>' + (b.assignee ? esc(b.assignee) : 'Not assigned yet') + '</span>' +
                (n ? '<span aria-hidden="true">·</span><span><i class="ph ph-chat-circle" aria-hidden="true"></i> ' + n + '</span>' : '') +
              '</span>' +
            '</span></td>' +
            '<td>' + (threadBadge(b, 'user') || '<span class="muted">—</span>') + '</td>' +
            '<td>' + prioPill(b.priority, true) + '</td>' +
            '<td><span class="c-badge ' + BUG_STATUS[b.status].badge + '">' + BUG_STATUS[b.status].label + '</span></td>' +
          '</tr>';
        }).join('') +
        '</tbody></table></div>'
      : '<div class="c-empty is-section">' +
          '<i class="ph ph-bug" aria-hidden="true"></i><h4>You have not reported anything yet</h4>' +
          '<p>When something breaks, send it here with a screenshot and the tech team picks it up from this same record.</p>' +
          '<div class="c-empty-actions"><button class="c-btn c-btn-primary c-btn-md" type="button" id="emptyNewBug">' +
            '<i class="ph ph-plus"></i>Report a bug</button></div>' +
        '</div>');

  wireBugSeg($('#routeBugMine'), 'mine');
  if ($('#emptyNewBug')) $('#emptyNewBug').addEventListener('click', function(){ go('bugNew'); });

  var ids = mine.map(function(b){ return b.id; });
  $$('[data-mine]').forEach(function(tr){
    function open(){ openRecord(ids, ids.indexOf(tr.dataset.mine), 'user'); }
    tr.addEventListener('click', open);
    tr.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
    });
  });
}

/* ==========================================================================
   Bug report — admin view
   ========================================================================== */
function renderBugAdmin(){
  $('#routeBugAdmin').hidden = false;
  setHeader('Bug Reports', 'Every report submitted across the pods.',
    '<button class="c-btn c-btn-primary c-btn-md" type="button" id="reportBug"><i class="ph ph-plus"></i>Report a bug</button>');
  setBack('Feedback', 'landing');
  $('#reportBug').addEventListener('click', function(){ go('bugNew'); });

  var pods = ['all'].concat(PODS.filter(function(p){
    return BUGS.some(function(b){ return b.pod === p; }); }));

  $('#routeBugAdmin').innerHTML =
    bugSegHtml('') +
    '<div class="row between">' +
      '<div class="row tight">' +
        /* Two kinds of filter in one group: the ticket's own status, then —
           past the separator — whose turn the conversation is on. The second
           pair cuts across the first (an In Progress ticket can be
           awaiting a response), which is exactly why they are not one
           list. */
        '<div class="c-chip-group" role="group" aria-label="Filter reports">' +
          ['all','new','progress','resolved'].map(bugChip).join('') +
          '<span class="chip-sep" aria-hidden="true"></span>' +
          ['awaiting','replied'].map(bugChip).join('') +
        '</div>' +
      '</div>' +
      /* .dd-float — without it the panel is position:static and opening this
         filter pushes the entire table down by the panel's own height, which
         is the one thing a filter sitting above a table must not do. */
      '<div class="c-field c-dropdown-field dd-float" style="width:200px">' +
        '<div class="input-wrap has-trailing-icon">' +
          '<input type="text" class="c-dropdown-input" id="podTrigger" readonly value="' +
            (state.bugPod === 'all' ? 'All pods' : esc(state.bugPod)) + '" aria-label="Filter by pod"' +
            ' aria-haspopup="listbox" aria-expanded="false" />' +
          '<span class="icon-trailing" aria-hidden="true"><i class="ph ph-caret-down c-dropdown-chevron"></i></span>' +
        '</div>' +
        '<div class="c-dropdown-panel" id="podPanel" hidden><div class="c-dropdown-list">' +
          pods.map(function(p){
            return '<div class="c-dropdown-row' + (state.bugPod === p ? ' selected' : '') + '" role="option" data-pod="' + esc(p) + '">' +
              '<span class="c-dropdown-row-label">' + (p === 'all' ? 'All pods' : esc(p)) + '</span>' +
              '<i class="ph ph-check c-dropdown-row-check" aria-hidden="true"></i></div>';
          }).join('') +
        '</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="c-table-standalone-wrap c-table-scroll-x"><table class="c-table c-table-standalone"><thead><tr>' +
      BUG_COLS.map(bugSortTh).join('') +
    '</tr></thead><tbody id="bugRows"></tbody></table></div>';

  wireBugSeg($('#routeBugAdmin'), 'admin');

  $$('[data-bs]').forEach(function(c){
    c.addEventListener('click', function(){ state.bugStatus = c.dataset.bs; renderBugAdmin(); });
  });
  /* Unsorted -> ascending -> descending -> unsorted, and picking a new
     column clears the old one. Enter and Space do what the click does. */
  $$('[data-bugcol]', $('#routeBugAdmin')).forEach(function(th){
    function cycle(){
      var k = th.dataset.bugcol;
      if (state.bugSortCol !== k){ state.bugSortCol = k; state.bugSortDir = 1; }
      else if (state.bugSortDir === 1){ state.bugSortDir = -1; }
      else { state.bugSortCol = null; }
      renderBugAdmin();
      var back = $('[data-bugcol="' + k + '"]', $('#routeBugAdmin'));
      if (back) back.focus();
    }
    th.addEventListener('click', cycle);
    th.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); cycle(); }
    });
  });

  /* Pod filter — Dropdown's Single select, wired for real. */
  var trig = $('#podTrigger'), panel = $('#podPanel'), field = trig.closest('.c-dropdown-field');
  trig.addEventListener('click', function(e){
    e.stopPropagation();
    var open = panel.hidden;
    panel.hidden = !open;
    field.classList.toggle('open', open);
    trig.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  $$('[data-pod]', panel).forEach(function(r){
    r.addEventListener('click', function(){ state.bugPod = r.dataset.pod; renderBugAdmin(); });
  });

  paintBugRows();
}

function bugChipLabel(k){
  if (k === 'all') return 'All';
  if (THREAD_STATE[k]) return THREAD_STATE[k].admin;
  return BUG_STATUS[k].label;
}
function matchesBugChip(b, k){
  if (k === 'all') return true;
  if (THREAD_STATE[k]) return threadState(b) === k;
  return b.status === k;
}
function bugChip(k){
  var n = BUGS.filter(function(b){ return matchesBugChip(b, k); }).length;
  return '<button class="c-chip c-chip-filter' + (state.bugStatus === k ? ' is-active' : '') +
    '" type="button" data-bs="' + k + '">' + esc(bugChipLabel(k)) +
    ' <span class="count">' + n + '</span></button>';
}

/* Sorting — Table's own documented behaviour: every eligible column sortable,
   one active sort at a time, cycling unsorted -> ascending -> descending.
   The old Submitted control was a ghost button in the header cell, which is
   a second recipe for something the component already specifies.
   Each column declares what it sorts on rather than sorting the rendered
   cell: Priority reads P1..P4 as 1..4, so ascending is most urgent first,
   and Status reads the handover before the workflow state, because that is
   what the cell actually shows. */
var BUG_COLS = [
  { key:'date',     label:'Submitted',   num:true,  val:function(b){ return b.at.getTime(); } },
  { key:'who',      label:'Reported by', num:false, val:function(b){ return b.who; } },
  { key:'pod',      label:'Pod',         num:false, val:function(b){ return b.pod; } },
  { key:'priority', label:'Priority',    num:true,  val:function(b){ return PRIO_ORDER.indexOf(b.priority); } },
  { key:'title',    label:'Title',       num:false, val:function(b){ return b.title; } },
  { key:'assignee', label:'Assigned to', num:false, val:function(b){ return b.assignee || '\uffff'; } },
  { key:'status',   label:'Status',      num:true,  val:function(b){
      var t = threadState(b);
      if (t === 'awaiting') return 0;
      if (t === 'replied')  return 1;
      return { 'new':2, 'progress':3, 'resolved':4 }[b.status];
    } },
  { key:'comments', label:'Comments',    num:true,  val:function(b){ return (b.comments || []).length; } }
];
function bugCol(key){
  return BUG_COLS.filter(function(c){ return c.key === key; })[0];
}
function bugSortTh(c){
  var on = state.bugSortCol === c.key;
  var icon = !on ? 'ph-arrows-down-up' : (state.bugSortDir === 1 ? 'ph-arrow-up' : 'ph-arrow-down');
  return '<th class="c-table-sort-th' + (on ? ' is-sorted' : '') + '" data-bugcol="' + c.key + '"' +
    ' tabindex="0" role="columnheader" aria-sort="' +
    (on ? (state.bugSortDir === 1 ? 'ascending' : 'descending') : 'none') + '">' +
    esc(c.label) + '<i class="ph ' + icon + ' c-table-sort-icon" aria-hidden="true"></i></th>';
}

function filteredBugs(){
  var list = BUGS.filter(function(b){
    return matchesBugChip(b, state.bugStatus)
        && (state.bugPod === 'all' || b.pod === state.bugPod);
  });
  var c = bugCol(state.bugSortCol);
  if (!c) return list;                       /* unsorted — the order they were filed in */
  var dir = state.bugSortDir;
  return list.sort(function(x, y){
    var a = c.val(x), b = c.val(y);
    if (c.num) return (a - b) * dir;
    return String(a).localeCompare(String(b)) * dir;
  });
}

function paintBugRows(){
  var rows = filteredBugs(), tb = $('#bugRows');
  if (!rows.length){
    tb.innerHTML = '<tr><td colspan="8"><div class="c-empty is-inline" style="align-items:center;text-align:center;max-width:none">' +
      '<i class="ph ph-bug" aria-hidden="true"></i><h4>No reports match</h4>' +
      '<p>Try a different status or pod.</p></div></td></tr>';
    return;
  }
  var ids = rows.map(function(b){ return b.id; });
  tb.innerHTML = rows.map(function(b){
    var t = threadState(b);
    return '<tr class="is-interactive is-clickable" data-bug="' + b.id + '" tabindex="0">' +
      '<td style="white-space:nowrap">' + fmtDateTime(b.at) + '</td>' +
      /* Name and pod are two columns, and neither carries an avatar. A
         32px disc per row is 11 discs down the page saying nothing the name
         does not already say, and it cost the width that the pod column
         now uses. Both columns sort. */
      '<td style="white-space:nowrap;font-weight:700">' + esc(b.who) + '</td>' +
      '<td style="white-space:nowrap">' + esc(b.pod) + '</td>' +
      '<td>' + prioPill(b.priority, true) + '</td>' +
      /* Title only. Attachments are a detail of the report, not something
         triage sorts or scans on, and the record modal shows them all
         properly the moment the row is opened. */
      '<td>' + esc(b.title) + '</td>' +
      '<td style="white-space:nowrap">' + (b.assignee
        ? esc(b.assignee)
        : '<span class="muted">Unassigned</span>') + '</td>' +
      /* Whose turn it is *is* the status here, not a note attached to one —
         a waiting ticket reads as one badge, the same as every other row.
         The workflow status is still on the record itself, where it is
         editable; repeating it under the badge only made the cell two lines
         tall and gave the column two answers to one question. */
      '<td>' + (t
        ? threadBadge(b, 'admin')
        : '<span class="c-badge ' + BUG_STATUS[b.status].badge + '">' + BUG_STATUS[b.status].label + '</span>') + '</td>' +
      '<td>' + cmtPill(b) + '</td>' +
    '</tr>';
  }).join('');

  $$('#bugRows tr[data-bug]').forEach(function(tr){
    function open(){ openRecord(ids, ids.indexOf(tr.dataset.bug), 'admin'); }
    tr.addEventListener('click', open);
    tr.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
    });
  });
}

/* ==========================================================================
   Share modal — Add users
   Built entirely out of components: Modal for the dialog, Dropdown's
   Multiple select for the people picker, Dropdown's Single select for every
   role and access control, and Banner for the publish notice. The only new
   things are the layer it mounts in and the access-row layout.
   ========================================================================== */
var ROLES = { editor:'Editor', responder:'Responder' };
var EDITOR_ACCESS = {
  restricted:{ label:'Restricted', desc:'Only the people listed above can open the builder' },
  link:      { label:'Anyone with the link', desc:'Anyone inside Collabrium with the link can edit' }
};
var RESPONDER_ACCESS = {
  link:  { label:'Anyone with the link', desc:'Anyone with the link can answer the survey' },
  none:  { label:'Remove link', desc:'The share link stops working; only invited responders can answer' }
};

/* Who a survey can be shared with, and who it is already shared with. Seeded
   per form on first open so the modal has real content to show. */
function shareStateFor(f){
  if (!f.share){
    f.share = {
      people: [
        { name:ME.name, role:'owner' },
        { name:'Nurul Kamal', role:'editor' },
        { name:'Priya Nair',  role:'responder' }
      ],
      editorAccess: 'restricted',
      responderAccess: 'link',
      picked: [],
      pickRole: 'responder'
    };
  }
  return f.share;
}
function shareCandidates(f){
  var have = shareStateFor(f).people.map(function(p){ return p.name; });
  return PEOPLE.concat(TECH).filter(function(n){ return have.indexOf(n) === -1; })
               .sort(function(a, b){ return a.localeCompare(b); });
}

function openShare(f){
  var layer = $('#shareLayer');
  shareLastFocus = document.activeElement;
  layer.hidden = false;
  paintShare(f);
  void layer.offsetWidth;
  layer.classList.add('is-open');
  var c = $('#shareClose');
  if (c) c.focus();
}
var shareLastFocus = null;
function closeShare(){
  var layer = $('#shareLayer');
  layer.classList.remove('is-open');
  setTimeout(function(){ layer.hidden = true; $('#share').innerHTML = ''; }, 240);
  if (shareLastFocus && shareLastFocus.focus) shareLastFocus.focus();
}
function shareOpen(){ return !$('#shareLayer').hidden; }

/* Single select, in the shape this modal needs: a labelled trigger over a
   floating panel of plain rows. No descriptions in the panel — the row the
   reader lands on already has its description on the page, under "Editor
   view" / "Responder view", and it updates with the selection. Printing the
   same sentence twice makes the picker a wall of text to scan through for
   two options. */
function accessSelect(id, map, current, label){
  return '<div class="c-field c-dropdown-field dd-float align-right" style="width:230px">' +
    '<div class="input-wrap has-trailing-icon">' +
      '<input type="text" class="c-dropdown-input" id="' + id + '" readonly value="' + esc(map[current].label) + '"' +
        ' aria-label="' + esc(label) + '" aria-haspopup="listbox" aria-expanded="false" />' +
      '<span class="icon-trailing" aria-hidden="true"><i class="ph ph-caret-down c-dropdown-chevron"></i></span>' +
    '</div>' +
    '<div class="c-dropdown-panel" data-panelfor="' + id + '" hidden><div class="c-dropdown-list">' +
      Object.keys(map).map(function(k){
        return '<div class="c-dropdown-row' + (current === k ? ' selected' : '') + '" role="option" data-' + id + '="' + k + '">' +
          '<span class="c-dropdown-row-label">' + esc(map[k].label) + '</span>' +
          '<i class="ph ph-check c-dropdown-row-check" aria-hidden="true"></i></div>';
      }).join('') +
