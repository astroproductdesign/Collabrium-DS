<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Prompt input bar — mobile preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="components.css" />
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--color-neutral-2); color:var(--color-neutral-9); font-family:var(--font-primary); padding:var(--spacing-16);}

  .m-label{font-size:var(--text-caption-size); font-weight:700; color:var(--color-neutral-5); margin:0 0 var(--spacing-8);}
  .m-stage{position:relative; height:150px; background:var(--color-canvas-warm-card); border:1px solid var(--color-neutral-3); border-radius:var(--radius-lg); margin-bottom:var(--spacing-32); overflow:hidden;}
  .m-section[hidden]{display:none;}

  /* Same PROPOSED-enhancement collapsed-pill sizing as
     preview-promptbar-draft.html — kept in sync manually since this is
     a draft pair, not a shared include. See that file's review notes. */
  .c-prompt-bar{--prompt-bar-w:406px;}
  .c-prompt-bar.is-collapsed .c-prompt-bar-surface{padding:11px var(--spacing-16) 11px 56px;}
</style>
</head>
<body>

  <div class="m-section" id="secExpanded">
    <p class="m-label">Expanded</p>
    <div class="m-stage">
      <div class="c-prompt-bar is-revealed is-morphable">
        <div class="c-prompt-bar-glow-outer" aria-hidden="true"></div>
        <div class="c-prompt-bar-glow-inner" aria-hidden="true"></div>
        <div class="c-prompt-bar-surface">
          <div class="c-btn c-btn-primary c-btn-icon c-btn-sm c-prompt-bar-mark" aria-hidden="true"><i class="ph-fill ph-sparkle"></i></div>
          <div class="c-prompt-bar-field">
            <input type="text" aria-label="Ask anything" />
            <div class="c-prompt-bar-ghost" aria-hidden="true">
              <span class="c-prompt-bar-ghost-text" id="mExpandedGhost"></span>
            </div>
            <span class="c-prompt-bar-ghost-static">Ask me anything</span>
          </div>
          <div class="c-prompt-bar-more">
            <div class="c-prompt-bar-toolbar">
              <div class="c-prompt-bar-group">
                <button type="button" class="c-btn c-btn-ghost c-btn-icon c-btn-sm" aria-label="Add image"><i class="ph ph-image"></i></button>
                <button type="button" class="c-btn c-btn-ghost c-btn-icon c-btn-sm" aria-label="Attach file"><i class="ph ph-paperclip"></i></button>
                <button type="button" class="c-btn c-btn-ghost c-btn-icon c-btn-sm" aria-label="More options"><i class="ph ph-dots-three"></i></button>
              </div>
              <div class="c-prompt-bar-group">
                <button type="button" class="c-btn c-btn-ghost c-btn-icon c-btn-sm" aria-label="Voice input"><i class="ph ph-microphone"></i></button>
                <button type="button" class="c-btn c-btn-primary c-btn-icon c-btn-sm" aria-label="Send"><i class="ph ph-arrow-up"></i></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="m-section" id="secCollapsed">
    <p class="m-label">Collapsed &mdash; full-width, radius-lg (never a pill on mobile)</p>
    <div class="m-stage">
      <div class="c-prompt-bar is-revealed is-morphable is-collapsed" id="mCollapsedBar">
        <div class="c-prompt-bar-glow-outer" aria-hidden="true"></div>
        <div class="c-prompt-bar-glow-inner" aria-hidden="true"></div>
        <div class="c-prompt-bar-surface">
          <div class="c-btn c-btn-primary c-btn-icon c-btn-sm c-prompt-bar-mark" aria-hidden="true"><i class="ph-fill ph-sparkle"></i></div>
          <div class="c-prompt-bar-field">
            <input type="text" aria-label="Ask anything" />
            <div class="c-prompt-bar-ghost" aria-hidden="true">
              <span class="c-prompt-bar-ghost-text" id="mCollapsedGhost">I am your Collabrium assistant, let me help you</span>
            </div>
            <span class="c-prompt-bar-ghost-static">Ask me anything</span>
          </div>
          <div class="c-prompt-bar-more">
            <div class="c-prompt-bar-toolbar">
              <div class="c-prompt-bar-group">
                <button type="button" class="c-btn c-btn-ghost c-btn-icon c-btn-sm" aria-label="Add image"><i class="ph ph-image"></i></button>
                <button type="button" class="c-btn c-btn-ghost c-btn-icon c-btn-sm" aria-label="Attach file"><i class="ph ph-paperclip"></i></button>
                <button type="button" class="c-btn c-btn-ghost c-btn-icon c-btn-sm" aria-label="More options"><i class="ph ph-dots-three"></i></button>
              </div>
              <div class="c-prompt-bar-group">
                <button type="button" class="c-btn c-btn-ghost c-btn-icon c-btn-sm" aria-label="Voice input"><i class="ph ph-microphone"></i></button>
                <button type="button" class="c-btn c-btn-primary c-btn-icon c-btn-sm" aria-label="Send"><i class="ph ph-arrow-up"></i></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  // ?state=expanded or ?state=collapsed shows only that section, sized
  // to fit one card — used when this file is embedded in a small
  // per-state iframe from preview-promptbar-draft.html. No param (i.e.
  // opened directly) shows both, for standalone viewing.
  var state = new URLSearchParams(location.search).get('state');
  if (state === 'expanded') document.getElementById('secCollapsed').hidden = true;
  if (state === 'collapsed') document.getElementById('secExpanded').hidden = true;
})();
</script>
<script>
(function(){
  var expandedGhost = document.getElementById('mExpandedGhost');
  var collapsedBar = document.getElementById('mCollapsedBar');
  var collapsedGhost = document.getElementById('mCollapsedGhost');
  if (!expandedGhost || !collapsedBar || !collapsedGhost) return;

  var FINAL_TEXT = "I am your Collabrium assistant, let me help you";

  function typeOut(el, str){
    var i = 0;
    el.classList.add('is-caret-pulsing');
    (function tick(){
      i++;
      el.textContent = str.slice(0, i);
      if (i < str.length) setTimeout(tick, 35);
      else el.classList.remove('is-caret-pulsing');
    })();
  }

  function runMarquee(){
    var surface = collapsedBar.querySelector('.c-prompt-bar-surface');
    var cs = getComputedStyle(surface);
    var padL = parseFloat(cs.paddingLeft) || 0;
    var padR = parseFloat(cs.paddingRight) || 0;
    var win = collapsedBar.getBoundingClientRect().width - padL - padR;
    var textWidth = collapsedGhost.scrollWidth;
    var dx = Math.min(0, win - textWidth);
    var travelPx = Math.abs(dx);
    var travelMs = (travelPx / 60) * 1000;
    var totalMs = travelPx === 0 ? 0 : travelMs / 0.64;
    collapsedBar.style.setProperty('--prompt-bar-marquee-dx', dx + 'px');
    collapsedBar.style.setProperty('--prompt-bar-marquee-dur', (totalMs || 1) + 'ms');
  }

  window.addEventListener('load', function(){
    setTimeout(function(){ typeOut(expandedGhost, FINAL_TEXT); }, 300);
    setTimeout(runMarquee, 50);
  });
})();
</script>
</body>
</html>
